<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledger Software – Compound Journal</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont;
}

body{
    margin:0;
    padding:30px;
    background:#1c1c1e;
    color:#f5f5f7;
}

/* HEADER */
h1{
    text-align:center;
    font-weight:600;
    margin-bottom:30px;
}

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.menu button{
    padding:12px 22px;
    border:none;
    border-radius:999px;
    background:#0a84ff;
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:.25s;
}

.menu button:hover{
    background:#3395ff;
    transform:scale(1.04);
}

/* CARD */
.card{
    max-width:950px;
    margin:30px auto;
    background:#2c2c2e;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
    animation:fadeUp .5s ease;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:12px;
    border:1px solid #3a3a3c;
    background:#1c1c1e;
    color:#f5f5f7;
    outline:none;
}

input::placeholder{color:#8e8e93}

input:focus{border-color:#0a84ff}

/* FLEX */
.row{
    display:flex;
    gap:14px;
    margin-top:12px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#3a3a3c;
    font-weight:500;
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #48484a;
}

tr:hover{background:#3a3a3c}

.note{
    color:#a1a1a6;
    font-size:14px;
}

@media(max-width:650px){
    .row{flex-direction:column}
}
</style>
</head>

<body>

<h1>📘 Ledger Software (Compound Journal)</h1>

<div class="menu">
    <button onclick="showAddEntry()">➕ Add Entry</button>
    <button onclick="showJournal()">📓 Compound Journal</button>
    <button onclick="showLedger()">📂 Ledger</button>
</div>

<div id="content"></div>

<script>
/* ======================
   GLOBAL DATA
====================== */
let journal = [];
let ledger = {};

/* ======================
   AUTO LOAD
====================== */
window.onload = () => {
    const j = localStorage.getItem("journal");
    const l = localStorage.getItem("ledger");

    if(j) journal = JSON.parse(j);
    if(l) ledger = JSON.parse(l);
};

/* ======================
   MENU UI
====================== */
function showAddEntry(){
    document.getElementById("content").innerHTML = `
    <div class="card">
        <h3>Add Compound Journal Entry</h3>

        <input id="date" type="date">

        <div class="row">
            <input id="drAcc" placeholder="Debit Accounts (comma separated)">
            <input id="drAmt" placeholder="Debit Amounts (comma separated)">
        </div>

        <div class="row">
            <input id="crAcc" placeholder="Credit Accounts (comma separated)">
            <input id="crAmt" placeholder="Credit Amounts (comma separated)">
        </div>

        <input id="narration" placeholder="Narration (optional)">

        <div class="row">
            <button onclick="saveEntry()">Save Entry</button>
        </div>

        <p class="note">Example: Cash, Purchases | 5000, 3000</p>
    </div>`;
}

/* ======================
   SAVE ENTRY
====================== */
function saveEntry(){
    const date = document.getElementById("date").value;
    const drAcc = document.getElementById("drAcc").value.split(",");
    const drAmt = document.getElementById("drAmt").value.split(",");
    const crAcc = document.getElementById("crAcc").value.split(",");
    const crAmt = document.getElementById("crAmt").value.split(",");
    const narration = document.getElementById("narration").value;

    if(!date || drAcc.length!==drAmt.length || crAcc.length!==crAmt.length){
        alert("Invalid input");
        return;
    }

    const entry = {date,drAcc,drAmt,crAcc,crAmt,narration};
    journal.push(entry);

    drAcc.forEach((a,i)=>postLedger(a.trim(),drAmt[i],0));
    crAcc.forEach((a,i)=>postLedger(a.trim(),0,crAmt[i]));

    localStorage.setItem("journal",JSON.stringify(journal));
    localStorage.setItem("ledger",JSON.stringify(ledger));

    alert("Entry saved successfully");
}

/* ======================
   LEDGER POSTING
====================== */
function postLedger(acc,dr,cr){
    if(!ledger[acc]) ledger[acc]={dr:0,cr:0};
    ledger[acc].dr += Number(dr);
    ledger[acc].cr += Number(cr);
}

/* ======================
   VIEW JOURNAL
====================== */
function showJournal(){
    let html = `<div class="card"><h3>Compound Journal</h3>
    <table>
    <tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr>`;

    journal.forEach(e=>{
        e.drAcc.forEach((a,i)=>{
            html += `<tr><td>${e.date}</td><td>${a}</td><td>${e.drAmt[i]}</td><td></td></tr>`;
        });
        e.crAcc.forEach((a,i)=>{
            html += `<tr><td>${e.date}</td><td>${a}</td><td></td><td>${e.crAmt[i]}</td></tr>`;
        });
    });

    html += `</table></div>`;
    document.getElementById("content").innerHTML = html;
}

/* ======================
   VIEW LEDGER
====================== */
function showLedger(){
    let html = `<div class="card"><h3>Ledger</h3>`;

    for(let acc in ledger){
        html += `<p><strong>${acc}</strong> → Debit: ₹${ledger[acc].dr} | Credit: ₹${ledger[acc].cr}</p>`;
    }

    html += `</div>`;
    document.getElementById("content").innerHTML = html;
}
</script>

</body>
</html>
