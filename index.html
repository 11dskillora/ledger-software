<script>
/* ==========================================================
   COMPOUND JOURNAL → AUTO LEDGER (DUAL MODE DISPLAY)
   Stabilized + Bugfixed + Exhibition Ready
   - No UI change
   - No meaning change
   - Narration supported (FULLY)
   - Enter/Return auto navigation added
   - White Screen issue removed (crash-proof)
   - NEW: Search Entry / Search Account
   - NEW: Edit entry after saving (auto updates ledger)
   - FIXED: safe DOM insertions (no null parent crash)
   ========================================================== */

(function () {
  "use strict";

  // ------------------------------
  // GLOBAL STATE (same meaning)
  // ------------------------------
  var journal = [];
  var ledger = {};
  var undoStack = [];

  // Edit state
  var editModeIndex = null;
  var editSnapshot = null;

  // Storage keys
  var LS_JOURNAL = "journalData";
  var LS_UNDO = "undoStack";

  // ------------------------------
  // HELPERS
  // ------------------------------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = String(text == null ? "" : text);
    return div.innerHTML;
  }

  function toPaise(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.round(n * 100);
  }

  function paiseToStr(p) {
    p = Number(p) || 0;
    return (p / 100).toFixed(2);
  }

  function normalizeAccountName(name) {
    var n = String(name || "").trim();
    if (!n) return "";
    n = n.replace(/\s+/g, " ");
    if (!/a\/c$/i.test(n)) n = n + " A/c";
    n = n.replace(/A\/c\s*A\/c$/i, "A/c");
    n = n.charAt(0).toUpperCase() + n.slice(1);
    return n;
  }

  function safeJSONParse(str, fallback) {
    try {
      var obj = JSON.parse(str);
      return obj == null ? fallback : obj;
    } catch (e) {
      return fallback;
    }
  }

  function deepClone(obj) {
    return safeJSONParse(JSON.stringify(obj), null);
  }

  function persist() {
    try { localStorage.setItem(LS_JOURNAL, JSON.stringify(journal)); } catch (e) {}
    try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack)); } catch (e2) {}
  }

  function restore() {
    var j = safeJSONParse(localStorage.getItem(LS_JOURNAL), []);
    var u = safeJSONParse(localStorage.getItem(LS_UNDO), []);
    if (!Array.isArray(j)) j = [];
    if (!Array.isArray(u)) u = [];
    journal = j;
    undoStack = u;
  }

  function safeAlert(msg) {
    try { alert(msg); } catch (e) { console.log(msg); }
  }

  function strIncludes(hay, needle) {
    hay = String(hay || "").toLowerCase();
    needle = String(needle || "").toLowerCase();
    return hay.indexOf(needle) !== -1;
  }

  function safeFocus(el) {
    if (!el) return;
    try {
      el.focus();
      if (el.select) el.select();
    } catch (e) {}
  }

  // ------------------------------
  // SAFE DOM ENSURE (Narration input)
  // ------------------------------
  function ensureNarrationInputExists() {
    if (document.getElementById("narrationInput")) return;

    var dateInput = document.getElementById("dateInput");
    if (!dateInput) return;
    if (!dateInput.parentNode) return;

    var narr = document.createElement("input");
    narr.id = "narrationInput";
    narr.type = "text";
    narr.placeholder = "Narration";

    // keep styling consistent: copy class from date input if any
    narr.className = dateInput.className || "";

    // minimal inline fallback (won't break UI)
    if (!narr.className) {
      narr.style.width = "100%";
      narr.style.padding = "10px";
      narr.style.borderRadius = "8px";
      narr.style.border = "1px solid #ccc";
      narr.style.marginTop = "8px";
    } else {
      narr.style.marginTop = "8px";
    }

    try {
      if (dateInput.nextSibling) dateInput.parentNode.insertBefore(narr, dateInput.nextSibling);
      else dateInput.parentNode.appendChild(narr);
    } catch (e) {
      console.error("Narration insert failed:", e);
    }
  }

  // ------------------------------
  // PAGE NAV
  // ------------------------------
  function showPage(pageIndex) {
    var pages = $all(".page");
    var navBtns = $all("nav button");

    if (!pages.length) return;
    if (pageIndex < 0 || pageIndex >= pages.length) return;

    pages.forEach(function (p) { p.classList.remove("active"); });
    if (navBtns.length) navBtns.forEach(function (b) { b.classList.remove("active"); });

    pages[pageIndex].classList.add("active");
    if (navBtns.length && navBtns[pageIndex]) navBtns[pageIndex].classList.add("active");
  }
  window.showPage = showPage;

  function getLedgerPageIndex() {
    var pages = $all(".page");
    if (!pages.length) return null;

    for (var i = 0; i < pages.length; i++) {
      var p = pages[i];
      if (!p) continue;

      if (p.id && /ledger/i.test(p.id)) return i;
      if (p.getAttribute && /ledger/i.test(String(p.getAttribute("data-page") || ""))) return i;
      if (p.querySelector && p.querySelector("#ledgerOutput")) return i;
    }

    if (pages.length >= 2) return 1;
    return 0;
  }

  // ------------------------------
  // SAFE DOM ENSURE (Search UI)
  // ------------------------------
  function ensureSearchUIExists() {
    var journalOut = document.getElementById("journalOutput");
    if (!journalOut) return;
    if (!journalOut.parentNode) return;

    if (document.getElementById("searchBoxWrap")) return;

    var wrap = document.createElement("div");
    wrap.id = "searchBoxWrap";
    wrap.style.margin = "10px 0";
    wrap.style.padding = "10px";
    wrap.style.borderRadius = "10px";
    wrap.style.border = "1px solid rgba(0,0,0,0.15)";
    wrap.style.background = "rgba(255,255,255,0.85)";

    wrap.innerHTML =
      "<div style='font-weight:700;margin-bottom:6px'>Search</div>" +
      "<input id='searchInput' type='text' placeholder='Search entry / account / narration / date / amount...' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'>" +
      "<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px'>" +
        "<button id='searchClearBtn' type='button' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Clear</button>" +
        "<button id='searchGoLedgerBtn' type='button' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Search in Ledger</button>" +
      "</div>" +
      "<div id='searchHint' style='margin-top:8px;font-size:12px;opacity:0.8'></div>";

    try {
      journalOut.parentNode.insertBefore(wrap, journalOut);
    } catch (e) {
      console.error("Search UI insert failed:", e);
      return;
    }

    var input = document.getElementById("searchInput");
    var clearBtn = document.getElementById("searchClearBtn");
    var goLedgerBtn = document.getElementById("searchGoLedgerBtn");

    if (input) {
      input.addEventListener("input", function(){ renderAll(); });
      input.addEventListener("keydown", function(e){
        if (e.key === "Enter") {
          e.preventDefault();
          renderAll();
        }
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener("click", function(){
        var si = document.getElementById("searchInput");
        if (si) si.value = "";
        renderAll();
      });
    }

    if (goLedgerBtn) {
      goLedgerBtn.addEventListener("click", function(){
        var si2 = document.getElementById("searchInput");
        var q = si2 ? si2.value.trim() : "";
        if (!q) {
          safeAlert("Type something in search box first.");
          return;
        }
        var ledgerIndex = getLedgerPageIndex();
        if (ledgerIndex != null) showPage(ledgerIndex);
        setTimeout(function(){ highlightLedgerAccount(q); }, 150);
      });
    }
  }

  // ------------------------------
  // FORM ROWS
  // ------------------------------
  function addDebit() {
    var container = document.getElementById("debitContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row debit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Debit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Debit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Debit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  function addCredit() {
    var container = document.getElementById("creditContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row credit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Credit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Credit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Credit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  window.addDebit = addDebit;
  window.addCredit = addCredit;

  function getRowsData(selector) {
    var rows = $all(selector);
    return rows.map(function (row) {
      var accEl = $(".account-input", row);
      var amtEl = $(".amount-input", row);
      var acc = normalizeAccountName(accEl ? accEl.value : "");
      var amt = toPaise(amtEl ? amtEl.value : 0);
      return { acc: acc, amt: amt, row: row };
    });
  }

  function autoFillParticularsInForm() {
    var debitContainer = document.getElementById("debitContainer");
    var creditContainer = document.getElementById("creditContainer");
    if (!debitContainer || !creditContainer) return;

    var debits = getRowsData(".debit-row");
    var credits = getRowsData(".credit-row");

    var debitAccounts = debits.map(function(d){ return d.acc; }).filter(Boolean);
    var creditAccounts = credits.map(function(c){ return c.acc; }).filter(Boolean);

    var debitParticularText = debitAccounts.length ? ("By " + debitAccounts.join(", ")) : "";
    var creditParticularText = creditAccounts.length ? ("To " + creditAccounts.join(", ")) : "";

    debits.forEach(function (d) {
      var p = $(".particulars-input", d.row);
      if (p) { p.readOnly = true; p.value = creditParticularText; }
    });

    credits.forEach(function (c) {
      var p = $(".particulars-input", c.row);
      if (p) { p.readOnly = true; p.value = debitParticularText; }
    });
  }

  window.autoFillParticularsInForm = autoFillParticularsInForm;

  document.addEventListener("input", function (e) {
    if (!e.target || !e.target.classList) return;
    if (e.target.classList.contains("account-input") || e.target.classList.contains("amount-input")) {
      autoFillParticularsInForm();
    }
  });

  // ------------------------------
  // ENTER/RETURN AUTO SHIFT NAVIGATION
  // ------------------------------
  (function enableEnterNavigation(){
    function getRowInputs(row){
      if (!row) return [];
      var acc = row.querySelector('.account-input');
      var amt = row.querySelector('.amount-input');
      var par = row.querySelector('.particulars-input');
      var arr = [];
      if (acc) arr.push(acc);
      if (amt) arr.push(amt);
      if (par) arr.push(par);
      return arr;
    }

    function ensureNextRow(currentRow){
      if (!currentRow) return null;

      if (currentRow.classList.contains('debit-row')) {
        var next = currentRow.nextElementSibling;
        if (next && next.classList.contains('debit-row')) return next;
        addDebit();
        return currentRow.nextElementSibling;
      }

      if (currentRow.classList.contains('credit-row')) {
        var next2 = currentRow.nextElementSibling;
        if (next2 && next2.classList.contains('credit-row')) return next2;
        addCredit();
        return currentRow.nextElementSibling;
      }

      return null;
    }

    document.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;

      var t = e.target;
      if (!t) return;

      if (t.id === "narrationInput") {
        e.preventDefault();
        var firstDebit = document.querySelector("#debitContainer .debit-row .account-input");
        safeFocus(firstDebit);
        return;
      }

      if (t.id === "searchInput") {
        e.preventDefault();
        renderAll();
        return;
      }

      if (!t.classList) return;

      if (!(t.classList.contains('account-input') || t.classList.contains('amount-input') || t.classList.contains('particulars-input'))) {
        return;
      }

      e.preventDefault();

      var row = t.closest('.entry-row');
      if (!row) return;

      var inputs = getRowInputs(row);
      var idx = inputs.indexOf(t);

      if (idx >= 0 && idx < inputs.length - 1) {
        safeFocus(inputs[idx + 1]);
        return;
      }

      var nextRow = ensureNextRow(row);
      if (nextRow) {
        var nextInputs = getRowInputs(nextRow);
        safeFocus(nextInputs[0]);
        autoFillParticularsInForm();
        return;
      }
    }, true);
  })();

  // ------------------------------
  // VALIDATION
  // ------------------------------
  function validateEntry(debits, credits, narration) {
    var errors = [];

    if (!debits.length) errors.push("Add at least 1 debit line.");
    if (!credits.length) errors.push("Add at least 1 credit line.");

    debits.forEach(function (d, idx) {
      if (!d.acc) errors.push("Debit row " + (idx + 1) + ": Account name is required.");
      if (d.amt <= 0) errors.push("Debit row " + (idx + 1) + ": Amount must be > 0.");
    });

    credits.forEach(function (c, idx) {
      if (!c.acc) errors.push("Credit row " + (idx + 1) + ": Account name is required.");
      if (c.amt <= 0) errors.push("Credit row " + (idx + 1) + ": Amount must be > 0.");
    });

    if (narration != null) {
      var n = String(narration).trim();
      if (n.length > 300) errors.push("Narration is too long (max 300 characters).");
    }

    var debitTotal = debits.reduce(function(s, d){ return s + d.amt; }, 0);
    var creditTotal = credits.reduce(function(s, c){ return s + c.amt; }, 0);

    if (debitTotal !== creditTotal) {
      errors.push("Debit total (" + paiseToStr(debitTotal) + ") must equal Credit total (" + paiseToStr(creditTotal) + ").");
    }

    return { ok: errors.length === 0, errors: errors };
  }

  // ------------------------------
  // LEDGER UPDATE
  // ------------------------------
  function ensureLedgerAcc(name) {
    if (!ledger[name]) ledger[name] = [];
  }

  function postToLedger(entry) {
    var jf = entry.jf || "-";

    (entry.debits || []).forEach(function (d) {
      ensureLedgerAcc(d.acc);
      ledger[d.acc].push({
        date: entry.date,
        particulars: "To " + (entry.credits || []).map(function(c){ return c.acc; }).join(", "),
        debit: d.amt,
        credit: 0,
        jf: jf
      });
    });

    (entry.credits || []).forEach(function (c) {
      ensureLedgerAcc(c.acc);
      ledger[c.acc].push({
        date: entry.date,
        particulars: "By " + (entry.debits || []).map(function(d){ return d.acc; }).join(", "),
        debit: 0,
        credit: c.amt,
        jf: jf
      });
    });
  }

  function rebuildLedgerFromJournal() {
    ledger = {};
    journal.forEach(postToLedger);
  }

  // ------------------------------
  // ADD ENTRY
  // ------------------------------
  function addEntry() {
    var dateEl = $("#dateInput");
    var narrationEl = $("#narrationInput");

    var date = (dateEl ? dateEl.value : "").trim();
    var narration = (narrationEl ? narrationEl.value : "").trim();

    var debits = getRowsData(".debit-row").filter(function(d){ return d.acc || d.amt; });
    var credits = getRowsData(".credit-row").filter(function(c){ return c.acc || c.amt; });

    var v = validateEntry(debits, credits, narration);
    if (!v.ok) {
      safeAlert("Fix these errors:\n\n" + v.errors.map(function(e){ return "• " + e; }).join("\n"));
      return;
    }

    var entry = {
      date: date || new Date().toISOString().slice(0, 10),
      narration: narration ? narration : "-",
      debits: debits.map(function(d){ return { acc: d.acc, amt: d.amt }; }),
      credits: credits.map(function(c){ return { acc: c.acc, amt: c.amt }; }),
      jf: "-"
    };

    undoStack.push({ type: "add", index: journal.length, entry: deepClone(entry) });

    journal.push(entry);
    rebuildLedgerFromJournal();
    persist();

    resetEntryForm();
    renderAll();
  }
  window.addEntry = addEntry;

  // ------------------------------
  // EDIT ENTRY
  // ------------------------------
  function startEditEntry(index) {
    if (index == null || index < 0 || index >= journal.length) return;

    editModeIndex = index;
    editSnapshot = deepClone(journal[index]);

    renderAll();

    setTimeout(function(){
      var box = document.querySelector("[data-edit-index='" + index + "']");
      if (!box) return;
      var first = box.querySelector("input");
      safeFocus(first);
    }, 50);
  }

  function cancelEditEntry() {
    if (editModeIndex == null) return;

    if (editSnapshot && journal[editModeIndex]) {
      journal[editModeIndex] = deepClone(editSnapshot);
    }

    editModeIndex = null;
    editSnapshot = null;

    rebuildLedgerFromJournal();
    persist();
    renderAll();
  }

  function saveEditEntry(index) {
    if (index == null || index < 0 || index >= journal.length) return;

    var box = document.querySelector("[data-edit-index='" + index + "']");
    if (!box) return;

    var dateEl = box.querySelector(".edit-date");
    var narrEl = box.querySelector(".edit-narration");

    var date = dateEl ? dateEl.value : "";
    var narration = narrEl ? narrEl.value : "";

    date = String(date).trim();
    narration = String(narration).trim();

    function readLines(kind) {
      var lines = [];
      var rows = box.querySelectorAll(".edit-" + kind + "-row");
      Array.prototype.forEach.call(rows, function(r){
        var accEl = r.querySelector(".edit-acc");
        var amtEl = r.querySelector(".edit-amt");
        var acc = normalizeAccountName(accEl ? accEl.value : "");
        var amt = toPaise(amtEl ? amtEl.value : 0);
        if (acc || amt) lines.push({ acc: acc, amt: amt });
      });
      return lines;
    }

    var debits = readLines("debit");
    var credits = readLines("credit");

    var v = validateEntry(
      debits.map(function(d){ return {acc:d.acc, amt:d.amt}; }),
      credits.map(function(c){ return {acc:c.acc, amt:c.amt}; }),
      narration
    );

    if (!v.ok) {
      safeAlert("Fix these errors:\n\n" + v.errors.map(function(e){ return "• " + e; }).join("\n"));
      return;
    }

    var beforeState = deepClone(editSnapshot || journal[index] || null);

    journal[index] = {
      date: date || new Date().toISOString().slice(0, 10),
      narration: narration || "-",
      debits: debits,
      credits: credits,
      jf: "-"
    };

    undoStack.push({
      type: "edit",
      index: index,
      before: beforeState,
      after: deepClone(journal[index])
    });

    editModeIndex = null;
    editSnapshot = null;

    rebuildLedgerFromJournal();
    persist();
    renderAll();
  }

  window.startEditEntry = startEditEntry;
  window.saveEditEntry = saveEditEntry;
  window.cancelEditEntry = cancelEditEntry;

  // ------------------------------
  // UNDO
  // ------------------------------
  function undoLast() {
    if (!undoStack.length) {
      safeAlert("Nothing to undo.");
      return;
    }

    var last = undoStack.pop();

    if (last.type === "add") {
      if (typeof last.index === "number") journal.splice(last.index, 1);
    }

    if (last.type === "edit") {
      if (last.before && typeof last.index === "number") {
        journal[last.index] = deepClone(last.before);
      }
    }

    rebuildLedgerFromJournal();
    persist();
    renderAll();
  }
  window.undoLast = undoLast;

  // ------------------------------
  // FORM RESET
  // ------------------------------
  function resetEntryForm() {
    var debitC = document.getElementById("debitContainer");
    var creditC = document.getElementById("creditContainer");
    if (!debitC || !creditC) return;

    debitC.innerHTML = "";
    creditC.innerHTML = "";

    addDebit();
    addCredit();

    var narrationEl = $("#narrationInput");
    if (narrationEl) narrationEl.value = "";

    autoFillParticularsInForm();
  }
  window.resetEntryForm = resetEntryForm;

  // ------------------------------
  // SEARCH
  // ------------------------------
  function getSearchQuery() {
    var si = document.getElementById("searchInput");
    return si ? String(si.value || "").trim() : "";
  }

  function entryMatchesSearch(entry, query) {
    if (!query) return true;
    var q = query.toLowerCase();

    if (strIncludes(entry.date, q)) return true;
    if (strIncludes(entry.narration, q)) return true;

    var allLines = [].concat(entry.debits || []).concat(entry.credits || []);
    for (var i = 0; i < allLines.length; i++) {
      var ln = allLines[i];
      if (strIncludes(ln.acc, q)) return true;
      if (strIncludes(paiseToStr(ln.amt), q)) return true;
    }
    return false;
  }

  function highlightLedgerAccount(query) {
    if (!query) return;

    var q = query.toLowerCase();
    var cards = document.querySelectorAll(".ledger-card");
    if (!cards.length) return;

    var found = null;

    Array.prototype.forEach.call(cards, function(card){
      card.style.outline = "";
      card.style.boxShadow = "";
      var h = card.querySelector("h3");
      if (!h) return;
      var name = String(h.textContent || "").toLowerCase();
      if (!found && name.indexOf(q) !== -1) found = card;
    });

    if (found) {
      found.scrollIntoView({ behavior: "smooth", block: "start" });
      found.style.outline = "2px solid #000";
      found.style.boxShadow = "0 0 0 4px rgba(0,0,0,0.1)";
    } else {
      safeAlert("No matching account found in ledger.");
    }
  }

  // ------------------------------
  // RENDERING
  // ------------------------------
  function renderJournal() {
    var out = document.getElementById("journalOutput");
    if (!out) return;

    var query = getSearchQuery();
    var hint = document.getElementById("searchHint");

    if (!journal.length) {
      out.innerHTML = "<p style='opacity:0.8'>No entries yet.</p>";
      if (hint) hint.textContent = "";
      return;
    }

    var visibleCount = 0;
    var html = "";

    journal.forEach(function (e, idx) {
      var match = entryMatchesSearch(e, query);
      if (!match) return;

      visibleCount++;

      if (editModeIndex === idx) {
        var debitEdit = (e.debits || []).map(function(d){
          return (
            "<div class='edit-debit-row' style='display:flex;gap:8px;margin-top:6px'>" +
              "<input class='edit-acc' type='text' value='" + escapeHtml(d.acc) + "' style='flex:2;padding:8px;border-radius:8px;border:1px solid #ccc'>" +
              "<input class='edit-amt' type='number' step='0.01' min='0' value='" + escapeHtml(paiseToStr(d.amt)) + "' style='flex:1;padding:8px;border-radius:8px;border:1px solid #ccc'>" +
            "</div>"
          );
        }).join("");

        var creditEdit = (e.credits || []).map(function(c){
          return (
            "<div class='edit-credit-row' style='display:flex;gap:8px;margin-top:6px'>" +
              "<input class='edit-acc' type='text' value='" + escapeHtml(c.acc) + "' style='flex:2;padding:8px;border-radius:8px;border:1px solid #ccc'>" +
              "<input class='edit-amt' type='number' step='0.01' min='0' value='" + escapeHtml(paiseToStr(c.amt)) + "' style='flex:1;padding:8px;border-radius:8px;border:1px solid #ccc'>" +
            "</div>"
          );
        }).join("");

        html +=
          "<div class='entry-card' data-edit-index='" + idx + "' style='border:2px solid rgba(0,0,0,0.2)'>" +
            "<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'>" +
              "<div><b>Entry " + (idx + 1) + " (Editing)</b></div>" +
              "<div style='display:flex;gap:8px;flex-wrap:wrap'>" +
                "<button type='button' onclick='saveEditEntry(" + idx + ")' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Save</button>" +
                "<button type='button' onclick='cancelEditEntry()' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Cancel</button>" +
              "</div>" +
            "</div>" +

            "<div style='margin-top:10px'>" +
              "<div style='font-weight:700;margin-bottom:6px'>Date</div>" +
              "<input class='edit-date' type='date' value='" + escapeHtml(e.date) + "' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'>" +
            "</div>" +

            "<div style='margin-top:10px'>" +
              "<div style='font-weight:700;margin-bottom:6px'>Narration</div>" +
              "<input class='edit-narration' type='text' value='" + escapeHtml(e.narration || "-") + "' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'>" +
            "</div>" +

            "<div style='margin-top:10px'>" +
              "<div style='font-weight:700'>Debits</div>" +
              debitEdit +
            "</div>" +

            "<div style='margin-top:10px'>" +
              "<div style='font-weight:700'>Credits</div>" +
              creditEdit +
            "</div>" +
          "</div>";

        return;
      }

      var debitLines = (e.debits || []).map(function(d){
        return "<div>" + escapeHtml(d.acc) + " Dr. " + paiseToStr(d.amt) + "</div>";
      }).join("");

      var creditLines = (e.credits || []).map(function(c){
        return "<div>To " + escapeHtml(c.acc) + " " + paiseToStr(c.amt) + "</div>";
      }).join("");

      html +=
        "<div class='entry-card'>" +
          "<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'>" +
            "<div><b>Entry " + (idx + 1) + "</b> | " + escapeHtml(e.date) + "</div>" +
            "<div style='display:flex;gap:8px;flex-wrap:wrap'>" +
              "<button type='button' onclick='startEditEntry(" + idx + ")' style='padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Edit</button>" +
            "</div>" +
          "</div>" +
          "<div style='margin-top:6px'>" + debitLines + "</div>" +
          "<div style='margin-top:6px'>" + creditLines + "</div>" +
          "<div style='margin-top:6px'><i>Narration:</i> " + escapeHtml(e.narration || "-") + "</div>" +
        "</div>";
    });

    if (!visibleCount) out.innerHTML = "<p style='opacity:0.8'>No matching entries found.</p>";
    else out.innerHTML = html;

    if (hint) {
      hint.textContent = query
        ? ("Showing " + visibleCount + " matching entry(s) for: " + query)
        : ("Showing all entries: " + journal.length);
    }
  }

  function renderLedger() {
    var out = document.getElementById("ledgerOutput");
    if (!out) return;

    var accNames = Object.keys(ledger).sort();
    if (!accNames.length) {
      out.innerHTML = "<p style='opacity:0.8'>Ledger is empty.</p>";
      return;
    }

    var html = "";
    accNames.forEach(function (acc) {
      var rows = ledger[acc] || [];
      var debitTotal = 0, creditTotal = 0;

      var rowHtml = rows.map(function (r) {
        debitTotal += r.debit || 0;
        creditTotal += r.credit || 0;

        return (
          "<tr>" +
            "<td>" + escapeHtml(r.date) + "</td>" +
            "<td>" + escapeHtml(r.particulars) + "</td>" +
            "<td>" + escapeHtml(r.jf || "-") + "</td>" +
            "<td style='text-align:right'>" + (r.debit ? paiseToStr(r.debit) : "") + "</td>" +
            "<td style='text-align:right'>" + (r.credit ? paiseToStr(r.credit) : "") + "</td>" +
          "</tr>"
        );
      }).join("");

      html +=
        "<div class='ledger-card'>" +
          "<h3>" + escapeHtml(acc) + "</h3>" +
          "<div style='overflow:auto'>" +
          "<table class='ledger-table'>" +
            "<thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead>" +
            "<tbody>" + rowHtml + "</tbody>" +
            "<tfoot>" +
              "<tr>" +
                "<td colspan='3'><b>Total</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(debitTotal) + "</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(creditTotal) + "</b></td>" +
              "</tr>" +
            "</tfoot>" +
          "</table>" +
          "</div>" +
        "</div>";
    });

    out.innerHTML = html;
  }

  function renderAll() {
    renderJournal();
    renderLedger();
  }
  window.renderAll = renderAll;

  // ------------------------------
  // INIT
  // ------------------------------
  function init() {
    restore();
    rebuildLedgerFromJournal();

    ensureNarrationInputExists();
    ensureSearchUIExists();

    if (!document.querySelector(".debit-row")) addDebit();
    if (!document.querySelector(".credit-row")) addCredit();

    autoFillParticularsInForm();
    renderAll();
  }

  window.addEventListener("error", function(e){
    console.error("Runtime error:", e.message, e.error);
  });

  function safeInitWithRetry(retries) {
    try {
      init();
    } catch (err) {
      console.error("Init failed:", err);
      if (retries > 0) {
        setTimeout(function(){ safeInitWithRetry(retries - 1); }, 150);
      } else {
        safeAlert("Error loading app. Please refresh the page.");
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){ safeInitWithRetry(5); });
  } else {
    safeInitWithRetry(5);
  }

})();
</script>
