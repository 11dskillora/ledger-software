<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SARASWATI INTERNATIONAL SCHOOL - Accounting System</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* =========================================================
   REDESIGNED UI — EDITORIAL GLASS + MODERN LEDGER
========================================================= */

:root {
  --bg-dark: #101114;
  --bg-deep: #0c0d10;
  --paper: #14161b;
  --paper-2: #191b22;
  --accent: #e8c07d;
  --accent-2: #7bdff2;
  --text: #e9edf1;
  --muted: #9aa3ad;
  --danger: #ff5c5c;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --shadow: 0 20px 60px rgba(0,0,0,0.5);
  --radius: 18px;
  --heading: 'DM Serif Display', serif;
  --body: 'Space Grotesk', sans-serif;
}

* { box-sizing: border-box; cursor: none; }

body {
  margin: 0;
  font-family: var(--body);
  background: var(--bg-dark);
  color: var(--text);
  overflow-x: hidden;
}

/* --- Custom Cursor --- */
.cursor-dot, .cursor-outline {
  position: fixed; top: 0; left: 0;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
}
.cursor-dot { width: 6px; height: 6px; background: var(--accent); }
.cursor-outline {
  width: 38px; height: 38px;
  border: 1px solid rgba(255,255,255,0.25);
  transition: width .2s, height .2s, background .2s, border .2s;
}
body:hover .cursor-outline.hovered {
  width: 60px; height: 60px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
}

/* --- Background Shader Container --- */
#canvas-container {
  position: fixed; inset: 0;
  z-index: -2;
}

/* --- Grain Overlay --- */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity=".08"/></svg>');
  mix-blend-mode: soft-light;
  pointer-events: none;
  z-index: -1;
}

/* --- Layout --- */
.app { min-height: 100vh; padding: 24px; }
.container { max-width: 1200px; margin: 0 auto; }

/* --- Header / Nav --- */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 18px;
  align-items: center;
  padding: 18px 22px;
  border-radius: 999px;
  background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
  margin-bottom: 30px;
}

.brand {
  font-family: var(--heading);
  font-size: 1.4rem;
  letter-spacing: 0.04em;
  color: var(--accent);
}

.nav-links {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.nav-controls {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.18);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: .3s ease;
}
.btn:hover, .btn.active {
  background: var(--accent);
  color: #111;
  border-color: var(--accent);
  transform: translateY(-1px);
}
.btn-danger {
  color: var(--danger);
  border-color: rgba(255,92,92,0.5);
}
.btn-danger:hover {
  background: var(--danger);
  color: #111;
  border-color: var(--danger);
}

/* --- Main Paper --- */
.paper {
  background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  animation: liftIn .6s ease;
  min-height: 420px;
}

@keyframes liftIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-family: var(--heading);
  font-size: 2.1rem;
  margin: 0 0 18px;
  color: var(--accent);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 18px;
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--body);
  outline: none;
  transition: .25s;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232,192,125,0.15); }

/* --- Entry Rows --- */
.entry-lines { display: flex; flex-direction: column; gap: 12px; }
.entry-row {
  display: grid;
  grid-template-columns: 2fr 1fr auto;
  gap: 10px;
  align-items: center;
}

/* --- Actions --- */
.btn-action {
  background: var(--accent);
  color: #111;
  border: none;
  padding: 12px 24px;
  font-weight: 700;
  border-radius: 999px;
  transition: transform .2s ease;
}
.btn-action:active { transform: scale(0.96); }

/* --- Table --- */
.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { padding: 14px 12px; }
th {
  font-family: var(--heading);
  color: var(--accent);
  font-weight: 600;
  text-align: left;
}
td { border-bottom: 1px solid rgba(255,255,255,0.06); }
tr:hover td { background: rgba(255,255,255,0.03); }

.text-right { text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

/* --- Responsive --- */
@media (max-width: 820px) {
  .topbar { grid-template-columns: 1fr; text-align: center; }
  .nav-links, .nav-controls { justify-content: center; flex-wrap: wrap; }
  .form-grid { grid-template-columns: 1fr; }
  .entry-row { grid-template-columns: 1fr; }
  * { cursor: auto; }
  .cursor-dot, .cursor-outline { display: none; }
}

/* --- Motion Highlights --- */
.glow-line {
  position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
  background: radial-gradient(circle at 50% 100%, rgba(123,223,242,0.12), transparent 60%);
  pointer-events: none;
  z-index: -1;
}
</style>
</head>
<body>

<div id="canvas-container"></div>
<div class="glow-line"></div>

<div class="cursor-dot" id="cursor-dot"></div>
<div class="cursor-outline" id="cursor-outline"></div>

<div class="app">
  <div class="container">
    <nav class="topbar">
      <div class="brand magnetic-area"><div class="magnetic-wrap">SIS ACCOUNTING</div></div>
      <div class="nav-links" id="navLinks">
        <div class="magnetic-area"><button class="btn active magnetic-wrap" data-view="dashboard" onclick="switchView('dashboard')">Dashboard</button></div>
        <div class="magnetic-area"><button class="btn magnetic-wrap" data-view="new" onclick="switchView('new')">New Entry</button></div>
        <div class="magnetic-area"><button class="btn magnetic-wrap" data-view="journal" onclick="switchView('journal')">Journal</button></div>
        <div class="magnetic-area"><button class="btn magnetic-wrap" data-view="ledger" onclick="switchView('ledger')">Ledger</button></div>
        <div class="magnetic-area"><button class="btn magnetic-wrap" data-view="trial" onclick="switchView('trial')">Trial Balance</button></div>
      </div>
      <div class="nav-controls">
        <button class="btn" onclick="undo()">Undo</button>
        <button class="btn btn-danger" onclick="confirmGlobalDelete()">Global Delete</button>
      </div>
    </nav>

    <main id="main-content"></main>
  </div>
</div>

<script>
const LS_KEY = "SIS_ACCOUNTING_V7";
const uid = () => Math.random().toString(16).slice(2) + Date.now().toString(16);
const uid2 = () => Math.random().toString(36).substr(2, 9);

const state = { view: 'dashboard', entries: [], ledger: {}, folioNext: 1, editingId: null };
let historyStack = [];

function safeText(s) { return String(s ?? "").replace(/[<>]/g,""); }
function toPaise(str) { if(str === "" || str == null) return 0; const n = Number(str); return Number.isFinite(n) ? Math.round(n*100) : 0; }
function paiseToStr(p) { return (p/100).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

function pushHistory() {
  historyStack.push(JSON.stringify({ entries: state.entries, ledger: state.ledger, folioNext: state.folioNext }));
  if(historyStack.length > 20) historyStack.shift();
  saveLocal();
}

function undo() {
  if(historyStack.length === 0) return alert("No actions to undo.");
  const prev = JSON.parse(historyStack.pop());
  state.entries = prev.entries; state.ledger = prev.ledger; state.folioNext = prev.folioNext; state.editingId = null;
  saveLocal(); render();
}

function saveLocal() { localStorage.setItem(LS_KEY, JSON.stringify({ entries: state.entries, ledger: state.ledger, folioNext: state.folioNext })); }
function loadLocal() {
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ const data = JSON.parse(raw); state.entries = data.entries || []; state.ledger = data.ledger || {}; state.folioNext = data.folioNext || 1; }
}

function buildLedger() {
  state.ledger = {};
  state.entries.forEach(e => {
    e.debits.forEach(d => { if(!state.ledger[d.acc]) state.ledger[d.acc] = { dr:0, cr:0, lf: state.folioNext++ }; state.ledger[d.acc].dr += d.amtPaise; });
    e.credits.forEach(c => { if(!state.ledger[c.acc]) state.ledger[c.acc] = { dr:0, cr:0, lf: state.folioNext++ }; state.ledger[c.acc].cr += c.amtPaise; });
  });
}

const mainContent = document.getElementById('main-content');

function switchView(v) {
  state.view = v; state.editingId = null;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-view="${v}"]`); if(btn) btn.classList.add('active');
  render();
}

function render() {
  buildLedger(); mainContent.innerHTML = '';
  if(state.view === 'dashboard') renderDashboard();
  else if(state.view === 'new') renderNewEntry();
  else if(state.view === 'journal') renderJournal();
  else if(state.view === 'ledger') renderLedger();
  else if(state.view === 'trial') renderTrialBalance();
  initMagnetic();
}

function renderDashboard() {
  mainContent.innerHTML = `
    <div class="paper">
      <h2 class="section-title">Overview</h2>
      <p>Welcome to the Saraswati International School Accounting System.</p>
    </div>`;
}

let tempDebits = [{id: uid2(), acc: '', amt: ''}];
let tempCredits = [{id: uid2(), acc: '', amt: ''}];

function renderNewEntry() {
  if(state.editingId) {
    const entry = state.entries.find(e => e.id === state.editingId);
    if(entry) {
      tempDebits = entry.debits.map(d => ({id: uid2(), acc: d.acc, amt: String(d.amtPaise/100)}));
      tempCredits = entry.credits.map(c => ({id: uid2(), acc: c.acc, amt: String(c.amtPaise/100)}));
    }
  } else {
    tempDebits = [{id: uid2(), acc: '', amt: ''}];
    tempCredits = [{id: uid2(), acc: '', amt: ''}];
  }

  const dateVal = state.editingId ? state.entries.find(e=>e.id===state.editingId).date : todayISO();
  const narrVal = state.editingId ? state.entries.find(e=>e.id===state.editingId).narration : "";

  mainContent.innerHTML = `
    <div class="paper">
      <h2 class="section-title">${state.editingId ? "Edit Entry" : "New Journal Entry"}</h2>
      <div class="form-grid">
        <div><label>Date</label><input type="date" id="entryDate" value="${dateVal}"></div>
        <div><label>Narration</label><input type="text" id="entryNarr" placeholder="Description..." value="${narrVal}"></div>
      </div>
      <h3>Debits</h3>
      <div class="entry-lines" id="debitLines"></div>
      <button class="btn" onclick="addLine('debit')">+ Add Debit</button>

      <h3 style="margin-top:20px;">Credits</h3>
      <div class="entry-lines" id="creditLines"></div>
      <button class="btn" onclick="addLine('credit')">+ Add Credit</button>

      <div style="margin-top:30px; text-align:right;">
        <button class="btn" onclick="switchView('journal')" style="margin-right:10px;">Cancel</button>
        <button class="btn-action" onclick="saveEntry()">Save Entry</button>
      </div>
    </div>
  `;
  renderLines('debit', tempDebits);
  renderLines('credit', tempCredits);
}

function addLine(side) {
  if(side === 'debit') tempDebits.push({id: uid2(), acc: '', amt: ''});
  else tempCredits.push({id: uid2(), acc: '', amt: ''});
  renderLines(side, side==='debit' ? tempDebits : tempCredits);
}

function renderLines(side, arr) {
  const container = document.getElementById(side + 'Lines');
  container.innerHTML = arr.map((line, i) => `
    <div class="entry-row" data-id="${line.id}">
      <input type="text" placeholder="Account Name" class="inp-acc" value="${safeText(line.acc)}">
      <input type="number" placeholder="Amount" class="inp-amt" value="${line.amt}">
      <button class="btn btn-danger" onclick="removeLine('${side}', ${i})">✕</button>
    </div>
  `).join('');
}

function removeLine(side, index) {
  if(side === 'debit') tempDebits.splice(index, 1);
  else tempCredits.splice(index, 1);
  renderLines(side, side==='debit' ? tempDebits : tempCredits);
}

function saveEntry() {
  const date = document.getElementById('entryDate').value;
  const narr = document.getElementById('entryNarr').value;
  const debits = [...document.querySelectorAll('#debitLines .entry-row')].map(r => ({
    acc: r.querySelector('.inp-acc').value,
    amtPaise: toPaise(r.querySelector('.inp-amt').value)
  })).filter(d => d.acc && d.amtPaise > 0).map(d => ({...d, id: uid2()}));
  const credits = [...document.querySelectorAll('#creditLines .entry-row')].map(r => ({
    acc: r.querySelector('.inp-acc').value,
    amtPaise: toPaise(r.querySelector('.inp-amt').value)
  })).filter(c => c.acc && c.amtPaise > 0).map(c => ({...c, id: uid2()}));

  const drTotal = debits.reduce((a,b)=>a+b.amtPaise,0);
  const crTotal = credits.reduce((a,b)=>a+b.amtPaise,0);

  if(drTotal !== crTotal) return alert(`Debit Total (${paiseToStr(drTotal)}) must match Credit Total (${paiseToStr(crTotal)}).`);

  if(state.editingId) {
    const index = state.entries.findIndex(e => e.id === state.editingId);
    if(index !== -1) {
      state.entries[index] = { id: state.editingId, date, narration: narr, debits, credits, createdAt: state.entries[index].createdAt };
    }
    state.editingId = null;
  } else {
    state.entries.push({ id: uid(), date, narration: narr, debits, credits, createdAt: Date.now() });
  }

  tempDebits = [{id: uid2(), acc: '', amt: ''}];
  tempCredits = [{id: uid2(), acc: '', amt: ''}];
  pushHistory(); switchView('journal');
}

function editEntry(id) { state.editingId = id; switchView('new'); }

function renderJournal() {
  buildLedger();
  const rows = [...state.entries].sort((a,b)=>b.createdAt-a.createdAt);
  let html = `<div class="paper"><h2 class="section-title">Journal Entries</h2>
  <div style="text-align:right; margin-bottom:10px;">
    <button class="btn btn-danger" onclick="confirmJournalDelete()">Delete All (Journal)</button>
  </div>`;

  if(rows.length === 0) html += `<p>No entries found.</p>`;
  else {
    html += `<div class="table-responsive"><table>
      <thead><tr><th>Date</th><th>Particulars</th><th class="text-right">Debit</th><th class="text-right">Credit</th><th class="text-right">Actions</th></tr></thead>
      <tbody>`;
    rows.forEach(e => {
      e.debits.forEach((d,i) => {
        html += `<tr>
          <td>${i===0?e.date:''}</td>
          <td><b>${d.acc}</b> ${i===0?`<br><small class="text-muted">${e.narration}</small>`:''}</td>
          <td class="text-right mono">${paiseToStr(d.amtPaise)}</td>
          <td class="text-right"></td>
          <td class="text-right">${i===0 ? `<button class="btn" onclick="editEntry('${e.id}')">Edit</button> <button class="btn btn-danger" onclick="deleteSingleEntry('${e.id}')">Delete</button>` : ""}</td>
        </tr>`;
      });
      e.credits.forEach(c => {
        html += `<tr>
          <td></td>
          <td style="padding-left:20px;">To <b>${c.acc}</b></td>
          <td class="text-right"></td>
          <td class="text-right mono">${paiseToStr(c.amtPaise)}</td>
          <td class="text-right"></td>
        </tr>`;
      });
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  mainContent.innerHTML = html;
}

function deleteSingleEntry(id) {
  if(confirm("Are you sure you want to delete this entry?")) {
    pushHistory();
    state.entries = state.entries.filter(e => e.id !== id);
    saveLocal(); render();
  }
}

function confirmJournalDelete() {
  if(confirm("This will delete ALL Journal Entries (and consequently clear Ledger). Continue?")) {
    pushHistory();
    state.entries = []; state.ledger = {}; state.folioNext = 1;
    saveLocal(); render();
  }
}

function confirmGlobalDelete() {
  if(confirm("GLOBAL DELETE: This will wipe ALL data permanently.")) {
    localStorage.removeItem(LS_KEY);
    state.entries = []; state.ledger = {}; state.folioNext = 1; historyStack = [];
    render();
  }
}

function renderLedger() {
  buildLedger();
  const accounts = Object.keys(state.ledger).sort();
  let html = `<div class="paper"><h2 class="section-title">General Ledger</h2>`;
  if(accounts.length === 0) html += `<p>No ledger data.</p>`;
  else {
    html += `<div style="display:grid; gap:18px;">`;
    accounts.forEach(acc => {
      const data = state.ledger[acc];
      const bal = data.dr - data.cr;
      const balType = bal >= 0 ? "Dr" : "Cr";
      html += `
        <div class="paper" style="min-height:auto; padding:18px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">${acc} <small>(LF: ${data.lf})</small></h3>
            <button class="btn btn-danger" onclick="deleteAccount('${safeText(acc)}')">Delete Account</button>
          </div>
          <div style="display:flex; justify-content:space-between; padding:10px 0;">
            <span>Total Debit:</span> <span class="mono">${paiseToStr(data.dr)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding:10px 0;">
            <span>Total Credit:</span> <span class="mono">${paiseToStr(data.cr)}</span>
          </div>
          <div style="margin-top:10px; padding:10px; background:rgba(232,192,125,0.1); border-radius:10px; text-align:center;">
            <b>Balance: ${paiseToStr(Math.abs(bal))} ${balType}</b>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  mainContent.innerHTML = html;
}

function deleteAccount(accName) {
  if(confirm(`Delete ALL entries for account "${accName}"? This cannot be undone.`)) {
    pushHistory();
    state.entries = state.entries.filter(e => {
      const hasInDebit = e.debits.some(d => d.acc === accName);
      const hasInCredit = e.credits.some(c => c.acc === accName);
      return !(hasInDebit || hasInCredit);
    });
    saveLocal(); render();
  }
}

function renderTrialBalance() {
  buildLedger();
  const accounts = Object.keys(state.ledger).sort();
  let totalDr = 0, totalCr = 0;
  let html = `<div class="paper"><h2 class="section-title">Trial Balance</h2>`;
  if(accounts.length === 0) html += `<p>No data available. Create entries first.</p>`;
  else {
    html += `<div class="table-responsive"><table>
      <thead><tr><th>Account Name</th><th class="text-right">L.F.</th><th class="text-right">Debit Balance (₹)</th><th class="text-right">Credit Balance (₹)</th></tr></thead><tbody>`;
    accounts.forEach(acc => {
      const data = state.ledger[acc]; const bal = data.dr - data.cr;
      if(bal === 0) return;
      if(bal > 0){ totalDr += bal; html += `<tr><td><b>${safeText(acc)}</b></td><td class="text-right">${data.lf}</td><td class="text-right mono">${paiseToStr(bal)}</td><td class="text-right"></td></tr>`; }
      else { totalCr += Math.abs(bal); html += `<tr><td><b>${safeText(acc)}</b></td><td class="text-right">${data.lf}</td><td class="text-right"></td><td class="text-right mono">${paiseToStr(Math.abs(bal))}</td></tr>`; }
    });
    const matched = totalDr === totalCr;
    html += `</tbody><tfoot><tr><td colspan="2" class="text-right">Total:</td><td class="text-right mono">${paiseToStr(totalDr)}</td><td class="text-right mono">${paiseToStr(totalCr)}</td></tr></tfoot></table></div>
    <div style="margin-top:16px; text-align:center; padding:12px; border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
      Status: <b style="color:${matched ? '#7bdff2' : '#ff5c5c'}">${matched ? '✓ Matched' : '✗ Not Matched'}</b>
    </div>`;
  }
  html += `</div>`;
  mainContent.innerHTML = html;
}

const initThreeJS = () => {
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const renderer = new THREE.WebGLRenderer({ alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.PlaneGeometry(2,2);
  const uniforms = { u_time: { value: 0.0 }, u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } };

  const fragmentShader = `
    uniform float u_time;
    uniform vec2 u_resolution;
    float noise(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      float n = noise(uv * 50.0 + u_time * 0.02);
      vec3 base = mix(vec3(0.06,0.07,0.09), vec3(0.12,0.13,0.16), uv.y);
      vec3 glow = vec3(0.9,0.75,0.45) * smoothstep(0.2, 0.8, sin(uv.x*8.0 + u_time*0.2));
      gl_FragColor = vec4(base + glow * 0.05 + n*0.02, 1.0);
    }
  `;

  const material = new THREE.ShaderMaterial({ uniforms, fragmentShader, vertexShader: 'void main(){gl_Position=vec4(position,1.0);}' });
  const plane = new THREE.Mesh(geometry, material);
  scene.add(plane);

  const animate = () => { requestAnimationFrame(animate); uniforms.u_time.value += 0.01; renderer.render(scene, camera); };
  animate();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
  });
};

function initMagnetic() {
  document.querySelectorAll('.magnetic-area').forEach(magnet => {
    const wrap = magnet.querySelector('.magnetic-wrap');
    if(!wrap) return;
    magnet.addEventListener('mousemove', (e) => {
      const rect = magnet.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      wrap.style.transform = `translate(${x*0.2}px, ${y*0.2}px)`;
    });
    magnet.addEventListener('mouseleave', () => { wrap.style.transform = 'translate(0,0)'; });
  });
}

const cursorDot = document.getElementById('cursor-dot');
const cursorOutline = document.getElementById('cursor-outline');
window.addEventListener('mousemove', (e) => {
  cursorDot.style.left = e.clientX + 'px';
  cursorDot.style.top = e.clientY + 'px';
  cursorOutline.animate({ left: e.clientX + 'px', top: e.clientY + 'px' }, { duration: 500, fill: "forwards" });
});

loadLocal();
initThreeJS();
render();
</script>
</body>
