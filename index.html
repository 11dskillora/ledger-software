<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledger — Apple Style</title>

<style>
*{
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                Roboto,Helvetica,Arial,sans-serif;
}

body{
    margin:0;
    padding:40px 20px;
    background:#f5f5f7;
    color:#1d1d1f;
}

h1{
    text-align:center;
    font-size:34px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6e6e73;
    margin-bottom:40px;
}

/* NAV */
.menu{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

.menu button{
    background:#0071e3;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:0.25s;
}

.menu button:hover{
    background:#0077ed;
    transform:scale(1.04);
}

/* CARD */
.card{
    max-width:900px;
    margin:0 auto 30px;
    background:white;
    border-radius:22px;
    padding:32px;
    box-shadow:0 20px 40px rgba(0,0,0,0.08);
    animation:fadeUp 0.5s ease;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(25px)}
    to{opacity:1;transform:translateY(0)}
}

h3{
    margin-top:0;
    margin-bottom:20px;
}

/* FORM */
label{
    font-size:13px;
    color:#6e6e73;
    display:block;
    margin-top:18px;
}

input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:12px;
    border:1px solid #d2d2d7;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#0071e3;
}

/* ROW */
.row{
    display:flex;
    gap:14px;
    margin-top:10px;
}

.add-btn{
    margin-top:12px;
    background:#e8e8ed;
    border:none;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
}

.add-btn:hover{
    background:#dcdce1;
}

.save-btn{
    margin-top:30px;
    width:100%;
    padding:14px;
    background:#0071e3;
    color:white;
    border:none;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
}

.save-btn:hover{
    background:#0077ed;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:14px;
    font-size:14px;
    border-bottom:1px solid #e8e8ed;
    text-align:left;
}

th{
    color:#6e6e73;
    font-weight:500;
}

@media(max-width:700px){
    .row{flex-direction:column;}
}
</style>
</head>

<body>

<h1>Ledger</h1>
<div class="subtitle">Simple. Clean. Apple-style accounting UI</div>

<div class="menu">
    <button onclick="addEntryUI()">Add Journal Entry</button>
    <button onclick="viewJournal()">Compound Journal</button>
    <button onclick="viewLedger()">Ledger</button>
</div>

<div id="content"></div>

<script>
let journal = [];
let ledger = {};

/* ADD ENTRY UI */
function addEntryUI(){
document.getElementById("content").innerHTML = `
<div class="card">
<h3>Compound Journal Entry</h3>

<label>Date</label>
<input type="date" id="date">

<label>Debit Accounts</label>
<div id="debits"></div>
<button class="add-btn" onclick="addRow('debits')">+ Add Debit</button>

<label>Credit Accounts</label>
<div id="credits"></div>
<button class="add-btn" onclick="addRow('credits')">+ Add Credit</button>

<label>Narration</label>
<input id="narr" placeholder="Being ...">

<button class="save-btn" onclick="saveEntry()">Save Entry</button>
</div>`;
addRow("debits");
addRow("credits");
}

function addRow(id){
document.getElementById(id).insertAdjacentHTML("beforeend",`
<div class="row">
<input placeholder="Account Name">
<input type="number" placeholder="Amount">
</div>`);
}

/* SAVE ENTRY */
function saveEntry(){
let date = document.getElementById("date").value;
let narr = document.getElementById("narr").value;

let dr=[], cr=[], drT=0, crT=0;

document.querySelectorAll("#debits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){dr.push({a,m});drT+=m;}
});

document.querySelectorAll("#credits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){cr.push({a,m});crT+=m;}
});

if(drT!==crT || drT===0){
alert("Debit and Credit totals must match");
return;
}

journal.push({date,narr,dr,cr});

dr.forEach(d=>{
ledger[d.a] = ledger[d.a] || [];
ledger[d.a].push({date,p:"To "+cr.map(x=>x.a).join(", "),dr:d.m,cr:""});
});

cr.forEach(c=>{
ledger[c.a] = ledger[c.a] || [];
ledger[c.a].push({date,p:"By "+dr.map(x=>x.a).join(", "),dr:"",cr:c.m});
});

alert("Entry saved successfully");
}

/* VIEW JOURNAL */
function viewJournal(){
if(journal.length===0){
content.innerHTML="<div class='card'>No journal entries yet.</div>";
return;
}

let h="<div class='card'><h3>Compound Journal</h3>";

journal.forEach(j=>{
h+=`
<table>
<tr><th>Date</th><th>Particulars</th><th>Debit</th><th>Credit</th></tr>`;
j.dr.forEach(d=>{
h+=`<tr><td>${j.date}</td><td>${d.a}</td><td>${d.m}</td><td></td></tr>`;
});
j.cr.forEach(c=>{
h+=`<tr><td></td><td>To ${c.a}</td><td></td><td>${c.m}</td></tr>`;
});
h+=`<tr><td></td><td colspan="3"><em>${j.narr}</em></td></tr></table><br>`;
});

h+="</div>";
content.innerHTML=h;
}

/* VIEW LEDGER */
function viewLedger(){
let h="<div class='card'><h3>Ledger</h3>";
for(let a in ledger){
h+=`<h4>${a}</h4>
<table>
<tr><th>Date</th><th>Particulars</th><th>Debit</th><th>Credit</th></tr>`;
ledger[a].forEach(t=>{
h+=`<tr><td>${t.date}</td><td>${t.p}</td><td>${t.dr}</td><td>${t.cr}</td></tr>`;
});
h+="</table>";
}
h+="</div>";
content.innerHTML=h;
}
</script>

</body>
</html>
