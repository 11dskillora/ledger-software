<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elite Ledger - Premium Accounting</title>

  <style>
    /* ==========================================================
       CLASSY & COOL PREMIUM UI DESIGN
       Sophisticated Luxury Interface with Modern Elegance
       ========================================================== */
    
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f4e4a7;
      --gold-dark: #b8941f;
      --charcoal: #2b2d42;
      --charcoal-light: #3d3f56;
      --navy: #1a1d2e;
      --cream: #f8f5f0;
      --white: #ffffff;
      --silver: #c0c0c0;
      --shadow: rgba(212, 175, 55, 0.15);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes goldGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), 0 0 40px rgba(212, 175, 55, 0.1);
      }
      50% {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 0 60px rgba(212, 175, 55, 0.2);
      }
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1d2e 0%, #2b2d42 100%);
      background-attachment: fixed;
      color: var(--cream);
      min-height: 100vh;
      position: relative;
    }

    /* Elegant Background Pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle Texture Overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="1" height="1" fill="rgba(212,175,55,0.02)"/></svg>');
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, rgba(26, 29, 46, 0.95) 0%, rgba(43, 45, 66, 0.95) 100%);
      backdrop-filter: blur(20px);
      padding: 35px 50px;
      border-bottom: 2px solid var(--gold);
      position: relative;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.05), transparent);
      animation: shimmer 3s infinite;
    }

    .header-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .logo-section h1 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 0 2px 20px rgba(212, 175, 55, 0.4);
    }

    .logo-section .tagline {
      font-family: 'Poppins', sans-serif;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 5px;
      opacity: 0.9;
    }

    .header-badge {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    /* Navigation */
    nav {
      background: rgba(26, 29, 46, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      position: sticky;
      top: 0;
      z-index: 99;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
    }

    .nav-container {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      padding: 0 50px;
    }

    nav button {
      flex: 1;
      border: none;
      padding: 20px 30px;
      background: transparent;
      color: var(--cream);
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border-right: 1px solid rgba(212, 175, 55, 0.1);
    }

    nav button:last-child {
      border-right: none;
    }

    nav button::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--gold);
      transform: translateX(-50%);
      transition: width 0.4s ease;
    }

    nav button:hover {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.05);
    }

    nav button.active {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.1);
      font-weight: 600;
    }

    nav button.active::before {
      width: 80%;
    }

    /* Container */
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 50px;
      position: relative;
      z-index: 1;
    }

    /* Pages */
    .page {
      display: none;
    }

    .page.active {
      display: block;
      animation: fadeInUp 0.6s ease;
    }

    /* Premium Card */
    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 45px;
      margin-bottom: 35px;
      position: relative;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }

    .card:hover {
      border-color: var(--gold);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(212, 175, 55, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
    }

    /* Gold Accent Line */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 20px 20px 0 0;
    }

    /* Section Headers */
    .subhead {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 30px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
      padding-bottom: 15px;
    }

    .subhead::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 2px;
      background: var(--gold);
    }

    .subhead .icon {
      font-size: 32px;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
    }

    /* Forms */
    .row {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 10px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input, textarea, select {
      border: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(26, 29, 46, 0.6);
      border-radius: 10px;
      padding: 14px 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 400;
      outline: none;
      color: var(--cream);
      min-width: 240px;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--gold);
      background: rgba(26, 29, 46, 0.8);
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        0 0 20px rgba(212, 175, 55, 0.2);
      transform: translateY(-2px);
    }

    textarea {
      min-width: 320px;
      resize: vertical;
      min-height: 100px;
    }

    input::placeholder, textarea::placeholder, select::placeholder {
      color: rgba(248, 245, 240, 0.4);
      font-style: italic;
    }

    /* Premium Buttons */
    .btn {
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
      padding: 14px 32px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      color: var(--gold);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
      border-color: var(--gold-light);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.15) 100%);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--navy);
      border-color: var(--gold);
      font-weight: 700;
    }

    .btn.primary:hover {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
    }

    .btn.secondary {
      border-color: rgba(192, 192, 192, 0.5);
      color: var(--silver);
      background: rgba(192, 192, 192, 0.1);
    }

    .btn.secondary:hover {
      border-color: var(--silver);
      background: rgba(192, 192, 192, 0.2);
    }

    .btn.danger {
      border-color: rgba(220, 53, 69, 0.5);
      color: #dc3545;
      background: rgba(220, 53, 69, 0.1);
    }

    .btn.danger:hover {
      border-color: #dc3545;
      background: rgba(220, 53, 69, 0.2);
    }

    /* Grid Layout */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      margin-top: 35px;
    }

    /* Entry Rows */
    .entry-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1.6fr;
      gap: 15px;
      margin-top: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      transition: all 0.3s ease;
      position: relative;
    }

    .entry-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, var(--gold), transparent);
      border-radius: 10px 0 0 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .entry-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--gold);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
    }

    .entry-row:hover::before {
      opacity: 1;
    }

    .entry-row input {
      min-width: unset;
      width: 100%;
    }

    /* Entry Card */
    .entry-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 15px;
      padding: 30px;
      margin: 25px 0;
      position: relative;
      transition: all 0.4s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .entry-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      border-radius: 15px 0 0 15px;
    }

    .entry-card:hover {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.03) 100%);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
      transform: translateX(5px);
    }

    /* Ledger Card */
    .ledger-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 15px;
      padding: 35px;
      margin: 30px 0;
      position: relative;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
    }

    .ledger-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), transparent);
      border-radius: 15px 15px 0 0;
    }

    .ledger-card:hover {
      border-color: var(--gold);
      box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
      transform: translateY(-4px);
    }

    .ledger-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      letter-spacing: 1px;
    }

    /* Elegant Table */
    .ledger-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
      font-size: 14px;
    }

    .ledger-table th,
    .ledger-table td {
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding: 18px 16px;
      vertical-align: top;
      text-align: left;
    }

    .ledger-table th {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1.5px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .ledger-table tbody tr {
      transition: all 0.2s ease;
    }

    .ledger-table tbody tr:hover {
      background: rgba(212, 175, 55, 0.05);
    }

    .ledger-table tfoot {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.08) 100%);
      font-weight: 700;
      color: var(--gold);
    }

    .ledger-table tfoot td {
      border-top: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
    }

    /* Utilities */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
      margin: 35px 0;
    }

    .info-box {
      padding: 20px 28px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.04) 100%);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      color: var(--gold-light);
      font-weight: 500;
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
    }

    .info-box .icon {
      font-size: 24px;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
    }

    /* Search Section */
    .search-section {
      background: rgba(212, 175, 55, 0.05);
      padding: 28px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 15px;
      margin-bottom: 35px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 100px 40px;
      color: rgba(248, 245, 240, 0.5);
    }

    .empty-state .icon {
      font-size: 80px;
      margin-bottom: 25px;
      opacity: 0.3;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
    }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--gold);
    }

    .empty-state p {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(26, 29, 46, 0.6);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      border-radius: 10px;
      border: 2px solid rgba(26, 29, 46, 0.6);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
    }

    /* Amount Display */
    .amount-display {
      font-family: 'Poppins', sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Responsive */
    @media(max-width: 1200px) {
      .container {
        padding: 40px 30px;
      }
      .nav-container {
        padding: 0 30px;
      }
      .header-content {
        padding: 0 30px;
      }
    }

    @media(max-width: 900px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
      .entry-row {
        grid-template-columns: 1fr;
      }
      input, textarea {
        width: 100%;
        min-width: unset;
      }
      .logo-section h1 {
        font-size: 32px;
      }
      .container {
        padding: 30px 20px;
      }
      .nav-container {
        padding: 0 20px;
      }
      .header-content {
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
      }
      nav button {
        font-size: 12px;
        padding: 16px 20px;
      }
    }

    /* Luxury Hover Effects */
    .luxury-hover {
      transition: all 0.3s ease;
    }

    .luxury-hover:hover {
      animation: float 2s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="logo-section">
        <h1>✦ ELITE LEDGER ✦</h1>
        <div class="tagline">Premium Accounting Excellence</div>
      </div>
      <div class="header-badge">
        Prestige Edition
      </div>
    </div>
  </header>

  <nav>
    <div class="nav-container">
      <button class="active" onclick="showPage(0)">New Entry</button>
      <button onclick="showPage(1)">Journal Records</button>
      <button onclick="showPage(2)">Ledger Accounts</button>
    </div>
  </nav>

  <div class="container">
    <!-- PAGE 1: JOURNAL ENTRY -->
    <section class="page active">
      <div class="card luxury-hover">
        <div class="subhead">
          <span class="icon">📝</span>
          Create Transaction Entry
        </div>

        <div class="row">
          <div>
            <label>Transaction Date</label>
            <input id="dateInput" type="date" />
          </div>

          <div style="flex: 1; min-width: 340px;">
            <label>Transaction Narration</label>
            <textarea id="narrationInput" rows="2" placeholder="Enter detailed description of the transaction..."></textarea>
          </div>
        </div>

        <div class="divider"></div>

        <div class="grid2">
          <div class="card" style="margin: 0; border-color: rgba(16, 185, 129, 0.5);">
            <div class="subhead" style="color: #10b981; font-size: 22px;">
              <span class="icon">💰</span>
              Debit Accounts
            </div>
            <div id="debitContainer"></div>
            <div class="row" style="margin-top: 25px;">
              <button class="btn" style="border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1);" onclick="addDebit()">
                + Add Debit Entry
              </button>
            </div>
          </div>

          <div class="card" style="margin: 0; border-color: rgba(239, 68, 68, 0.5);">
            <div class="subhead" style="color: #ef4444; font-size: 22px;">
              <span class="icon">📤</span>
              Credit Accounts
            </div>
            <div id="creditContainer"></div>
            <div class="row" style="margin-top: 25px;">
              <button class="btn" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1);" onclick="addCredit()">
                + Add Credit Entry
              </button>
            </div>
          </div>
        </div>

        <div class="row" style="margin-top: 40px; gap: 18px;">
          <button class="btn primary" onclick="addEntry()">
            💎 Save Transaction
          </button>
          <button class="btn secondary" onclick="resetEntryForm()">
            🔄 Reset Form
          </button>
          <button class="btn danger" onclick="undoLast()">
            ↶ Undo Last Action
          </button>
        </div>

        <div class="info-box">
          <span class="icon">💡</span>
          <div><strong>Pro Tip:</strong> Press <strong>Enter</strong> to seamlessly navigate between fields and automatically create new entry rows</div>
        </div>
      </div>
    </section>

    <!-- PAGE 2: JOURNAL VIEW -->
    <section class="page">
      <div class="card luxury-hover">
        <div class="subhead">
          <span class="icon">📊</span>
          Transaction Journal
        </div>

        <div class="search-section">
          <div class="row" style="margin: 0;">
            <div style="flex: 1; min-width: 300px;">
              <label>Search Entries</label>
              <input id="journalSearchInput" type="text" placeholder="Search by date, account, or narration..." />
            </div>
            <div>
              <label>Filter By</label>
              <select id="journalSearchMode">
                <option value="all">All Fields</option>
                <option value="account">Account Name</option>
                <option value="narration">Narration</option>
                <option value="date">Date</option>
              </select>
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="btn secondary" onclick="clearJournalSearch()">Clear Filter</button>
            </div>
          </div>
        </div>

        <div id="journalOutput"></div>
      </div>
    </section>

    <!-- PAGE 3: LEDGER -->
    <section class="page">
      <div class="card luxury-hover">
        <div class="subhead">
          <span class="icon">📖</span>
          Account Ledger
        </div>

        <div class="search-section">
          <div class="row" style="margin: 0;">
            <div style="flex: 1; min-width: 300px;">
              <label>Search Accounts</label>
              <input id="ledgerSearchInput" type="text" placeholder="Enter account name to filter..." />
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="btn secondary" onclick="clearLedgerSearch()">Clear Search</button>
            </div>
          </div>
        </div>

        <div id="ledgerOutput"></div>
      </div>
    </section>
  </div>

  <script>
  /* ==========================================================
     COMPOUND JOURNAL → AUTO LEDGER (ELITE EDITION)
     All original functionality preserved with premium styling
     ========================================================== */

  (function () {
    "use strict";

    var journal = [];
    var ledger = {};
    var undoStack = [];
    var LS_JOURNAL = "journalData";
    var LS_UNDO = "undoStack";

    function $(sel, root) { return (root || document).querySelector(sel); }
    function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    function escapeHtml(text) {
      var div = document.createElement("div");
      div.textContent = String(text == null ? "" : text);
      return div.innerHTML;
    }

    function toPaise(v) {
      var n = Number(v);
      if (!isFinite(n) || n <= 0) return 0;
      return Math.round(n * 100);
    }

    function paiseToStr(p) {
      p = Number(p) || 0;
      return (p / 100).toFixed(2);
    }

    function normalizeAccountName(name) {
      var n = String(name || "").trim();
      if (!n) return "";
      n = n.replace(/\s+/g, " ");
      if (!/a\/c$/i.test(n)) n = n + " A/c";
      n = n.replace(/A\/c\s*A\/c$/i, "A/c");
      n = n.charAt(0).toUpperCase() + n.slice(1);
      return n;
    }

    function safeJSONParse(str, fallback) {
      try {
        var obj = JSON.parse(str);
        return obj == null ? fallback : obj;
      } catch (e) {
        return fallback;
      }
    }

    function persist() {
      try { localStorage.setItem(LS_JOURNAL, JSON.stringify(journal)); } catch (e) {}
      try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack)); } catch (e2) {}
    }

    function restore() {
      var j = safeJSONParse(localStorage.getItem(LS_JOURNAL), []);
      var u = safeJSONParse(localStorage.getItem(LS_UNDO), []);
      if (!Array.isArray(j)) j = [];
      if (!Array.isArray(u)) u = [];
      journal = j;
      undoStack = u;
    }

    function showPage(pageIndex) {
      var pages = $all(".page");
      var navBtns = $all("nav button");
      if (pageIndex < 0 || pageIndex >= pages.length) return;

      pages.forEach(function (p) { p.classList.remove("active"); });
      navBtns.forEach(function (b) { b.classList.remove("active"); });

      pages[pageIndex].classList.add("active");
      navBtns[pageIndex].classList.add("active");
    }
    window.showPage = showPage;

    function addDebit(prefill) {
      var container = document.getElementById("debitContainer");
      if (!container) return;

      var row = document.createElement("div");
      row.className = "entry-row debit-row";
      row.innerHTML =
        '<input placeholder="Account Name" class="account-input" type="text">' +
        '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input amount-display">' +
        '<input placeholder="Particulars" class="particulars-input" type="text">';
      container.appendChild(row);

      var p = $(".particulars-input", row);
      if (p) { p.readOnly = true; p.value = ""; }

      if (prefill && typeof prefill === "object") {
        var a = $(".account-input", row);
        var m = $(".amount-input", row);
        if (a) a.value = prefill.acc || "";
        if (m) m.value = prefill.amtStr || "";
      }

      autoFillParticularsInForm();
    }

    function addCredit(prefill) {
      var container = document.getElementById("creditContainer");
      if (!container) return;

      var row = document.createElement("div");
      row.className = "entry-row credit-row";
      row.innerHTML =
        '<input placeholder="Account Name" class="account-input" type="text">' +
        '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input amount-display">' +
        '<input placeholder="Particulars" class="particulars-input" type="text">';
      container.appendChild(row);

      var p = $(".particulars-input", row);
      if (p) { p.readOnly = true; p.value = ""; }

      if (prefill && typeof prefill === "object") {
        var a = $(".account-input", row);
        var m = $(".amount-input", row);
        if (a) a.value = prefill.acc || "";
        if (m) m.value = prefill.amtStr || "";
      }

      autoFillParticularsInForm();
    }

    window.addDebit = addDebit;
    window.addCredit = addCredit;

    function getRowsData(selector) {
      var rows = $all(selector);
      return rows.map(function (row) {
        var accEl = $(".account-input", row);
        var amtEl = $(".amount-input", row);
        var acc = normalizeAccountName(accEl ? accEl.value : "");
        var amt = toPaise(amtEl ? amtEl.value : 0);
        return { acc: acc, amt: amt, row: row };
      });
    }

    function autoFillParticularsInForm() {
      var debits = getRowsData(".debit-row");
      var credits = getRowsData(".credit-row");

      var debitAccounts = debits.map(function(d){ return d.acc; }).filter(Boolean);
      var creditAccounts = credits.map(function(c){ return c.acc; }).filter(Boolean);

      var debitParticularText = debitAccounts.length ? ("By " + debitAccounts.join(", ")) : "";
      var creditParticularText = creditAccounts.length ? ("To " + creditAccounts.join(", ")) : "";

      debits.forEach(function (d) {
        var p = $(".particulars-input", d.row);
        if (p) { p.readOnly = true; p.value = creditParticularText; }
      });

      credits.forEach(function (c) {
        var p = $(".particulars-input", c.row);
        if (p) { p.readOnly = true; p.value = debitParticularText; }
      });
    }
    window.autoFillParticularsInForm = autoFillParticularsInForm;

    document.addEventListener("input", function (e) {
      if (!e.target || !e.target.classList) return;
      if (e.target.classList.contains("account-input") || e.target.classList.contains("amount-input")) {
        autoFillParticularsInForm();
      }
    });

    (function enableEnterNavigation(){
      function focusEl(el){
        if (!el) return;
        el.focus();
        try { if (el.select) el.select(); } catch(e){}
      }

      function getRowInputs(row){
        if (!row) return [];
        var acc = row.querySelector('.account-input');
        var amt = row.querySelector('.amount-input');
        var par = row.querySelector('.particulars-input');
        var arr = [];
        if (acc) arr.push(acc);
        if (amt) arr.push(amt);
        if (par) arr.push(par);
        return arr;
      }

      function ensureNextRow(currentRow){
        if (!currentRow) return null;

        if (currentRow.classList.contains('debit-row')) {
          var next = currentRow.nextElementSibling;
          if (next && next.classList.contains('debit-row')) return next;
          addDebit();
          return currentRow.nextElementSibling;
        }

        if (currentRow.classList.contains('credit-row')) {
          var next2 = currentRow.nextElementSibling;
          if (next2 && next2.classList.contains('credit-row')) return next2;
          addCredit();
          return currentRow.nextElementSibling;
        }

        return null;
      }

      document.addEventListener('keydown', function(e){
        if (e.key !== 'Enter') return;

        var t = e.target;
        if (!t || !t.classList) return;

        if (!(t.classList.contains('account-input') || t.classList.contains('amount-input') || t.classList.contains('particulars-input'))) {
          return;
        }

        e.preventDefault();

        var row = t.closest('.entry-row');
        if (!row) return;

        var inputs = getRowInputs(row);
        var idx = inputs.indexOf(t);

        if (idx >= 0 && idx < inputs.length - 1) {
          focusEl(inputs[idx + 1]);
          return;
        }

        var nextRow = ensureNextRow(row);
        if (nextRow) {
          var nextInputs = getRowInputs(nextRow);
          focusEl(nextInputs[0]);
          autoFillParticularsInForm();
          return;
        }
      }, true);
    })();

    function validateEntry(debits, credits) {
      var errors = [];

      if (!debits.length) errors.push("Add at least 1 debit line.");
      if (!credits.length) errors.push("Add at least 1 credit line.");

      debits.forEach(function (d, idx) {
        if (!d.acc) errors.push("Debit row " + (idx + 1) + ": Account name is required.");
        if (d.amt <= 0) errors.push("Debit row " + (idx + 1) + ": Amount must be > 0.");
      });

      credits.forEach(function (c, idx) {
        if (!c.acc) errors.push("Credit row " + (idx + 1) + ": Account name is required.");
        if (c.amt <= 0) errors.push("Credit row " + (idx + 1) + ": Amount must be > 0.");
      });

      var debitTotal = debits.reduce(function(s, d){ return s + d.amt; }, 0);
      var creditTotal = credits.reduce(function(s, c){ return s + c.amt; }, 0);

      if (debitTotal !== creditTotal) {
        errors.push("Debit total (₹" + paiseToStr(debitTotal) + ") must equal Credit total (₹" + paiseToStr(creditTotal) + ").");
      }

      return { ok: errors.length === 0, errors: errors };
    }

    function ensureLedgerAcc(name) {
      if (!ledger[name]) ledger[name] = [];
    }

    function postToLedger(entry, entryIndex) {
      var jf = entry.jf || "-";

      entry.debits.forEach(function (d) {
        ensureLedgerAcc(d.acc);
        ledger[d.acc].push({
          entryIndex: entryIndex,
          date: entry.date,
          particulars: "To " + entry.credits.map(function(c){ return c.acc; }).join(", "),
          debit: d.amt,
          credit: 0,
          jf: jf
        });
      });

      entry.credits.forEach(function (c) {
        ensureLedgerAcc(c.acc);
        ledger[c.acc].push({
          entryIndex: entryIndex,
          date: entry.date,
          particulars: "By " + entry.debits.map(function(d){ return d.acc; }).join(", "),
          debit: 0,
          credit: c.amt,
          jf: jf
        });
      });
    }

    function rebuildLedgerFromJournal() {
      ledger = {};
      journal.forEach(function(entry, idx){
        postToLedger(entry, idx);
      });
    }

    function addEntry() {
      var dateEl = $("#dateInput");
      var narrationEl = $("#narrationInput");

      var date = (dateEl ? dateEl.value : "").trim();
      var narration = (narrationEl ? narrationEl.value : "").trim();

      var debits = getRowsData(".debit-row").filter(function(d){ return d.acc || d.amt; });
      var credits = getRowsData(".credit-row").filter(function(c){ return c.acc || c.amt; });

      var v = validateEntry(debits, credits);
      if (!v.ok) {
        alert("Please fix these errors:\n\n" + v.errors.map(function(e){ return "• " + e; }).join("\n"));
        return;
      }

      var entry = {
        date: date || new Date().toISOString().slice(0, 10),
        narration: narration || "-",
        debits: debits.map(function(d){ return { acc: d.acc, amt: d.amt }; }),
        credits: credits.map(function(c){ return { acc: c.acc, amt: c.amt }; }),
        jf: "-"
      };

      undoStack.push({ type: "add", index: journal.length, entry: entry });

      journal.push(entry);
      rebuildLedgerFromJournal();
      persist();

      resetEntryForm();
      renderAll();
    }
    window.addEntry = addEntry;

    function editEntry(index) {
      index = Number(index);
      if (!isFinite(index) || index < 0 || index >= journal.length) {
        alert("Invalid entry index.");
        return;
      }

      var e = journal[index];
      showPage(0);

      var dateEl = $("#dateInput");
      var narrationEl = $("#narrationInput");
      if (dateEl) dateEl.value = e.date || "";
      if (narrationEl) narrationEl.value = (e.narration && e.narration !== "-") ? e.narration : "";

      var debitC = document.getElementById("debitContainer");
      var creditC = document.getElementById("creditContainer");
      if (!debitC || !creditC) return;

      debitC.innerHTML = "";
      creditC.innerHTML = "";

      (e.debits || []).forEach(function(d){
        addDebit({ acc: d.acc, amtStr: paiseToStr(d.amt) });
      });
      (e.credits || []).forEach(function(c){
        addCredit({ acc: c.acc, amtStr: paiseToStr(c.amt) });
      });

      if (!document.querySelector(".debit-row")) addDebit();
      if (!document.querySelector(".credit-row")) addCredit();

      autoFillParticularsInForm();

      var originalAddEntry = window.addEntry;

      window.addEntry = function saveEditedEntry() {
        var date2 = ($("#dateInput") ? $("#dateInput").value : "").trim();
        var narration2 = ($("#narrationInput") ? $("#narrationInput").value : "").trim();

        var deb2 = getRowsData(".debit-row").filter(function(d){ return d.acc || d.amt; });
        var cre2 = getRowsData(".credit-row").filter(function(c){ return c.acc || c.amt; });

        var v2 = validateEntry(deb2, cre2);
        if (!v2.ok) {
          alert("Please fix these errors:\n\n" + v2.errors.map(function(x){ return "• " + x; }).join("\n"));
          return;
        }

        var oldCopy = JSON.parse(JSON.stringify(journal[index]));
        undoStack.push({ type: "edit", index: index, oldEntry: oldCopy });

        journal[index] = {
          date: date2 || new Date().toISOString().slice(0, 10),
          narration: narration2 || "-",
          debits: deb2.map(function(d){ return { acc: d.acc, amt: d.amt }; }),
          credits: cre2.map(function(c){ return { acc: c.acc, amt: c.amt }; }),
          jf: "-"
        };

        rebuildLedgerFromJournal();
        persist();
        resetEntryForm();
        renderAll();

        window.addEntry = originalAddEntry;

        alert("✓ Entry updated successfully!");
      };

      alert("Editing Entry #" + (index + 1) + ". Make your changes and click 'Save Transaction'.");
    }
    window.editEntry = editEntry;

    function undoLast() {
      if (!undoStack.length) {
        alert("Nothing to undo.");
        return;
      }

      var last = undoStack.pop();

      if (last.type === "add") {
        if (journal[last.index] && journal[last.index] === last.entry) {
          journal.splice(last.index, 1);
        } else {
          var idx = journal.lastIndexOf(last.entry);
          if (idx >= 0) journal.splice(idx, 1);
        }
      } else if (last.type === "edit") {
        if (last.oldEntry && journal[last.index]) {
          journal[last.index] = last.oldEntry;
        }
      }

      rebuildLedgerFromJournal();
      persist();
      renderAll();
    }
    window.undoLast = undoLast;

    function resetEntryForm() {
      var debitC = document.getElementById("debitContainer");
      var creditC = document.getElementById("creditContainer");
      if (!debitC || !creditC) return;

      debitC.innerHTML = "";
      creditC.innerHTML = "";

      addDebit();
      addCredit();

      var narrationEl = $("#narrationInput");
      if (narrationEl) narrationEl.value = "";

      autoFillParticularsInForm();
    }
    window.resetEntryForm = resetEntryForm;

    function getJournalSearchQuery() {
      var q = ($("#journalSearchInput") ? $("#journalSearchInput").value : "");
      return String(q || "").trim().toLowerCase();
    }

    function getJournalSearchMode() {
      var m = ($("#journalSearchMode") ? $("#journalSearchMode").value : "all");
      return m || "all";
    }

    function entryMatchesSearch(entry, q, mode) {
      if (!q) return true;

      var date = String(entry.date || "").toLowerCase();
      var narration = String(entry.narration || "").toLowerCase();

      var debitAccs = (entry.debits || []).map(function(d){ return String(d.acc || "").toLowerCase(); }).join(" ");
      var creditAccs = (entry.credits || []).map(function(c){ return String(c.acc || "").toLowerCase(); }).join(" ");
      var allAccs = (debitAccs + " " + creditAccs).trim();

      if (mode === "date") return date.indexOf(q) !== -1;
      if (mode === "narration") return narration.indexOf(q) !== -1;
      if (mode === "account") return allAccs.indexOf(q) !== -1;

      return (
        date.indexOf(q) !== -1 ||
        narration.indexOf(q) !== -1 ||
        allAccs.indexOf(q) !== -1
      );
    }

    function clearJournalSearch() {
      var s = $("#journalSearchInput");
      if (s) s.value = "";
      renderJournal();
    }
    window.clearJournalSearch = clearJournalSearch;

    function getLedgerSearchQuery() {
      var q = ($("#ledgerSearchInput") ? $("#ledgerSearchInput").value : "");
      return String(q || "").trim().toLowerCase();
    }

    function clearLedgerSearch() {
      var s = $("#ledgerSearchInput");
      if (s) s.value = "";
      renderLedger();
    }
    window.clearLedgerSearch = clearLedgerSearch;

    function renderJournal() {
      var out = document.getElementById("journalOutput");
      if (!out) return;

      if (!journal.length) {
        out.innerHTML = 
          '<div class="empty-state">' +
            '<div class="icon">📋</div>' +
            '<h3>No Entries Yet</h3>' +
            '<p>Create your first transaction entry to begin your accounting journey</p>' +
          '</div>';
        return;
      }

      var q = getJournalSearchQuery();
      var mode = getJournalSearchMode();

      var html = "";
      var shown = 0;

      journal.forEach(function (e, idx) {
        if (!entryMatchesSearch(e, q, mode)) return;

        shown++;

        var debitLines = (e.debits || []).map(function(d){
          return "<div style='padding:10px; margin:6px 0; background:rgba(16, 185, 129, 0.08); border-left:3px solid #10b981; border-radius:8px;'>" +
                 "<strong style='color:#10b981;'>Dr.</strong> " + escapeHtml(d.acc) + 
                 " <span class='amount-display' style='color:#10b981; font-size:16px; float:right;'>₹" + paiseToStr(d.amt) + "</span></div>";
        }).join("");

        var creditLines = (e.credits || []).map(function(c){
          return "<div style='padding:10px; margin:6px 0; background:rgba(239, 68, 68, 0.08); border-left:3px solid #ef4444; border-radius:8px;'>" +
                 "<strong style='color:#ef4444;'>Cr.</strong> " + escapeHtml(c.acc) + 
                 " <span class='amount-display' style='color:#ef4444; font-size:16px; float:right;'>₹" + paiseToStr(c.amt) + "</span></div>";
        }).join("");

        html +=
          "<div class='entry-card'>" +
            "<div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;'>" +
              "<div><strong style='font-size:18px; color:var(--gold); font-family:Playfair Display, serif;'>Entry #" + (idx + 1) + "</strong> " +
              "<span class='badge' style='margin-left:10px;'>📅 " + escapeHtml(e.date) + "</span></div>" +
              "<button class='btn' style='padding:10px 20px;' onclick='editEntry(" + idx + ")'>✏️ Edit</button>" +
            "</div>" +
            "<div>" + debitLines + "</div>" +
            "<div style='margin-top:10px;'>" + creditLines + "</div>" +
            "<div style='margin-top:15px; padding:12px; background:rgba(212, 175, 55, 0.08); border-left:3px solid var(--gold); border-radius:8px;'>" +
              "<strong style='color:var(--gold);'>Narration:</strong> <span style='color:var(--cream);'>" + escapeHtml(e.narration || "-") + "</span>" +
            "</div>" +
          "</div>";
      });

      if (!shown) {
        out.innerHTML = 
          '<div class="empty-state">' +
            '<div class="icon">🔍</div>' +
            '<h3>No Matching Entries</h3>' +
            '<p>Try adjusting your search criteria to find entries</p>' +
          '</div>';
        return;
      }

      out.innerHTML = html;
    }

    function renderLedger() {
      var out = document.getElementById("ledgerOutput");
      if (!out) return;

      var q = getLedgerSearchQuery();

      var accNames = Object.keys(ledger).sort(function(a,b){
        return a.localeCompare(b);
      });

      if (q) {
        accNames = accNames.filter(function(name){
          return String(name).toLowerCase().indexOf(q) !== -1;
        });
      }

      if (!accNames.length) {
        out.innerHTML = 
          '<div class="empty-state">' +
            '<div class="icon">📖</div>' +
            '<h3>No Ledger Accounts</h3>' +
            '<p>Add journal entries to populate your ledger accounts</p>' +
          '</div>';
        return;
      }

      var html = "";
      accNames.forEach(function (acc) {
        var rows = ledger[acc] || [];
        var debitTotal = 0, creditTotal = 0;

        var rowHtml = rows.map(function (r) {
          debitTotal += r.debit || 0;
          creditTotal += r.credit || 0;
          return (
            "<tr>" +
              "<td>" + escapeHtml(r.date) + "</td>" +
              "<td>" + escapeHtml(r.particulars) + "</td>" +
              "<td style='text-align:center;'>" + escapeHtml(r.jf || "-") + "</td>" +
              "<td style='text-align:right;'><span class='amount-display' style='color:#10b981;'>" + 
                (r.debit ? "₹" + paiseToStr(r.debit) : "") + "</span></td>" +
              "<td style='text-align:right;'><span class='amount-display' style='color:#ef4444;'>" + 
                (r.credit ? "₹" + paiseToStr(r.credit) : "") + "</span></td>" +
            "</tr>"
          );
        }).join("");

        var balance = debitTotal - creditTotal;
        var balanceType = balance >= 0 ? "Dr." : "Cr.";
        var balanceAbs = Math.abs(balance);

        html +=
          "<div class='ledger-card'>" +
            "<div style='display:flex; justify-content:space-between; align-items:center;'>" +
              "<h3>✦ " + escapeHtml(acc) + "</h3>" +
              "<div style='display:flex; gap:15px;'>" +
                "<span class='badge'>" + rows.length + " Entries</span>" +
                "<span class='badge' style='background:rgba(212, 175, 55, 0.15);'>" +
                  "Balance: ₹" + paiseToStr(balanceAbs) + " " + balanceType +
                "</span>" +
              "</div>" +
            "</div>" +
            "<div style='overflow:auto; margin-top:25px;'>" +
              "<table class='ledger-table'>" +
                "<thead><tr>" +
                  "<th>Date</th>" +
                  "<th>Particulars</th>" +
                  "<th style='text-align:center;'>J/F</th>" +
                  "<th style='text-align:right;'>Debit</th>" +
                  "<th style='text-align:right;'>Credit</th>" +
                "</tr></thead>" +
                "<tbody>" + rowHtml + "</tbody>" +
                "<tfoot>" +
                  "<tr>" +
                    "<td colspan='3'><strong>Total</strong></td>" +
                    "<td style='text-align:right;'><span class='amount-display'>₹" + paiseToStr(debitTotal) + "</span></td>" +
                    "<td style='text-align:right;'><span class='amount-display'>₹" + paiseToStr(creditTotal) + "</span></td>" +
                  "</tr>" +
                "</tfoot>" +
              "</table>" +
            "</div>" +
          "</div>";
      });

      out.innerHTML = html;
    }

    function renderAll() {
      renderJournal();
      renderLedger();
    }
    window.renderAll = renderAll;

    function attachSearchListeners(){
      var js = $("#journalSearchInput");
      var jm = $("#journalSearchMode");
      var ls = $("#ledgerSearchInput");

      if (js) js.addEventListener("input", function(){ renderJournal(); });
      if (jm) jm.addEventListener("change", function(){ renderJournal(); });
      if (ls) ls.addEventListener("input", function(){ renderLedger(); });
    }

    function init() {
      restore();
      rebuildLedgerFromJournal();

      var dateInput = document.getElementById("dateInput");
      if (dateInput && !dateInput.value) {
        dateInput.value = new Date().toISOString().slice(0, 10);
      }

      if (!document.querySelector(".debit-row")) addDebit();
      if (!document.querySelector(".credit-row")) addCredit();

      autoFillParticularsInForm();
      attachSearchListeners();
      renderAll();
    }

    window.addEventListener("error", function(e){
      console.error("Runtime error:", e.message, e.error);
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
