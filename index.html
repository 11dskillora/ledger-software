<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Accounting Dashboard</title>
<style>
/* -------------------- BASE -------------------- */
body {
    font-family: 'Courier New', monospace;
    margin:0; padding:0;
    background: linear-gradient(135deg,#fefcf5,#f4eee0);
    color:#3e2723;
    transition: 0.3s;
}
h1,h2,h3{text-align:center;margin:5px;color:#5c4033;}
.container{max-width:1400px;margin:auto;padding:15px;}

/* -------------------- FORM -------------------- */
input, select, button{
    padding:8px 12px;margin:3px;border-radius:6px;border:1px solid #a1887f;font-size:14px;
}
input:focus{border-color:#6d4c41;box-shadow:0 0 8px #bcaaa4;}
button{background:linear-gradient(to right,#a1887f,#d7ccc8);color:#3e2723;font-weight:bold;cursor:pointer;border:none;}
button:hover{background:linear-gradient(to right,#d7ccc8,#a1887f);transform:scale(1.05);}

/* -------------------- TABLES -------------------- */
.responsive-table{overflow-x:auto;}
table{width:100%;border-collapse:collapse;margin-bottom:25px;box-shadow:0 6px 15px rgba(0,0,0,0.05);}
th,td{border:1px solid #8b6f47;padding:10px;text-align:left;}
th{background:linear-gradient(to right,#f2e6d9,#d7ccc8);font-weight:bold;}
tr:hover td{background:rgba(255,235,205,0.3);}

/* -------------------- FLEX -------------------- */
.flex{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}
.flex>div{flex:1;min-width:280px;}

/* -------------------- ANIMATIONS -------------------- */
.fade-in{animation: fadeIn 0.5s ease-in-out;}
@keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}

/* -------------------- NOTEBOOK STYLE -------------------- */
h2{border-bottom:2px solid #a1887f;padding-bottom:5px;}
tr td:first-child{font-weight:bold;}

/* -------------------- DARK MODE -------------------- */
.dark-mode{background:#2c2c2c;color:#f0f0f0;}
.dark-mode table th{background:#3e3e3e;color:#f0f0f0;}
.dark-mode table td{border-color:#555;}

/* -------------------- RESPONSIVE -------------------- */
@media(max-width:768px){body{font-size:14px;}button,input,select{width:100%;}}
</style>
</head>
<body>
<div class="container">
<h1>Advanced Accounting Dashboard</h1>

<div style="text-align:center;margin:10px;">
    <select id="viewSelect">
        <option value="journal">Journal</option>
        <option value="ledger">Ledger</option>
        <option value="trading">Trading Account</option>
        <option value="profitloss">Profit & Loss Account</option>
        <option value="balance">Balance Sheet</option>
    </select>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
</div>

<!-- MULTI-ENTRY FORM -->
<div class="flex" id="entryForm">
    <div>
        <h3>Add Multiple Entries</h3>
        <div id="entriesContainer"></div>
        <button onclick="addNewRow()">Add Debit/Credit Row</button>
        <button onclick="submitMultipleEntry()">Submit Entry</button>
    </div>
</div>

<div class="responsive-table fade-in" id="displayArea"></div>
</div>

<script>
// ==========================
// ACCOUNTING LOGIC
// ==========================
class Entry { constructor(account,debit=0,credit=0){ this.account=account; this.debit=debit; this.credit=credit; } }
class LedgerAccount { 
    constructor(name){ this.name=name; this.entries=[]; }
    addEntry(entry){ this.entries.push(entry); saveToLocal(); }
    totalDebit(){ return this.entries.reduce((a,e)=>a+e.debit,0); }
    totalCredit(){ return this.entries.reduce((a,e)=>a+e.credit,0); }
    balance(){ return this.totalDebit()-this.totalCredit(); }
}

const ledger={};
let journal=[];
let grossProfit=0, netProfit=0;

const displayArea=document.getElementById("displayArea");
const viewSelect=document.getElementById("viewSelect");
viewSelect.addEventListener("change", render);

// ---------------- MULTIPLE ENTRY FORM ----------------
const entriesContainer=document.getElementById("entriesContainer");
function addNewRow(){
    const row=document.createElement("div");
    row.style.marginBottom="5px";
    row.innerHTML=`<input type="text" placeholder="Account Name" class="accName">
                     <input type="number" placeholder="Debit" class="debit">
                     <input type="number" placeholder="Credit" class="credit">`;
    entriesContainer.appendChild(row);
}
addNewRow(); // initial row

function submitMultipleEntry(){
    const rows=entriesContainer.querySelectorAll("div");
    let tempJournal=[];
    rows.forEach(row=>{
        const acc=row.querySelector(".accName").value.trim();
        const debit=parseFloat(row.querySelector(".debit").value)||0;
        const credit=parseFloat(row.querySelector(".credit").value)||0;
        if(acc){ 
            const entry=new Entry(acc,debit,credit);
            tempJournal.push(entry);
            if(!ledger[acc]) ledger[acc]=new LedgerAccount(acc);
            ledger[acc].addEntry(entry);
        }
    });
    journal=[...journal,...tempJournal];
    entriesContainer.innerHTML="";
    addNewRow();
    render();
}

// ---------------- LOCAL STORAGE ----------------
function saveToLocal(){
    const data={journal, ledger: Object.fromEntries(Object.entries(ledger).map(([k,v])=>[k,v.entries]))};
    localStorage.setItem("accountData", JSON.stringify(data));
}

function loadFromLocal(){
    const data=JSON.parse(localStorage.getItem("accountData")||"{}");
    if(data.journal) journal=data.journal.map(e=>new Entry(e.account,e.debit,e.credit));
    if(data.ledger){
        for(const acc in data.ledger){
            ledger[acc]=new LedgerAccount(acc);
            data.ledger[acc].forEach(e=>ledger[acc].addEntry(new Entry(e.account,e.debit,e.credit)));
        }
    }
}

function formatCurrency(num){ return "₹ "+num.toLocaleString('en-IN',{minimumFractionDigits:2}); }

// ---------------- RENDER FUNCTIONS ----------------
function renderJournal(){
    let html="<h2>Journal</h2><table><tr><th>Account</th><th>Debit</th><th>Credit</th></tr>";
    journal.forEach(e=>html+=`<tr><td>${e.account}</td><td>${formatCurrency(e.debit)}</td><td>${formatCurrency(e.credit)}</td></tr>`);
    html+="</table>"; displayArea.innerHTML=html;
}

function renderLedger(){
    let html="<h2>Ledger</h2>";
    for(const acc in ledger){
        html+=`<h3>${acc}</h3><table><tr><th>Debit</th><th>Credit</th><th>Balance</th></tr>`;
        ledger[acc].entries.forEach(e=>{
            html+=`<tr><td>${formatCurrency(e.debit)}</td><td>${formatCurrency(e.credit)}</td><td>${formatCurrency(ledger[acc].balance())}</td></tr>`;
        });
        html+="</table>";
    }
    displayArea.innerHTML=html;
}

function renderTradingAccount(){
    const getBal=name=>ledger[name]?.balance()||0;
    const openingStock=getBal("Opening Stock");
    const purchases=getBal("Purchases");
    const sales=getBal("Sales");
    const closingStock=getBal("Closing Stock");
    const costOfGoodsSold=openingStock+purchases-closingStock;
    grossProfit=sales-costOfGoodsSold;

    let html="<h2>Trading Account</h2><table><tr><th>Particulars</th><th>Amount</th></tr>";
    html+=`<tr><td>Opening Stock</td><td>${formatCurrency(openingStock)}</td></tr>`;
    html+=`<tr><td>Purchases</td><td>${formatCurrency(purchases)}</td></tr>`;
    html+=`<tr><td>Closing Stock</td><td>${formatCurrency(closingStock)}</td></tr>`;
    html+=`<tr><td><strong>Cost of Goods Sold</strong></td><td>${formatCurrency(costOfGoodsSold)}</td></tr>`;
    html+=`<tr><td>Sales</td><td>${formatCurrency(sales)}</td></tr>`;
    html+=`<tr><td><strong>Gross Profit</strong></td><td>${formatCurrency(grossProfit)}</td></tr></table>`;
    displayArea.innerHTML=html;
}

function renderProfitLossAccount(){
    const getBal=name=>ledger[name]?.balance()||0;
    const expenses=getBal("Expenses");
    const income=getBal("Income");
    netProfit=grossProfit+income-expenses;

    let html="<h2>Profit & Loss Account</h2><table><tr><th>Particulars</th><th>Amount</th></tr>";
    html+=`<tr><td>Gross Profit b/d</td><td>${formatCurrency(grossProfit)}</td></tr>`;
    html+=`<tr><td>Income</td><td>${formatCurrency(income)}</td></tr>`;
    html+=`<tr><td>Expenses</td><td>${formatCurrency(expenses)}</td></tr>`;
    html+=`<tr><td><strong>Net Profit</strong></td><td>${formatCurrency(netProfit)}</td></tr></table>`;
    displayArea.innerHTML=html;
}

function renderBalanceSheet(){
    const assets=[], liabilities=[];
    let capital=netProfit;
    for(const acc in ledger){
        const bal=ledger[acc].balance();
        const name=acc.toLowerCase();
        if(["cash","bank","stock","debtor","furniture","plant","building","equipment","closing stock"].some(a=>name.includes(a))){
            assets.push({acc,balance: bal>0?bal:0});
        } else if(["creditor","loan","payable","mortgage"].some(a=>name.includes(a))){
            liabilities.push({acc,balance: bal<0?Math.abs(bal):0});
        } else if(!["opening stock","purchases","sales","expenses","income","closing stock"].includes(name)){
            capital+=bal;
        }
    }
    const totalAssets=assets.reduce((a,b)=>a+b.balance,0);
    const totalLiabilities=liabilities.reduce((a,b)=>a+b.balance,0);

    let html="<h2>Balance Sheet</h2><div class='flex'>";
    html+="<div><h3>Assets</h3><table>";
    assets.forEach(a=>html+=`<tr><td>${a.acc}</td><td>${formatCurrency(a.balance)}</td></tr>`);
    html+=`<tr><td><strong>Total Assets</strong></td><td>${formatCurrency(totalAssets)}</td></tr></table></div>`;

    html+="<div><h3>Liabilities & Equity</h3><table>";
    liabilities.forEach(l=>html+=`<tr><td>${l.acc}</td><td>${formatCurrency(l.balance)}</td></tr>`);
    html+=`<tr><td>Capital / Equity (incl. Net Profit)</td><td>${formatCurrency(capital)}</td></tr>`;
    html+=`<tr><td><strong>Total Liabilities & Equity</strong></td><td>${formatCurrency(totalLiabilities+capital)}</td></tr></table></div>`;
    html+="</div>";
    displayArea.innerHTML=html;
}

// ---------------- UTILS ----------------
function toggleDarkMode(){ document.body.classList.toggle("dark-mode"); }
function render(){
    const view=viewSelect.value;
    if(view==="journal") renderJournal();
    else if(view==="ledger") renderLedger();
    else if(view==="trading") renderTradingAccount();
    else if(view==="profitloss") renderProfitLossAccount();
    else if(view==="balance") renderBalanceSheet();
}

// ---------------- INIT ----------------
loadFromLocal();
render();
</script>
</body>
</html>
