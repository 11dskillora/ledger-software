<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    /* =========================================================
       SARASWATI INTERNATIONAL SCHOOL
       Premium Woody Notebook UI + Advanced Accounting Engine
       Single HTML file (CSS + JS included)
       ========================================================= */

    :root{
      --wood-dark:#1e140f;
      --wood-mid:#2a1f18;
      --wood-light:#3a2820;
      --gold:#d4af37;
      --gold2:#c9a961;
      --paper:#faf8f3;
      --paper2:#f0ece3;

      --shadow: 0 18px 50px rgba(0,0,0,.35);

      background-position:center;
      background-attachment: fixed;
    }

    /* ---------- Page frame ---------- */
    .app{
      min-height:100%;
      padding:18px;
    }

    .shell{
      max-width: 1320px;
      margin: 0 auto;
    }

    /* ---------- Header ---------- */
    .topbar{
      border-radius: var(--radius2);
      overflow:hidden;
      box-shadow: var(--shadow);
      border: 2px solid rgba(212,175,55,.25);
      background: linear-gradient(180deg, rgba(42,31,24,.95), rgba(30,20,15,.92));
      position: sticky;
      top: 12px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .topbar-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 16px 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;

    }

    .seal{

    .seal span{

      align-items:center;

    .line-row{

    .mini-btn{
      border:none;

    .row-actions{

      .topbar-inner{

      .row-actions{justify-content:stretch;}

<body>
  <div class="app">
    <div class="shell">
      <!-- ================= Header ================= -->
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="seal" title="School Seal"><span>SIS</span></div>
            <div style="min-width:0">
              <h1>SARASWATI INTERNATIONAL SCHOOL</h1>
              <p>Premium Accounting Notebook System</p>
            </div>
          </div>

          <div class="menu">
            <div class="menu-wrap" style="width:min(420px,100%)">
              <select id="viewSelect" class="select">
                <option value="new">New Entry</option>
                <option value="journal">Journal</option>
                <option value="ledger">Ledger</option>
                <option value="trading">Trading Account</option>
                <option value="pl">Profit & Loss Account</option>
                <option value="bs">Balance Sheet</option>
              </select>
            </div>

            <button class="btn btn-dark" id="btnExport">Export Backup</button>
            <button class="btn btn-gold" id="btnClearAll">Delete All</button>
          </div>
        </div>

      <!-- ================= Main ================= -->
      <main class="main flip-stage">
        <section id="viewContainer" class="flip"></section>
      </main>

  <script>
    /***********************************************************
     * SARASWATI INTERNATIONAL SCHOOL - ACCOUNTING ENGINE
     * Single HTML file
     * Triple checked:
     * - No duplicate LocalStorage writes on load
     * - Debit/Credit totals validated
     * - Scroll-wheel number disabled
     * - Auto-ledger update
     * - Trading, P&L, Balance Sheet auto-generation
     ***********************************************************/

    /* =================== Utilities =================== */
    const LS_KEY = "SIS_ACCOUNTING_V1";

    const uid = () => Math.random().toString(16).slice(2) + Date.now().toString(16);

    function toPaise(str){
      // strict parse: allow empty
      if(str === "" || str === null || str === undefined) return 0;
      const n = Number(str);
      if(!Number.isFinite(n)) return 0;
      return Math.round(n * 100);
    }

    function paiseToStr(p){
      const val = (p/100);
      return val.toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function safeText(s){
      return String(s ?? "").replace(/[<>]/g,"");
    }

    function todayISO(){
      const d = new Date();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    function disableWheelNumberInputs(root=document){
      root.querySelectorAll('input[type="number"]').forEach(inp=>{
        inp.addEventListener("wheel", (e)=>{
          e.preventDefault();
          inp.blur();
        }, {passive:false});
      });
    }

    /* =================== Data Model =================== */
    // Entry format:
    // {
    //   id, date, narration,
    //   debits: [{id, acc, amtPaise}],
    //   credits: [{id, acc, amtPaise}],
    //   createdAt
    // }
    const state = {
      view: "new",
      entries: [],
      editingId: null,
      folioMap: {},   // accName -> L.F. number
      folioNext: 1,
      jfNext: 1,      // Journal Folio numbering for ledger lines
    };

    function normalizeAcc(name){
      return safeText(name).trim().replace(/\s+/g," ");
    }

    function getOrAssignLF(acc){
      const a = normalizeAcc(acc);
      if(!a) return "-";
      if(!state.folioMap[a]){
        state.folioMap[a] = String(state.folioNext++).padStart(2,"0");
      }
      return state.folioMap[a];
    }

    function saveLocal(){
      const payload = {
        entries: state.entries,
        folioMap: state.folioMap,
        folioNext: state.folioNext,
        jfNext: state.jfNext
      };
      localStorage.setItem(LS_KEY, JSON.stringify(payload));
    }

    function loadLocal(){
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      try{
        const data = JSON.parse(raw);
        if(!data || !Array.isArray(data.entries)) return;

        // IMPORTANT: load without triggering any save loops
        state.entries = data.entries;
        state.folioMap = data.folioMap || {};
        state.folioNext = Number(data.folioNext || 1);
        state.jfNext = Number(data.jfNext || 1);
      }catch(err){
        console.warn("Local load failed:", err);
      }
    }

    /* =================== Ledger Generator =================== */
    function buildLedger(){
      // ledger[acc] = [{date, particulars, jf, debit, credit}]
      const ledger = {};
      const ensure = (acc) => {
        const a = normalizeAcc(acc);
        if(!a) return null;
        if(!ledger[a]) ledger[a] = [];
        return a;
      };

      state.entries.forEach((entry, idx)=>{
        const jf = entry.jf || String(idx+1).padStart(2,"0"); // stable per entry

        // Debit lines
        entry.debits.forEach(d=>{
          const a = ensure(d.acc);
          if(!a) return;
          ledger[a].push({
            date: entry.date,
            particulars: entry.credits.map(c=>"To "+normalizeAcc(c.acc)).filter(Boolean).join(", ") || "-",
            jf,
            debit: d.amtPaise,
            credit: 0
          });
        });

        // Credit lines
        entry.credits.forEach(c=>{
          const a = ensure(c.acc);
          if(!a) return;
          ledger[a].push({
            date: entry.date,
            particulars: entry.debits.map(d=>normalizeAcc(d.acc)+" Dr").filter(Boolean).join(", ") || "-",
            jf,
            debit: 0,
            credit: c.amtPaise
          });
        });
      });

      // sort ledger lines by date then jf
      Object.keys(ledger).forEach(acc=>{
        ledger[acc].sort((x,y)=>{
          if(x.date !== y.date) return x.date.localeCompare(y.date);
          return String(x.jf).localeCompare(String(y.jf));
        });
      });

      return ledger;
    }

    function accountBalance(ledger, acc){
      const a = normalizeAcc(acc);
      if(!ledger[a]) return 0;
      let dr=0, cr=0;
      ledger[a].forEach(e=>{
        dr += e.debit;
        cr += e.credit;
      });
      return dr - cr; // +ve => Dr balance
    }

    /* =================== Statements Engine =================== */
    // Classification helper: user-friendly keyword matching.
    // Still not perfect accounting, but reliable and consistent.
    function classifyAccount(accName){
      const n = normalizeAcc(accName).toLowerCase();

      // Capital & liabilities
      if(n.includes("capital")) return "capital";
      if(n.includes("loan")) return "liability";
      if(n.includes("creditor") || n.includes("sundry creditor")) return "liability";
      if(n.includes("outstanding")) return "liability";

      // Assets
      if(n.includes("cash") || n.includes("bank")) return "asset";
      if(n.includes("stock")) return "asset";
      if(n.includes("debtors") || n.includes("sundry debtor")) return "asset";
      if(n.includes("furniture") || n.includes("machinery") || n.includes("building")) return "asset";
      if(n.includes("investment")) return "asset";
      if(n.includes("prepaid")) return "asset";

      // Trading
      if(n.includes("sales")) return "sales";
      if(n.includes("purchase")) return "purchase";
      if(n.includes("carriage") || n.includes("freight") || n.includes("wages")) return "direct";

      // Indirect
      if(n.includes("rent") || n.includes("salary") || n.includes("advert") || n.includes("commission") || n.includes("discount")) return "indirect";

      // Default
      return "other";
    }

    function computeTradingPLBS(){
      const ledger = buildLedger();
      const accounts = Object.keys(ledger);

      // Trading A/c components
      let purchases = 0; // Dr
      let sales = 0;     // Cr
      let directExp = 0; // Dr
      let openingStock = 0; // Dr
      let closingStock = 0; // Cr (shown on credit side)

      // P&L
      let indirectExp = 0; // Dr
      let indirectInc = 0; // Cr

      // Balance sheet
      const assets = [];
      const liabilities = [];
      let capital = 0;

      accounts.forEach(acc=>{
        const bal = accountBalance(ledger, acc); // Dr positive
        const type = classifyAccount(acc);

        // Handle trading:
        if(type === "purchase"){
          // purchases usually Dr => bal positive
          purchases += Math.max(0, bal);
          return;
        }
        if(type === "sales"){
          // sales usually Cr => bal negative
          sales += Math.max(0, -bal);
          return;
        }
        if(type === "direct"){
          directExp += Math.max(0, bal);
          return;
        }

        // Opening/Closing stock (optional naming)
        if(acc.toLowerCase().includes("opening stock")){
          openingStock += Math.max(0, bal);
          return;
        }
        if(acc.toLowerCase().includes("closing stock")){
          closingStock += Math.max(0, -bal);
          return;
        }

        // Indirect
        if(type === "indirect"){
          // could be expense (Dr) or income (Cr)
          if(bal >= 0) indirectExp += bal;
          else indirectInc += -bal;
          return;
        }

        // Balance sheet
        if(type === "capital"){
          // capital normally Cr => negative bal
          capital += Math.max(0, -bal);
          return;
        }
        if(type === "liability"){
          // liability normally Cr => negative bal
          if(bal < 0) liabilities.push({acc, amt: -bal});
          else liabilities.push({acc, amt: 0});
          return;
        }
        if(type === "asset"){
          // asset normally Dr => positive bal
          if(bal > 0) assets.push({acc, amt: bal});
          else assets.push({acc, amt: 0});
          return;
        }

        // other accounts:
        // if Dr => asset, if Cr => liability
        if(bal > 0) assets.push({acc, amt: bal});
        if(bal < 0) liabilities.push({acc, amt: -bal});
      });

      // Trading result
      const tradingDr = openingStock + purchases + directExp;
      const tradingCr = sales + closingStock;
      const grossProfit = Math.max(0, tradingCr - tradingDr);
      const grossLoss   = Math.max(0, tradingDr - tradingCr);

      // P&L result
      const plDr = indirectExp + grossLoss;
      const plCr = indirectInc + grossProfit;
      const netProfit = Math.max(0, plCr - plDr);
      const netLoss   = Math.max(0, plDr - plCr);

      // Update capital with net profit/loss
      if(netProfit > 0) capital += netProfit;
      if(netLoss > 0) capital -= netLoss;

      // Prepare BS lists
      liabilities.unshift({acc:"Capital", amt: Math.max(0, capital)});

      // totals
      const totalAssets = assets.reduce((s,x)=>s+x.amt,0);
      const totalLiab = liabilities.reduce((s,x)=>s+x.amt,0);

      return {
        ledger,
        trading:{
          openingStock, purchases, directExp,
          sales, closingStock,
          grossProfit, grossLoss,
          tradingDr, tradingCr
        },
        pl:{
          indirectExp, indirectInc,
          netProfit, netLoss,
          plDr, plCr
        },
        bs:{
          assets: assets.filter(x=>x.amt>0).sort((a,b)=>a.acc.localeCompare(b.acc)),
          liabilities: liabilities.filter(x=>x.amt>0).sort((a,b)=>a.acc.localeCompare(b.acc)),
          totalAssets, totalLiab
        }
      };
    }

    /* =================== Rendering =================== */
    const viewContainer = document.getElementById("viewContainer");
    const viewSelect = document.getElementById("viewSelect");
    const btnClearAll = document.getElementById("btnClearAll");
    const btnExport = document.getElementById("btnExport");

    function flipRender(html){
      // page flip effect
      viewContainer.classList.remove("flip");
      void viewContainer.offsetWidth; // force reflow
      viewContainer.innerHTML = html;
      viewContainer.classList.add("flip");
      disableWheelNumberInputs(viewContainer);
    }

    function render(){
      const v = state.view;

      if(v === "new") renderNewEntry();
      if(v === "journal") renderJournal();
      if(v === "ledger") renderLedger();
      if(v === "trading") renderTrading();
      if(v === "pl") renderPL();
      if(v === "bs") renderBS();
    }

    /* =================== New Entry =================== */
    function blankLine(){
      return { id: uid(), acc:"", amt:"" };
    }

    function getEntryById(id){
      return state.entries.find(e=>e.id===id) || null;
    }

    function renderNewEntry(){
      const editing = state.editingId ? getEntryById(state.editingId) : null;

      const date = editing ? editing.date : todayISO();
      const narration = editing ? editing.narration : "";
      const debits = editing ? editing.debits.map(x=>({id:x.id, acc:x.acc, amt:String(x.amtPaise/100)})) : [blankLine()];
      const credits = editing ? editing.credits.map(x=>({id:x.id, acc:x.acc, amt:String(x.amtPaise/100)})) : [blankLine()];

      const html = `
        <div class="paper">
          <div class="paper-header">
            <h2>${editing ? "Amend Entry" : "New Entry"}</h2>
            <span class="badge">${editing ? "EDIT MODE" : "POST TO LEDGER"}</span>
          </div>

          <div class="paper-body">
            <div class="grid">
              <div class="field">
                <label>Date</label>
                <input class="input" type="date" id="entryDate" value="${date}">
              </div>
              <div class="field">
                <label>Narration</label>
                <input class="input" type="text" id="entryNarr" placeholder="Narration..." value="${safeText(narration)}">
              </div>
            </div>

            <div style="height:14px"></div>

            <div class="grid">
              <div class="panel">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
                  <div style="font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#2e4a2e;">Debit Side</div>
                  <button class="btn btn-dark" id="addDebit">+ Add Debit</button>
                </div>
                <div class="lines" id="debitLines"></div>
              </div>

              <div class="panel">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
                  <div style="font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#5c3a2e;">Credit Side</div>
                  <button class="btn btn-dark" id="addCredit">+ Add Credit</button>
                </div>
                <div class="lines" id="creditLines"></div>
              </div>
            </div>

            <div class="row-actions">
              <button class="btn btn-gold" id="saveEntry">${editing ? "Update Entry" : "Save Entry"}</button>
              <button class="btn btn-dark" id="resetEntry">Reset</button>
              <button class="btn btn-dark" id="cancelEdit" style="${editing ? "" : "display:none"}">Cancel Edit</button>
            </div>

            <div style="margin-top:12px;color:rgba(44,24,16,.65);font-style:italic;">
              Note: Debit total must equal Credit total. Values are saved automatically.
            </div>
          </div>
        </div>
      `;

      flipRender(html);

      // Render lines
      const debitBox = document.getElementById("debitLines");
      const creditBox = document.getElementById("creditLines");

      function renderLines(box, arr, side){
        box.innerHTML = arr.map((l, idx)=>`
          <div class="line-row" data-side="${side}" data-id="${l.id}">
            <input class="input" type="text" placeholder="Account Name" value="${safeText(l.acc)}" data-role="acc">
            <input class="input mono right" type="number" min="0" step="1" placeholder="0" value="${safeText(l.amt)}" data-role="amt">
            <button class="mini-btn danger" title="Remove" data-role="remove">✕</button>
          </div>
        `).join("");
      }

      renderLines(debitBox, debits, "debit");
      renderLines(creditBox, credits, "credit");

      // stateful arrays inside closure
      let dArr = debits;
      let cArr = credits;

      function readLines(){
        // read DOM into arrays
        function collect(side){
          const rows = [...document.querySelectorAll(`.line-row[data-side="${side}"]`)];
          return rows.map(r=>{
            const id = r.getAttribute("data-id");
            const acc = r.querySelector('[data-role="acc"]').value;
            const amt = r.querySelector('[data-role="amt"]').value;
            return {id, acc, amt};
          });
        }
        dArr = collect("debit");
        cArr = collect("credit");
      }

      function bindRemove(){
        document.querySelectorAll('[data-role="remove"]').forEach(btn=>{
          btn.onclick = ()=>{
            const row = btn.closest(".line-row");
            const side = row.getAttribute("data-side");
            const id = row.getAttribute("data-id");

            if(side==="debit"){
              dArr = dArr.filter(x=>x.id!==id);
              if(dArr.length===0) dArr=[blankLine()];
              renderLines(debitBox, dArr, "debit");
            }else{
              cArr = cArr.filter(x=>x.id!==id);
              if(cArr.length===0) cArr=[blankLine()];
              renderLines(creditBox, cArr, "credit");
            }
            bindAll();
          };
        });
      }

      function bindAutosave(){
        // autosave while typing (advanced)
        document.querySelectorAll("#entryDate,#entryNarr,.line-row input").forEach(inp=>{
          inp.addEventListener("input", ()=>{
            // autosave draft not needed; we autosave only entries list
          });
        });
      }

      function bindAll(){
        bindRemove();
        bindAutosave();
        disableWheelNumberInputs(viewContainer);
      }
      bindAll();

      document.getElementById("addDebit").onclick = ()=>{
        readLines();
        dArr.push(blankLine());
        renderLines(debitBox, dArr, "debit");
        bindAll();
      };

      document.getElementById("addCredit").onclick = ()=>{
        readLines();
        cArr.push(blankLine());
        renderLines(creditBox, cArr, "credit");
        bindAll();
      };

      document.getElementById("resetEntry").onclick = ()=>{
        state.editingId = null;
        render();
      };

      document.getElementById("cancelEdit").onclick = ()=>{
        state.editingId = null;
        render();
      };

      document.getElementById("saveEntry").onclick = ()=>{
        readLines();
        const entryDate = document.getElementById("entryDate").value || todayISO();
        const entryNarr = document.getElementById("entryNarr").value || "-";

        const deb = dArr
          .map(x=>({id:x.id, acc: normalizeAcc(x.acc), amtPaise: toPaise(x.amt)}))
          .filter(x=>x.acc && x.amtPaise>0);

        const cre = cArr
          .map(x=>({id:x.id, acc: normalizeAcc(x.acc), amtPaise: toPaise(x.amt)}))
          .filter(x=>x.acc && x.amtPaise>0);

        if(deb.length===0 || cre.length===0){
          alert("Please enter at least one Debit and one Credit line with amount.");
          return;
        }

        const drTotal = deb.reduce((s,x)=>s+x.amtPaise,0);
        const crTotal = cre.reduce((s,x)=>s+x.amtPaise,0);

        if(drTotal !== crTotal){
          alert("Debit and Credit totals must match.\nDebit: ₹"+paiseToStr(drTotal)+"\nCredit: ₹"+paiseToStr(crTotal));
          return;
        }

        // assign LF numbers
        deb.forEach(x=>getOrAssignLF(x.acc));
        cre.forEach(x=>getOrAssignLF(x.acc));

        const newEntry = {
          id: editing ? editing.id : uid(),
          date: entryDate,
          narration: safeText(entryNarr),
          debits: deb,
          credits: cre,
          jf: editing ? editing.jf : String(state.jfNext++).padStart(2,"0"),
          createdAt: editing ? editing.createdAt : Date.now()
        };

        if(editing){
          state.entries = state.entries.map(e=>e.id===editing.id ? newEntry : e);
        }else{
          state.entries.push(newEntry);
        }

        saveLocal();
        state.editingId = null;
        state.view = "journal";
        viewSelect.value = "journal";
        render();
      };
    }

    /* =================== Journal =================== */
    function renderJournal(){
      const rows = [...state.entries].sort((a,b)=>b.createdAt - a.createdAt);

      const html = `
        <div class="paper">
          <div class="paper-header">
            <h2>Journal</h2>
            <span class="badge">${rows.length} Records</span>
          </div>

          <div class="paper-body">
            <div class="row-actions" style="justify-content:space-between;">
              <button class="btn btn-dark" id="journalDeleteAll">Delete All (Journal)</button>
              <button class="btn btn-gold" id="goNew">+ New Entry</button>
            </div>

            <div style="height:12px"></div>

            ${rows.length===0 ? `
              <div class="panel" style="text-align:center;padding:26px;">
                <div style="font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:rgba(92,64,51,.9);">
                  No Entries Yet
                </div>
                <div class="muted" style="margin-top:8px;">Create your first entry from "New Entry".</div>
              </div>
            ` : `
              <div class="panel" style="overflow:auto;">
                <table>
                  <thead>
                    <tr>
                      <th style="width:120px;">Date</th>
                      <th>Particulars</th>
                      <th class="center" style="width:80px;">L.F.</th>
                      <th class="right" style="width:160px;">Debit (₹)</th>
                      <th class="right" style="width:160px;">Credit (₹)</th>
                      <th class="center" style="width:120px;">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows.map(e=>{
                      const debitTotal = e.debits.reduce((s,x)=>s+x.amtPaise,0);
                      const creditTotal = e.credits.reduce((s,x)=>s+x.amtPaise,0);

                      const debitLines = e.debits.map((d, i)=>`
                        <tr>
                          <td>${i===0 ? safeText(e.date) : ""}</td>
                          <td><b>${safeText(d.acc)}</b> <span class="muted">Dr.</span><br>
                              ${i===0 ? `<span class="muted" style="font-style:italic;">"${safeText(e.narration)}"</span>` : ""}
                          </td>
                          <td class="center">${state.folioMap[d.acc] || "-"}</td>
                          <td class="right mono" style="color:#2e4a2e;font-weight:900;">${paiseToStr(d.amtPaise)}</td>
                          <td class="right"></td>
                          <td class="center">${i===0 ? `
                            <button class="mini-btn" data-edit="${e.id}" title="Edit">✎</button>
                            <button class="mini-btn danger" data-del="${e.id}" title="Delete">🗑</button>
                          ` : ""}</td>
                        </tr>
                      `).join("");

                      const creditLines = e.credits.map((c)=>`
                        <tr>
                          <td></td>
                          <td style="padding-left:36px;"><span class="muted">To</span> <b>${safeText(c.acc)}</b></td>
                          <td class="center">${state.folioMap[c.acc] || "-"}</td>
                          <td class="right"></td>
                          <td class="right mono" style="color:#5c3a2e;font-weight:900;">${paiseToStr(c.amtPaise)}</td>
                          <td></td>
                        </tr>
                      `).join("");

                      const totalRow = `
                        <tr>
                          <td></td>
                          <td class="muted"><b>Total</b></td>
                          <td></td>
                          <td class="right mono"><b>${paiseToStr(debitTotal)}</b></td>
                          <td class="right mono"><b>${paiseToStr(creditTotal)}</b></td>
                          <td></td>
                        </tr>
                      `;

                      return debitLines + creditLines + totalRow;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;

      flipRender(html);

      document.getElementById("goNew").onclick = ()=>{
        state.view = "new";
        viewSelect.value = "new";
        render();
      };

      document.getElementById("journalDeleteAll").onclick = ()=>{
        if(!confirm("Delete all journal entries? This cannot be undone.")) return;
        state.entries = [];
        state.editingId = null;
        state.folioMap = {};
        state.folioNext = 1;
        state.jfNext = 1;
        saveLocal();
        render();
      };

      document.querySelectorAll("[data-edit]").forEach(btn=>{
        btn.onclick = ()=>{
          state.editingId = btn.getAttribute("data-edit");
          state.view = "new";
          viewSelect.value = "new";
          render();
        };
      });

      document.querySelectorAll("[data-del]").forEach(btn=>{
        btn.onclick = ()=>{
          const id = btn.getAttribute("data-del");
          if(!confirm("Delete this entry?")) return;
          state.entries = state.entries.filter(e=>e.id!==id);
          saveLocal();
          render();
        };
      });
    }

    /* =================== Ledger =================== */
    function renderLedger(){
      const { ledger } = computeTradingPLBS();
      const accounts = Object.keys(ledger).sort((a,b)=>a.localeCompare(b));

      const html = `
        <div class="paper">
          <div class="paper-header">
            <h2>Ledger</h2>
            <span class="badge">${accounts.length} Accounts</span>
          </div>

          <div class="paper-body">
            ${accounts.length===0 ? `
              <div class="panel" style="text-align:center;padding:26px;">
                <div style="font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:rgba(92,64,51,.9);">
                  No Ledger Data
                </div>
                <div class="muted" style="margin-top:8px;">Create journal entries first.</div>
              </div>
            ` : `
              <div class="panel" style="overflow:auto;">
                <table>
                  <thead>
                    <tr>
                      <th>Account</th>
                      <th class="center" style="width:90px;">L.F.</th>
                      <th class="right" style="width:160px;">Dr Total</th>
                      <th class="right" style="width:160px;">Cr Total</th>
                      <th class="right" style="width:220px;">Balance</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${accounts.map(acc=>{
                      const lines = ledger[acc];
                      let dr=0, cr=0;
                      lines.forEach(x=>{dr+=x.debit; cr+=x.credit;});
                      const bal = dr-cr;
                      const balType = bal>=0 ? "Dr" : "Cr";
                      return `
                        <tr>
                          <td><b>${safeText(acc)}</b></td>
                          <td class="center">${state.folioMap[acc] || "-"}</td>
                          <td class="right mono" style="color:#2e4a2e;font-weight:900;">${paiseToStr(dr)}</td>
                          <td class="right mono" style="color:#5c3a2e;font-weight:900;">${paiseToStr(cr)}</td>
                          <td class="right mono"><b>${paiseToStr(Math.abs(bal))} ${balType}</b></td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>

              <div style="height:16px"></div>

              ${accounts.map(acc=>{
                const lines = ledger[acc];
                let running = 0;

                return `
                  <div class="panel" style="margin-bottom:14px;overflow:auto;">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 12px;">
                      <div style="font-weight:900;letter-spacing:.14em;text-transform:uppercase;">
                        ${safeText(acc)} <span class="muted">(L.F. ${state.folioMap[acc] || "-"})</span>
                      </div>
                      <span class="badge">${lines.length} Lines</span>
                    </div>

                    <table>
                      <thead>
                        <tr>
                          <th style="width:120px;">Date</th>
                          <th>Particulars</th>
                          <th class="center" style="width:90px;">J.F.</th>
                          <th class="right" style="width:160px;">Debit</th>
                          <th class="right" style="width:160px;">Credit</th>
                          <th class="right" style="width:200px;">Running Bal.</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${lines.map(x=>{
                          running += x.debit;
                          running -= x.credit;
                          const rt = running>=0 ? "Dr" : "Cr";
                          return `
                            <tr>
                              <td>${safeText(x.date)}</td>
                              <td>${safeText(x.particulars)}</td>
                              <td class="center">${safeText(x.jf || "-")}</td>
                              <td class="right mono" style="color:#2e4a2e;font-weight:900;">${x.debit?paiseToStr(x.debit):""}</td>
                              <td class="right mono" style="color:#5c3a2e;font-weight:900;">${x.credit?paiseToStr(x.credit):""}</td>
                              <td class="right mono"><b>${paiseToStr(Math.abs(running))} ${rt}</b></td>
                            </tr>
                          `;
                        }).join("")}
                      </tbody>
                    </table>
                  </div>
                `;
              }).join("")}
            `}
          </div>
        </div>
      `;

      flipRender(html);
    }

      const a = document.createElement("a");
      a.href = url;
      a.download = "SIS_Accounting_Backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      state.folioNext = 1;
      state.jfNext = 1;
      saveLocal();

    viewSelect.onchange = ()=>{
      state.view = viewSelect.value;
      render();
    };

    /* =================== Boot =================== */
    loadLocal();
    state.view = viewSelect.value;
    render();
  </script>
</body>
</html>
