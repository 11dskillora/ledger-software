<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Journal • Ledger with Particulars</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* UI UNCHANGED */
*{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont}
body{margin:0;min-height:100vh;background:#1c1c1e;color:#f5f5f7;}
header{text-align:center;padding:40px 20px 20px}
header h1{font-size:38px;background:linear-gradient(90deg,#0a84ff,#5ac8fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:#9aa0a6;margin-top:4px}
nav{display:flex;justify-content:center;gap:14px;margin:20px 0 40px}
nav button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#fff;cursor:pointer;transition:0.3s}
nav button.active,nav button:hover{background:linear-gradient(135deg,#0a84ff,#5ac8fa);box-shadow:0 10px 30px rgba(10,132,255,0.5)}
.page{max-width:1100px;margin:auto;padding:0 20px 80px;display:none;animation:slideFade 0.7s cubic-bezier(.2,.8,.2,1);}
.page.active{display:block}
@keyframes slideFade{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-radius:26px;padding:32px;margin-bottom:30px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.card h3{margin-bottom:18px}
input{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;margin-bottom:10px;width:100%}
.row{display:flex;gap:14px;margin-top:10px}
.action{background:linear-gradient(135deg,#0a84ff,#5ac8fa);border:none;border-radius:999px;padding:12px 26px;color:white;cursor:pointer;font-weight:500;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border:1px solid #888;padding:10px;text-align:center;}
th{background:#0a84ff;color:#fff;}
td{background:#222;}
.note{color:#aaa;font-size:13px;margin-top:5px}
.ledger-account{margin-bottom:30px;}
.ledger-title{font-weight:600;font-size:18px;margin-bottom:8px;border-bottom:1px solid #888;padding-bottom:4px;}
.t-account{display:flex;justify-content:space-between;gap:10px}
.t-column{width:48%;background:rgba(0,0,0,0.35);border-radius:8px;padding:10px;overflow:auto;max-height:300px}
.t-column h4{text-align:center;text-decoration:underline;margin-bottom:8px;font-size:15px}
.t-row{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px dashed #555;font-size:14px}
.t-row span{flex:1;text-align:center}
.total-row{font-weight:600;border-top:2px solid #888;padding-top:6px;margin-top:4px;text-align:right;font-size:15px}
</style>
</head>

<body>

<header>
<h1>Compound Journal</h1>
<p>Ledger with Particulars • Blue Apple-Style UI</p>
</header>

<nav>
<button class="active" onclick="showPage(0)">Entry</button>
<button onclick="showPage(1)">Journal</button>
<button onclick="showPage(2)">Ledger</button>
</nav>

<div class="page active">
<div class="card">
<h3>Add Compound Entry</h3>
<input id="date" type="date">

<div id="debitContainer">
<h4>Debit Side</h4>
<div class="debit-group row">
<input placeholder="Debit Account">
<input placeholder="Amount">
<input placeholder="Particulars">
</div>
<button class="action" onclick="addDebit()">+ Add Debit Side</button>
</div>

<div id="creditContainer">
<h4>Credit Side</h4>
<div class="credit-group row">
<input placeholder="Credit Account">
<input placeholder="Amount">
<input placeholder="Particulars">
</div>
<button class="action" onclick="addCredit()">+ Add Credit Side</button>
</div>

<button class="action" onclick="saveEntry()">Save Entry</button>
<p class="note">Ensure total Debit = total Credit</p>
</div>
</div>

<div class="page">
<div class="card">
<h3>Journal</h3>
<table id="journalTable">
<tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr>
</table>
</div>
</div>

<div class="page">
<div class="card">
<h3>Ledger (T-Account Style with Particulars)</h3>
<div id="ledgerDiv"></div>
</div>
</div>

<script>
let pages=document.querySelectorAll(".page");
let navBtns=document.querySelectorAll("nav button");
function showPage(i){
    pages.forEach(p=>p.classList.remove("active"));
    navBtns.forEach(b=>b.classList.remove("active"));
    pages[i].classList.add("active");
    navBtns[i].classList.add("active");
}

let journal=[], ledger={};

window.onload=()=>{
    const d=localStorage.getItem("journalData");
    if(d){journal=JSON.parse(d); rebuild();}
};

function addDebit(){
    const div=document.createElement("div");
    div.className="debit-group row";
    div.innerHTML='<input placeholder="Debit Account"><input placeholder="Amount"><input placeholder="Particulars">';
    debitContainer.insertBefore(div, debitContainer.lastElementChild);
}

function addCredit(){
    const div=document.createElement("div");
    div.className="credit-group row";
    div.innerHTML='<input placeholder="Credit Account"><input placeholder="Amount"><input placeholder="Particulars">';
    creditContainer.insertBefore(div, creditContainer.lastElementChild);
}

function saveEntry(){
    const date=document.getElementById("date").value;
    if(!date){alert("Enter a date");return;}

    let totalD=0,totalC=0;
    let d=[],c=[];

    document.querySelectorAll(".debit-group").forEach(r=>{
        let a=r.children[0].value.trim();
        let m=Number(r.children[1].value);
        let p=r.children[2].value.trim();
        if(a && m){d.push({a,m,p}); totalD+=m;}
    });

    document.querySelectorAll(".credit-group").forEach(r=>{
        let a=r.children[0].value.trim();
        let m=Number(r.children[1].value);
        let p=r.children[2].value.trim();
        if(a && m){c.push({a,m,p}); totalC+=m;}
    });

    if(!d.length||!c.length||totalD!==totalC){
        alert("Debit and Credit must exist and be equal");
        return;
    }

    journal.push({date,d,c});
    localStorage.setItem("journalData",JSON.stringify(journal));
    rebuild();

    document.getElementById("date").value="";
    document.querySelectorAll(".debit-group,.credit-group").forEach((e,i)=>{if(i>0)e.remove();});
}

function rebuild(){
    ledger={};
    journalTable.innerHTML="<tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr>";

    journal.forEach((e,i)=>{
        e.d.forEach(d=>{
            journalTable.insertRow().innerHTML=`<td>${e.date}</td><td>${d.a}</td><td>${i+1}</td><td>${d.m}</td><td></td>`;
            updateLedger(d.a,e.date,d.p,d.m,0);
        });
        e.c.forEach(c=>{
            journalTable.insertRow().innerHTML=`<td>${e.date}</td><td>${c.a}</td><td>${i+1}</td><td></td><td>${c.m}</td>`;
            updateLedger(c.a,e.date,c.p,0,c.m);
        });
    });
    renderLedger();
}

function updateLedger(a,date,p,d,c){
    if(!ledger[a]) ledger[a]={d:[],c:[]};
    if(d>0) ledger[a].d.push({date,p,amt:d});
    if(c>0) ledger[a].c.push({date,p,amt:c});
}

function renderLedger(){
    ledgerDiv.innerHTML="";
    for(let a in ledger){
        let dT=ledger[a].d.reduce((s,v)=>s+v.amt,0);
        let cT=ledger[a].c.reduce((s,v)=>s+v.amt,0);
        ledgerDiv.innerHTML+=`
        <div class="ledger-account">
            <div class="ledger-title">${a}</div>
            <div class="t-account">
                <div class="t-column">
                    <h4>Debit</h4>
                    ${ledger[a].d.map(v=>`<div class="t-row"><span>${v.date}</span><span>${v.p}</span><span>${v.amt}</span></div>`).join("")}
                    <div class="total-row">Total: ${dT}</div>
                </div>
                <div class="t-column">
                    <h4>Credit</h4>
                    ${ledger[a].c.map(v=>`<div class="t-row"><span>${v.date}</span><span>${v.p}</span><span>${v.amt}</span></div>`).join("")}
                    <div class="total-row">Total: ${cT}</div>
                </div>
            </div>
        </div>`;
    }
}
</script>

</body>
</html>
