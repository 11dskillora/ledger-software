<script>
let journal = [];
let ledger = {};
let dark=false;

/* ---------------- ADD ENTRY UI ---------------- */
function showEntry(){
document.getElementById("content").innerHTML=`
<div class="card">
<h3>Compound Journal Entry</h3>

<label>Date</label>
<input type="date" id="date">

<h4>Debit Accounts</h4>
<div id="debits"></div>
<button class="add-btn" onclick="addRow('debits')">+ Add Debit</button>

<h4>Credit Accounts</h4>
<div id="credits"></div>
<button class="add-btn" onclick="addRow('credits')">+ Add Credit</button>

<label>Narration</label>
<input id="narration" placeholder="Being ...">

<button class="save-btn" onclick="saveEntry()">💾 Save Entry</button>
</div>`;
addRow('debits');
addRow('credits');
}

function addRow(type){
document.getElementById(type).innerHTML+=`
<div class="row">
<input placeholder="Account Name">
<input type="number" placeholder="Amount">
</div>`;
}

/* ---------------- SAVE ENTRY ---------------- */
function saveEntry(){
let date=document.getElementById("date").value;
let narration=document.getElementById("narration").value;

let dr=[],cr=[],drTotal=0,crTotal=0;

document.querySelectorAll("#debits .row").forEach(r=>{
let acc=r.children[0].value;
let amt=parseFloat(r.children[1].value);
if(acc && amt){dr.push({acc,amt});drTotal+=amt;}
});

document.querySelectorAll("#credits .row").forEach(r=>{
let acc=r.children[0].value;
let amt=parseFloat(r.children[1].value);
if(acc && amt){cr.push({acc,amt});crTotal+=amt;}
});

if(drTotal!==crTotal || drTotal===0){
alert("Debit & Credit totals must be equal");
return;
}

/* STORE JOURNAL */
journal.push({date,debits:dr,credits:cr,narration});

/* POST TO LEDGER */
dr.forEach(d=>{
if(!ledger[d.acc]) ledger[d.acc]=[];
ledger[d.acc].push({date,particulars:"To "+cr.map(c=>c.acc).join(", "),dr:d.amt,cr:""});
});

cr.forEach(c=>{
if(!ledger[c.acc]) ledger[c.acc]=[];
ledger[c.acc].push({date,particulars:"By "+dr.map(d=>d.acc).join(", "),dr:"",cr:c.amt});
});

alert("Compound Journal Entry Saved ✅");
}

/* ---------------- VIEW COMPOUND JOURNAL ---------------- */
function showJournal(){
if(journal.length===0){
document.getElementById("content").innerHTML=
`<div class="card">📘 No Journal Entries</div>`;
return;
}

let html=`<div class="card"><h3>Compound Journal Book</h3>`;

journal.forEach((j,i)=>{
html+=`
<table>
<tr>
<th>Date</th><th>Particulars</th><th>Dr (₹)</th><th>Cr (₹)</th>
</tr>`;

j.debits.forEach(d=>{
html+=`
<tr>
<td>${j.date}</td>
<td>${d.acc} A/c</td>
<td>${d.amt}</td>
<td></td>
</tr>`;
});

j.credits.forEach(c=>{
html+=`
<tr>
<td></td>
<td style="padding-left:25px;">To ${c.acc} A/c</td>
<td></td>
<td>${c.amt}</td>
</tr>`;
});

html+=`
<tr>
<td></td>
<td colspan="3"><em>${j.narration}</em></td>
</tr>
</table><br>`;
});

html+=`</div>`;
document.getElementById("content").innerHTML=html;
}

/* ---------------- LEDGER ---------------- */
function showLedger(){
let html=`<div class="card"><h3>Ledger</h3>`;
for(let acc in ledger){
html+=`<h4>${acc}</h4>
<table>
<tr><th>Date</th><th>Particulars</th><th>Dr</th><th>Cr</th></tr>`;
ledger[acc].forEach(t=>{
html+=`
<tr>
<td>${t.date}</td>
<td>${t.particulars}</td>
<td>${t.dr}</td>
<td>${t.cr}</td>
</tr>`;
});
html+=`</table>`;
}
html+=`</div>`;
document.getElementById("content").innerHTML=html;
}

/* ---------------- DARK MODE ---------------- */
function toggleMode(){
dark=!dark;
document.body.classList.toggle("dark");
}
</script>
