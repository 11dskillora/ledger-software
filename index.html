<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elite Ledger</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#1c1410]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const Icon = ({ name, className }) => {
      const I = lucide[name];
      return I ? <I className={className} /> : null;
    };

    const paiseToStr = v => (v / 100).toFixed(2);

    function AccountingApp() {

      /* ---------------- STATE ---------------- */
      const [view, setView] = useState("new");
      const [date, setDate] = useState("");
      const [narration, setNarration] = useState("");
      const [debits, setDebits] = useState([{ acc: "", amt: 0 }]);
      const [credits, setCredits] = useState([{ acc: "", amt: 0 }]);
      const [journal, setJournal] = useState([]);

      /* ---------------- HELPERS ---------------- */
      const addDebit = () => setDebits([...debits, { acc: "", amt: 0 }]);
      const addCredit = () => setCredits([...credits, { acc: "", amt: 0 }]);

      const saveEntry = () => {
        if (!date) return alert("Date required");

        const drTotal = debits.reduce((s, d) => s + d.amt, 0);
        const crTotal = credits.reduce((s, c) => s + c.amt, 0);
        if (drTotal !== crTotal) return alert("Debit & Credit must match");

        setJournal([...journal, { date, narration, debits, credits }]);
        setDate(""); setNarration("");
        setDebits([{ acc: "", amt: 0 }]);
        setCredits([{ acc: "", amt: 0 }]);
        setView("journal");
      };

      /* ---------------- LEDGER ---------------- */
      const ledger = useMemo(() => {
        const map = {};
        journal.forEach(e => {
          e.debits.forEach(d => {
            if (!map[d.acc]) map[d.acc] = [];
            map[d.acc].push({ date: e.date, dr: d.amt, cr: 0 });
          });
          e.credits.forEach(c => {
            if (!map[c.acc]) map[c.acc] = [];
            map[c.acc].push({ date: e.date, dr: 0, cr: c.amt });
          });
        });
        return map;
      }, [journal]);

      /* ---------------- TRIAL BALANCE ---------------- */
      const trialBalance = useMemo(() => {
        const rows = [];
        Object.keys(ledger).forEach(acc => {
          const dr = ledger[acc].reduce((s, e) => s + e.dr, 0);
          const cr = ledger[acc].reduce((s, e) => s + e.cr, 0);
          if (dr >= cr) rows.push({ acc, debit: dr - cr, credit: 0 });
          else rows.push({ acc, debit: 0, credit: cr - dr });
        });

        return {
          rows,
          totalDr: rows.reduce((s, r) => s + r.debit, 0),
          totalCr: rows.reduce((s, r) => s + r.credit, 0)
        };
      }, [ledger]);

      /* ---------------- BALANCE SHEET ---------------- */
      const balanceSheet = useMemo(() => {
        const assets = [];
        const liabilities = [];

        trialBalance.rows.forEach(r => {
          if (r.debit > 0) assets.push(r);
          if (r.credit > 0) liabilities.push(r);
        });

        return {
          assets,
          liabilities,
          totalAssets: assets.reduce((s,a)=>s+a.debit,0),
          totalLiabilities: liabilities.reduce((s,l)=>s+l.credit,0)
        };
      }, [trialBalance]);

      /* ---------------- UI ---------------- */
      return (
        <div className="text-[#f4e4bc] font-serif">

          {/* NAV */}
          <div className="flex gap-2 p-4 bg-[#2a1f18]">
            {[
              ["new","New Entry"],
              ["journal","Journal"],
              ["ledger","Ledger"],
              ["trial","Trial Balance"],
              ["balance","Balance Sheet"]
            ].map(t=>(
              <button key={t[0]}
                onClick={()=>setView(t[0])}
                className={`px-4 py-2 border ${
                  view===t[0]?"bg-[#d4af37] text-black":"border-[#d4af37]"
                }`}>
                {t[1]}
              </button>
            ))}
          </div>

          {/* NEW ENTRY */}
          {view==="new" && (
            <div className="p-6 space-y-4">
              <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="text-black px-2"/>
              <input placeholder="Narration" value={narration} onChange={e=>setNarration(e.target.value)} className="text-black px-2 w-full"/>

              <h3>Debit</h3>
              {debits.map((d,i)=>(
                <div key={i}>
                  <input placeholder="Account" className="text-black" onChange={e=>{
                    const x=[...debits]; x[i].acc=e.target.value; setDebits(x);
                  }}/>
                  <input type="number" className="text-black" onChange={e=>{
                    const x=[...debits]; x[i].amt=+e.target.value*100; setDebits(x);
                  }}/>
                </div>
              ))}
              <button onClick={addDebit}>+ Debit</button>

              <h3>Credit</h3>
              {credits.map((c,i)=>(
                <div key={i}>
                  <input placeholder="Account" className="text-black" onChange={e=>{
                    const x=[...credits]; x[i].acc=e.target.value; setCredits(x);
                  }}/>
                  <input type="number" className="text-black" onChange={e=>{
                    const x=[...credits]; x[i].amt=+e.target.value*100; setCredits(x);
                  }}/>
                </div>
              ))}
              <button onClick={addCredit}>+ Credit</button>

              <button onClick={saveEntry} className="bg-[#d4af37] text-black px-4 py-2">
                Save Entry
              </button>
            </div>
          )}

          {/* JOURNAL */}
          {view==="journal" && (
            <table className="w-full border">
              <tbody>
                {journal.map((e,i)=>(
                  <tr key={i}><td>{e.date}</td><td>{e.narration}</td></tr>
                ))}
              </tbody>
            </table>
          )}

          {/* LEDGER */}
          {view==="ledger" && Object.keys(ledger).map(acc=>(
            <div key={acc}>
              <h3>{acc}</h3>
              {ledger[acc].map((r,i)=>(
                <div key={i}>{r.date} Dr {paiseToStr(r.dr)} Cr {paiseToStr(r.cr)}</div>
              ))}
            </div>
          ))}

          {/* TRIAL BALANCE */}
          {view==="trial" && (
            <table className="w-full">
              <tbody>
                {trialBalance.rows.map((r,i)=>(
                  <tr key={i}>
                    <td>{r.acc}</td>
                    <td>{r.debit?paiseToStr(r.debit):""}</td>
                    <td>{r.credit?paiseToStr(r.credit):""}</td>
                  </tr>
                ))}
                <tr>
                  <td>Total</td>
                  <td>{paiseToStr(trialBalance.totalDr)}</td>
                  <td>{paiseToStr(trialBalance.totalCr)}</td>
                </tr>
              </tbody>
            </table>
          )}

          {/* BALANCE SHEET */}
          {view==="balance" && (
            <table className="w-full">
              <tbody>
                {Array.from({length:Math.max(balanceSheet.assets.length,balanceSheet.liabilities.length)})
                .map((_,i)=>(
                  <tr key={i}>
                    <td>{balanceSheet.assets[i]?.acc}</td>
                    <td>{balanceSheet.assets[i]?paiseToStr(balanceSheet.assets[i].debit):""}</td>
                    <td>{balanceSheet.liabilities[i]?.acc}</td>
                    <td>{balanceSheet.liabilities[i]?paiseToStr(balanceSheet.liabilities[i].credit):""}</td>
                  </tr>
                ))}
                <tr>
                  <td>Total</td>
                  <td>{paiseToStr(balanceSheet.totalAssets)}</td>
                  <td>Total</td>
                  <td>{paiseToStr(balanceSheet.totalLiabilities)}</td>
                </tr>
              </tbody>
            </table>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AccountingApp/>);
  </script>
</body>
</html>
