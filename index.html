<script>
(function () {
  "use strict";

  var journal = [];
  var ledger = {};
  var undoStack = [];
  var editModeIndex = null;
  var editSnapshot = null;
  var LS_JOURNAL = "journalData";
  var LS_UNDO = "undoStack";

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function escapeHtml(text) { var div=document.createElement("div"); div.textContent=String(text||""); return div.innerHTML; }
  function toPaise(v){ var n=Number(v); return (!isFinite(n)||n<=0)?0:Math.round(n*100); }
  function paiseToStr(p){ p=Number(p)||0; return (p/100).toFixed(2); }
  function normalizeAccountName(name){ var n=String(name||"").trim(); if(!n)return""; n=n.replace(/\s+/g," "); if(!/a\/c$/i.test(n))n=n+" A/c"; n=n.replace(/A\/c\s*A\/c$/i,"A/c"); n=n.charAt(0).toUpperCase()+n.slice(1); return n; }
  function deepClone(obj){ return safeJSONParse(JSON.stringify(obj), null); }
  function safeJSONParse(str,fallback){ try{ var o=JSON.parse(str); return o==null?fallback:o;}catch(e){return fallback;} }

  function persist(){ try{ localStorage.setItem(LS_JOURNAL,JSON.stringify(journal)); }catch(e){} try{ localStorage.setItem(LS_UNDO,JSON.stringify(undoStack));}catch(e2){} }
  function restore(){ var j=safeJSONParse(localStorage.getItem(LS_JOURNAL),[]); var u=safeJSONParse(localStorage.getItem(LS_UNDO),[]); if(!Array.isArray(j)) j=[]; if(!Array.isArray(u)) u=[]; journal=j; undoStack=u; }
  function safeAlert(msg){ try{ alert(msg); }catch(e){console.log(msg);} }
  function strIncludes(hay,needle){ hay=String(hay||"").toLowerCase(); needle=String(needle||"").toLowerCase(); return hay.indexOf(needle)!==-1; }

  function ensureNarrationInputExists(){
    if($("#narrationInput")) return;
    var dateInput=$("#dateInput"); if(!dateInput)return;
    var wrapper=document.createElement("div"); wrapper.style.marginTop="8px";
    wrapper.innerHTML='<input id="narrationInput" type="text" placeholder="Narration" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc">';
    dateInput.parentNode.insertBefore(wrapper,dateInput.nextSibling);
  }

  function ensureSearchUIExists(){
    if(!$("#journalOutput")) return;
    if($("#searchBoxWrap")) return;
    var wrap=document.createElement("div");
    wrap.id="searchBoxWrap"; wrap.style.cssText="margin:10px 0;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,0.15);background:rgba(255,255,255,0.85)";
    wrap.innerHTML="<div style='font-weight:700;margin-bottom:6px'>Search</div><input id='searchInput' type='text' placeholder='Search entry / account / narration / date / amount...' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'>"+
    "<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px'>"+
    "<button id='searchClearBtn' type='button' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Clear</button>"+
    "<button id='searchGoLedgerBtn' type='button' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Search in Ledger</button>"+
    "</div><div id='searchHint' style='margin-top:8px;font-size:12px;opacity:0.8'></div>";
    $("#journalOutput").parentNode.insertBefore(wrap,$("#journalOutput"));

    $("#searchInput")?.addEventListener("input",()=>renderAll());
    $("#searchInput")?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); renderAll(); } });
    $("#searchClearBtn")?.addEventListener("click",()=>{ if($("#searchInput")) $("#searchInput").value=""; renderAll(); });
    $("#searchGoLedgerBtn")?.addEventListener("click",()=>{
      var q=$("#searchInput")?.value.trim(); if(!q){ safeAlert("Type something first."); return; }
      showPage(1); setTimeout(()=>highlightLedgerAccount(q),120);
    });
  }

  function showPage(idx){ var pages=$all(".page"),btns=$all("nav button"); if(!pages.length||idx<0||idx>=pages.length)return; pages.forEach(p=>p.classList.remove("active")); btns.forEach(b=>b.classList.remove("active")); pages[idx].classList.add("active"); if(btns[idx])btns[idx].classList.add("active"); }
  window.showPage=showPage;

  function addDebit(){ var c=$("#debitContainer"); if(!c)return; var r=document.createElement("div"); r.className="entry-row debit-row"; r.innerHTML='<input placeholder="Account Name" class="account-input" type="text"><input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input"><input placeholder="Particulars" class="particulars-input" type="text" readonly>'; c.appendChild(r); autoFillParticularsInForm(); }
  function addCredit(){ var c=$("#creditContainer"); if(!c)return; var r=document.createElement("div"); r.className="entry-row credit-row"; r.innerHTML='<input placeholder="Account Name" class="account-input" type="text"><input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input"><input placeholder="Particulars" class="particulars-input" type="text" readonly>'; c.appendChild(r); autoFillParticularsInForm(); }
  window.addDebit=addDebit; window.addCredit=addCredit;

  function getRowsData(sel){ return $all(sel).map(r=>{ var accEl=$(".account-input",r); var amtEl=$(".amount-input",r); return {acc:normalizeAccountName(accEl?accEl.value:""),amt:toPaise(amtEl?amtEl.value:0),row:r}; }); }
  function autoFillParticularsInForm(){ var d=$("#debitContainer"),c=$("#creditContainer"); if(!d||!c)return; var deb=getRowsData(".debit-row").filter(x=>x.acc||x.amt); var cred=getRowsData(".credit-row").filter(x=>x.acc||x.amt); var dtxt=deb.map(x=>x.acc).filter(Boolean); var ctxt=cred.map(x=>x.acc).filter(Boolean); deb.forEach(d=>{$(".particulars-input",d.row).value=ctxt.length?("To "+ctxt.join(", ")):"";}); cred.forEach(c=>{$(".particulars-input",c.row).value=dtxt.length?("By "+dtxt.join(", ")):"";}); }
  window.autoFillParticularsInForm=autoFillParticularsInForm;
  document.addEventListener("input",e=>{ if(e.target?.classList.contains("account-input")||e.target?.classList.contains("amount-input")) autoFillParticularsInForm(); });

  (function enableEnterNavigation(){
    function focusEl(el){ el?.focus(); try{el.select?.();}catch{} }
    function getRowInputs(row){ if(!row)return[]; return Array.from(row.querySelectorAll(".account-input,.amount-input,.particulars-input")); }
    function ensureNextRow(row){ if(!row)return null; if(row.classList.contains("debit-row")){ var n=row.nextElementSibling; if(n?.classList.contains("debit-row"))return n; addDebit(); return row.nextElementSibling; } if(row.classList.contains("credit-row")){ var n=row.nextElementSibling; if(n?.classList.contains("credit-row"))return n; addCredit(); return row.nextElementSibling; } return null; }
    document.addEventListener("keydown",e=>{
      if(e.key!=="Enter")return; var t=e.target; if(!t)return;
      if(t.id==="narrationInput"){ e.preventDefault(); $("#debitContainer .debit-row .account-input")?.focus(); return; }
      if(t.id==="searchInput"){ e.preventDefault(); renderAll(); return; }
      if(!(t.classList.contains("account-input")||t.classList.contains("amount-input")||t.classList.contains("particulars-input")))return;
      e.preventDefault(); var row=t.closest(".entry-row"); if(!row)return; var inputs=getRowInputs(row),idx=inputs.indexOf(t); if(idx>=0 && idx<inputs.length-1){ focusEl(inputs[idx+1]); return; }
      var next=ensureNextRow(row); if(next) focusEl(getRowInputs(next)[0]); autoFillParticularsInForm();
    },true);
  })();

  function validateEntry(debits,credits,narr){ var errs=[]; if(!debits.length) errs.push("Add at least 1 debit line."); if(!credits.length) errs.push("Add at least 1 credit line.");
    debits.forEach((d,i)=>{ if(!d.acc) errs.push("Debit row "+(i+1)+" Account required"); if(d.amt<=0) errs.push("Debit row "+(i+1)+" Amount >0");});
    credits.forEach((c,i)=>{ if(!c.acc) errs.push("Credit row "+(i+1)+" Account required"); if(c.amt<=0) errs.push("Credit row "+(i+1)+" Amount >0");});
    if(narr!=null){ var n=String(narr).trim(); if(n.length>300) errs.push("Narration max 300 chars"); }
    var dtotal=debits.reduce((s,d)=>s+d.amt,0),ctotal=credits.reduce((s,c)=>s+c.amt,0);
    if(dtotal!==ctotal) errs.push("Debit total ("+paiseToStr(dtotal)+") ≠ Credit total ("+paiseToStr(ctotal)+")");
    return {ok:errs.length===0,errors:errs,debitTotal:dtotal,creditTotal:ctotal};
  }

  function ensureLedgerAcc(name){ if(!ledger[name]) ledger[name]=[]; }
  function postToLedger(entry){ entry.debits.forEach(d=>{ ensureLedgerAcc(d.acc); ledger[d.acc].push({date:entry.date,particulars:"To "+entry.credits.map(c=>c.acc).join(", "),debit:d.amt,credit:0,jf:entry.jf||"-"}); });
    entry.credits.forEach(c=>{ ensureLedgerAcc(c.acc); ledger[c.acc].push({date:entry.date,particulars:"By "+entry.debits.map(d=>d.acc).join(", "),debit:0,credit:c.amt,jf:entry.jf||"-"}); });
  }
  function rebuildLedgerFromJournal(){ ledger={}; journal.forEach(postToLedger); }

  function addEntry(){
    var date=$("#dateInput")?.value?.trim()||new Date().toISOString().slice(0,10);
    var narr=$("#narrationInput")?.value?.trim()||"-";
    var deb=getRowsData(".debit-row").filter(d=>d.acc||d.amt);
    var cred=getRowsData(".credit-row").filter(c=>c.acc||c.amt);
    var v=validateEntry(deb,cred,narr); if(!v.ok){ safeAlert("Fix:\n"+v.errors.join("\n")); return; }
    var entry={date:date,narration:narr,debits:deb.map(d=>({acc:d.acc,amt:d.amt})),credits:cred.map(c=>({acc:c.acc,amt:c.amt})),jf:"-"};
    undoStack.push({type:"add",index:journal.length,entry:entry});
    journal.push(entry); rebuildLedgerFromJournal(); persist(); resetEntryForm(); renderAll();
  }
  window.addEntry=addEntry;

  // EDIT functions safely fixed
  function startEditEntry(idx){ if(idx==null||idx<0||idx>=journal.length)return; editModeIndex=idx; editSnapshot=deepClone(journal[idx]); renderAll(); setTimeout(()=>{$("[data-edit-index='"+idx+"'] input")?.focus();},50);}
  function cancelEditEntry(){ if(editModeIndex==null)return; if(editSnapshot) journal[editModeIndex]=deepClone(editSnapshot); editModeIndex=null; editSnapshot=null; rebuildLedgerFromJournal(); persist(); renderAll();}
  function saveEditEntry(idx){
    if(idx==null||idx<0||idx>=journal.length)return;
    var box=$("[data-edit-index='"+idx+"']"); if(!box)return;
    var date=box.querySelector(".edit-date")?.value?.trim()||new Date().toISOString().slice(0,10);
    var narr=box.querySelector(".edit-narration")?.value?.trim()||"-";
    function readLines(kind){ return Array.from(box.querySelectorAll(".edit-"+kind+"-row")).map(r=>{ var acc=r.querySelector(".edit-acc"); var amt=r.querySelector(".edit-amt"); return {acc:normalizeAccountName(acc?acc.value:""),amt:toPaise(amt?amt.value:0)}; }).filter(x=>x.acc||x.amt); }
    var deb=readLines("debit"), cred=readLines("credit");
    var v=validateEntry(deb,cred,narr); if(!v.ok){ safeAlert("Fix:\n"+v.errors.join("\n")); return; }
    undoStack.push({type:"edit",index:idx,before:deepClone(editSnapshot||journal[idx]),after:null});
    journal[idx]={date:date,narration:narr,debits:deb,credits:cred,jf:"-"};
    undoStack[undoStack.length-1].after=deepClone(journal[idx]); editModeIndex=null; editSnapshot=null; rebuildLedgerFromJournal(); persist(); renderAll();
  }
  window.startEditEntry=startEditEntry; window.saveEditEntry=saveEditEntry; window.cancelEditEntry=cancelEditEntry;

  function undoLast(){ if(!undoStack.length){ safeAlert("Nothing to undo"); return; } var last=undoStack.pop(); if(last.type==="add"){ journal.splice(last.index,1); } if(last.type==="edit"){ if(last.before) journal[last.index]=deepClone(last.before); } rebuildLedgerFromJournal(); persist(); renderAll(); }
  window.undoLast=undoLast;

  function resetEntryForm(){ var d=$("#debitContainer"),c=$("#creditContainer"); if(!d||!c)return; d.innerHTML=""; c.innerHTML=""; addDebit(); addCredit(); $("#narrationInput")&&( $("#narrationInput").value=""); autoFillParticularsInForm(); }
  window.resetEntryForm=resetEntryForm;

  function getSearchQuery(){ return $("#searchInput")?.value?.trim()||""; }
  function entryMatchesSearch(e,q){ if(!q)return true; q=q.toLowerCase(); if(strIncludes(e.date,q))return true; if(strIncludes(e.narration,q))return true; for(var lines=[].concat(e.debits||[],e.credits||[]),i=0;i<lines.length;i++){ var ln=lines[i]; if(strIncludes(ln.acc,q)||strIncludes(paiseToStr(ln.amt),q)) return true;} return false;}
  function highlightLedgerAccount(q){ if(!q)return; var cards=$$(".ledger-card"); if(!cards.length)return; var f=null; Array.prototype.forEach.call(cards,c=>{ c.style.outline=""; c.style.boxShadow=""; var h=c.querySelector("h3"); if(!h) return; if(!f && h.textContent.toLowerCase().indexOf(q.toLowerCase())!==-1) f=c; }); if(f){ f.scrollIntoView({behavior:"smooth",block:"start"}); f.style.outline="2px solid #000"; f.style.boxShadow="0 0 0 4px rgba(0,0,0,0.1)";}else safeAlert("No matching account in ledger."); }

  function renderJournal(){
    var out=$("#journalOutput"); if(!out) return; var query=getSearchQuery(); var hint=$("#searchHint"); if(!journal.length){ out.innerHTML="<p style='opacity:0.8'>No entries yet.</p>"; if(hint) hint.textContent=""; return;}
    var html=""; var visibleCount=0;
    journal.forEach((e,idx)=>{
      if(!entryMatchesSearch(e,query)) return; visibleCount++;
      if(editModeIndex===idx){
        var debitEdit=(e.debits||[]).map(d=>"<div class='edit-debit-row' style='display:flex;gap:8px;margin-top:6px'><input class='edit-acc' type='text' value='"+escapeHtml(d.acc)+"' style='flex:2;padding:8px;border-radius:8px;border:1px solid #ccc'><input class='edit-amt' type='number' step='0.01' min='0' value='"+escapeHtml(paiseToStr(d.amt))+"' style='flex:1;padding:8px;border-radius:8px;border:1px solid #ccc'></div>").join("");
        var creditEdit=(e.credits||[]).map(c=>"<div class='edit-credit-row' style='display:flex;gap:8px;margin-top:6px'><input class='edit-acc' type='text' value='"+escapeHtml(c.acc)+"' style='flex:2;padding:8px;border-radius:8px;border:1px solid #ccc'><input class='edit-amt' type='number' step='0.01' min='0' value='"+escapeHtml(paiseToStr(c.amt))+"' style='flex:1;padding:8px;border-radius:8px;border:1px solid #ccc'></div>").join("");
        html+="<div class='entry-card' data-edit-index='"+idx+"' style='border:2px solid rgba(0,0,0,0.2)'><div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'><div><b>Entry "+(idx+1)+" (Editing)</b></div><div style='display:flex;gap:8px;flex-wrap:wrap'><button type='button' onclick='saveEditEntry("+idx+")' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Save</button><button type='button' onclick='cancelEditEntry()' style='padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Cancel</button></div></div><div style='margin-top:10px'><div style='font-weight:700;margin-bottom:6px'>Date</div><input class='edit-date' type='date' value='"+escapeHtml(e.date)+"' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'></div><div style='margin-top:10px'><div style='font-weight:700;margin-bottom:6px'>Narration</div><input class='edit-narration' type='text' value='"+escapeHtml(e.narration||"-")+"' style='width:100%;padding:10px;border-radius:8px;border:1px solid #ccc'></div><div style='margin-top:10px'><div style='font-weight:700'>Debits</div>"+debitEdit+"</div><div style='margin-top:10px'><div style='font-weight:700'>Credits</div>"+creditEdit+"</div></div>"; return;}
      var debitLines=(e.debits||[]).map(d=>"<div>"+escapeHtml(d.acc)+" Dr. "+paiseToStr(d.amt)+"</div>").join("");
      var creditLines=(e.credits||[]).map(c=>"<div>To "+escapeHtml(c.acc)+" "+paiseToStr(c.amt)+"</div>").join("");
      html+="<div class='entry-card'><div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'><div><b>Entry "+(idx+1)+"</b> | "+escapeHtml(e.date)+"</div><div style='display:flex;gap:8px;flex-wrap:wrap'><button type='button' onclick='startEditEntry("+idx+")' style='padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer'>Edit</button></div></div><div style='margin-top:6px'>"+debitLines+"</div><div style='margin-top:6px'>"+creditLines+"</div><div style='margin-top:6px'><i>Narration:</i> "+escapeHtml(e.narration||"-")+"</div></div>";
    });
    out.innerHTML=visibleCount?html:"<p style='opacity:0.8'>No matching entries found.</p>";
    if(hint) hint.textContent=query?("Showing "+visibleCount+" matching entry(s) for: "+query):("Showing all entries: "+journal.length);
  }

  function renderLedger(){
    var out=$("#ledgerOutput"); if(!out) return;
    var accs=Object.keys(ledger).sort(); if(!accs.length){ out.innerHTML="<p style='opacity:0.8'>Ledger empty</p>"; return;}
    var html="";
    accs.forEach(acc=>{
      var rows=ledger[acc]||[],dt=0,ct=0;
      var rowHtml=rows.map(r=>{ dt+=r.debit||0; ct+=r.credit||0; return "<tr><td>"+escapeHtml(r.date)+"</td><td>"+escapeHtml(r.particulars)+"</td><td>"+escapeHtml(r.jf||"-")+"</td><td style='text-align:right'>"+(r.debit?paiseToStr(r.debit):"")+"</td><td style='text-align:right'>"+(r.credit?paiseToStr(r.credit):"")+"</td></tr>";}).join("");
      html+="<div class='ledger-card'><h3>"+escapeHtml(acc)+"</h3><div style='overflow:auto'><table class='ledger-table'><thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead><tbody>"+rowHtml+"</tbody><tfoot><tr><td colspan='3'><b>Total</b></td><td style='text-align:right'><b>"+paiseToStr(dt)+"</b></td><td style='text-align:right'><b>"+paiseToStr(ct)+"</b></td></tr></tfoot></table></div></div>";
    });
    out.innerHTML=html;
  }

  function renderAll(){ renderJournal(); renderLedger(); }
  window.renderAll=renderAll;

  function init(){ restore(); rebuildLedgerFromJournal(); ensureNarrationInputExists(); ensureSearchUIExists(); if(!document.querySelector(".debit-row")) addDebit(); if(!document.querySelector(".credit-row")) addCredit(); autoFillParticularsInForm(); renderAll(); }

  window.addEventListener("error",e=>{ console.error("Runtime error:",e.message,e.error); });
  function safeInitWithRetry(r){ try{init();}catch(err){ console.error("Init failed:",err); if(r>0)setTimeout(()=>safeInitWithRetry(r-1),150); } }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>safeInitWithRetry(5)); else safeInitWithRetry(5);

})();
</script>
