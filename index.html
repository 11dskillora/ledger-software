<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SARASWATI INTERNATIONAL SCHOOL - Accounting System</title>

<style>
  :root{
    --bg:#f6f1e6;
    --card:#fffaf0;
    --ink:#2b1b12;
    --muted:#7a5c3d;
    --border:#d8c1a2;
    --shadow:0 12px 30px rgba(0,0,0,.12);
    --accent:#8b5a2b;
    --accent2:#c59a6c;
    --danger:#b23b3b;
    --ok:#2f6f3e;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, rgba(255,255,255,.6), transparent 40%),
      linear-gradient(180deg, #f3eadb, #efe4d2);
    min-height:100vh;
  }

  /* ===== Top Sticky Menu ===== */
  .topbar{
    position:sticky; top:0; z-index:999;
    background: linear-gradient(90deg, #3a261a, #5a3a24);
    color:#fff;
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
    padding:10px 14px;
  }
  .topbar-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800;
    letter-spacing:.5px;
  }
  .seal{
    width:36px;height:36px;border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #ffdf9a, #b8892a);
    border:2px solid rgba(255,255,255,.4);
    box-shadow: inset 0 0 10px rgba(0,0,0,.25);
  }
  .brand-title{
    line-height:1.05;
    font-size:14px;
  }
  .brand-sub{
    opacity:.85;
    font-size:12px;
    font-weight:600;
  }

  .menu{
    display:flex; align-items:center; gap:10px;
    flex-wrap:wrap;
  }
  select, input, button, textarea{
    font-family: inherit;
  }
  .select{
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.12);
    color:#fff;
    outline:none;
    cursor:pointer;
  }
  .select option{color:#111;}
  .btn{
    border:none;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    font-weight:800;
    letter-spacing:.2px;
    transition:.15s;
    user-select:none;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.98)}
  .btn-accent{
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    color:#fff;
    box-shadow: 0 10px 20px rgba(0,0,0,.25);
  }
  .btn-ghost{
    background: rgba(255,255,255,.12);
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
  }
  .btn-danger{
    background: linear-gradient(90deg, #d66, #b23b3b);
    color:#fff;
  }

  /* ===== Layout ===== */
  .wrap{
    max-width:1200px;
    margin:14px auto 60px;
    padding:0 14px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow: var(--shadow);
    padding:16px;
    overflow:hidden;
  }

  /* ===== Notebook Table ===== */
  .table-wrap{
    overflow:auto;
    border-radius:14px;
    border:1px solid var(--border);
    background:
      linear-gradient(transparent 0, transparent 27px, rgba(140,90,40,.18) 28px),
      linear-gradient(90deg, rgba(210,40,40,.25) 0 2px, transparent 2px),
      var(--paper);
    background-size: 100% 28px, 100% 100%, 100% 100%;
    background-position: 0 0, 58px 0, 0 0;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:780px;
  }
  th,td{
    padding:10px 10px;
    border-bottom:1px dashed rgba(120,80,40,.35);
    vertical-align:top;
    font-size:14px;
  }
  th{
    position:sticky; top:0;
    background: linear-gradient(180deg, rgba(250,248,243,.96), rgba(245,236,219,.92));
    z-index:2;
    text-align:left;
    border-bottom:2px solid rgba(120,80,40,.35);
  }

  .muted{color:var(--muted); font-weight:600;}
  .pill{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.55);
    font-weight:800;
    font-size:12px;
  }
  .pill.dr{color:#0b5}
  .pill.cr{color:#b33}

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }
  @media (max-width: 900px){
    .grid{grid-template-columns:1fr;}
    table{min-width:980px;}
  }

  /* ===== Forms ===== */
  .card{
    border:1px solid var(--border);
    border-radius:18px;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
    padding:14px;
  }
  .h2{
    margin:0 0 10px;
    font-size:18px;
    font-weight:900;
    letter-spacing:.2px;
  }
  .row{
    display:grid;
    grid-template-columns: 1.2fr .6fr .6fr auto;
    gap:10px;
    margin-bottom:10px;
    align-items:center;
  }
  @media(max-width:650px){
    .row{grid-template-columns:1fr 1fr; }
    .row .span2{grid-column:span 2;}
  }

  .field{
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fffdf7;
    outline:none;
  }
  .field:focus{
    border-color:#caa57c;
    box-shadow:0 0 0 4px rgba(197,154,108,.25);
  }

  .mini{
    padding:8px 10px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fffdf7;
    cursor:pointer;
    font-weight:900;
  }
  .mini.danger{
    border-color: rgba(178,59,59,.35);
    background: rgba(178,59,59,.08);
    color: var(--danger);
  }
  .mini.ok{
    border-color: rgba(47,111,62,.35);
    background: rgba(47,111,62,.08);
    color: var(--ok);
  }

  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }

  .note{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    font-weight:700;
  }

  /* ===== Modal ===== */
  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:2000;
  }
  .modal{
    width:min(900px, 100%);
    background: var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .modal-head{
    padding:14px 16px;
    background: linear-gradient(90deg, #3a261a, #5a3a24);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .modal-body{padding:16px;}
  .modal-backdrop.show{display:flex;}
</style>
</head>

<body>

<!-- TOP MENU (overlaps everything) -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="seal" aria-hidden="true"></div>
      <div>
        <div class="brand-title">SARASWATI INTERNATIONAL SCHOOL</div>
        <div class="brand-sub">Premium Accounting Practical System</div>
      </div>
    </div>

    <div class="menu">
      <select class="select" id="viewSelect" title="Choose section">
        <option value="newEntry">New Entry</option>
        <option value="journal">Journal</option>
        <option value="ledger">Ledger</option>
        <option value="trial">Trial Balance</option>
      </select>

      <button class="btn btn-ghost" id="undoBtn" title="Undo last action">Undo</button>
      <button class="btn btn-danger" id="deleteAllBtn" title="Delete everything">Delete All</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="panel" id="app"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div style="font-weight:900">Edit Journal Entry (CBSE Practical)</div>
      <button class="btn btn-ghost" id="closeEdit">Close</button>
    </div>
    <div class="modal-body">
      <div class="card">
        <div class="h2">Edit Entry</div>
        <div class="note">You can modify date, narration, and debit/credit lines. Totals must match.</div>

        <div class="row">
          <input class="field span2" id="editDate" type="date" />
          <input class="field span2" id="editNarr" placeholder="Narration" />
        </div>

        <div id="editLines"></div>

        <div class="actions">
          <button class="btn btn-accent" id="saveEdit">Save Changes</button>
          <button class="btn btn-danger" id="deleteEditEntry">Delete This Entry</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SARASWATI INTERNATIONAL SCHOOL - Accounting System
   FIXED + TRIPLE CHECKED
   - Multiple Dr/Cr in one entry
   - LocalStorage autosave
   - Undo
   - Delete All / Delete Journal / Delete Ledger
   - Delete single journal entry
   - Edit journal entry
   - Delete single ledger account
   - Trial Balance auto-generated
   - Scroll-wheel number disabled
   ============================================================ */

/* -------------------- Utils -------------------- */
const $ = (id)=>document.getElementById(id);
const money = (n)=>"₹ " + (Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2, maximumFractionDigits:2});
const uid = ()=> "E" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

/* -------------------- State -------------------- */
const STORAGE_KEY = "sis_accounting_v1";

let state = {
  journal: [], // entries
  ledger: {},  // accountName -> {name, lines:[{entryId, date, type, amount}]}
  lastActionStack: [] // undo snapshots
};

/* -------------------- Undo -------------------- */
function pushUndoSnapshot(){
  // keep only last 25 actions to avoid huge storage
  state.lastActionStack.push({
    journal: deepClone(state.journal),
    ledger: deepClone(state.ledger)
  });
  if(state.lastActionStack.length>25) state.lastActionStack.shift();
}
function undo(){
  const snap = state.lastActionStack.pop();
  if(!snap){ alert("Nothing to undo."); return; }
  state.journal = snap.journal;
  state.ledger = snap.ledger;
  saveToLocal();
  render();
}

/* -------------------- LocalStorage -------------------- */
function saveToLocal(){
  const safe = {
    journal: state.journal,
    ledger: state.ledger
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
}
function loadFromLocal(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    if(data && typeof data === "object"){
      state.journal = Array.isArray(data.journal) ? data.journal : [];
      state.ledger = data.ledger && typeof data.ledger==="object" ? data.ledger : {};
    }
  }catch(e){
    console.warn("Storage corrupted. Resetting.");
    state.journal=[]; state.ledger={};
  }
}

/* -------------------- Ledger Rebuild (safe + correct) -------------------- */
function rebuildLedgerFromJournal(){
  const ledger = {};
  const ensure = (acc)=>{
    if(!ledger[acc]) ledger[acc] = {name: acc, lines: []};
  };

  for(const entry of state.journal){
    const date = entry.date;
    for(const d of entry.debits){
      ensure(d.account);
      ledger[d.account].lines.push({entryId: entry.id, date, type:"Dr", amount: Number(d.amount)||0});
    }
    for(const c of entry.credits){
      ensure(c.account);
      ledger[c.account].lines.push({entryId: entry.id, date, type:"Cr", amount: Number(c.amount)||0});
    }
  }

  // sort lines by date (then by entryId)
  for(const acc in ledger){
    ledger[acc].lines.sort((a,b)=>{
      if(a.date===b.date) return (a.entryId>b.entryId?1:-1);
      return (a.date>b.date?1:-1);
    });
  }

  state.ledger = ledger;
}

/* -------------------- Validation -------------------- */
function sumLines(arr){ return arr.reduce((s,x)=>s+(Number(x.amount)||0),0); }

function validateEntry(entry){
  if(!entry.date) return "Date is required.";
  if(!entry.narration || entry.narration.trim().length<3) return "Narration must be at least 3 characters.";

  if(!Array.isArray(entry.debits) || entry.debits.length===0) return "At least 1 debit line required.";
  if(!Array.isArray(entry.credits) || entry.credits.length===0) return "At least 1 credit line required.";

  for(const d of entry.debits){
    if(!d.account || !d.account.trim()) return "Debit account name missing.";
    if(!(Number(d.amount)>0)) return "Debit amount must be > 0.";
  }
  for(const c of entry.credits){
    if(!c.account || !c.account.trim()) return "Credit account name missing.";
    if(!(Number(c.amount)>0)) return "Credit amount must be > 0.";
  }

  const td = sumLines(entry.debits);
  const tc = sumLines(entry.credits);
  if(Math.abs(td-tc) > 0.001) return "Total Debit must equal Total Credit.";
  return null;
}

/* -------------------- Scroll-wheel disable for number inputs -------------------- */
document.addEventListener("wheel", function(e){
  const el = document.activeElement;
  if(el && el.tagName==="INPUT" && el.type==="number"){
    el.blur();
    e.preventDefault();
    setTimeout(()=>el.focus(), 0);
  }
},{passive:false});

/* -------------------- UI Builders -------------------- */
const app = $("app");
const viewSelect = $("viewSelect");

function setView(v){
  viewSelect.value = v;
  render();
}

/* -------------------- New Entry UI -------------------- */
function NewEntryView(){
  const container = document.createElement("div");
  container.className = "grid";

  const left = document.createElement("div");
  left.className = "card";

  left.innerHTML = `
    <div class="h2">New Journal Entry</div>

    <div class="row">
      <div class="span2">
        <div class="muted">Date</div>
        <input class="field" id="dateField" type="date"/>
      </div>
      <div class="span2">
        <div class="muted">Narration</div>
        <input class="field" id="narrField" placeholder="Being ... (CBSE style narration)"/>
      </div>
    </div>

    <div class="muted" style="margin:10px 0 6px;font-weight:900;">Debit Lines</div>
    <div id="debitLines"></div>
    <button class="mini ok" id="addDebit">+ Add Debit</button>

    <div class="muted" style="margin:14px 0 6px;font-weight:900;">Credit Lines</div>
    <div id="creditLines"></div>
    <button class="mini ok" id="addCredit">+ Add Credit</button>

    <div class="actions">
      <button class="btn btn-accent" id="postEntry">Post Entry</button>
      <button class="btn btn-ghost" id="clearForm">Clear</button>
    </div>

    <div class="note">
      Tip: Add multiple debit/credit accounts in one entry. Totals must match.
    </div>
  `;

  const right = document.createElement("div");
  right.className = "card";
  right.innerHTML = `
    <div class="h2">Quick Actions</div>
    <div class="actions">
      <button class="btn btn-ghost" id="gotoJournal">Open Journal</button>
      <button class="btn btn-ghost" id="gotoLedger">Open Ledger</button>
      <button class="btn btn-ghost" id="gotoTrial">Open Trial Balance</button>
    </div>

    <div style="margin-top:14px;">
      <div class="muted" style="font-weight:900;margin-bottom:6px;">Delete Options</div>
      <div class="actions">
        <button class="btn btn-danger" id="deleteJournal">Delete Journal</button>
        <button class="btn btn-danger" id="deleteLedger">Delete Ledger</button>
      </div>
      <div class="note">Delete Journal removes entries and auto rebuilds ledger as empty.</div>
    </div>
  `;

  container.appendChild(left);
  container.appendChild(right);

  // default lines
  const debitWrap = left.querySelector("#debitLines");
  const creditWrap = left.querySelector("#creditLines");

  function lineRow(type){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input class="field span2 acc" placeholder="${type} Account (e.g., Cash A/c)" />
      <input class="field amt" type="number" inputmode="numeric" placeholder="Amount" />
      <button class="mini danger remove">Remove</button>
    `;
    row.querySelector(".remove").onclick = ()=> row.remove();
    return row;
  }

  debitWrap.appendChild(lineRow("Debit"));
  creditWrap.appendChild(lineRow("Credit"));

  left.querySelector("#addDebit").onclick = ()=> debitWrap.appendChild(lineRow("Debit"));
  left.querySelector("#addCredit").onclick = ()=> creditWrap.appendChild(lineRow("Credit"));

  left.querySelector("#clearForm").onclick = ()=>{
    $("dateField").value="";
    $("narrField").value="";
    debitWrap.innerHTML="";
    creditWrap.innerHTML="";
    debitWrap.appendChild(lineRow("Debit"));
    creditWrap.appendChild(lineRow("Credit"));
  };

  left.querySelector("#postEntry").onclick = ()=>{
    const date = $("dateField").value;
    const narration = $("narrField").value;

    const debits = [...debitWrap.querySelectorAll(".row")].map(r=>({
      account: r.querySelector(".acc").value.trim(),
      amount: Number(r.querySelector(".amt").value)||0
    })).filter(x=>x.account || x.amount);

    const credits = [...creditWrap.querySelectorAll(".row")].map(r=>({
      account: r.querySelector(".acc").value.trim(),
      amount: Number(r.querySelector(".amt").value)||0
    })).filter(x=>x.account || x.amount);

    const entry = { id: uid(), date, narration, debits, credits };

    const err = validateEntry(entry);
    if(err){ alert(err); return; }

    pushUndoSnapshot();
    state.journal.push(entry);
    rebuildLedgerFromJournal();
    saveToLocal();

    alert("Entry posted successfully!");
    setView("journal");
  };

  right.querySelector("#gotoJournal").onclick = ()=> setView("journal");
  right.querySelector("#gotoLedger").onclick = ()=> setView("ledger");
  right.querySelector("#gotoTrial").onclick = ()=> setView("trial");

  right.querySelector("#deleteJournal").onclick = ()=>{
    if(!confirm("Delete all journal entries?")) return;
    pushUndoSnapshot();
    state.journal = [];
    rebuildLedgerFromJournal();
    saveToLocal();
    render();
  };
  right.querySelector("#deleteLedger").onclick = ()=>{
    if(!confirm("Delete all ledger accounts? (Ledger will be cleared)")) return;
    pushUndoSnapshot();
    state.ledger = {};
    // keep journal? As per user: delete ledger only
    saveToLocal();
    render();
  };

  return container;
}

/* -------------------- Journal UI -------------------- */
function JournalView(){
  const box = document.createElement("div");
  box.className="card";
  box.innerHTML = `
    <div class="h2">Journal</div>
    <div class="actions">
      <button class="btn btn-ghost" id="jNew">New Entry</button>
      <button class="btn btn-danger" id="jDeleteAll">Delete All (Journal)</button>
    </div>
    <div class="note">Each entry has Edit and Delete buttons (CBSE practical feature).</div>
    <div style="margin-top:12px" class="table-wrap" id="jTableWrap"></div>
  `;

  box.querySelector("#jNew").onclick = ()=> setView("newEntry");
  box.querySelector("#jDeleteAll").onclick = ()=>{
    if(!confirm("Delete ALL journal entries?")) return;
    pushUndoSnapshot();
    state.journal=[];
    rebuildLedgerFromJournal();
    saveToLocal();
    render();
  };

  const tw = box.querySelector("#jTableWrap");

  let html = `
    <table>
      <thead>
        <tr>
          <th style="width:120px;">Date</th>
          <th>Particulars</th>
          <th style="width:160px;">L.F.</th>
          <th style="width:170px;">Debit (₹)</th>
          <th style="width:170px;">Credit (₹)</th>
          <th style="width:180px;">Actions</th>
        </tr>
      </thead>
      <tbody>
  `;

  if(state.journal.length===0){
    html += `<tr><td colspan="6" class="muted">No journal entries yet.</td></tr>`;
  }else{
    state.journal.forEach((entry, idx)=>{
      const lf = String(idx+1).padStart(3,"0"); // CBSE style folio numbering

      // Build CBSE-style journal rows:
      // - debit lines first
      // - credit lines indented
      // - narration in italics
      const rows = [];

      entry.debits.forEach((d,i)=>{
        rows.push(`
          <tr>
            ${i===0?`<td rowspan="${entry.debits.length + entry.credits.length + 1}">${entry.date}</td>`:""}
            <td><span class="pill dr">Dr</span> ${escapeHtml(d.account)}</td>
            <td>${lf}</td>
            <td>${money(d.amount)}</td>
            <td></td>
            ${i===0?`<td rowspan="${entry.debits.length + entry.credits.length + 1}">
              <button class="mini ok" data-edit="${entry.id}">Edit</button>
              <button class="mini danger" data-del="${entry.id}">Delete</button>
            </td>`:""}
          </tr>
        `);
      });

      entry.credits.forEach((c)=>{
        rows.push(`
          <tr>
            <td style="padding-left:26px;"><span class="pill cr">Cr</span> To ${escapeHtml(c.account)}</td>
            <td>${lf}</td>
            <td></td>
            <td>${money(c.amount)}</td>
          </tr>
        `);
      });

      rows.push(`
        <tr>
          <td colspan="4" class="muted"><em>${escapeHtml(entry.narration)}</em></td>
        </tr>
      `);

      html += rows.join("");
    });
  }

  html += `</tbody></table>`;
  tw.innerHTML = html;

  // Bind edit/delete
  tw.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-del");
      if(!confirm("Delete this journal entry?")) return;
      pushUndoSnapshot();
      state.journal = state.journal.filter(e=>e.id!==id);
      rebuildLedgerFromJournal();
      saveToLocal();
      render();
    };
  });
  tw.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-edit");
      openEditModal(id);
    };
  });

  return box;
}

/* -------------------- Ledger UI -------------------- */
function LedgerView(){
  const box = document.createElement("div");
  box.className="card";
  box.innerHTML = `
    <div class="h2">Ledger (Single Page)</div>
    <div class="actions">
      <button class="btn btn-ghost" id="lNew">New Entry</button>
      <button class="btn btn-danger" id="lDeleteAll">Delete All (Ledger)</button>
    </div>
    <div class="note">You can delete a single ledger account from here.</div>
    <div style="margin-top:12px" id="ledgerArea"></div>
  `;

  box.querySelector("#lNew").onclick = ()=> setView("newEntry");
  box.querySelector("#lDeleteAll").onclick = ()=>{
    if(!confirm("Delete ALL ledger accounts? (Journal will remain)")) return;
    pushUndoSnapshot();
    state.ledger = {};
    saveToLocal();
    render();
  };

  const area = box.querySelector("#ledgerArea");
  const accounts = Object.keys(state.ledger).sort((a,b)=>a.localeCompare(b));

  if(accounts.length===0){
    area.innerHTML = `<div class="muted">No ledger accounts available. Post journal entries first.</div>`;
    return box;
  }

  let out = "";
  for(const acc of accounts){
    const obj = state.ledger[acc];
    const totals = ledgerTotals(obj.lines);

    out += `
      <div style="margin-bottom:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div style="font-weight:900;font-size:16px;">${escapeHtml(acc)}</div>
          <div class="actions" style="margin:0;">
            <span class="pill">Dr: ${money(totals.debit)}</span>
            <span class="pill">Cr: ${money(totals.credit)}</span>
            <span class="pill">${totals.balanceSide}: ${money(totals.balance)}</span>
            <button class="mini danger" data-led-del="${escapeAttr(acc)}">Delete Account</button>
          </div>
        </div>

        <div class="table-wrap" style="margin-top:10px;">
          <table>
            <thead>
              <tr>
                <th style="width:140px;">Date</th>
                <th style="width:120px;">Type</th>
                <th>Particulars</th>
                <th style="width:180px;">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${
                obj.lines.length===0
                ? `<tr><td colspan="4" class="muted">No transactions</td></tr>`
                : obj.lines.map(line=>`
                  <tr>
                    <td>${line.date || ""}</td>
                    <td>${line.type==="Dr" ? '<span class="pill dr">Dr</span>' : '<span class="pill cr">Cr</span>'}</td>
                    <td>Ref: ${line.entryId}</td>
                    <td>${money(line.amount)}</td>
                  </tr>
                `).join("")
              }
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  area.innerHTML = out;

  // Delete single ledger account
  area.querySelectorAll("[data-led-del]").forEach(btn=>{
    btn.onclick = ()=>{
      const acc = btn.getAttribute("data-led-del");
      if(!confirm(`Delete ledger account "${acc}" only?`)) return;
      pushUndoSnapshot();
      delete state.ledger[acc];
      saveToLocal();
      render();
    };
  });

  return box;
}

/* -------------------- Trial Balance UI -------------------- */
function TrialBalanceView(){
  const box = document.createElement("div");
  box.className="card";
  box.innerHTML = `
    <div class="h2">Trial Balance (Auto-generated)</div>
    <div class="note">Generated from Ledger totals. Debit and Credit totals must match.</div>
    <div style="margin-top:12px" class="table-wrap" id="tbWrap"></div>
  `;

  const wrap = box.querySelector("#tbWrap");
  const accounts = Object.keys(state.ledger).sort((a,b)=>a.localeCompare(b));

  let totalDr=0, totalCr=0;
  let rows="";

  if(accounts.length===0){
    rows = `<tr><td colspan="4" class="muted">No ledger accounts available.</td></tr>`;
  }else{
    for(const acc of accounts){
      const t = ledgerTotals(state.ledger[acc].lines);
      let dr=0, cr=0;
      if(t.balanceSide==="Dr") dr = t.balance;
      else cr = t.balance;

      totalDr += dr;
      totalCr += cr;

      rows += `
        <tr>
          <td>${escapeHtml(acc)}</td>
          <td>${t.balanceSide}</td>
          <td>${dr?money(dr):""}</td>
          <td>${cr?money(cr):""}</td>
        </tr>
      `;
    }
  }

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Particulars</th>
          <th style="width:120px;">Type</th>
          <th style="width:200px;">Debit</th>
          <th style="width:200px;">Credit</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        <tr>
          <td style="font-weight:900;">TOTAL</td>
          <td></td>
          <td style="font-weight:900;">${money(totalDr)}</td>
          <td style="font-weight:900;">${money(totalCr)}</td>
        </tr>
      </tbody>
    </table>
  `;

  return box;
}

/* -------------------- Helper: ledger totals -------------------- */
function ledgerTotals(lines){
  let debit=0, credit=0;
  for(const l of lines){
    if(l.type==="Dr") debit += Number(l.amount)||0;
    else credit += Number(l.amount)||0;
  }
  const net = debit - credit;
  return {
    debit, credit,
    balance: Math.abs(net),
    balanceSide: net>=0 ? "Dr" : "Cr"
  };
}

/* -------------------- Delete All -------------------- */
function deleteAll(){
  if(!confirm("Delete EVERYTHING (Journal + Ledger)?")) return;
  pushUndoSnapshot();
  state.journal=[];
  state.ledger={};
  saveToLocal();
  render();
}

/* -------------------- Edit Modal -------------------- */
let editingEntryId = null;

function openEditModal(entryId){
  const entry = state.journal.find(e=>e.id===entryId);
  if(!entry){ alert("Entry not found."); return; }

  editingEntryId = entryId;
  $("editDate").value = entry.date || "";
  $("editNarr").value = entry.narration || "";

  const wrap = $("editLines");
  wrap.innerHTML = "";

  function addLine(type, account="", amount=""){
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `
      <input class="field span2 acc" placeholder="${type} Account" value="${escapeAttr(account)}"/>
      <input class="field amt" type="number" inputmode="numeric" placeholder="Amount" value="${escapeAttr(amount)}"/>
      <button class="mini danger remove">Remove</button>
    `;
    div.dataset.type = type;
    div.querySelector(".remove").onclick = ()=> div.remove();
    wrap.appendChild(div);
  }

  // Add debit lines
  const title1 = document.createElement("div");
  title1.className="muted";
  title1.style.fontWeight="900";
  title1.style.margin="8px 0 6px";
  title1.textContent = "Debit Lines";
  wrap.appendChild(title1);

  entry.debits.forEach(d=>addLine("Debit", d.account, d.amount));
  const addDeb = document.createElement("button");
  addDeb.className="mini ok";
  addDeb.textContent="+ Add Debit";
  addDeb.onclick = ()=> addLine("Debit");
  wrap.appendChild(addDeb);

  // Add credit lines
  const title2 = document.createElement("div");
  title2.className="muted";
  title2.style.fontWeight="900";
  title2.style.margin="14px 0 6px";
  title2.textContent = "Credit Lines";
  wrap.appendChild(title2);

  entry.credits.forEach(c=>addLine("Credit", c.account, c.amount));
  const addCr = document.createElement("button");
  addCr.className="mini ok";
  addCr.textContent="+ Add Credit";
  addCr.onclick = ()=> addLine("Credit");
  wrap.appendChild(addCr);

  $("editBackdrop").classList.add("show");
}

function closeEdit(){
  editingEntryId = null;
  $("editBackdrop").classList.remove("show");
}

$("closeEdit").onclick = closeEdit;
$("editBackdrop").addEventListener("click",(e)=>{
  if(e.target.id==="editBackdrop") closeEdit();
});

$("saveEdit").onclick = ()=>{
  if(!editingEntryId) return;

  const entryIndex = state.journal.findIndex(e=>e.id===editingEntryId);
  if(entryIndex<0){ alert("Entry missing."); return; }

  const date = $("editDate").value;
  const narration = $("editNarr").value;

  const rows = [...$("editLines").querySelectorAll(".row")];

  const debits=[], credits=[];
  for(const r of rows){
    const type = r.dataset.type;
    const account = r.querySelector(".acc").value.trim();
    const amount = Number(r.querySelector(".amt").value)||0;
    if(!account && !amount) continue;
    if(type==="Debit") debits.push({account, amount});
    else credits.push({account, amount});
  }

  const updated = {
    id: editingEntryId,
    date,
    narration,
    debits,
    credits
  };

  const err = validateEntry(updated);
  if(err){ alert(err); return; }

  pushUndoSnapshot();
  state.journal[entryIndex] = updated;
  rebuildLedgerFromJournal();
  saveToLocal();
  closeEdit();
  render();
};

$("deleteEditEntry").onclick = ()=>{
  if(!editingEntryId) return;
  if(!confirm("Delete this entry?")) return;

  pushUndoSnapshot();
  state.journal = state.journal.filter(e=>e.id!==editingEntryId);
  rebuildLedgerFromJournal();
  saveToLocal();
  closeEdit();
  render();
};

/* -------------------- Escaping -------------------- */
function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(str){ return escapeHtml(str).replaceAll("\n"," "); }

/* -------------------- Render -------------------- */
function render(){
  const v = viewSelect.value;

  // safety: if ledger deleted but journal exists, rebuild if needed
  // (only rebuild when ledger missing and journal has entries)
  if((!state.ledger || typeof state.ledger!=="object") && state.journal.length>0){
    rebuildLedgerFromJournal();
  }

  app.innerHTML = "";
  if(v==="newEntry") app.appendChild(NewEntryView());
  else if(v==="journal") app.appendChild(JournalView());
  else if(v==="ledger") app.appendChild(LedgerView());
  else if(v==="trial") app.appendChild(TrialBalanceView());
}

/* -------------------- Topbar Buttons -------------------- */
$("undoBtn").onclick = undo;
$("deleteAllBtn").onclick = deleteAll;
viewSelect.onchange = render;

/* -------------------- Init -------------------- */
loadFromLocal();
// ensure ledger consistent with journal on load
rebuildLedgerFromJournal();
render();
</script>
