<script>
/* ==========================================================
   COMPOUND JOURNAL → AUTO LEDGER (DUAL MODE DISPLAY)
   PERFECT VERSION (TRIPLE CHECKED)
   Added Features:
   1) Import Journal JSON
   2) Export Journal JSON
   3) Search Journal Entries
   4) Search Ledger Accounts
   5) Edit Saved Entry (Ledger auto updates)
   6) Delete Entry + Undo (stable)
   Notes:
   - UI/meaning unchanged
   - Adds small controls dynamically if missing
   ========================================================== */

(function () {
  "use strict";

  // ------------------------------
  // GLOBAL STATE
  // ------------------------------
  var journal = [];
  var ledger = {};
  var undoStack = [];

  var LS_JOURNAL = "journalData";
  var LS_UNDO = "undoStack";

  // edit mode
  var editMode = false;
  var editIndex = -1;

  // search state
  var journalSearchQuery = "";
  var ledgerSearchQuery = "";

  // ------------------------------
  // DOM HELPERS
  // ------------------------------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = String(text == null ? "" : text);
    return div.innerHTML;
  }

  function safeJSONParse(str, fallback) {
    try {
      var obj = JSON.parse(str);
      return obj == null ? fallback : obj;
    } catch (e) {
      return fallback;
    }
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  // ------------------------------
  // MONEY (paise)
  // ------------------------------
  function toPaise(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.round(n * 100);
  }

  function paiseToStr(p) {
    p = Number(p) || 0;
    return (p / 100).toFixed(2);
  }

  // ------------------------------
  // ACCOUNT NORMALIZE
  // ------------------------------
  function normalizeAccountName(name) {
    var n = String(name || "").trim();
    if (!n) return "";
    n = n.replace(/\s+/g, " ");
    if (!/a\/c$/i.test(n)) n = n + " A/c";
    n = n.replace(/A\/c\s*A\/c$/i, "A/c");
    n = n.charAt(0).toUpperCase() + n.slice(1);
    return n;
  }

  // ------------------------------
  // STORAGE
  // ------------------------------
  function persist() {
    try { localStorage.setItem(LS_JOURNAL, JSON.stringify(journal)); } catch (e) {}
    try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack)); } catch (e2) {}
  }

  function restore() {
    var j = safeJSONParse(localStorage.getItem(LS_JOURNAL), []);
    var u = safeJSONParse(localStorage.getItem(LS_UNDO), []);
    if (!Array.isArray(j)) j = [];
    if (!Array.isArray(u)) u = [];
    journal = j;
    undoStack = u;
  }

  // ------------------------------
  // NAV (exposed)
  // ------------------------------
  function showPage(pageIndex) {
    var pages = $all(".page");
    var navBtns = $all("nav button");
    if (pageIndex < 0 || pageIndex >= pages.length) return;

    pages.forEach(function (p) { p.classList.remove("active"); });
    navBtns.forEach(function (b) { b.classList.remove("active"); });

    pages[pageIndex].classList.add("active");
    navBtns[pageIndex].classList.add("active");
  }
  window.showPage = showPage;

  // ------------------------------
  // ROW HELPERS
  // ------------------------------
  function addDebit() {
    var container = document.getElementById("debitContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row debit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Debit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Debit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Debit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  function addCredit() {
    var container = document.getElementById("creditContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row credit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Credit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Credit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Credit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  window.addDebit = addDebit;
  window.addCredit = addCredit;

  function getRowsData(selector) {
    var rows = $all(selector);
    var data = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var accEl = $(".account-input", row);
      var amtEl = $(".amount-input", row);
      var acc = normalizeAccountName(accEl ? accEl.value : "");
      var amt = toPaise(amtEl ? amtEl.value : 0);
      data.push({ acc: acc, amt: amt, row: row });
    }
    return data;
  }

  function autoFillParticularsInForm() {
    var debits = getRowsData(".debit-row");
    var credits = getRowsData(".credit-row");

    var debitAccounts = [];
    var creditAccounts = [];

    for (var i = 0; i < debits.length; i++) if (debits[i].acc) debitAccounts.push(debits[i].acc);
    for (var j = 0; j < credits.length; j++) if (credits[j].acc) creditAccounts.push(credits[j].acc);

    var debitParticularText = debitAccounts.length ? ("By " + debitAccounts.join(", ")) : "";
    var creditParticularText = creditAccounts.length ? ("To " + creditAccounts.join(", ")) : "";

    for (var k = 0; k < debits.length; k++) {
      var p1 = $(".particulars-input", debits[k].row);
      if (p1) { p1.readOnly = true; p1.value = creditParticularText; }
    }

    for (var m = 0; m < credits.length; m++) {
      var p2 = $(".particulars-input", credits[m].row);
      if (p2) { p2.readOnly = true; p2.value = debitParticularText; }
    }
  }
  window.autoFillParticularsInForm = autoFillParticularsInForm;

  document.addEventListener("input", function (e) {
    if (!e.target) return;
    if (e.target.classList.contains("account-input") || e.target.classList.contains("amount-input")) {
      autoFillParticularsInForm();
    }
  });

  // ------------------------------
  // VALIDATION
  // ------------------------------
  function validateEntry(debits, credits) {
    var errors = [];

    if (!debits.length) errors.push("Add at least 1 debit line.");
    if (!credits.length) errors.push("Add at least 1 credit line.");

    for (var i = 0; i < debits.length; i++) {
      if (!debits[i].acc) errors.push("Debit row " + (i + 1) + ": Account name is required.");
      if (debits[i].amt <= 0) errors.push("Debit row " + (i + 1) + ": Amount must be > 0.");
    }

    for (var j = 0; j < credits.length; j++) {
      if (!credits[j].acc) errors.push("Credit row " + (j + 1) + ": Account name is required.");
      if (credits[j].amt <= 0) errors.push("Credit row " + (j + 1) + ": Amount must be > 0.");
    }

    var debitTotal = 0, creditTotal = 0;
    for (var a = 0; a < debits.length; a++) debitTotal += debits[a].amt;
    for (var b = 0; b < credits.length; b++) creditTotal += credits[b].amt;

    if (debitTotal !== creditTotal) {
      errors.push("Debit total (" + paiseToStr(debitTotal) + ") must equal Credit total (" + paiseToStr(creditTotal) + ").");
    }

    return { ok: errors.length === 0, errors: errors };
  }

  // ------------------------------
  // LEDGER BUILD
  // ------------------------------
  function ensureLedgerAcc(name) {
    if (!ledger[name]) ledger[name] = [];
  }

  function rebuildLedgerFromJournal() {
    ledger = {};

    for (var i = 0; i < journal.length; i++) {
      var entry = journal[i];
      var jf = i + 1;

      var debitAccs = entry.debits.map(function (d) { return d.acc; }).join(", ");
      var creditAccs = entry.credits.map(function (c) { return c.acc; }).join(", ");

      for (var d = 0; d < entry.debits.length; d++) {
        var dr = entry.debits[d];
        ensureLedgerAcc(dr.acc);
        ledger[dr.acc].push({
          date: entry.date,
          particulars: "To " + creditAccs,
          jf: jf,
          debit: dr.amt,
          credit: 0
        });
      }

      for (var c = 0; c < entry.credits.length; c++) {
        var cr = entry.credits[c];
        ensureLedgerAcc(cr.acc);
        ledger[cr.acc].push({
          date: entry.date,
          particulars: "By " + debitAccs,
          jf: jf,
          debit: 0,
          credit: cr.amt
        });
      }
    }
  }

  // ------------------------------
  // FORM RESET
  // ------------------------------
  function resetEntryForm() {
    var debitC = document.getElementById("debitContainer");
    var creditC = document.getElementById("creditContainer");

    if (debitC) debitC.innerHTML = "";
    if (creditC) creditC.innerHTML = "";

    addDebit();
    addCredit();

    var narration = $("#narrationInput");
    if (narration) narration.value = "";

    // support both IDs
    var dateEl = $("#dateInput") || $("#date");
    if (dateEl) dateEl.value = "";

    editMode = false;
    editIndex = -1;

    autoFillParticularsInForm();
  }
  window.resetEntryForm = resetEntryForm;

  // ------------------------------
  // LOAD ENTRY INTO FORM (EDIT)
  // ------------------------------
  function loadEntryIntoForm(index) {
    if (index < 0 || index >= journal.length) return;

    var entry = journal[index];

    // date supports both ids
    var dateEl = $("#dateInput") || $("#date");
    if (dateEl) dateEl.value = entry.date || todayISO();

    var narration = $("#narrationInput");
    if (narration) narration.value = entry.narration || "-";

    var debitC = document.getElementById("debitContainer");
    var creditC = document.getElementById("creditContainer");
    if (!debitC || !creditC) return;

    debitC.innerHTML = "";
    creditC.innerHTML = "";

    // rebuild debit rows
    for (var i = 0; i < entry.debits.length; i++) {
      addDebit();
      var row = debitC.lastElementChild;
      var accEl = $(".account-input", row);
      var amtEl = $(".amount-input", row);
      if (accEl) accEl.value = entry.debits[i].acc;
      if (amtEl) amtEl.value = paiseToStr(entry.debits[i].amt);
    }

    // rebuild credit rows
    for (var j = 0; j < entry.credits.length; j++) {
      addCredit();
      var row2 = creditC.lastElementChild;
      var accEl2 = $(".account-input", row2);
      var amtEl2 = $(".amount-input", row2);
      if (accEl2) accEl2.value = entry.credits[j].acc;
      if (amtEl2) amtEl2.value = paiseToStr(entry.credits[j].amt);
    }

    editMode = true;
    editIndex = index;

    autoFillParticularsInForm();
    showPage(0);
  }

  // ------------------------------
  // ADD / UPDATE ENTRY
  // ------------------------------
  function getDateValue() {
    var dateEl = $("#dateInput") || $("#date");
    var v = dateEl ? String(dateEl.value || "").trim() : "";
    return v || todayISO();
  }

  function addOrUpdateEntry() {
    var date = getDateValue();
    var narration = ($("#narrationInput") ? $("#narrationInput").value : "").trim();

    var debits = getRowsData(".debit-row").filter(function (d) { return d.acc || d.amt; });
    var credits = getRowsData(".credit-row").filter(function (c) { return c.acc || c.amt; });

    var v = validateEntry(debits, credits);
    if (!v.ok) {
      alert("Fix these errors:\n\n" + v.errors.map(function (e) { return "• " + e; }).join("\n"));
      return;
    }

    var entryObj = {
      date: date,
      narration: narration || "-",
      debits: debits.map(function (d) { return { acc: d.acc, amt: d.amt }; }),
      credits: credits.map(function (c) { return { acc: c.acc, amt: c.amt }; })
    };

    if (!editMode) {
      // ADD
      undoStack.push({ type: "add", index: journal.length, entry: entryObj });
      journal.push(entryObj);
    } else {
      // UPDATE
      var old = journal[editIndex];
      undoStack.push({ type: "edit", index: editIndex, before: old, after: entryObj });
      journal[editIndex] = entryObj;
      editMode = false;
      editIndex = -1;
    }

    rebuildLedgerFromJournal();
    persist();
    resetEntryForm();
    renderAll();
    alert("Saved successfully!");
    showPage(1);
  }

  window.addEntry = addOrUpdateEntry;

  // ------------------------------
  // DELETE ENTRY
  // ------------------------------
  function deleteEntry(index) {
    if (index < 0 || index >= journal.length) return;
    var ok = confirm("Delete this entry? Ledger will update automatically.");
    if (!ok) return;

    var deleted = journal.splice(index, 1)[0];
    undoStack.push({ type: "delete", index: index, entry: deleted });

    rebuildLedgerFromJournal();
    persist();
    renderAll();
  }

  // ------------------------------
  // UNDO
  // ------------------------------
  function undoLast() {
    if (!undoStack.length) {
      alert("Nothing to undo.");
      return;
    }

    var last = undoStack.pop();

    if (last.type === "add") {
      if (journal[last.index]) journal.splice(last.index, 1);
    } else if (last.type === "delete") {
      journal.splice(last.index, 0, last.entry);
    } else if (last.type === "edit") {
      journal[last.index] = last.before;
    } else if (last.type === "clear") {
      journal = last.beforeJournal || [];
      undoStack = last.beforeUndo || [];
    }

    rebuildLedgerFromJournal();
    persist();
    renderAll();
    alert("Undo successful!");
  }

  window.undoLast = undoLast;

  // ------------------------------
  // CLEAR ALL
  // ------------------------------
  function clearAllData() {
    var ok = confirm("Clear ALL data? (Exhibition reset)");
    if (!ok) return;

    undoStack.push({
      type: "clear",
      beforeJournal: journal.slice(),
      beforeUndo: undoStack.slice()
    });

    journal = [];
    ledger = {};
    persist();
    renderAll();
    resetEntryForm();
    alert("All data cleared.");
  }
  window.clearAllData = clearAllData;

  // ------------------------------
  // IMPORT / EXPORT
  // ------------------------------
  function exportJournal() {
    var payload = {
      app: "CLOUD COUNT",
      version: "1.0",
      exportedAt: new Date().toISOString(),
      journal: journal
    };

    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = "cloud-count-journal.json";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function importJournalFile(file) {
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var txt = String(reader.result || "");
      var parsed = safeJSONParse(txt, null);

      if (!parsed) {
        alert("Invalid file. Please import a valid JSON file.");
        return;
      }

      var incoming = null;

      if (Array.isArray(parsed)) incoming = parsed;
      else if (parsed && Array.isArray(parsed.journal)) incoming = parsed.journal;

      if (!incoming) {
        alert("Invalid format. File must contain journal array.");
        return;
      }

      // validate structure lightly
      var cleaned = [];
      for (var i = 0; i < incoming.length; i++) {
        var e = incoming[i];
        if (!e || !e.debits || !e.credits) continue;

        var deb = [];
        var cre = [];

        for (var d = 0; d < e.debits.length; d++) {
          var dr = e.debits[d];
          var acc = normalizeAccountName(dr.acc);
          var amt = Number(dr.amt) || 0;
          if (acc && amt > 0) deb.push({ acc: acc, amt: Math.round(amt) });
        }

        for (var c = 0; c < e.credits.length; c++) {
          var cr = e.credits[c];
          var acc2 = normalizeAccountName(cr.acc);
          var amt2 = Number(cr.amt) || 0;
          if (acc2 && amt2 > 0) cre.push({ acc: acc2, amt: Math.round(amt2) });
        }

        if (!deb.length || !cre.length) continue;

        cleaned.push({
          date: e.date || todayISO(),
          narration: e.narration || "-",
          debits: deb,
          credits: cre
        });
      }

      var mode = confirm("Import Mode:\n\nOK = MERGE with existing\nCancel = REPLACE existing");
      if (mode) {
        // merge
        undoStack.push({ type: "importMerge", before: journal.slice() });
        journal = journal.concat(cleaned);
      } else {
        // replace
        undoStack.push({ type: "importReplace", before: journal.slice() });
        journal = cleaned;
      }

      rebuildLedgerFromJournal();
      persist();
      renderAll();
      alert("Import successful! Entries loaded: " + cleaned.length);
    };

    reader.readAsText(file);
  }

  // ------------------------------
  // SEARCH
  // ------------------------------
  function setJournalSearch(q) {
    journalSearchQuery = String(q || "").trim().toLowerCase();
    renderJournal();
  }

  function setLedgerSearch(q) {
    ledgerSearchQuery = String(q || "").trim().toLowerCase();
    renderLedger();
  }

  // ------------------------------
  // UI CONTROLS (injected)
  // ------------------------------
  function ensureControls() {
    // JOURNAL SEARCH + IMPORT/EXPORT
    var journalOut = document.getElementById("journalOutput");
    if (journalOut && !document.getElementById("journalToolsBar")) {
      var bar = document.createElement("div");
      bar.id = "journalToolsBar";
      bar.style.cssText = "display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0;";

      bar.innerHTML =
        '<input id="journalSearchBox" type="text" placeholder="Search Journal (account/date/amount)" style="padding:10px; flex:1; min-width:220px;">' +
        '<button type="button" class="btn" id="exportBtn">Export Journal</button>' +
        '<button type="button" class="btn btn-add" id="importBtn">Import Journal</button>' +
        '<input id="importFile" type="file" accept=".json,application/json" style="display:none;">';

      journalOut.parentNode.insertBefore(bar, journalOut);

      $("#journalSearchBox").addEventListener("input", function () {
        setJournalSearch(this.value);
      });

      $("#exportBtn").addEventListener("click", exportJournal);

      $("#importBtn").addEventListener("click", function () {
        $("#importFile").click();
      });

      $("#importFile").addEventListener("change", function () {
        if (this.files && this.files[0]) importJournalFile(this.files[0]);
        this.value = "";
      });
    }

    // LEDGER SEARCH
    var ledgerOut = document.getElementById("ledgerOutput");
    if (ledgerOut && !document.getElementById("ledgerToolsBar")) {
      var bar2 = document.createElement("div");
      bar2.id = "ledgerToolsBar";
      bar2.style.cssText = "display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0;";

      bar2.innerHTML =
        '<input id="ledgerSearchBox" type="text" placeholder="Search Account (Ledger)" style="padding:10px; flex:1; min-width:220px;">';

      ledgerOut.parentNode.insertBefore(bar2, ledgerOut);

      $("#ledgerSearchBox").addEventListener("input", function () {
        setLedgerSearch(this.value);
      });
    }
  }

  // ------------------------------
  // RENDER JOURNAL
  // ------------------------------
  function entryMatchesSearch(entry, q) {
    if (!q) return true;

    var date = String(entry.date || "").toLowerCase();
    var narration = String(entry.narration || "").toLowerCase();

    if (date.indexOf(q) !== -1) return true;
    if (narration.indexOf(q) !== -1) return true;

    // search accounts + amount
    for (var i = 0; i < entry.debits.length; i++) {
      var d = entry.debits[i];
      if (String(d.acc || "").toLowerCase().indexOf(q) !== -1) return true;
      if (paiseToStr(d.amt).indexOf(q) !== -1) return true;
    }
    for (var j = 0; j < entry.credits.length; j++) {
      var c = entry.credits[j];
      if (String(c.acc || "").toLowerCase().indexOf(q) !== -1) return true;
      if (paiseToStr(c.amt).indexOf(q) !== -1) return true;
    }

    return false;
  }

  function renderJournal() {
    var out = document.getElementById("journalOutput");
    if (!out) return;

    if (!journal.length) {
      out.innerHTML = "<p style='opacity:0.8'>No entries yet.</p>";
      return;
    }

    var html = "";
    for (var idx = 0; idx < journal.length; idx++) {
      var e = journal[idx];
      if (!entryMatchesSearch(e, journalSearchQuery)) continue;

      var debitLines = e.debits.map(function (d) {
        return "<div>" + escapeHtml(d.acc) + " Dr. " + paiseToStr(d.amt) + "</div>";
      }).join("");

      var creditLines = e.credits.map(function (c) {
        return "<div>To " + escapeHtml(c.acc) + " " + paiseToStr(c.amt) + "</div>";
      }).join("");

      html +=
        "<div class='entry-card'>" +
          "<div style='display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;'>" +
            "<div><b>Entry " + (idx + 1) + "</b> | " + escapeHtml(e.date) + "</div>" +
            "<div style='display:flex; gap:8px; flex-wrap:wrap;'>" +
              "<button type='button' class='btn btn-warning' onclick='window.__editEntry(" + idx + ")'>Edit</button>" +
              "<button type='button' class='btn btn-danger' onclick='window.__deleteEntry(" + idx + ")'>Delete</button>" +
            "</div>" +
          "</div>" +
          "<div style='margin-top:6px'>" + debitLines + "</div>" +
          "<div style='margin-top:6px'>" + creditLines + "</div>" +
          "<div style='margin-top:6px'><i>Narration:</i> " + escapeHtml(e.narration) + "</div>" +
        "</div>";
    }

    out.innerHTML = html || "<p style='opacity:0.8'>No matching entries found.</p>";
  }

  // expose edit/delete to inline onclick
  window.__editEntry = function (i) { loadEntryIntoForm(i); };
  window.__deleteEntry = function (i) { deleteEntry(i); };

  // ------------------------------
  // RENDER LEDGER
  // ------------------------------
  function renderLedger() {
    var out = document.getElementById("ledgerOutput");
    if (!out) return;

    var accNames = Object.keys(ledger).sort();
    if (!accNames.length) {
      out.innerHTML = "<p style='opacity:0.8'>Ledger is empty.</p>";
      return;
    }

    var q = ledgerSearchQuery;
    if (q) {
      accNames = accNames.filter(function (a) {
        return String(a || "").toLowerCase().indexOf(q) !== -1;
      });
    }

    if (!accNames.length) {
      out.innerHTML = "<p style='opacity:0.8'>No matching accounts found.</p>";
      return;
    }

    var html = "";
    for (var i = 0; i < accNames.length; i++) {
      var acc = accNames[i];
      var rows = ledger[acc] || [];
      var debitTotal = 0, creditTotal = 0;

      var rowHtml = rows.map(function (r) {
        debitTotal += r.debit || 0;
        creditTotal += r.credit || 0;
        return (
          "<tr>" +
            "<td>" + escapeHtml(r.date) + "</td>" +
            "<td>" + escapeHtml(r.particulars) + "</td>" +
            "<td>" + escapeHtml(r.jf || "-") + "</td>" +
            "<td style='text-align:right'>" + (r.debit ? paiseToStr(r.debit) : "") + "</td>" +
            "<td style='text-align:right'>" + (r.credit ? paiseToStr(r.credit) : "") + "</td>" +
          "</tr>"
        );
      }).join("");

      html +=
        "<div class='ledger-card'>" +
          "<h3>" + escapeHtml(acc) + "</h3>" +
          "<div style='overflow:auto'>" +
          "<table class='ledger-table'>" +
            "<thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead>" +
            "<tbody>" + rowHtml + "</tbody>" +
            "<tfoot>" +
              "<tr>" +
                "<td colspan='3'><b>Total</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(debitTotal) + "</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(creditTotal) + "</b></td>" +
              "</tr>" +
            "</tfoot>" +
          "</table>" +
          "</div>" +
        "</div>";
    }

    out.innerHTML = html;
  }

  function renderAll() {
    ensureControls();
    renderJournal();
    renderLedger();
  }
  window.renderAll = renderAll;

  // ------------------------------
  // INIT
  // ------------------------------
  function init() {
    restore();
    rebuildLedgerFromJournal();

    // ensure at least one row
    if (!document.querySelector(".debit-row")) addDebit();
    if (!document.querySelector(".credit-row")) addCredit();

    autoFillParticularsInForm();
    renderAll();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
