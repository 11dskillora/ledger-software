<script>
/* ==========================================================
   COMPOUND JOURNAL → AUTO LEDGER (DUAL MODE DISPLAY)
   Stabilized + Bugfixed + Exhibition Ready
   - No UI change
   - No meaning change
   - Better validation, undo, storage safety
   - Added: Import journal file
   - Added: Search account / search entry
   - Added: Edit entry after saving (ledger safe rebuild)
   ========================================================== */

(function () {
  "use strict";

  /* ----------------------------------------------------------
     COMPATIBILITY HELPERS (avoid crashes)
  ---------------------------------------------------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function getEl(id) { return document.getElementById(id); }
  function valOf(id) { var el = getEl(id); return el ? (el.value || "") : ""; }

  function safeSetHTML(id, html) { var el = getEl(id); if (el) el.innerHTML = html; }
  function safeSetValue(id, v) { var el = getEl(id); if (el) el.value = v; }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = String(text == null ? "" : text);
    return div.innerHTML;
  }

  // Always store money in paise to avoid float errors
  function toPaise(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return 0;
    return Math.round(n * 100);
  }
  function paiseToStr(p) {
    p = Number(p) || 0;
    return (p / 100).toFixed(2);
  }

  function normalizeAccountName(name) {
    var n = String(name || "").trim();
    if (!n) return "";
    n = n.replace(/\s+/g, " ");
    if (!/a\/c$/i.test(n)) n = n + " A/c";
    n = n.replace(/A\/c\s*A\/c$/i, "A/c");
    n = n.charAt(0).toUpperCase() + n.slice(1);
    return n;
  }

  function safeJSONParse(str, fallback) {
    try {
      var obj = JSON.parse(str);
      return obj == null ? fallback : obj;
    } catch (e) {
      return fallback;
    }
  }

  function deepClone(obj) {
    return safeJSONParse(JSON.stringify(obj), obj);
  }

  /* ----------------------------------------------------------
     GLOBAL STATE (same meaning)
  ---------------------------------------------------------- */
  var journal = [];
  var ledger = {};
  var undoStack = [];

  // edit state
  var editMode = false;
  var editIndex = -1;

  // Storage keys
  var LS_JOURNAL = "journalData";
  var LS_UNDO = "undoStack";

  function persist() {
    try { localStorage.setItem(LS_JOURNAL, JSON.stringify(journal)); } catch (e) {}
    try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack)); } catch (e2) {}
  }

  function restore() {
    var j = safeJSONParse(localStorage.getItem(LS_JOURNAL), []);
    var u = safeJSONParse(localStorage.getItem(LS_UNDO), []);
    if (!Array.isArray(j)) j = [];
    if (!Array.isArray(u)) u = [];
    journal = j;
    undoStack = u;
  }

  /* ----------------------------------------------------------
     PAGE NAV (UI unchanged)
  ---------------------------------------------------------- */
  function showPage(pageIndex) {
    var pages = $all(".page");
    var navBtns = $all("nav button");
    if (pageIndex < 0 || pageIndex >= pages.length) return;

    pages.forEach(function (p) { p.classList.remove("active"); });
    navBtns.forEach(function (b) { b.classList.remove("active"); });

    pages[pageIndex].classList.add("active");
    navBtns[pageIndex].classList.add("active");
  }
  window.showPage = showPage;

  /* ----------------------------------------------------------
     FORM ROWS
  ---------------------------------------------------------- */
  function addDebit() {
    var container = getEl("debitContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row debit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Debit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Debit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Debit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  function addCredit() {
    var container = getEl("creditContainer");
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row credit-row";
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text" aria-label="Credit Account Name">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Credit Amount">' +
      '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Credit Particulars">';
    container.appendChild(row);

    var p = $(".particulars-input", row);
    if (p) { p.readOnly = true; p.value = ""; }

    autoFillParticularsInForm();
  }

  window.addDebit = addDebit;
  window.addCredit = addCredit;

  function getRowsData(selector) {
    var rows = $all(selector);
    return rows.map(function (row) {
      var accEl = $(".account-input", row);
      var amtEl = $(".amount-input", row);

      var acc = normalizeAccountName(accEl ? accEl.value : "");
      var amt = toPaise(amtEl ? amtEl.value : "");
      return { acc: acc, amt: amt, row: row };
    });
  }

  function autoFillParticularsInForm() {
    var debits = getRowsData(".debit-row");
    var credits = getRowsData(".credit-row");

    var debitAccounts = debits.map(function (d) { return d.acc; }).filter(Boolean);
    var creditAccounts = credits.map(function (c) { return c.acc; }).filter(Boolean);

    var debitParticularText = debitAccounts.length ? ("By " + debitAccounts.join(", ")) : "";
    var creditParticularText = creditAccounts.length ? ("To " + creditAccounts.join(", ")) : "";

    debits.forEach(function (d) {
      var p = $(".particulars-input", d.row);
      if (p) { p.readOnly = true; p.value = creditParticularText; }
    });

    credits.forEach(function (c) {
      var p = $(".particulars-input", c.row);
      if (p) { p.readOnly = true; p.value = debitParticularText; }
    });
  }
  window.autoFillParticularsInForm = autoFillParticularsInForm;

  document.addEventListener("input", function (e) {
    if (!e || !e.target) return;
    if (e.target.classList && (e.target.classList.contains("account-input") || e.target.classList.contains("amount-input"))) {
      autoFillParticularsInForm();
    }
  });

  /* ----------------------------------------------------------
     VALIDATION
  ---------------------------------------------------------- */
  function validateEntry(debits, credits) {
    var errors = [];

    if (!debits.length) errors.push("Add at least 1 debit line.");
    if (!credits.length) errors.push("Add at least 1 credit line.");

    debits.forEach(function (d, idx) {
      if (!d.acc) errors.push("Debit row " + (idx + 1) + ": Account name is required.");
      if (d.amt <= 0) errors.push("Debit row " + (idx + 1) + ": Amount must be > 0.");
    });

    credits.forEach(function (c, idx) {
      if (!c.acc) errors.push("Credit row " + (idx + 1) + ": Account name is required.");
      if (c.amt <= 0) errors.push("Credit row " + (idx + 1) + ": Amount must be > 0.");
    });

    var debitTotal = debits.reduce(function (s, d) { return s + d.amt; }, 0);
    var creditTotal = credits.reduce(function (s, c) { return s + c.amt; }, 0);

    if (debitTotal !== creditTotal) {
      errors.push("Debit total (" + paiseToStr(debitTotal) + ") must equal Credit total (" + paiseToStr(creditTotal) + ").");
    }

    return { ok: errors.length === 0, errors: errors, debitTotal: debitTotal, creditTotal: creditTotal };
  }

  /* ----------------------------------------------------------
     LEDGER UPDATE
  ---------------------------------------------------------- */
  function ensureLedgerAcc(name) {
    if (!ledger[name]) ledger[name] = [];
  }

  function postToLedger(entry) {
    var jf = entry.jf || "-";

    entry.debits.forEach(function (d) {
      ensureLedgerAcc(d.acc);
      ledger[d.acc].push({
        date: entry.date,
        particulars: "To " + entry.credits.map(function (c) { return c.acc; }).join(", "),
        debit: d.amt,
        credit: 0,
        jf: jf
      });
    });

    entry.credits.forEach(function (c) {
      ensureLedgerAcc(c.acc);
      ledger[c.acc].push({
        date: entry.date,
        particulars: "By " + entry.debits.map(function (d) { return d.acc; }).join(", "),
        debit: 0,
        credit: c.amt,
        jf: jf
      });
    });
  }

  function rebuildLedgerFromJournal() {
    ledger = {};
    journal.forEach(postToLedger);
  }

  /* ----------------------------------------------------------
     FORM RESET
  ---------------------------------------------------------- */
  function resetEntryForm() {
    var debitC = getEl("debitContainer");
    var creditC = getEl("creditContainer");
    if (!debitC || !creditC) return;

    debitC.innerHTML = "";
    creditC.innerHTML = "";

    addDebit();
    addCredit();

    safeSetValue("narrationInput", "");
    safeSetValue("dateInput", "");

    editMode = false;
    editIndex = -1;

    autoFillParticularsInForm();
  }
  window.resetEntryForm = resetEntryForm;

  /* ----------------------------------------------------------
     ADD / SAVE ENTRY (journal → ledger)
     + EDIT MODE SUPPORT
  ---------------------------------------------------------- */
  function buildEntryFromForm() {
    var date = (valOf("dateInput") || "").trim();
    var narration = (valOf("narrationInput") || "").trim();

    var debits = getRowsData(".debit-row").filter(function (d) { return d.acc || d.amt; });
    var credits = getRowsData(".credit-row").filter(function (c) { return c.acc || c.amt; });

    var v = validateEntry(debits, credits);
    if (!v.ok) {
      alert("Fix these errors:\n\n" + v.errors.map(function (e) { return "• " + e; }).join("\n"));
      return null;
    }

    return {
      date: date || new Date().toISOString().slice(0, 10),
      narration: narration || "-",
      debits: debits.map(function (d) { return { acc: d.acc, amt: d.amt }; }),
      credits: credits.map(function (c) { return { acc: c.acc, amt: c.amt }; }),
      jf: "-"
    };
  }

  function addEntry() {
    var entry = buildEntryFromForm();
    if (!entry) return;

    // EDIT MODE: update existing entry without breaking ledger
    if (editMode && editIndex >= 0 && editIndex < journal.length) {
      undoStack.push({
        type: "edit",
        index: editIndex,
        before: deepClone(journal[editIndex]),
        after: deepClone(entry)
      });

      journal[editIndex] = entry;
      rebuildLedgerFromJournal();
      persist();
      resetEntryForm();
      renderAll();
      return;
    }

    // Normal ADD
    undoStack.push({ type: "add", index: journal.length, entry: entry });
    journal.push(entry);

    rebuildLedgerFromJournal();
    persist();

    resetEntryForm();
    renderAll();
  }
  window.addEntry = addEntry;

  /* ----------------------------------------------------------
     UNDO (supports add + edit)
  ---------------------------------------------------------- */
  function undoLast() {
    if (!undoStack.length) {
      alert("Nothing to undo.");
      return;
    }

    var last = undoStack.pop();

    if (last.type === "add") {
      if (journal[last.index] && journal[last.index] === last.entry) {
        journal.splice(last.index, 1);
      } else {
        var idx = journal.lastIndexOf(last.entry);
        if (idx >= 0) journal.splice(idx, 1);
      }
    }

    if (last.type === "edit") {
      if (typeof last.index === "number" && last.index >= 0 && last.index < journal.length) {
        journal[last.index] = last.before;
      }
    }

    rebuildLedgerFromJournal();
    persist();
    renderAll();
  }
  window.undoLast = undoLast;

  /* ----------------------------------------------------------
     EDIT ENTRY AFTER SAVING (UI unchanged)
     You can call this from a button: editEntry(index)
  ---------------------------------------------------------- */
  function clearContainer(containerId) {
    var c = getEl(containerId);
    if (c) c.innerHTML = "";
  }

  function createRow(containerId, type, acc, amt) {
    var container = getEl(containerId);
    if (!container) return;

    var row = document.createElement("div");
    row.className = "entry-row " + (type === "debit" ? "debit-row" : "credit-row");
    row.innerHTML =
      '<input placeholder="Account Name" class="account-input" type="text">' +
      '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input">' +
      '<input placeholder="Particulars" class="particulars-input" type="text">';
    container.appendChild(row);

    var accEl = $(".account-input", row);
    var amtEl = $(".amount-input", row);
    var pEl = $(".particulars-input", row);

    if (accEl) accEl.value = acc || "";
    if (amtEl) amtEl.value = (amt ? paiseToStr(amt) : "");
    if (pEl) { pEl.readOnly = true; pEl.value = ""; }
  }

  function editEntry(index) {
    index = Number(index);
    if (!isFinite(index) || index < 0 || index >= journal.length) {
      alert("Invalid entry index.");
      return;
    }

    var e = journal[index];

    // Fill top fields
    safeSetValue("dateInput", e.date || "");
    safeSetValue("narrationInput", e.narration || "");

    // Fill rows
    clearContainer("debitContainer");
    clearContainer("creditContainer");

    (e.debits || []).forEach(function (d) {
      createRow("debitContainer", "debit", d.acc, d.amt);
    });

    (e.credits || []).forEach(function (c) {
      createRow("creditContainer", "credit", c.acc, c.amt);
    });

    // If empty somehow, ensure at least 1 row each
    if (!$(".debit-row")) addDebit();
    if (!$(".credit-row")) addCredit();

    editMode = true;
    editIndex = index;

    autoFillParticularsInForm();
    showPage(0); // go to journal entry page (safe)
  }
  window.editEntry = editEntry;

  /* ----------------------------------------------------------
     SEARCH (account / entry)
     - account search filters ledger cards
     - entry search filters journal entries
  ---------------------------------------------------------- */
  function searchAccount(query) {
    query = String(query || "").trim().toLowerCase();
    if (!query) { renderLedger(); return; }

    var out = getEl("ledgerOutput");
    if (!out) return;

    var accNames = Object.keys(ledger).sort().filter(function (acc) {
      return acc.toLowerCase().indexOf(query) !== -1;
    });

    if (!accNames.length) {
      out.innerHTML = "<p style='opacity:0.8'>No matching accounts found.</p>";
      return;
    }

    var html = "";
    accNames.forEach(function (acc) {
      var rows = ledger[acc] || [];
      var debitTotal = 0, creditTotal = 0;

      var rowHtml = rows.map(function (r) {
        debitTotal += r.debit || 0;
        creditTotal += r.credit || 0;
        return (
          "<tr>" +
            "<td>" + escapeHtml(r.date) + "</td>" +
            "<td>" + escapeHtml(r.particulars) + "</td>" +
            "<td>" + escapeHtml(r.jf || "-") + "</td>" +
            "<td style='text-align:right'>" + (r.debit ? paiseToStr(r.debit) : "") + "</td>" +
            "<td style='text-align:right'>" + (r.credit ? paiseToStr(r.credit) : "") + "</td>" +
          "</tr>"
        );
      }).join("");

      html +=
        "<div class='ledger-card'>" +
          "<h3>" + escapeHtml(acc) + "</h3>" +
          "<div style='overflow:auto'>" +
          "<table class='ledger-table'>" +
            "<thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead>" +
            "<tbody>" + rowHtml + "</tbody>" +
            "<tfoot>" +
              "<tr>" +
                "<td colspan='3'><b>Total</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(debitTotal) + "</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(creditTotal) + "</b></td>" +
              "</tr>" +
            "</tfoot>" +
          "</table>" +
          "</div>" +
        "</div>";
    });

    out.innerHTML = html;
  }
  window.searchAccount = searchAccount;

  function searchEntry(query) {
    query = String(query || "").trim().toLowerCase();
    if (!query) { renderJournal(); return; }

    var out = getEl("journalOutput");
    if (!out) return;

    var matches = journal.map(function (e, idx) { return { e: e, idx: idx }; }).filter(function (x) {
      var e = x.e;
      var text =
        (e.date || "") + " " +
        (e.narration || "") + " " +
        (e.debits || []).map(function (d) { return d.acc; }).join(" ") + " " +
        (e.credits || []).map(function (c) { return c.acc; }).join(" ");
      return text.toLowerCase().indexOf(query) !== -1;
    });

    if (!matches.length) {
      out.innerHTML = "<p style='opacity:0.8'>No matching entries found.</p>";
      return;
    }

    var html = "";
    matches.forEach(function (x) {
      var e = x.e, idx = x.idx;
      var debitLines = e.debits.map(function (d) { return "<div>" + escapeHtml(d.acc) + " Dr. " + paiseToStr(d.amt) + "</div>"; }).join("");
      var creditLines = e.credits.map(function (c) { return "<div>To " + escapeHtml(c.acc) + " " + paiseToStr(c.amt) + "</div>"; }).join("");

      html +=
        "<div class='entry-card'>" +
          "<div><b>Entry " + (idx + 1) + "</b> | " + escapeHtml(e.date) + "</div>" +
          "<div style='margin-top:6px'>" + debitLines + "</div>" +
          "<div style='margin-top:6px'>" + creditLines + "</div>" +
          "<div style='margin-top:6px'><i>Narration:</i> " + escapeHtml(e.narration) + "</div>" +
          "<div style='margin-top:8px'>" +
            "<button onclick='editEntry(" + idx + ")'>Edit</button>" +
          "</div>" +
        "</div>";
    });

    out.innerHTML = html;
  }
  window.searchEntry = searchEntry;

  /* ----------------------------------------------------------
     IMPORT / EXPORT JOURNAL FILE (JSON)
  ---------------------------------------------------------- */
  function exportJournalFile() {
    var data = {
      app: "Compound Journal Auto Ledger",
      version: "1.0",
      exportedAt: new Date().toISOString(),
      journal: journal
    };

    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = "journal_backup.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  window.exportJournalFile = exportJournalFile;

  function importJournalFile(file) {
    if (!file) {
      alert("No file selected.");
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      var parsed = safeJSONParse(reader.result, null);
      if (!parsed) {
        alert("Invalid file.");
        return;
      }

      // accept either {journal:[...]} or direct array
      var incoming = Array.isArray(parsed) ? parsed : parsed.journal;

      if (!Array.isArray(incoming)) {
        alert("File format not supported.");
        return;
      }

      // basic validation
      var cleaned = incoming.filter(function (e) {
        return e && typeof e === "object" && Array.isArray(e.debits) && Array.isArray(e.credits);
      });

      undoStack.push({ type: "import", before: deepClone(journal), after: deepClone(cleaned) });

      journal = cleaned;
      rebuildLedgerFromJournal();
      persist();
      renderAll();

      alert("Journal imported successfully. Entries loaded: " + journal.length);
    };

    reader.readAsText(file);
  }
  window.importJournalFile = importJournalFile;

  /* ----------------------------------------------------------
     RENDERING (UI unchanged)
  ---------------------------------------------------------- */
  function renderJournal() {
    var out = getEl("journalOutput");
    if (!out) return;

    if (!journal.length) {
      out.innerHTML = "<p style='opacity:0.8'>No entries yet.</p>";
      return;
    }

    var html = "";
    journal.forEach(function (e, idx) {
      var debitLines = e.debits.map(function (d) { return "<div>" + escapeHtml(d.acc) + " Dr. " + paiseToStr(d.amt) + "</div>"; }).join("");
      var creditLines = e.credits.map(function (c) { return "<div>To " + escapeHtml(c.acc) + " " + paiseToStr(c.amt) + "</div>"; }).join("");

      html +=
        "<div class='entry-card'>" +
          "<div><b>Entry " + (idx + 1) + "</b> | " + escapeHtml(e.date) + "</div>" +
          "<div style='margin-top:6px'>" + debitLines + "</div>" +
          "<div style='margin-top:6px'>" + creditLines + "</div>" +
          "<div style='margin-top:6px'><i>Narration:</i> " + escapeHtml(e.narration) + "</div>" +
          "<div style='margin-top:8px'>" +
            "<button onclick='editEntry(" + idx + ")'>Edit</button>" +
          "</div>" +
        "</div>";
    });

    out.innerHTML = html;
  }

  function renderLedger() {
    var out = getEl("ledgerOutput");
    if (!out) return;

    var accNames = Object.keys(ledger).sort();
    if (!accNames.length) {
      out.innerHTML = "<p style='opacity:0.8'>Ledger is empty.</p>";
      return;
    }

    var html = "";
    accNames.forEach(function (acc) {
      var rows = ledger[acc] || [];
      var debitTotal = 0, creditTotal = 0;

      var rowHtml = rows.map(function (r) {
        debitTotal += r.debit || 0;
        creditTotal += r.credit || 0;
        return (
          "<tr>" +
            "<td>" + escapeHtml(r.date) + "</td>" +
            "<td>" + escapeHtml(r.particulars) + "</td>" +
            "<td>" + escapeHtml(r.jf || "-") + "</td>" +
            "<td style='text-align:right'>" + (r.debit ? paiseToStr(r.debit) : "") + "</td>" +
            "<td style='text-align:right'>" + (r.credit ? paiseToStr(r.credit) : "") + "</td>" +
          "</tr>"
        );
      }).join("");

      html +=
        "<div class='ledger-card'>" +
          "<h3>" + escapeHtml(acc) + "</h3>" +
          "<div style='overflow:auto'>" +
          "<table class='ledger-table'>" +
            "<thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead>" +
            "<tbody>" + rowHtml + "</tbody>" +
            "<tfoot>" +
              "<tr>" +
                "<td colspan='3'><b>Total</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(debitTotal) + "</b></td>" +
                "<td style='text-align:right'><b>" + paiseToStr(creditTotal) + "</b></td>" +
              "</tr>" +
            "</tfoot>" +
          "</table>" +
          "</div>" +
        "</div>";
    });

    out.innerHTML = html;
  }

  function renderAll() {
    renderJournal();
    renderLedger();
  }
  window.renderAll = renderAll;

  /* ----------------------------------------------------------
     AUTO BIND IMPORT INPUT IF EXISTS
     (No UI change: if you already have input id, it works)
  ---------------------------------------------------------- */
  function bindImportInput() {
    // If your HTML already has: <input type="file" id="importFileInput">
    var inp = getEl("importFileInput");
    if (!inp) return;

    inp.addEventListener("change", function () {
      if (inp.files && inp.files[0]) importJournalFile(inp.files[0]);
      inp.value = "";
    });
  }

  /* ----------------------------------------------------------
     INIT
  ---------------------------------------------------------- */
  function init() {
    restore();
    rebuildLedgerFromJournal();

    // ensure at least one row
    if (!document.querySelector(".debit-row")) addDebit();
    if (!document.querySelector(".credit-row")) addCredit();

    autoFillParticularsInForm();
    bindImportInput();
    renderAll();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
