<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Ledger Software</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

*{
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    margin:0;
    padding:25px;
    min-height:100vh;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
    from{background-position:0%}
    to{background-position:100%}
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#2c3e50;
    text-shadow:1px 1px 4px rgba(0,0,0,0.2);
}

/* ---------- MENU ---------- */
.menu{
    text-align:center;
    margin-bottom:20px;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#34495e,#2c3e50);
    color:white;
    cursor:pointer;
    font-size:14px;
    transition:0.3s;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* ---------- CARD ---------- */
.card{
    max-width:900px;
    margin:25px auto;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(12px);
    padding:25px;
    border-radius:18px;
    box-shadow:0 20px 35px rgba(0,0,0,0.25);
    animation:fadeUp 0.6s ease;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

/* ---------- INPUTS ---------- */
input{
    padding:10px;
    width:100%;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#3498db;
    box-shadow:0 0 8px rgba(52,152,219,0.4);
}

/* ---------- ROWS ---------- */
.row{
    display:flex;
    gap:12px;
    margin-top:8px;
}

/* ---------- TABLE ---------- */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    overflow:hidden;
    border-radius:12px;
}

th,td{
    padding:10px;
    text-align:center;
}

th{
    background:linear-gradient(135deg,#34495e,#2c3e50);
    color:white;
}

tr:nth-child(even){
    background:#f4f6f7;
}

tr:hover{
    background:#eaf2f8;
}

/* ---------- HEADINGS ---------- */
h3{
    margin-bottom:15px;
    color:#2c3e50;
    border-left:6px solid #3498db;
    padding-left:10px;
}

h4{
    margin-top:20px;
    color:#2c3e50;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:600px){
    .row{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<h1>📘 Smart Ledger Software</h1>

<div class="menu">
    <button onclick="addEntryUI()">➕ Add Journal Entry</button>
    <button onclick="viewJournal()">📘 Compound Journal</button>
    <button onclick="viewLedger()">📂 Ledger</button>
</div>

<div id="content"></div>

<script>
/* ================= DATA ================= */
let journal = [];
let ledger = {};

/* ================= ADD ENTRY UI ================= */
function addEntryUI(){
document.getElementById("content").innerHTML=`
<div class="card">
<h3>Compound Journal Entry</h3>

<label>Date</label>
<input type="date" id="date">

<h4>Debit Accounts</h4>
<div id="debits"></div>
<button onclick="addRow('debits')">+ Add Debit</button>

<h4>Credit Accounts</h4>
<div id="credits"></div>
<button onclick="addRow('credits')">+ Add Credit</button>

<label>Narration</label>
<input id="narr" placeholder="Being ...">

<br><br>
<button onclick="saveEntry()">💾 Save Entry</button>
</div>`;
addRow("debits");
addRow("credits");
}

function addRow(id){
document.getElementById(id).insertAdjacentHTML("beforeend",`
<div class="row">
<input placeholder="Account Name">
<input type="number" placeholder="Amount">
</div>`);
}

/* ================= SAVE ENTRY ================= */
function saveEntry(){
let date=document.getElementById("date").value;
let narr=document.getElementById("narr").value;

let dr=[],cr=[],drT=0,crT=0;

document.querySelectorAll("#debits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){dr.push({a,m});drT+=m;}
});

document.querySelectorAll("#credits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){cr.push({a,m});crT+=m;}
});

if(drT!==crT || drT===0){
alert("❌ Debit & Credit totals must match");
return;
}

/* STORE JOURNAL */
journal.push({date,dr,cr,narr});

/* POST TO LEDGER */
dr.forEach(d=>{
if(!ledger[d.a]) ledger[d.a]=[];
ledger[d.a].push({date,p:"To "+cr.map(x=>x.a).join(", "),dr:d.m,cr:""});
});

cr.forEach(c=>{
if(!ledger[c.a]) ledger[c.a]=[];
ledger[c.a].push({date,p:"By "+dr.map(x=>x.a).join(", "),dr:"",cr:c.m});
});

alert("✅ Compound Journal Entry Saved");
}

/* ================= VIEW JOURNAL ================= */
function viewJournal(){
if(journal.length===0){
document.getElementById("content").innerHTML=
"<div class='card'>📘 No Journal Entries Found</div>";
return;
}

let h="<div class='card'><h3>Compound Journal Book</h3>";

journal.forEach(j=>{
h+=`
<table>
<tr><th>Date</th><th>Particulars</th><th>Dr (₹)</th><th>Cr (₹)</th></tr>`;

j.dr.forEach(d=>{
h+=`
<tr>
<td>${j.date}</td>
<td>${d.a} A/c</td>
<td>${d.m}</td>
<td></td>
</tr>`;
});

j.cr.forEach(c=>{
h+=`
<tr>
<td></td>
<td style="padding-left:25px;">To ${c.a} A/c</td>
<td></td>
<td>${c.m}</td>
</tr>`;
});

h+=`
<tr>
<td></td>
<td colspan="3"><i>${j.narr}</i></td>
</tr>
</table><br>`;
});

h+="</div>";
document.getElementById("content").innerHTML=h;
}

/* ================= VIEW LEDGER ================= */
function viewLedger(){
let h="<div class='card'><h3>Ledger Accounts</h3>";

for(let a in ledger){
h+=`
<h4>${a}</h4>
<table>
<tr><th>Date</th><th>Particulars</th><th>Dr</th><th>Cr</th></tr>`;

ledger[a].forEach(t=>{
h+=`
<tr>
<td>${t.date}</td>
<td>${t.p}</td>
<td>${t.dr}</td>
<td>${t.cr}</td>
</tr>`;
});

h+="</table>";
}

h+="</div>";
document.getElementById("content").innerHTML=h;
}
</script>

</body>
</html>
