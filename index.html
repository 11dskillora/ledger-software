<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Journal – Apple Style</title>

<!-- Apple-like font -->
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont;
}

body{
    margin:0;
    padding:30px;
    background:#f5f5f7;
    color:#1d1d1f;
}

/* ---------- HEADER ---------- */
header{
    text-align:center;
    margin-bottom:40px;
}

header h1{
    font-size:36px;
    font-weight:600;
}

header p{
    color:#6e6e73;
}

/* ---------- CARD ---------- */
.card{
    max-width:950px;
    margin:30px auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

/* ---------- BUTTON ---------- */
button{
    padding:12px 22px;
    border:none;
    border-radius:999px;
    background:#0071e3;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.25s;
}

button:hover{
    background:#0077ed;
    transform:scale(1.03);
}

/* ---------- INPUT ---------- */
input{
    padding:12px;
    width:100%;
    border-radius:12px;
    border:1px solid #d2d2d7;
    outline:none;
    margin-top:6px;
}

input:focus{
    border-color:#0071e3;
}

/* ---------- FLEX ---------- */
.row{
    display:flex;
    gap:15px;
    margin-top:12px;
}

/* ---------- TABLE ---------- */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#f5f5f7;
    font-weight:500;
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #e5e5ea;
}

h3{
    margin-top:0;
    font-weight:500;
}

/* ---------- SMALL ---------- */
.note{
    color:#6e6e73;
    font-size:14px;
}

@media(max-width:650px){
    .row{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
    <h1>Compound Journal</h1>
    <p>Clean • Simple • Apple-style Accounting UI</p>
</header>

<div class="card">
    <h3>Add Compound Entry</h3>

    <input id="date" type="date">

    <div class="row">
        <input id="debitAcc" placeholder="Debit Accounts (comma separated)">
        <input id="debitAmt" placeholder="Debit Amounts (comma separated)">
    </div>

    <div class="row">
        <input id="creditAcc" placeholder="Credit Accounts (comma separated)">
        <input id="creditAmt" placeholder="Credit Amounts (comma separated)">
    </div>

    <div class="row">
        <input id="narration" placeholder="Narration">
        <button onclick="saveEntry()">Save Entry</button>
    </div>

    <p class="note">Example: Cash, Purchases | 5000, 3000</p>
</div>

<div class="card">
    <h3>Journal</h3>
    <table id="journalTable">
        <tr>
            <th>Date</th>
            <th>Account</th>
            <th>Debit (₹)</th>
            <th>Credit (₹)</th>
        </tr>
    </table>
</div>

<div class="card">
    <h3>Ledger</h3>
    <div id="ledger"></div>
</div>

<script>
let journal = [];
let ledger = {};

function saveEntry(){
    const date = document.getElementById("date").value;
    const dAcc = document.getElementById("debitAcc").value.split(",");
    const dAmt = document.getElementById("debitAmt").value.split(",");
    const cAcc = document.getElementById("creditAcc").value.split(",");
    const cAmt = document.getElementById("creditAmt").value.split(",");
    const narration = document.getElementById("narration").value;

    if(!date || dAcc.length!==dAmt.length || cAcc.length!==cAmt.length){
        alert("Check inputs properly");
        return;
    }

    dAcc.forEach((acc,i)=>{
        addRow(date,acc.trim(),dAmt[i],0);
        updateLedger(acc.trim(),dAmt[i],0);
    });

    cAcc.forEach((acc,i)=>{
        addRow(date,acc.trim(),0,cAmt[i]);
        updateLedger(acc.trim(),0,cAmt[i]);
    });

    journal.push({date,dAcc,dAmt,cAcc,cAmt,narration});
    renderLedger();

    document.querySelectorAll("input").forEach(i=>i.value="");
}

function addRow(date,acc,debit,credit){
    const table = document.getElementById("journalTable");
    const row = table.insertRow();
    row.innerHTML = `<td>${date}</td><td>${acc}</td><td>${debit||""}</td><td>${credit||""}</td>`;
}

function updateLedger(acc,debit,credit){
    if(!ledger[acc]){
        ledger[acc]={debit:0,credit:0};
    }
    ledger[acc].debit += Number(debit);
    ledger[acc].credit += Number(credit);
}

function renderLedger(){
    const box = document.getElementById("ledger");
    box.innerHTML="";
    for(let acc in ledger){
        box.innerHTML += `
        <p><strong>${acc}</strong> → Debit: ₹${ledger[acc].debit} | Credit: ₹${ledger[acc].credit}</p>`;
    }
}
</script>

</body>
</html>
