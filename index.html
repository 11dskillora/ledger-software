<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compound Journal → Auto Ledger</title>

  <style>
    /* ==========================================================
       BASIC UI (kept simple + stable)
       ========================================================== */
    body{
      font-family: Arial, sans-serif;
      margin:0;
      padding:0;
      background:#f5f7fb;
      color:#111;
    }
    header{
      padding:14px 16px;
      background:#111827;
      color:#fff;
      font-weight:700;
      letter-spacing:.3px;
    }
    nav{
      display:flex;
      gap:10px;
      padding:10px 12px;
      background:#0f172a;
      position:sticky;
      top:0;
      z-index:10;
    }
    nav button{
      border:0;
      padding:10px 14px;
      border-radius:10px;
      background:#1f2937;
      color:#fff;
      cursor:pointer;
      font-weight:600;
    }
    nav button.active{ background:#2563eb; }
    .page{ display:none; padding:14px 12px 60px; }
    .page.active{ display:block; }

    .card{
      background:#fff;
      border-radius:16px;
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
      padding:14px;
      margin:12px 0;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    label{ font-size:13px; font-weight:700; opacity:.85; }
    input, textarea, select{
      border:1px solid #d7dce5;
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      outline:none;
      background:#fff;
      min-width: 180px;
    }
    textarea{ min-width: 260px; }
    input:focus, textarea:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }

    .btn{
      border:0;
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:700;
    }
    .btn.primary{ background:#2563eb; color:#fff; }
    .btn.gray{ background:#e5e7eb; }
    .btn.red{ background:#ef4444; color:#fff; }
    .btn.green{ background:#10b981; color:#fff; }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media(max-width:900px){
      .grid2{ grid-template-columns:1fr; }
      input, textarea{ width:100%; min-width:unset; }
    }

    .entry-row{
      display:grid;
      grid-template-columns: 1.4fr 0.7fr 1.4fr;
      gap:10px;
      margin-top:10px;
    }
    @media(max-width:900px){
      .entry-row{ grid-template-columns:1fr; }
    }

    .subhead{
      font-weight:800;
      font-size:15px;
      margin-bottom:6px;
    }

    .entry-card{
      background:#fff;
      border:1px solid #e6e9f0;
      border-radius:16px;
      padding:12px;
      margin:10px 0;
    }

    .ledger-card{
      background:#fff;
      border:1px solid #e6e9f0;
      border-radius:16px;
      padding:12px;
      margin:12px 0;
    }

    .ledger-table{
      width:100%;
      border-collapse:collapse;
      min-width: 650px;
    }
    .ledger-table th, .ledger-table td{
      border-bottom:1px solid #edf0f6;
      padding:10px 8px;
      font-size:14px;
      vertical-align:top;
    }
    .ledger-table th{
      text-align:left;
      background:#f8fafc;
      position:sticky;
      top:0;
      z-index:1;
    }

    .muted{ opacity:.75; font-size:13px; }
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      background:#f1f5f9;
      font-size:12px;
      font-weight:700;
    }

    .hr{ height:1px; background:#edf0f6; margin:12px 0; }

    .warn{
      padding:10px 12px;
      border-radius:12px;
      background:#fff7ed;
      border:1px solid #fed7aa;
      color:#9a3412;
      font-weight:700;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <header>COMPOUND JOURNAL → AUTO LEDGER (Dual Mode)</header>

  <nav>
    <button class="active" onclick="showPage(0)">Journal Entry</button>
    <button onclick="showPage(1)">Journal View</button>
    <button onclick="showPage(2)">Ledger</button>
  </nav>

  <!-- PAGE 1 -->
  <section class="page active">
    <div class="card">
      <div class="subhead">Create Entry</div>

      <div class="row">
        <div>
          <label>Date</label><br/>
          <input id="dateInput" type="date" />
        </div>

        <div style="flex:1; min-width:260px;">
          <label>Narration</label><br/>
          <textarea id="narrationInput" rows="2" placeholder="Narration (optional)"></textarea>
        </div>
      </div>

      <div class="hr"></div>

      <div class="grid2">
        <div class="card" style="margin:0;">
          <div class="subhead">Debit</div>
          <div id="debitContainer"></div>
          <div class="row" style="margin-top:10px;">
            <button class="btn gray" onclick="addDebit()">+ Add Debit Row</button>
          </div>
        </div>

        <div class="card" style="margin:0;">
          <div class="subhead">Credit</div>
          <div id="creditContainer"></div>
          <div class="row" style="margin-top:10px;">
            <button class="btn gray" onclick="addCredit()">+ Add Credit Row</button>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary" onclick="addEntry()">Save Entry</button>
        <button class="btn gray" onclick="resetEntryForm()">Reset</button>
        <button class="btn red" onclick="undoLast()">Undo Last</button>
      </div>

      <div class="warn muted">
        Tip: Press <b>Enter</b> to move to next field / next row automatically.
      </div>
    </div>
  </section>

  <!-- PAGE 2 -->
  <section class="page">
    <div class="card">
      <div class="subhead">Journal Entries</div>

      <!-- SEARCH ENTRY / SEARCH ACCOUNT -->
      <div class="row" style="margin-top:10px;">
        <div style="flex:1; min-width:240px;">
          <label>Search entry / search account</label><br/>
          <input id="journalSearchInput" type="text" placeholder="Type date / narration / account..." />
        </div>
        <div>
          <label>Filter</label><br/>
          <select id="journalSearchMode">
            <option value="all">All</option>
            <option value="account">Account</option>
            <option value="narration">Narration</option>
            <option value="date">Date</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label><br/>
          <button class="btn gray" onclick="clearJournalSearch()">Clear</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="journalOutput"></div>
    </div>
  </section>

  <!-- PAGE 3 -->
  <section class="page">
    <div class="card">
      <div class="subhead">Ledger</div>

      <!-- SEARCH ACCOUNT -->
      <div class="row" style="margin-top:10px;">
        <div style="flex:1; min-width:240px;">
          <label>Search account</label><br/>
          <input id="ledgerSearchInput" type="text" placeholder="Type account name..." />
        </div>
        <div>
          <label>&nbsp;</label><br/>
          <button class="btn gray" onclick="clearLedgerSearch()">Clear</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="ledgerOutput"></div>
    </div>
  </section>

  <script>
  /* ==========================================================
     COMPOUND JOURNAL → AUTO LEDGER (DUAL MODE DISPLAY)
     - No white screen: guarded init + safe DOM access
     - Narration supported
     - Search entry / search account
     - Edit entry after saving (auto-updates ledger)
     ========================================================== */

  (function () {
    "use strict";

    // ------------------------------
    // GLOBAL STATE
    // ------------------------------
    var journal = [];
    var ledger = {};
    var undoStack = [];

    // Storage keys
    var LS_JOURNAL = "journalData";
    var LS_UNDO = "undoStack";

    // ------------------------------
    // HELPERS
    // ------------------------------
    function $(sel, root) { return (root || document).querySelector(sel); }
    function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    function escapeHtml(text) {
      var div = document.createElement("div");
      div.textContent = String(text == null ? "" : text);
      return div.innerHTML;
    }

    // Always store money in paise
    function toPaise(v) {
      var n = Number(v);
      if (!isFinite(n) || n <= 0) return 0;
      return Math.round(n * 100);
    }
    function paiseToStr(p) {
      p = Number(p) || 0;
      return (p / 100).toFixed(2);
    }

    function normalizeAccountName(name) {
      var n = String(name || "").trim();
      if (!n) return "";
      n = n.replace(/\s+/g, " ");
      if (!/a\/c$/i.test(n)) n = n + " A/c";
      n = n.replace(/A\/c\s*A\/c$/i, "A/c");
      n = n.charAt(0).toUpperCase() + n.slice(1);
      return n;
    }

    function safeJSONParse(str, fallback) {
      try {
        var obj = JSON.parse(str);
        return obj == null ? fallback : obj;
      } catch (e) {
        return fallback;
      }
    }

    function persist() {
      try { localStorage.setItem(LS_JOURNAL, JSON.stringify(journal)); } catch (e) {}
      try { localStorage.setItem(LS_UNDO, JSON.stringify(undoStack)); } catch (e2) {}
    }

    function restore() {
      var j = safeJSONParse(localStorage.getItem(LS_JOURNAL), []);
      var u = safeJSONParse(localStorage.getItem(LS_UNDO), []);
      if (!Array.isArray(j)) j = [];
      if (!Array.isArray(u)) u = [];
      journal = j;
      undoStack = u;
    }

    // ------------------------------
    // PAGE NAV
    // ------------------------------
    function showPage(pageIndex) {
      var pages = $all(".page");
      var navBtns = $all("nav button");
      if (pageIndex < 0 || pageIndex >= pages.length) return;

      pages.forEach(function (p) { p.classList.remove("active"); });
      navBtns.forEach(function (b) { b.classList.remove("active"); });

      pages[pageIndex].classList.add("active");
      navBtns[pageIndex].classList.add("active");
    }
    window.showPage = showPage;

    // ------------------------------
    // FORM ROWS
    // ------------------------------
    function addDebit(prefill) {
      var container = document.getElementById("debitContainer");
      if (!container) return;

      var row = document.createElement("div");
      row.className = "entry-row debit-row";
      row.innerHTML =
        '<input placeholder="Account Name" class="account-input" type="text" aria-label="Debit Account Name">' +
        '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Debit Amount">' +
        '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Debit Particulars">';
      container.appendChild(row);

      var p = $(".particulars-input", row);
      if (p) { p.readOnly = true; p.value = ""; }

      if (prefill && typeof prefill === "object") {
        var a = $(".account-input", row);
        var m = $(".amount-input", row);
        if (a) a.value = prefill.acc || "";
        if (m) m.value = prefill.amtStr || "";
      }

      autoFillParticularsInForm();
    }

    function addCredit(prefill) {
      var container = document.getElementById("creditContainer");
      if (!container) return;

      var row = document.createElement("div");
      row.className = "entry-row credit-row";
      row.innerHTML =
        '<input placeholder="Account Name" class="account-input" type="text" aria-label="Credit Account Name">' +
        '<input placeholder="Amount" type="number" step="0.01" min="0" class="amount-input" aria-label="Credit Amount">' +
        '<input placeholder="Particulars" class="particulars-input" type="text" aria-label="Credit Particulars">';
      container.appendChild(row);

      var p = $(".particulars-input", row);
      if (p) { p.readOnly = true; p.value = ""; }

      if (prefill && typeof prefill === "object") {
        var a = $(".account-input", row);
        var m = $(".amount-input", row);
        if (a) a.value = prefill.acc || "";
        if (m) m.value = prefill.amtStr || "";
      }

      autoFillParticularsInForm();
    }

    window.addDebit = addDebit;
    window.addCredit = addCredit;

    function getRowsData(selector) {
      var rows = $all(selector);
      return rows.map(function (row) {
        var accEl = $(".account-input", row);
        var amtEl = $(".amount-input", row);
        var acc = normalizeAccountName(accEl ? accEl.value : "");
        var amt = toPaise(amtEl ? amtEl.value : 0);
        return { acc: acc, amt: amt, row: row };
      });
    }

    function autoFillParticularsInForm() {
      var debits = getRowsData(".debit-row");
      var credits = getRowsData(".credit-row");

      var debitAccounts = debits.map(function(d){ return d.acc; }).filter(Boolean);
      var creditAccounts = credits.map(function(c){ return c.acc; }).filter(Boolean);

      var debitParticularText = debitAccounts.length ? ("By " + debitAccounts.join(", ")) : "";
      var creditParticularText = creditAccounts.length ? ("To " + creditAccounts.join(", ")) : "";

      debits.forEach(function (d) {
        var p = $(".particulars-input", d.row);
        if (p) { p.readOnly = true; p.value = creditParticularText; }
      });

      credits.forEach(function (c) {
        var p = $(".particulars-input", c.row);
        if (p) { p.readOnly = true; p.value = debitParticularText; }
      });
    }
    window.autoFillParticularsInForm = autoFillParticularsInForm;

    document.addEventListener("input", function (e) {
      if (!e.target || !e.target.classList) return;
      if (e.target.classList.contains("account-input") || e.target.classList.contains("amount-input")) {
        autoFillParticularsInForm();
      }
    });

    // ------------------------------
    // ENTER NAVIGATION
    // ------------------------------
    (function enableEnterNavigation(){
      function focusEl(el){
        if (!el) return;
        el.focus();
        try { if (el.select) el.select(); } catch(e){}
      }

      function getRowInputs(row){
        if (!row) return [];
        var acc = row.querySelector('.account-input');
        var amt = row.querySelector('.amount-input');
        var par = row.querySelector('.particulars-input');
        var arr = [];
        if (acc) arr.push(acc);
        if (amt) arr.push(amt);
        if (par) arr.push(par);
        return arr;
      }

      function ensureNextRow(currentRow){
        if (!currentRow) return null;

        if (currentRow.classList.contains('debit-row')) {
          var next = currentRow.nextElementSibling;
          if (next && next.classList.contains('debit-row')) return next;
          addDebit();
          return currentRow.nextElementSibling;
        }

        if (currentRow.classList.contains('credit-row')) {
          var next2 = currentRow.nextElementSibling;
          if (next2 && next2.classList.contains('credit-row')) return next2;
          addCredit();
          return currentRow.nextElementSibling;
        }

        return null;
      }

      document.addEventListener('keydown', function(e){
        if (e.key !== 'Enter') return;

        var t = e.target;
        if (!t || !t.classList) return;

        if (!(t.classList.contains('account-input') || t.classList.contains('amount-input') || t.classList.contains('particulars-input'))) {
          return;
        }

        e.preventDefault();

        var row = t.closest('.entry-row');
        if (!row) return;

        var inputs = getRowInputs(row);
        var idx = inputs.indexOf(t);

        if (idx >= 0 && idx < inputs.length - 1) {
          focusEl(inputs[idx + 1]);
          return;
        }

        var nextRow = ensureNextRow(row);
        if (nextRow) {
          var nextInputs = getRowInputs(nextRow);
          focusEl(nextInputs[0]);
          autoFillParticularsInForm();
          return;
        }
      }, true);
    })();

    // ------------------------------
    // VALIDATION
    // ------------------------------
    function validateEntry(debits, credits) {
      var errors = [];

      if (!debits.length) errors.push("Add at least 1 debit line.");
      if (!credits.length) errors.push("Add at least 1 credit line.");

      debits.forEach(function (d, idx) {
        if (!d.acc) errors.push("Debit row " + (idx + 1) + ": Account name is required.");
        if (d.amt <= 0) errors.push("Debit row " + (idx + 1) + ": Amount must be > 0.");
      });

      credits.forEach(function (c, idx) {
        if (!c.acc) errors.push("Credit row " + (idx + 1) + ": Account name is required.");
        if (c.amt <= 0) errors.push("Credit row " + (idx + 1) + ": Amount must be > 0.");
      });

      var debitTotal = debits.reduce(function(s, d){ return s + d.amt; }, 0);
      var creditTotal = credits.reduce(function(s, c){ return s + c.amt; }, 0);

      if (debitTotal !== creditTotal) {
        errors.push("Debit total (" + paiseToStr(debitTotal) + ") must equal Credit total (" + paiseToStr(creditTotal) + ").");
      }

      return { ok: errors.length === 0, errors: errors, debitTotal: debitTotal, creditTotal: creditTotal };
    }

    // ------------------------------
    // LEDGER UPDATE
    // ------------------------------
    function ensureLedgerAcc(name) {
      if (!ledger[name]) ledger[name] = [];
    }

    function postToLedger(entry, entryIndex) {
      var jf = entry.jf || "-";
      var idx = entryIndex;

      entry.debits.forEach(function (d) {
        ensureLedgerAcc(d.acc);
        ledger[d.acc].push({
          entryIndex: idx,
          date: entry.date,
          particulars: "To " + entry.credits.map(function(c){ return c.acc; }).join(", "),
          debit: d.amt,
          credit: 0,
          jf: jf
        });
      });

      entry.credits.forEach(function (c) {
        ensureLedgerAcc(c.acc);
        ledger[c.acc].push({
          entryIndex: idx,
          date: entry.date,
          particulars: "By " + entry.debits.map(function(d){ return d.acc; }).join(", "),
          debit: 0,
          credit: c.amt,
          jf: jf
        });
      });
    }

    function rebuildLedgerFromJournal() {
      ledger = {};
      journal.forEach(function(entry, idx){
        postToLedger(entry, idx);
      });
    }

    // ------------------------------
    // ADD ENTRY
    // ------------------------------
    function addEntry() {
      var dateEl = $("#dateInput");
      var narrationEl = $("#narrationInput");

      var date = (dateEl ? dateEl.value : "").trim();
      var narration = (narrationEl ? narrationEl.value : "").trim();

      var debits = getRowsData(".debit-row").filter(function(d){ return d.acc || d.amt; });
      var credits = getRowsData(".credit-row").filter(function(c){ return c.acc || c.amt; });

      var v = validateEntry(debits, credits);
      if (!v.ok) {
        alert("Fix these errors:\n\n" + v.errors.map(function(e){ return "• " + e; }).join("\n"));
        return;
      }

      var entry = {
        date: date || new Date().toISOString().slice(0, 10),
        narration: narration || "-",
        debits: debits.map(function(d){ return { acc: d.acc, amt: d.amt }; }),
        credits: credits.map(function(c){ return { acc: c.acc, amt: c.amt }; }),
        jf: "-"
      };

      undoStack.push({ type: "add", index: journal.length, entry: entry });

      journal.push(entry);
      rebuildLedgerFromJournal();
      persist();

      resetEntryForm();
      renderAll();
    }
    window.addEntry = addEntry;

    // ------------------------------
    // EDIT ENTRY AFTER SAVING
    // (auto updates ledger)
    // ------------------------------
    function editEntry(index) {
      index = Number(index);
      if (!isFinite(index) || index < 0 || index >= journal.length) {
        alert("Invalid entry index.");
        return;
      }

      var e = journal[index];

      // move user to entry page
      showPage(0);

      // fill date + narration
      var dateEl = $("#dateInput");
      var narrationEl = $("#narrationInput");
      if (dateEl) dateEl.value = e.date || "";
      if (narrationEl) narrationEl.value = (e.narration && e.narration !== "-") ? e.narration : "";

      // clear rows
      var debitC = document.getElementById("debitContainer");
      var creditC = document.getElementById("creditContainer");
      if (!debitC || !creditC) return;

      debitC.innerHTML = "";
      creditC.innerHTML = "";

      // recreate rows from entry
      (e.debits || []).forEach(function(d){
        addDebit({ acc: d.acc, amtStr: paiseToStr(d.amt) });
      });
      (e.credits || []).forEach(function(c){
        addCredit({ acc: c.acc, amtStr: paiseToStr(c.amt) });
      });

      if (!document.querySelector(".debit-row")) addDebit();
      if (!document.querySelector(".credit-row")) addCredit();

      autoFillParticularsInForm();

      // Replace save button behavior temporarily
      var originalAddEntry = window.addEntry;

      window.addEntry = function saveEditedEntry() {
        var date2 = ($("#dateInput") ? $("#dateInput").value : "").trim();
        var narration2 = ($("#narrationInput") ? $("#narrationInput").value : "").trim();

        var deb2 = getRowsData(".debit-row").filter(function(d){ return d.acc || d.amt; });
        var cre2 = getRowsData(".credit-row").filter(function(c){ return c.acc || c.amt; });

        var v2 = validateEntry(deb2, cre2);
        if (!v2.ok) {
          alert("Fix these errors:\n\n" + v2.errors.map(function(x){ return "• " + x; }).join("\n"));
          return;
        }

        // store undo snapshot
        var oldCopy = JSON.parse(JSON.stringify(journal[index]));
        undoStack.push({ type: "edit", index: index, oldEntry: oldCopy });

        journal[index] = {
          date: date2 || new Date().toISOString().slice(0, 10),
          narration: narration2 || "-",
          debits: deb2.map(function(d){ return { acc: d.acc, amt: d.amt }; }),
          credits: cre2.map(function(c){ return { acc: c.acc, amt: c.amt }; }),
          jf: "-"
        };

        rebuildLedgerFromJournal();
        persist();
        resetEntryForm();
        renderAll();

        // restore normal save behavior
        window.addEntry = originalAddEntry;

        alert("Entry updated successfully.");
      };

      alert("Editing Entry " + (index + 1) + ". Make changes and click Save Entry.");
    }
    window.editEntry = editEntry;

    // ------------------------------
    // UNDO
    // ------------------------------
    function undoLast() {
      if (!undoStack.length) {
        alert("Nothing to undo.");
        return;
      }

      var last = undoStack.pop();

      if (last.type === "add") {
        if (journal[last.index] && journal[last.index] === last.entry) {
          journal.splice(last.index, 1);
        } else {
          var idx = journal.lastIndexOf(last.entry);
          if (idx >= 0) journal.splice(idx, 1);
        }
      } else if (last.type === "edit") {
        if (last.oldEntry && journal[last.index]) {
          journal[last.index] = last.oldEntry;
        }
      }

      rebuildLedgerFromJournal();
      persist();
      renderAll();
    }
    window.undoLast = undoLast;

    // ------------------------------
    // FORM RESET
    // ------------------------------
    function resetEntryForm() {
      var debitC = document.getElementById("debitContainer");
      var creditC = document.getElementById("creditContainer");
      if (!debitC || !creditC) return;

      debitC.innerHTML = "";
      creditC.innerHTML = "";

      addDebit();
      addCredit();

      var narrationEl = $("#narrationInput");
      if (narrationEl) narrationEl.value = "";

      autoFillParticularsInForm();
    }
    window.resetEntryForm = resetEntryForm;

    // ------------------------------
    // SEARCH (Journal)
    // ------------------------------
    function getJournalSearchQuery() {
      var q = ($("#journalSearchInput") ? $("#journalSearchInput").value : "");
      return String(q || "").trim().toLowerCase();
    }

    function getJournalSearchMode() {
      var m = ($("#journalSearchMode") ? $("#journalSearchMode").value : "all");
      return m || "all";
    }

    function entryMatchesSearch(entry, q, mode) {
      if (!q) return true;

      var date = String(entry.date || "").toLowerCase();
      var narration = String(entry.narration || "").toLowerCase();

      var debitAccs = (entry.debits || []).map(function(d){ return String(d.acc || "").toLowerCase(); }).join(" ");
      var creditAccs = (entry.credits || []).map(function(c){ return String(c.acc || "").toLowerCase(); }).join(" ");
      var allAccs = (debitAccs + " " + creditAccs).trim();

      if (mode === "date") return date.indexOf(q) !== -1;
      if (mode === "narration") return narration.indexOf(q) !== -1;
      if (mode === "account") return allAccs.indexOf(q) !== -1;

      // all
      return (
        date.indexOf(q) !== -1 ||
        narration.indexOf(q) !== -1 ||
        allAccs.indexOf(q) !== -1
      );
    }

    function clearJournalSearch() {
      var s = $("#journalSearchInput");
      if (s) s.value = "";
      renderJournal();
    }
    window.clearJournalSearch = clearJournalSearch;

    // ------------------------------
    // SEARCH (Ledger)
    // ------------------------------
    function getLedgerSearchQuery() {
      var q = ($("#ledgerSearchInput") ? $("#ledgerSearchInput").value : "");
      return String(q || "").trim().toLowerCase();
    }

    function clearLedgerSearch() {
      var s = $("#ledgerSearchInput");
      if (s) s.value = "";
      renderLedger();
    }
    window.clearLedgerSearch = clearLedgerSearch;

    // ------------------------------
    // RENDERING
    // ------------------------------
    function renderJournal() {
      var out = document.getElementById("journalOutput");
      if (!out) return;

      if (!journal.length) {
        out.innerHTML = "<p class='muted'>No entries yet.</p>";
        return;
      }

      var q = getJournalSearchQuery();
      var mode = getJournalSearchMode();

      var html = "";
      var shown = 0;

      journal.forEach(function (e, idx) {
        if (!entryMatchesSearch(e, q, mode)) return;

        shown++;

        var debitLines = (e.debits || []).map(function(d){
          return "<div>" + escapeHtml(d.acc) + " <b>Dr.</b> " + paiseToStr(d.amt) + "</div>";
        }).join("");

        var creditLines = (e.credits || []).map(function(c){
          return "<div><b>To</b> " + escapeHtml(c.acc) + " " + paiseToStr(c.amt) + "</div>";
        }).join("");

        html +=
          "<div class='entry-card'>" +
            "<div class='row' style='justify-content:space-between;'>" +
              "<div><b>Entry " + (idx + 1) + "</b> <span class='pill'>Date: " + escapeHtml(e.date) + "</span></div>" +
              "<div class='row' style='gap:8px;'>" +
                "<button class='btn green' onclick='editEntry(" + idx + ")'>Edit</button>" +
              "</div>" +
            "</div>" +
            "<div style='margin-top:8px'>" + debitLines + "</div>" +
            "<div style='margin-top:8px'>" + creditLines + "</div>" +
            "<div style='margin-top:8px'><i>Narration:</i> " + escapeHtml(e.narration || "-") + "</div>" +
          "</div>";
      });

      if (!shown) {
        out.innerHTML = "<p class='muted'>No matching entries found.</p>";
        return;
      }

      out.innerHTML = html;
    }

    function renderLedger() {
      var out = document.getElementById("ledgerOutput");
      if (!out) return;

      var q = getLedgerSearchQuery();

      var accNames = Object.keys(ledger).sort(function(a,b){
        return a.localeCompare(b);
      });

      if (q) {
        accNames = accNames.filter(function(name){
          return String(name).toLowerCase().indexOf(q) !== -1;
        });
      }

      if (!accNames.length) {
        out.innerHTML = "<p class='muted'>Ledger is empty / no matching account.</p>";
        return;
      }

      var html = "";
      accNames.forEach(function (acc) {
        var rows = ledger[acc] || [];
        var debitTotal = 0, creditTotal = 0;

        var rowHtml = rows.map(function (r) {
          debitTotal += r.debit || 0;
          creditTotal += r.credit || 0;
          return (
            "<tr>" +
              "<td>" + escapeHtml(r.date) + "</td>" +
              "<td>" + escapeHtml(r.particulars) + "</td>" +
              "<td>" + escapeHtml(r.jf || "-") + "</td>" +
              "<td style='text-align:right'>" + (r.debit ? paiseToStr(r.debit) : "") + "</td>" +
              "<td style='text-align:right'>" + (r.credit ? paiseToStr(r.credit) : "") + "</td>" +
            "</tr>"
          );
        }).join("");

        html +=
          "<div class='ledger-card'>" +
            "<div class='row' style='justify-content:space-between;'>" +
              "<h3 style='margin:0;'>" + escapeHtml(acc) + "</h3>" +
              "<span class='pill'>Entries: " + rows.length + "</span>" +
            "</div>" +
            "<div style='overflow:auto; margin-top:10px;'>" +
              "<table class='ledger-table'>" +
                "<thead><tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr></thead>" +
                "<tbody>" + rowHtml + "</tbody>" +
                "<tfoot>" +
                  "<tr>" +
                    "<td colspan='3'><b>Total</b></td>" +
                    "<td style='text-align:right'><b>" + paiseToStr(debitTotal) + "</b></td>" +
                    "<td style='text-align:right'><b>" + paiseToStr(creditTotal) + "</b></td>" +
                  "</tr>" +
                "</tfoot>" +
              "</table>" +
            "</div>" +
          "</div>";
      });

      out.innerHTML = html;
    }

    function renderAll() {
      renderJournal();
      renderLedger();
    }
    window.renderAll = renderAll;

    // live search hooks
    function attachSearchListeners(){
      var js = $("#journalSearchInput");
      var jm = $("#journalSearchMode");
      var ls = $("#ledgerSearchInput");

      if (js) js.addEventListener("input", function(){ renderJournal(); });
      if (jm) jm.addEventListener("change", function(){ renderJournal(); });
      if (ls) ls.addEventListener("input", function(){ renderLedger(); });
    }

    // ------------------------------
    // INIT
    // ------------------------------
    function init() {
      restore();
      rebuildLedgerFromJournal();

      // Ensure at least one row exists
      if (!document.querySelector(".debit-row")) addDebit();
      if (!document.querySelector(".credit-row")) addCredit();

      autoFillParticularsInForm();
      attachSearchListeners();
      renderAll();
    }

    // crash guard
    window.addEventListener("error", function(e){
      console.error("Runtime error:", e.message, e.error);
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
