<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Journal • Notebook Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont}
body{
    margin:0;
    min-height:100vh;
    background:#1e1e20;
    color:#f5f5f7;
}

/* HEADER */
header{text-align:center;padding:40px 20px 20px}
header h1{font-size:38px;background:linear-gradient(90deg,#fff,#b3d9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:#9aa0a6;margin-top:4px}

/* NAV */
nav{display:flex;justify-content:center;gap:14px;margin:20px 0 40px}
nav button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#fff;cursor:pointer;transition:0.3s}
nav button.active,nav button:hover{background:linear-gradient(135deg,#0a84ff,#5ac8fa);box-shadow:0 10px 30px rgba(10,132,255,0.5)}

/* PAGE TRANSITIONS */
.page{max-width:1100px;margin:auto;padding:0 20px 80px;display:none;animation:slideFade 0.7s cubic-bezier(.2,.8,.2,1);}
.page.active{display:block}
@keyframes slideFade{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

/* CARD */
.card{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-radius:26px;padding:32px;margin-bottom:30px;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.card h3{margin-bottom:18px}

/* INPUT */
input{padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;margin-bottom:10px;width:100%}
input:focus{outline:none;border-color:#0a84ff}

/* ROWS */
.row{display:flex;gap:14px;margin-top:10px}
.action{background:linear-gradient(135deg,#0a84ff,#5ac8fa);border:none;border-radius:999px;padding:12px 26px;color:white;cursor:pointer;font-weight:500;margin-top:10px}

/* JOURNAL TABLE - Notebook Style */
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border:1px solid #888;padding:10px;text-align:center;}
th{background:#333;color:#fff;}
td{background:#222;}
tr:hover td{background:#2a2a2a;}
.note{color:#aaa;font-size:13px;margin-top:5px}

/* LEDGER - T-Account Style */
.ledger-account{margin-bottom:30px;}
.ledger-title{font-weight:600;font-size:18px;margin-bottom:8px;border-bottom:1px solid #888;padding-bottom:4px;}
.t-account{display:flex;justify-content:space-between;}
.t-column{width:48%;background:rgba(0,0,0,0.35);border-radius:8px;padding:10px}
.t-column h4{text-align:center;text-decoration:underline;margin-bottom:8px;font-size:15px}
.t-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #555}
.total-row{font-weight:600;border-top:2px solid #888;padding-top:6px;margin-top:4px}
</style>
</head>
<body>

<header>
<h1>Compound Journal</h1>
<p>Notebook Style Journal & Ledger</p>
</header>

<nav>
<button class="active" onclick="showPage(0)">Entry</button>
<button onclick="showPage(1)">Journal</button>
<button onclick="showPage(2)">Ledger</button>
</nav>

<!-- PAGE 1: ENTRY -->
<div class="page active">
<div class="card">
<h3>Add Compound Entry</h3>
<input id="date" type="date">

<div id="debitContainer">
<h4>Debit Side</h4>
<div class="debit-group row">
<input placeholder="Debit Account">
<input placeholder="Amount">
</div>
<button class="action" onclick="addDebit()">+ Add Debit Side</button>
</div>

<div id="creditContainer">
<h4>Credit Side</h4>
<div class="credit-group row">
<input placeholder="Credit Account">
<input placeholder="Amount">
</div>
<button class="action" onclick="addCredit()">+ Add Credit Side</button>
</div>

<button class="action" onclick="saveEntry()">Save Entry</button>
</div>
</div>

<!-- PAGE 2: JOURNAL -->
<div class="page">
<div class="card">
<h3>Journal</h3>
<table id="journalTable">
<tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr>
</table>
</div>
</div>

<!-- PAGE 3: LEDGER -->
<div class="page">
<div class="card">
<h3>Ledger (T-Account Style)</h3>
<div id="ledgerDiv"></div>
</div>
</div>

<script>
let pages=document.querySelectorAll(".page");
let navBtns=document.querySelectorAll("nav button");
function showPage(i){
    pages.forEach(p=>p.classList.remove("active"));
    navBtns.forEach(b=>b.classList.remove("active"));
    pages[i].classList.add("active");
    navBtns[i].classList.add("active");
}

/* Journal + Ledger Logic */
let journal=[],ledger={};
window.onload=()=>{
    let d=localStorage.getItem("journalData");
    if(d){journal=JSON.parse(d);rebuild();}
};

/* Add debit/credit row dynamically */
function addDebit(){
    const div=document.createElement("div");
    div.className="debit-group row";
    div.innerHTML='<input placeholder="Debit Account"><input placeholder="Amount">';
    document.getElementById("debitContainer").insertBefore(div, document.querySelector("#debitContainer button"));
}
function addCredit(){
    const div=document.createElement("div");
    div.className="credit-group row";
    div.innerHTML='<input placeholder="Credit Account"><input placeholder="Amount">';
    document.getElementById("creditContainer").insertBefore(div, document.querySelector("#creditContainer button"));
}

function saveEntry(){
    const date=document.getElementById("date").value;
    if(!date){alert("Enter a date"); return;}

    const dGroups=document.querySelectorAll("#debitContainer .debit-group");
    const cGroups=document.querySelectorAll("#creditContainer .credit-group");

    let dA=[], dM=[], cA=[], cM=[];
    dGroups.forEach(row=>{
        const acc=row.children[0].value.trim();
        const amt=row.children[1].value.trim();
        if(acc && amt){dA.push(acc); dM.push(Number(amt));}
    });
    cGroups.forEach(row=>{
        const acc=row.children[0].value.trim();
        const amt=row.children[1].value.trim();
        if(acc && amt){cA.push(acc); cM.push(Number(amt));}
    });

    if(dA.length===0 || cA.length===0){alert("Enter at least one debit and one credit"); return;}

    journal.push({date,dA,dM,cA,cM});
    localStorage.setItem("journalData",JSON.stringify(journal));
    rebuild();

    // Clear inputs
    document.getElementById("date").value="";
    dGroups.forEach(row=>row.remove());
    cGroups.forEach(row=>row.remove());
    addDebit(); addCredit();
}

function rebuild(){
    ledger={};
    journalTable.innerHTML="<tr><th>Date</th><th>Particulars</th><th>J/F</th><th>Debit</th><th>Credit</th></tr>";
    journal.forEach((e,idx)=>{
        // Debits
        e.dA.forEach((a,i)=>{
            addJournalRow(e.date,"To "+e.cA.join(", "),idx+1,a,e.dM[i],0);
            updateLedger(a,e.dM[i],0);
        });
        // Credits
        e.cA.forEach((a,i)=>{
            addJournalRow(e.date,"By "+e.dA.join(", "),idx+1,a,0,e.cM[i]);
            updateLedger(a,0,e.cM[i]);
        });
    });
    renderLedger();
}

function addJournalRow(date,particulars,jf,acc,de,cr){
    journalTable.insertRow().innerHTML=`<td>${date}</td><td>${acc} (${particulars})</td><td>${jf}</td><td>${de||""}</td><td>${cr||""}</td>`;
}

function updateLedger(a,de,cr){
    if(!ledger[a])ledger[a]={d:[],c:[]};
    ledger[a].d.push(de);
    ledger[a].c.push(cr);
}

function renderLedger(){
    const box=document.getElementById("ledgerDiv");
    box.innerHTML="";
    for(let a in ledger){
        let dTotal=ledger[a].d.reduce((sum,v)=>sum+v,0);
        let cTotal=ledger[a].c.reduce((sum,v)=>sum+v,0);
        box.innerHTML+=`
        <div class="ledger-account">
        <div class="ledger-title">${a}</div>
        <div class="t-account">
            <div class="t-column">
                <h4>Debit</h4>
                ${ledger[a].d.map((v,i)=>`<div class="t-row">${v}</div>`).join('')}
                <div class="total-row">${dTotal}</div>
            </div>
            <div class="t-column">
                <h4>Credit</h4>
                ${ledger[a].c.map((v,i)=>`<div class="t-row">${v}</div>`).join('')}
                <div class="total-row">${cTotal}</div>
            </div>
        </div>
        </div>`;
    }
}
</script>
</body>
</html>
