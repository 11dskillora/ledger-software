<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Journal • Signature Project</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(1200px 600px at 10% 10%, rgba(10,132,255,0.18), transparent),
        radial-gradient(900px 500px at 90% 20%, rgba(255,45,85,0.15), transparent),
        linear-gradient(180deg,#0f1014,#1a1b20);
    color:#f5f5f7;
}

/* HEADER */
header{
    text-align:center;
    padding:40px 20px 20px;
}
header h1{
    font-size:40px;
    background:linear-gradient(90deg,#fff,#b3d9ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
header p{color:#9aa0a6}

/* NAV */
nav{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:20px 0 40px;
}
nav button{
    padding:10px 18px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}
nav button.active,nav button:hover{
    background:linear-gradient(135deg,#0a84ff,#5ac8fa);
    box-shadow:0 10px 30px rgba(10,132,255,0.5);
}

/* PAGE TRANSITIONS */
.page{
    max-width:1100px;
    margin:auto;
    padding:0 20px 80px;
    display:none;
    animation:slideFade 0.7s cubic-bezier(.2,.8,.2,1);
}
.page.active{display:block}

@keyframes slideFade{
    from{opacity:0;transform:translateY(40px)}
    to{opacity:1;transform:none}
}

/* CARD */
.card{
    background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
    border-radius:26px;
    padding:32px;
    margin-bottom:30px;
    backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
}
.card h3{margin-bottom:18px}

/* INPUT */
input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.35);
    color:#fff;
}
input:focus{outline:none;border-color:#0a84ff}

.row{display:flex;gap:16px;margin-top:14px}

/* BUTTON */
.action{
    background:linear-gradient(135deg,#0a84ff,#5ac8fa);
    border:none;
    border-radius:999px;
    padding:14px 28px;
    color:white;
    cursor:pointer;
    font-weight:500;
}

/* TABLE */
table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 10px;
}
th{color:#9aa0a6;text-align:left;font-size:13px}
td{
    background:rgba(255,255,255,0.06);
    padding:14px;
}

/* LEDGER */
.ledger-item{
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,0.06);
    padding:14px 18px;
    border-radius:14px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<header>
    <h1>Compound Journal</h1>
    <p>Designed like software. Built like a project.</p>
</header>

<nav>
    <button class="active" onclick="showPage(0)">Entry</button>
    <button onclick="showPage(1)">Journal</button>
    <button onclick="showPage(2)">Ledger</button>
</nav>

<!-- PAGE 1 -->
<div class="page active">
<div class="card">
<h3>Add Compound Entry</h3>
<input id="date" type="date">
<div class="row">
<input id="debitAcc" placeholder="Debit Accounts">
<input id="debitAmt" placeholder="Debit Amounts">
</div>
<div class="row">
<input id="creditAcc" placeholder="Credit Accounts">
<input id="creditAmt" placeholder="Credit Amounts">
</div>
<div class="row">
<input id="narration" placeholder="Narration">
<button class="action" onclick="saveEntry()">Save Entry</button>
</div>
</div>
</div>

<!-- PAGE 2 -->
<div class="page">
<div class="card">
<h3>Journal</h3>
<table id="journalTable">
<tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr>
</table>
</div>
</div>

<!-- PAGE 3 -->
<div class="page">
<div class="card">
<h3>Ledger</h3>
<div id="ledgerDiv"></div>
</div>
</div>

<script>
let pages=document.querySelectorAll(".page");
let navBtns=document.querySelectorAll("nav button");

function showPage(i){
    pages.forEach(p=>p.classList.remove("active"));
    navBtns.forEach(b=>b.classList.remove("active"));
    pages[i].classList.add("active");
    navBtns[i].classList.add("active");
}

let journal=[],ledger={};

window.onload=()=>{
    let d=localStorage.getItem("journalData");
    if(d){journal=JSON.parse(d);rebuild();}
};

function saveEntry(){
    let date=document.getElementById("date").value;
    let dA=debitAcc.value.split(","),dM=debitAmt.value.split(",");
    let cA=creditAcc.value.split(","),cM=creditAmt.value.split(",");

    journal.push({date,dA,dM,cA,cM});
    localStorage.setItem("journalData",JSON.stringify(journal));
    rebuild();
    document.querySelectorAll("input").forEach(i=>i.value="");
}

function rebuild(){
    ledger={};
    journalTable.innerHTML="<tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr>";
    journal.forEach(e=>{
        e.dA.forEach((a,i)=>{addRow(e.date,a,e.dM[i],0);update(a,e.dM[i],0)});
        e.cA.forEach((a,i)=>{addRow(e.date,a,0,e.cM[i]);update(a,0,e.cM[i])});
    });
    renderLedger();
}

function addRow(d,a,de,cr){
    journalTable.insertRow().innerHTML=`<td>${d}</td><td>${a}</td><td>${de||""}</td><td>${cr||""}</td>`;
}
function update(a,de,cr){
    if(!ledger[a])ledger[a]={d:0,c:0};
    ledger[a].d+=Number(de);ledger[a].c+=Number(cr);
}
function renderLedger(){
    ledgerDiv.innerHTML="";
    for(let a in ledger){
        ledgerDiv.innerHTML+=
        `<div class="ledger-item"><strong>${a}</strong><span>Dr ₹${ledger[a].d} | Cr ₹${ledger[a].c}</span></div>`;
    }
}
</script>

</body>
</html>
