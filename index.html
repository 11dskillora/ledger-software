<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Ledger - Premium Accounting</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 + ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html,
      body {
        height: 100%;
        background: #2a1f18;
      }

      /* Wood grain texture overlay */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 2px,
            rgba(139, 90, 43, 0.03) 2px,
            rgba(139, 90, 43, 0.03) 4px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(92, 64, 51, 0.02) 1px,
            rgba(92, 64, 51, 0.02) 2px
          );
        pointer-events: none;
        z-index: 1;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      ::-webkit-scrollbar-track {
        background: #3a2f28;
        border-left: 1px solid #5c4033;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b6f47 0%, #5c4033 100%);
        border: 2px solid #3a2f28;
        border-radius: 8px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a68256 0%, #6d4c37 100%);
      }

      /* Parchment paper texture */
      .parchment {
        background: linear-gradient(135deg, #f5e6d3 0%, #e8dcc8 50%, #f0e4d0 100%);
        position: relative;
      }

      .parchment::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(139, 90, 43, 0.02) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(92, 64, 51, 0.03) 0%, transparent 50%);
        pointer-events: none;
      }

      /* Wood panel effect */
      .wood-panel {
        background: linear-gradient(135deg, #5c4033 0%, #3e2a1f 100%);
        position: relative;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      .wood-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 3px,
            rgba(0, 0, 0, 0.1) 3px,
            rgba(0, 0, 0, 0.1) 6px
          );
        pointer-events: none;
      }

      /* Leather texture */
      .leather {
        background: linear-gradient(135deg, #4a3428 0%, #3a2820 100%);
        position: relative;
      }

      .leather::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
          radial-gradient(circle at 75% 75%, rgba(0, 0, 0, 0.05) 0%, transparent 50%);
        pointer-events: none;
      }

      /* Embossed text effect */
      .embossed {
        text-shadow: 
          1px 1px 2px rgba(255, 255, 255, 0.3),
          -1px -1px 2px rgba(0, 0, 0, 0.5);
      }

      /* Gold foil effect */
      .gold-foil {
        background: linear-gradient(135deg, #d4af37 0%, #c9a961 25%, #f4e4bc 50%, #c9a961 75%, #b8941f 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
      }

      /* Brass accent */
      .brass {
        background: linear-gradient(135deg, #b5a642 0%, #8b7335 100%);
        box-shadow: 
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          inset 0 -1px 0 rgba(0, 0, 0, 0.3),
          0 2px 4px rgba(0, 0, 0, 0.4);
      }

      /* Aged paper edge effect */
      .torn-edge {
        position: relative;
      }

      .torn-edge::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, 
          transparent 0%, 
          rgba(139, 90, 43, 0.2) 10%, 
          transparent 20%,
          rgba(139, 90, 43, 0.2) 30%, 
          transparent 40%,
          rgba(139, 90, 43, 0.2) 50%, 
          transparent 60%,
          rgba(139, 90, 43, 0.2) 70%, 
          transparent 80%,
          rgba(139, 90, 43, 0.2) 90%, 
          transparent 100%
        );
      }

      /* Wax seal effect */
      .wax-seal {
        background: radial-gradient(circle, #8b1a1a 0%, #5c0f0f 100%);
        box-shadow: 
          0 2px 8px rgba(139, 26, 26, 0.6),
          inset 0 1px 2px rgba(255, 255, 255, 0.2);
      }

      /* Stop number input wheel changing value (strong CSS fix) */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // --- Inline Icon Component ---
      function Icon({ name, className }) {
        const base = "w-5 h-5 stroke-current fill-none stroke-[2] stroke-linecap-round stroke-linejoin-round";
        const cls = className ? className : base;

        const icons = {
          Building2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 21V3h18v18" />
              <path d="M9 21V9h6v12" />
              <path d="M7 7h.01" />
              <path d="M17 7h.01" />
              <path d="M7 11h.01" />
              <path d="M17 11h.01" />
              <path d="M7 15h.01" />
              <path d="M17 15h.01" />
            </svg>
          ),
          Plus: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          ),
          ScrollText: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M8 21h12a2 2 0 0 0 2-2V7" />
              <path d="M6 3h12a2 2 0 0 1 2 2v2" />
              <path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2" />
              <path d="M6 17h10" />
              <path d="M6 13h10" />
              <path d="M6 9h10" />
            </svg>
          ),
          BookOpen: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 7v14" />
              <path d="M3 18a2 2 0 0 0 2 2h7V6H5a2 2 0 0 0-2 2z" />
              <path d="M21 18a2 2 0 0 1-2 2h-7V6h7a2 2 0 0 1 2 2z" />
            </svg>
          ),
          Pencil: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M17 3a2.85 2.85 0 0 1 4 4L7 21H3v-4Z" />
              <path d="M15 5l4 4" />
            </svg>
          ),
          Save: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8" />
              <path d="M7 3v5h8" />
            </svg>
          ),
          RotateCcw: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          ),
          Undo2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h10a6 6 0 0 1 0 12h-4" />
            </svg>
          ),
          Trash2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
            </svg>
          ),
          TrendingDown: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 7l6 6 4-4 8 8" />
              <path d="M21 17V7h-10" />
            </svg>
          ),
          TrendingUp: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 17l6-6 4 4 8-8" />
              <path d="M21 7v10H11" />
            </svg>
          ),
          Search: (
            <svg className={cls} viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
          ),
          Info: (
            <svg className={cls} viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
          ),
          BadgeCheck: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 2l3 3 4 .5-2.5 3.2.8 4.3L12 11l-3.3 2.3.8-4.3L7 5.5 11 5z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
          ),
          Feather: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
              <line x1="17.5" y1="15" x2="9" y2="15" />
            </svg>
          ),
          Scale: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 3v18" />
              <path d="M3 7h18" />
              <path d="M7 7l-4 8h8l-4-8Z" />
              <path d="M17 7l-4 8h8l-4-8Z" />
              <path d="M8 21h8" />
            </svg>
          )
        };

        return icons[name] || null;
      }

      // --- Helper Functions ---
      function normalizeAccountName(name) {
        let n = String(name || "").trim();
        if (!n) return "";
        n = n.replace(/\s+/g, " ");
        if (!/a\/c$/i.test(n)) n = n + " A/c";
        n = n.replace(/A\/c\s*A\/c$/i, "A/c");
        n = n.charAt(0).toUpperCase() + n.slice(1);
        return n;
      }

      function toPaise(v) {
        const n = Number(v);
        if (!Number.isFinite(n) || n <= 0) return 0;
        return Math.round(n * 100);
      }

      function paiseToStr(p) {
        p = Number(p) || 0;
        return (p / 100).toFixed(2);
      }

      function safeJSONParse(str, fallback) {
        try {
          const obj = JSON.parse(str || "");
          return obj == null ? fallback : obj;
        } catch {
          return fallback;
        }
      }

      // --- App ---
      function AccountingApp() {
        const [view, setView] = useState("new");
        const [journal, setJournal] = useState([]);
        const [undoStack, setUndoStack] = useState([]);

        const [date, setDate] = useState("");
        const [narration, setNarration] = useState("");
        const [debits, setDebits] = useState([]);
        const [credits, setCredits] = useState([]);
        const [editingIndex, setEditingIndex] = useState(null);

        const [journalSearch, setJournalSearch] = useState("");
        const [journalSearchMode, setJournalSearchMode] = useState("all");
        const [ledgerSearch, setLedgerSearch] = useState("");

        const resetFormState = () => {
          setDate(new Date().toISOString().slice(0, 10));
          setNarration("");
          setDebits([{ id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);
          setCredits([{ id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);
          setEditingIndex(null);
        };

        useEffect(() => {
          const j = safeJSONParse(localStorage.getItem("journalData"), []);
          const u = safeJSONParse(localStorage.getItem("undoStack"), []);
          if (Array.isArray(j)) setJournal(j);
          if (Array.isArray(u)) setUndoStack(u);
          resetFormState();
        }, []);

        useEffect(() => {
          localStorage.setItem("journalData", JSON.stringify(journal));
        }, [journal]);

        useEffect(() => {
          localStorage.setItem("undoStack", JSON.stringify(undoStack));
        }, [undoStack]);

        // Stop scroll wheel changing number input values globally
        useEffect(() => {
          const handler = (e) => {
            const t = e.target;
            if (t && t.tagName === "INPUT" && t.type === "number") {
              t.blur();
              e.preventDefault();
            }
          };
          window.addEventListener("wheel", handler, { passive: false });
          return () => window.removeEventListener("wheel", handler);
        }, []);

        const addDebitRow = () =>
          setDebits((prev) => [...prev, { id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);

        const addCreditRow = () =>
          setCredits((prev) => [...prev, { id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);

        const updateRow = (type, index, field, value) => {
          const updateList = (list) => {
            const newList = [...list];
            const item = { ...newList[index] };
            if (field === "acc") item.acc = value;
            if (field === "amtStr") {
              item.amtStr = value;
              item.amt = toPaise(value);
            }
            newList[index] = item;
            return newList;
          };

          if (type === "debit") setDebits((prev) => updateList(prev));
          else setCredits((prev) => updateList(prev));
        };

        const removeRow = (type, index) => {
          if (type === "debit") {
            setDebits((prev) => (prev.length > 1 ? prev.filter((_, i) => i !== index) : prev));
          } else {
            setCredits((prev) => (prev.length > 1 ? prev.filter((_, i) => i !== index) : prev));
          }
        };

        const debitParticulars = useMemo(() => {
          const validAccs = debits.map((d) => normalizeAccountName(d.acc)).filter(Boolean);
          return validAccs.length ? "By " + validAccs.join(", ") : "";
        }, [debits]);

        const creditParticulars = useMemo(() => {
          const validAccs = credits.map((c) => normalizeAccountName(c.acc)).filter(Boolean);
          return validAccs.length ? "To " + validAccs.join(", ") : "";
        }, [credits]);

        const handleSaveEntry = () => {
          const finalDebits = debits
            .map((d) => ({ ...d, acc: normalizeAccountName(d.acc) }))
            .filter((d) => d.acc || d.amt > 0);

          const finalCredits = credits
            .map((c) => ({ ...c, acc: normalizeAccountName(c.acc) }))
            .filter((c) => c.acc || c.amt > 0);

          const errors = [];

          if (!finalDebits.length) errors.push("Add at least 1 debit line.");
          if (!finalCredits.length) errors.push("Add at least 1 credit line.");

          finalDebits.forEach((d, i) => {
            if (!d.acc) errors.push(`Debit row ${i + 1}: Account name is required.`);
            if (d.amt <= 0) errors.push(`Debit row ${i + 1}: Amount must be > 0.`);
          });

          finalCredits.forEach((c, i) => {
            if (!c.acc) errors.push(`Credit row ${i + 1}: Account name is required.`);
            if (c.amt <= 0) errors.push(`Credit row ${i + 1}: Amount must be > 0.`);
          });

          const dTotal = finalDebits.reduce((sum, d) => sum + d.amt, 0);
          const cTotal = finalCredits.reduce((sum, c) => sum + c.amt, 0);

          if (dTotal !== cTotal) {
            errors.push(
              `Debit total (₹${paiseToStr(dTotal)}) must equal Credit total (₹${paiseToStr(cTotal)}).`
            );
          }

          if (errors.length) {
            alert("Please fix these errors:\n\n" + errors.map((e) => "• " + e).join("\n"));
            return;
          }

          const entry = {
            date: date || new Date().toISOString().slice(0, 10),
            narration: narration || "-",
            debits: finalDebits.map((d) => ({ acc: d.acc, amt: d.amt })),
            credits: finalCredits.map((c) => ({ acc: c.acc, amt: c.amt })),
            jf: "-",
          };

          if (editingIndex !== null) {
            const oldEntry = JSON.parse(JSON.stringify(journal[editingIndex]));
            setUndoStack((prev) => [...prev, { type: "edit", index: editingIndex, oldEntry }]);

            setJournal((prev) => {
              const copy = [...prev];
              copy[editingIndex] = entry;
              return copy;
            });

            alert("✓ Entry updated successfully!");
          } else {
            setUndoStack((prev) => [...prev, { type: "add", index: journal.length, entry }]);
            setJournal((prev) => [...prev, entry]);
          }

          resetFormState();
        };

        const handleEditEntry = (index) => {
          const e = journal[index];
          setDate(e.date);
          setNarration(e.narration === "-" ? "" : e.narration);

          setDebits(
            e.debits.map((d) => ({
              id: crypto.randomUUID(),
              acc: d.acc,
              amt: d.amt,
              amtStr: paiseToStr(d.amt),
            }))
          );

          setCredits(
            e.credits.map((c) => ({
              id: crypto.randomUUID(),
              acc: c.acc,
              amt: c.amt,
              amtStr: paiseToStr(c.amt),
            }))
          );

          setEditingIndex(index);
          setView("new");
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const handleDeleteEntry = (index) => {
          if (!window.confirm(`Delete Entry #${index + 1}?`)) return;
          const oldEntry = JSON.parse(JSON.stringify(journal[index]));
          setUndoStack((prev) => [...prev, { type: "delete", index, oldEntry }]);
          setJournal((prev) => prev.filter((_, i) => i !== index));
        };

        const handleDeleteAll = () => {
          if (!journal.length) return alert("No entries to delete.");
          if (!window.confirm("DELETE ALL ENTRIES?\nThis action can be undone.")) return;

          setUndoStack((prev) => [
            ...prev,
            { type: "deleteAll", prevJournal: JSON.parse(JSON.stringify(journal)) },
          ]);
          setJournal([]);
          alert("✓ All entries deleted successfully!");
        };

        const handleUndo = () => {
          if (!undoStack.length) return alert("Nothing to undo.");

          const last = undoStack[undoStack.length - 1];
          setUndoStack((prev) => prev.slice(0, -1));

          if (last.type === "add") {
            setJournal((prev) => prev.filter((_, i) => i !== last.index));
          } else if (last.type === "edit") {
            setJournal((prev) => {
              const copy = [...prev];
              if (copy[last.index]) copy[last.index] = last.oldEntry;
              return copy;
            });
          } else if (last.type === "delete") {
            setJournal((prev) => {
              const copy = [...prev];
              copy.splice(last.index, 0, last.oldEntry);
              return copy;
            });
          } else if (last.type === "deleteAll") {
            setJournal(last.prevJournal || []);
          }
        };

        // Ledger generation + CBSE Folio numbering
        const ledgerData = useMemo(() => {
          const ledger = {};
          const accSet = new Set();

          journal.forEach((e) => {
            e.debits.forEach((d) => accSet.add(d.acc));
            e.credits.forEach((c) => accSet.add(c.acc));
          });

          const sortedAccs = Array.from(accSet).sort();
          const folioMap = {};
          sortedAccs.forEach((acc, i) => (folioMap[acc] = "L" + (i + 1)));

          const ensureAcc = (acc) => {
            if (!ledger[acc]) ledger[acc] = [];
          };

          journal.forEach((entry, idx) => {
            const jf = entry.jf || "-";
            const creditParticularsStr = "To " + entry.credits.map((c) => c.acc).join(", ");
            const debitParticularsStr = "By " + entry.debits.map((d) => d.acc).join(", ");

            entry.debits.forEach((d) => {
              ensureAcc(d.acc);
              ledger[d.acc].push({
                entryIndex: idx,
                date: entry.date,
                particulars: creditParticularsStr,
                debit: d.amt,
                credit: 0,
                jf,
                lf: folioMap[d.acc] || "-",
              });
            });

            entry.credits.forEach((c) => {
              ensureAcc(c.acc);
              ledger[c.acc].push({
                entryIndex: idx,
                date: entry.date,
                particulars: debitParticularsStr,
                debit: 0,
                credit: c.amt,
                jf,
                lf: folioMap[c.acc] || "-",
              });
            });
          });

          return { ledger, folioMap };
        }, [journal]);

        // Trial Balance generation (CBSE style)
        const trialBalance = useMemo(() => {
          const accounts = Object.keys(ledgerData.ledger || {}).sort();
          const rows = accounts.map((acc) => {
            const entries = ledgerData.ledger[acc] || [];
            const dr = entries.reduce((s, e) => s + (e.debit || 0), 0);
            const cr = entries.reduce((s, e) => s + (e.credit || 0), 0);
            const bal = dr - cr;
            return {
              acc,
              debit: bal > 0 ? bal : 0,
              credit: bal < 0 ? Math.abs(bal) : 0,
              lf: ledgerData.folioMap?.[acc] || "-"
            };
          });

          const totalDr = rows.reduce((s, r) => s + r.debit, 0);
          const totalCr = rows.reduce((s, r) => s + r.credit, 0);

          return { rows, totalDr, totalCr };
        }, [ledgerData]);

        const getFilteredJournal = () => {
          if (!journalSearch) return journal;
          const q = journalSearch.toLowerCase();

          return journal.filter((e) => {
            const dateStr = e.date.toLowerCase();
            const narr = e.narration.toLowerCase();
            const accs = [...e.debits, ...e.credits].map((x) => x.acc.toLowerCase()).join(" ");

            if (journalSearchMode === "date") return dateStr.includes(q);
            if (journalSearchMode === "narration") return narr.includes(q);
            if (journalSearchMode === "account") return accs.includes(q);
            return dateStr.includes(q) || narr.includes(q) || accs.includes(q);
          });
        };

        const getFilteredLedgerAccounts = () => {
          const accounts = Object.keys(ledgerData.ledger).sort();
          if (!ledgerSearch) return accounts;
          const q = ledgerSearch.toLowerCase();
          return accounts.filter((a) => a.toLowerCase().includes(q));
        };

        return (
          <div
            className="min-h-screen relative z-10"
            style={{ 
              fontFamily: '"EB Garamond", "Crimson Text", serif',
              background: 'linear-gradient(135deg, #2a1f18 0%, #1a1410 100%)'
            }}
          >
            {/* Ornate Header - Deep Wood Panel */}
            <header className="wood-panel sticky top-0 z-50 border-b-4 border-[#d4af37] shadow-2xl">
              {/* Decorative brass corner pieces */}

                  {/* Search */}
                  <div className="parchment p-6 rounded-lg border-4 border-[#8b6f47] shadow-xl">
                    <div className="flex items-center gap-4 max-w-md">
                      <div className="brass p-2 rounded">
                        <Icon name="Search" className="w-5 h-5 text-[#2c1810]" />
                      </div>
                      <input
                        type="text"
                        placeholder="Filter ledger accounts..."
                        value={ledgerSearch}
                        onChange={(e) => setLedgerSearch(e.target.value)}
                        className="flex-1 px-4 py-3 bg-[#faf8f3] border-2 border-[#b8956a] rounded-md text-sm text-[#3e2a1f] focus:bg-white focus:border-[#8b6f47] outline-none transition-all placeholder-[#a68b7c] shadow-inner font-semibold"
                        style={{ fontFamily: '"EB Garamond", serif' }}
                      />
                    </div>
                  </div>

                  {/* Ledger Accounts */}
                  <div className="space-y-12">
                    {getFilteredLedgerAccounts().map((accName) => {
                      const entries = ledgerData.ledger[accName];
                      const drTotal = entries.reduce((sum, e) => sum + e.debit, 0);
                      const crTotal = entries.reduce((sum, e) => sum + e.credit, 0);
                      const balance = drTotal - crTotal;
                      const balStr = paiseToStr(Math.abs(balance));
                      const balType = balance >= 0 ? "Dr" : "Cr";

                      const drRows = entries.filter((e) => e.debit > 0);
                      const crRows = entries.filter((e) => e.credit > 0);
                      const maxRows = Math.max(drRows.length, crRows.length);

                      return (
                        <div
                          key={accName}
                          className="parchment rounded-lg border-4 border-[#8b6f47] shadow-2xl overflow-hidden torn-edge"
                        >
                          {/* Account Header */}
                          <div className="wood-panel px-10 py-6 border-b-4 border-[#d4af37] flex flex-wrap justify-between items-center gap-4">
                            <h3
                              className="text-2xl font-bold text-[#f4e4bc] flex items-center gap-4 embossed"
                              style={{ fontFamily: '"Playfair Display", serif', letterSpacing: '0.1em' }}
                            >
                              <div className="wax-seal p-2 rounded-full">
                                <Icon name="BadgeCheck" className="w-6 h-6 text-[#d4af37]" />
                              </div>
                              {accName}
                            </h3>

                            <div className="flex gap-4">
                              <span className="brass px-5 py-2 rounded-full text-xs font-bold text-[#2c1810] uppercase tracking-widest">
                                {entries.length} Records
                              </span>
                              <span
                                className={`px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest border-2 ${
                                  balance >= 0
                                    ? "bg-[#e8f5e9] text-[#2e4a2e] border-[#556b2f]"
                                    : "bg-[#fff3e0] text-[#5c3a2e] border-[#8b4513]"
                                }`}
                              >
                                Balance: ₹{balStr} {balType}
                              </span>
                            </div>
                          </div>

                          {/* T-Account Table */}
                          <div className="overflow-x-auto">
                            <table className="w-full text-sm border-collapse">
                              <thead>
                                <tr className="leather border-b-2 border-[#8b6f47]">
                                  <th
                                    colSpan="4"
                                    className="py-4 text-center border-r-4 border-[#8b6f47] bg-[#e8f5e9]/30 text-[#2e4a2e] font-bold uppercase tracking-[0.25em]"
                                    style={{ fontFamily: '"Playfair Display", serif', fontSize: '13px' }}
                                  >
                                    Dr. Debit Side
                                  </th>
                                  <th
                                    colSpan="4"
                                    className="py-4 text-center bg-[#fff3e0]/30 text-[#5c3a2e] font-bold uppercase tracking-[0.25em]"
                                    style={{ fontFamily: '"Playfair Display", serif', fontSize: '13px' }}
                                  >
                                    Cr. Credit Side
                                  </th>
                                </tr>
                                <tr className="bg-[#f0ece3] border-b border-[#d4c5b0]">
                                  <th className="px-5 py-4 text-left font-bold text-[#5c4033] uppercase tracking-widest w-32" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>Date</th>
                                  <th className="px-5 py-4 text-left font-bold text-[#5c4033] uppercase tracking-widest" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>Particulars</th>
                                  <th className="px-5 py-4 text-center font-bold text-[#5c4033] uppercase tracking-widest w-20" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>JF</th>
                                  <th className="px-5 py-4 text-right font-bold text-[#5c4033] uppercase tracking-widest w-32 border-r-4 border-[#d4c5b0]" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>
                                    Amount
                                  </th>

                                  <th className="px-5 py-4 text-left font-bold text-[#5c4033] uppercase tracking-widest w-32 pl-8" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>Date</th>
                                  <th className="px-5 py-4 text-left font-bold text-[#5c4033] uppercase tracking-widest" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>Particulars</th>
                                  <th className="px-5 py-4 text-center font-bold text-[#5c4033] uppercase tracking-widest w-20" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>JF</th>
                                  <th className="px-5 py-4 text-right font-bold text-[#5c4033] uppercase tracking-widest w-32" style={{ fontFamily: '"EB Garamond", serif', fontSize: '11px' }}>Amount</th>
                                </tr>
                              </thead>

                              <tbody className="divide-y divide-[#e8dcc8]">
                                {Array.from({ length: maxRows }).map((_, i) => {
                                  const d = drRows[i];
                                  const c = crRows[i];
                                  return (
                                    <tr key={i} className="hover:bg-[#f5ede0]">
                                      <td className="px-5 py-3 text-[#3e2a1f] font-semibold" style={{ fontFamily: '"EB Garamond", serif' }}>
                                        {d?.date || ""}
                                      </td>
                                      <td
                                        className="px-5 py-3 text-[#2c1810] font-medium truncate max-w-[200px]"
                                        title={d?.particulars}
                                        style={{ fontFamily: '"EB Garamond", serif' }}
                                      >
                                        {d?.particulars || ""}
                                      </td>
                                      <td className="px-5 py-3 text-center text-[#8b6f47] font-semibold" style={{ fontFamily: '"EB Garamond", serif' }}>
                                        {d ? d.jf || "-" : ""}
                                      </td>
                                      <td className="px-5 py-3 text-right font-mono text-[#2e4a2e] font-bold border-r-4 border-[#e8dcc8] bg-[#e8f5e9]/20">
                                        {d ? paiseToStr(d.debit) : ""}
                                      </td>

                                      <td className="px-5 py-3 text-[#3e2a1f] font-semibold pl-8" style={{ fontFamily: '"EB Garamond", serif' }}>
                                        {c?.date || ""}
                                      </td>
                                      <td
                                        className="px-5 py-3 text-[#2c1810] font-medium truncate max-w-[200px]"
                                        title={c?.particulars}
                                        style={{ fontFamily: '"EB Garamond", serif' }}
                                      >
                                        {c?.particulars || ""}
                                      </td>
                                      <td className="px-5 py-3 text-center text-[#8b6f47] font-semibold" style={{ fontFamily: '"EB Garamond", serif' }}>
                                        {c ? c.jf || "-" : ""}
                                      </td>
                                      <td className="px-5 py-3 text-right font-mono text-[#5c3a2e] font-bold bg-[#fff3e0]/20">
                                        {c ? paiseToStr(c.credit) : ""}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TRIAL BALANCE VIEW */}
              {view === "trial" && (
                <div className="space-y-8">
                  <div className="parchment rounded-lg border-4 border-[#8b6f47] shadow-2xl overflow-hidden torn-edge">
                    <div className="wood-panel px-10 py-6 border-b-4 border-[#d4af37] flex items-center justify-between">
                      <h2
                        className="text-3xl font-bold flex items-center gap-4 text-[#f4e4bc] embossed"
                        style={{ fontFamily: '"Playfair Display", serif', letterSpacing: '0.15em' }}
                      >
                        <div className="brass p-2 rounded">
                          <Icon name="Scale" className="w-6 h-6 text-[#2c1810]" />
                        </div>
                        Trial Balance
                      </h2>

                      <span className="brass px-5 py-2 rounded-full text-xs font-bold text-[#2c1810] uppercase tracking-widest">
                        Auto Generated
                      </span>
                    </div>

                    <div className="p-8">
                      {trialBalance.rows.length === 0 ? (
                        <div className="p-20 text-center">
                          <div className="brass w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center">
                            <Icon name="Scale" className="w-10 h-10 text-[#2c1810]" />
                          </div>
                          <h3 className="text-2xl text-[#5c4033] font-bold mb-2" style={{ fontFamily: '"Playfair Display", serif' }}>
                            No Data Yet
                          </h3>
                          <p className="text-[#8b6f47] italic" style={{ fontFamily: '"Crimson Text", serif' }}>
                            Create journal entries to generate Trial Balance automatically.
                          </p>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-sm">
                            <thead>
                              <tr className="leather border-b-2 border-[#8b6f47]">
                                <th className="px-6 py-4 text-left font-bold text-[#f4e4bc] uppercase tracking-[0.2em]" style={{ fontFamily: '"Playfair Display", serif', fontSize: '11px' }}>
                                  Particulars
                                </th>
                                <th className="px-6 py-4 text-center font-bold text-[#f4e4bc] uppercase tracking-[0.2em] w-24 border-l border-r border-[#5c4033]/50" style={{ fontFamily: '"Playfair Display", serif', fontSize: '11px' }}>
                                  L.F.
                                </th>
                                <th className="px-6 py-4 text-right font-bold text-[#f4e4bc] uppercase tracking-[0.2em] w-40 border-r border-[#5c4033]/50" style={{ fontFamily: '"Playfair Display", serif', fontSize: '11px' }}>
                                  Debit (₹)
                                </th>
                                <th className="px-6 py-4 text-right font-bold text-[#f4e4bc] uppercase tracking-[0.2em] w-40" style={{ fontFamily: '"Playfair Display", serif', fontSize: '11px' }}>
                                  Credit (₹)
                                </th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-[#d4c5b0]">
                              {trialBalance.rows.map((r, i) => (
                                <tr key={i} className="hover:bg-[#f5ede0]">
                                  <td className="px-6 py-4 text-[#2c1810] font-semibold" style={{ fontFamily: '"EB Garamond", serif' }}>
                                    {r.acc}
                                  </td>
                                  <td className="px-6 py-4 text-center text-[#5c4033] font-semibold border-l border-r border-[#e8dcc8]" style={{ fontFamily: '"EB Garamond", serif' }}>
                                    {r.lf}
                                  </td>
                                  <td className="px-6 py-4 text-right font-mono text-[#2e4a2e] font-bold bg-[#e8f5e9]/40 border-r border-[#e8dcc8]">
                                    {r.debit ? paiseToStr(r.debit) : ""}
                                  </td>
                                  <td className="px-6 py-4 text-right font-mono text-[#5c3a2e] font-bold bg-[#fff3e0]/40">
                                    {r.credit ? paiseToStr(r.credit) : ""}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                            <tfoot>
                              <tr className="wood-panel border-t-4 border-[#d4af37]">
                                <td className="px-6 py-5 text-[#f4e4bc] font-bold uppercase tracking-[0.2em]" style={{ fontFamily: '"Playfair Display", serif', fontSize: '11px' }}>
                                  Total
                                </td>
                                <td className="px-6 py-5 border-l border-r border-[#5c4033]/50"></td>
                                <td className="px-6 py-5 text-right font-mono text-[#f4e4bc] font-bold">
                                  {paiseToStr(trialBalance.totalDr)}
                                </td>
                                <td className="px-6 py-5 text-right font-mono text-[#f4e4bc] font-bold">
                                  {paiseToStr(trialBalance.totalCr)}
                                </td>
                              </tr>
                            </tfoot>
                          </table>

                          <div className="mt-6 text-center">
                            <span
                              className={`inline-block px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest border-2 ${
                                trialBalance.totalDr === trialBalance.totalCr
                                  ? "bg-[#e8f5e9] text-[#2e4a2e] border-[#556b2f]"
                                  : "bg-[#fff3e0] text-[#5c3a2e] border-[#8b4513]"
                              }`}
                            >
                              {trialBalance.totalDr === trialBalance.totalCr
                                ? "✓ Trial Balance Matched"
                                : "⚠ Trial Balance Not Matched"}
                            </span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      // Render
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<AccountingApp />);
    </script>
  </body>
</html>
