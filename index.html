<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saraswati International School - Ledger System</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html,
      body {
        height: 100%;
        background: #2a1f18;
      }

      /* ====== WOOD DESK TEXTURE BACKGROUND (image-like via gradients) ====== */
      body {
        background-image:
          radial-gradient(circle at 20% 10%, rgba(255, 220, 160, 0.06), transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(255, 220, 160, 0.05), transparent 45%),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 6px,
            rgba(139, 90, 43, 0.08) 7px,
            rgba(139, 90, 43, 0.08) 8px
          ),
          linear-gradient(135deg, #2a1f18 0%, #1a1410 100%);
        background-attachment: fixed;
        background-size: cover;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(139, 90, 43, 0.03) 2px,
          rgba(139, 90, 43, 0.03) 4px
        );
        pointer-events: none;
        z-index: 1;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #3a2f28;
        border-left: 1px solid #5c4033;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8b6f47, #5c4033);
        border: 2px solid #3a2f28;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a68256, #6d4c37);
      }

      .parchment {
        background: linear-gradient(135deg, #f5e6d3, #e8dcc8 50%, #f0e4d0);
        position: relative;
      }
      .wood-panel {
        background: linear-gradient(135deg, #5c4033, #3e2a1f);
        position: relative;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .leather {
        background: linear-gradient(135deg, #4a3428, #3a2820);
        position: relative;
      }
      .embossed {
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.3), -1px -1px 2px rgba(0, 0, 0, 0.5);
      }
      .gold-foil {
        background: linear-gradient(
          135deg,
          #d4af37,
          #c9a961 25%,
          #f4e4bc 50%,
          #c9a961 75%,
          #b8941f
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brass {
        background: linear-gradient(135deg, #b5a642, #8b7335);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 -1px 0 rgba(0, 0, 0, 0.3),
          0 2px 4px rgba(0, 0, 0, 0.4);
      }
      .wax-seal {
        background: radial-gradient(circle, #8b1a1a, #5c0f0f);
        box-shadow: 0 2px 8px rgba(139, 26, 26, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
      }

      /* Disable wheel + spinners */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* ====== NOTEBOOK RULED + DASHED ROWS (CBSE copy style) ====== */
      .ruled-paper {
        position: relative;
      }
      .ruled-paper::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 26px,
          rgba(30, 90, 255, 0.14) 27px
        );
        opacity: 0.35;
        z-index: 0;
      }
      .notebook-table tbody tr {
        border-bottom: 1px dashed rgba(139, 90, 43, 0.55);
      }
      .notebook-table tbody tr:last-child {
        border-bottom: none;
      }
      .notebook-table td,
      .notebook-table th {
        position: relative;
        z-index: 1; /* above ruled lines */
      }

      /* ====== PAGE FLIP ANIMATION ====== */
      .page-flip {
        transform-style: preserve-3d;
        transform-origin: left center;
        animation: flipPage 650ms ease;
      }
      @keyframes flipPage {
        0% {
          transform: rotateY(-88deg);
          opacity: 0.15;
        }
        45% {
          transform: rotateY(-22deg);
          opacity: 0.95;
        }
        100% {
          transform: rotateY(0deg);
          opacity: 1;
        }
      }

      /* Mobile tweaks */
      @media (max-width: 1024px) {
        .title-tight {
          letter-spacing: 0.12em !important;
        }
      }
      @media (max-width: 640px) {
        .title-tight {
          font-size: 22px !important;
          letter-spacing: 0.08em !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const svgBase =
        "w-5 h-5 stroke-current fill-none stroke-[2] stroke-linecap-round stroke-linejoin-round";

      function Icon({ name, className = svgBase, style }) {
        const paths = {
          Building2: (
            <>
              <path d="M3 21V3h18v18" />
              <path d="M9 21V9h6v12" />
              <path d="M7 7h.01M17 7h.01M7 11h.01M17 11h.01M7 15h.01M17 15h.01" />
            </>
          ),
          Plus: (
            <>
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </>
          ),
          ScrollText: (
            <>
              <path d="M8 21h12a2 2 0 0 0 2-2V7" />
              <path d="M6 3h12a2 2 0 0 1 2 2v2" />
              <path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2" />
              <path d="M6 17h10M6 13h10M6 9h10" />
            </>
          ),
          BookOpen: (
            <>
              <path d="M12 7v14" />
              <path d="M3 18a2 2 0 0 0 2 2h7V6H5a2 2 0 0 0-2 2z" />
              <path d="M21 18a2 2 0 0 1-2 2h-7V6h7a2 2 0 0 1 2 2z" />
            </>
          ),
          Pencil: (
            <>
              <path d="M17 3a2.85 2.85 0 0 1 4 4L7 21H3v-4Z" />
              <path d="M15 5l4 4" />
            </>
          ),
          Save: (
            <>
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8M7 3v5h8" />
            </>
          ),
          RotateCcw: (
            <>
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </>
          ),
          Undo2: (
            <>
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h10a6 6 0 0 1 0 12h-4" />
            </>
          ),
          Trash2: (
            <>
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" />
            </>
          ),
          TrendingDown: (
            <>
              <path d="M3 7l6 6 4-4 8 8" />
              <path d="M21 17V7h-10" />
            </>
          ),
          TrendingUp: (
            <>
              <path d="M3 17l6-6 4 4 8-8" />
              <path d="M21 7v10H11" />
            </>
          ),
          Search: (
            <>
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.3-4.3" />
            </>
          ),
          Info: (
            <>
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </>
          ),
          BadgeCheck: (
            <>
              <path d="M12 2l3 3 4 .5-2.5 3.2.8 4.3L12 11l-3.3 2.3.8-4.3L7 5.5 11 5z" />
              <path d="M9 12l2 2 4-4" />
            </>
          ),
          Feather: (
            <>
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
              <line x1="17.5" y1="15" x2="9" y2="15" />
            </>
          ),
          Scale: (
            <>
              <path d="M12 3v18" />
              <path d="M3 7h18" />
              <path d="M7 7l-4 8h8l-4-8ZM17 7l-4 8h8l-4-8ZM8 21h8" />
            </>
          ),
          LayoutDashboard: (
            <>
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="4" rx="1" />
              <rect x="14" y="9" width="7" height="12" rx="1" />
              <rect x="3" y="12" width="7" height="9" rx="1" />
            </>
          )
        };

        return (
          <svg className={className} style={style} viewBox="0 0 24 24">
            {paths[name]}
          </svg>
        );
      }

      const normalize = (n) => {
        n = String(n || "").trim().replace(/\s+/g, " ");
        return n
          ? n.replace(/A\/c\s*A\/c$/i, "A/c").replace(/a\/c$/i, "") + " A/c"
          : n;
      };

      const toPaise = (v) => {
        const n = Number(v);
        return Number.isFinite(n) && n > 0 ? Math.round(n * 100) : 0;
      };

      const paiseToStr = (p) => ((Number(p) || 0) / 100).toFixed(2);

      const safeParse = (s, f) => {
        try {
          const o = JSON.parse(s || "");
          return o == null ? f : o;
        } catch {
          return f;
        }
      };

      // Fallback if randomUUID not supported
      const uuid = () =>
        (crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "id-" + Math.random().toString(16).slice(2) + "-" + Date.now();

      function AccountingApp() {
        const [view, setView] = useState("new");
        const [flipKey, setFlipKey] = useState(0);

        const [journal, setJournal] = useState([]);
        const [undoStack, setUndoStack] = useState([]);

        const [date, setDate] = useState("");
        const [narration, setNarration] = useState("");
        const [debits, setDebits] = useState([]);
        const [credits, setCredits] = useState([]);
        const [editingIndex, setEditingIndex] = useState(null);

        const [journalSearch, setJournalSearch] = useState("");
        const [journalSearchMode, setJournalSearchMode] = useState("all");
        const [ledgerSearch, setLedgerSearch] = useState("");

        const reset = () => {
          setDate(new Date().toISOString().slice(0, 10));
          setNarration("");
          setDebits([{ id: uuid(), acc: "", amtStr: "", amt: 0 }]);
          setCredits([{ id: uuid(), acc: "", amtStr: "", amt: 0 }]);
          setEditingIndex(null);
        };

        useEffect(() => {
          setJournal(safeParse(localStorage.getItem("journalData"), []));
          setUndoStack(safeParse(localStorage.getItem("undoStack"), []));
          reset();

          // Disable scroll wheel changing number input values
          const h = (e) => {
            const t = e.target;
            if (t && t.tagName === "INPUT" && t.type === "number") {
              e.preventDefault();
            }
          };
          window.addEventListener("wheel", h, { passive: false });
          return () => window.removeEventListener("wheel", h);
        }, []);

        useEffect(() => localStorage.setItem("journalData", JSON.stringify(journal)), [journal]);
        useEffect(() => localStorage.setItem("undoStack", JSON.stringify(undoStack)), [undoStack]);

        const changeView = (v) => {
          setView(v);
          setFlipKey((k) => k + 1);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const updateRow = (type, i, field, val) => {
          const update = (list) => {
            const n = [...list];
            const item = { ...n[i] };
            if (field === "acc") item.acc = val;
            else {
              item.amtStr = val;
              item.amt = toPaise(val);
            }
            n[i] = item;
            return n;
          };
          type === "debit" ? setDebits(update) : setCredits(update);
        };

        const removeRow = (type, i) => {
          const fn = (prev) => (prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev);
          type === "debit" ? setDebits(fn) : setCredits(fn);
        };

        const debitParts = useMemo(() => {
          const v = debits.map((d) => normalize(d.acc)).filter(Boolean);
          return v.length ? "By " + v.join(", ") : "";
        }, [debits]);

        const creditParts = useMemo(() => {
          const v = credits.map((c) => normalize(c.acc)).filter(Boolean);
          return v.length ? "To " + v.join(", ") : "";
        }, [credits]);

        const handleSave = () => {
          const fD = debits
            .map((d) => ({ ...d, acc: normalize(d.acc) }))
            .filter((d) => d.acc || d.amt > 0);

          const fC = credits
            .map((c) => ({ ...c, acc: normalize(c.acc) }))
            .filter((c) => c.acc || c.amt > 0);

          const err = [];
          if (!fD.length) err.push("Add at least 1 debit line.");
          if (!fC.length) err.push("Add at least 1 credit line.");

          fD.forEach((d, i) => {
            if (!d.acc) err.push(`Debit row ${i + 1}: Account name required.`);
            if (d.amt <= 0) err.push(`Debit row ${i + 1}: Amount must be > 0.`);
          });

          fC.forEach((c, i) => {
            if (!c.acc) err.push(`Credit row ${i + 1}: Account name required.`);
            if (c.amt <= 0) err.push(`Credit row ${i + 1}: Amount must be > 0.`);
          });

          const dT = fD.reduce((s, d) => s + d.amt, 0);
          const cT = fC.reduce((s, c) => s + c.amt, 0);

          if (dT !== cT)
            err.push(
              `Debit total (₹${paiseToStr(dT)}) must equal Credit total (₹${paiseToStr(cT)}).`
            );

          if (err.length)
            return alert(
              "Please fix these errors:\n\n" + err.map((e) => "• " + e).join("\n")
            );

          const entry = {
            date: date || new Date().toISOString().slice(0, 10),
            narration: narration || "-",
            debits: fD.map((d) => ({ acc: d.acc, amt: d.amt })),
            credits: fC.map((c) => ({ acc: c.acc, amt: c.amt })),
            jf: "-"
          };

          if (editingIndex !== null) {
            const old = JSON.parse(JSON.stringify(journal[editingIndex]));
            setUndoStack((p) => [...p, { type: "edit", index: editingIndex, oldEntry: old }]);
            setJournal((p) => {
              const c = [...p];
              c[editingIndex] = entry;
              return c;
            });
            alert("✓ Entry updated successfully!");
          } else {
            setUndoStack((p) => [...p, { type: "add", index: journal.length, entry }]);
            setJournal((p) => [...p, entry]);
          }

          reset();
        };

        const handleEdit = (i) => {
          const e = journal[i];
          setDate(e.date);
          setNarration(e.narration === "-" ? "" : e.narration);
          setDebits(
            e.debits.map((d) => ({
              id: uuid(),
              acc: d.acc,
              amt: d.amt,
              amtStr: paiseToStr(d.amt)
            }))
          );
          setCredits(
            e.credits.map((c) => ({
              id: uuid(),
              acc: c.acc,
              amt: c.amt,
              amtStr: paiseToStr(c.amt)
            }))
          );
          setEditingIndex(i);
          changeView("new");
        };

        const handleDelete = (i) => {
          if (!confirm(`Delete Entry #${i + 1}?`)) return;
          const old = JSON.parse(JSON.stringify(journal[i]));
          setUndoStack((p) => [...p, { type: "delete", index: i, oldEntry: old }]);
          setJournal((p) => p.filter((_, idx) => idx !== i));
        };

        const handleDeleteAll = () => {
          if (!journal.length) return alert("No entries to delete.");
          if (!confirm("DELETE ALL ENTRIES?\nThis action can be undone.")) return;
          setUndoStack((p) => [
            ...p,
            { type: "deleteAll", prevJournal: JSON.parse(JSON.stringify(journal)) }
          ]);
          setJournal([]);
          alert("✓ All entries deleted successfully!");
        };

        const handleUndo = () => {
          if (!undoStack.length) return alert("Nothing to undo.");
          const last = undoStack[undoStack.length - 1];
          setUndoStack((p) => p.slice(0, -1));

          if (last.type === "add") setJournal((p) => p.filter((_, i) => i !== last.index));
          else if (last.type === "edit")
            setJournal((p) => {
              const c = [...p];
              if (c[last.index]) c[last.index] = last.oldEntry;
              return c;
            });
          else if (last.type === "delete")
            setJournal((p) => {
              const c = [...p];
              c.splice(last.index, 0, last.oldEntry);
              return c;
            });
          else if (last.type === "deleteAll") setJournal(last.prevJournal || []);
        };

        const ledgerData = useMemo(() => {
          const ledger = {};
          const accSet = new Set();

          journal.forEach((e) => {
            e.debits.forEach((d) => accSet.add(d.acc));
            e.credits.forEach((c) => accSet.add(c.acc));
          });

          const sorted = Array.from(accSet).sort();
          const folioMap = {};
          sorted.forEach((a, i) => (folioMap[a] = "L" + (i + 1)));

          const ensure = (a) => {
            if (!ledger[a]) ledger[a] = [];
          };

          journal.forEach((e, idx) => {
            const jf = e.jf || "-";
            const cP = "To " + e.credits.map((c) => c.acc).join(", ");
            const dP = "By " + e.debits.map((d) => d.acc).join(", ");

            e.debits.forEach((d) => {
              ensure(d.acc);
              ledger[d.acc].push({
                entryIndex: idx,
                date: e.date,
                particulars: cP,
                debit: d.amt,
                credit: 0,
                jf,
                lf: folioMap[d.acc] || "-"
              });
            });

            e.credits.forEach((c) => {
              ensure(c.acc);
              ledger[c.acc].push({
                entryIndex: idx,
                date: e.date,
                particulars: dP,
                debit: 0,
                credit: c.amt,
                jf,
                lf: folioMap[c.acc] || "-"
              });
            });
          });

          return { ledger, folioMap };
        }, [journal]);

        const trialBalance = useMemo(() => {
          const accs = Object.keys(ledgerData.ledger || {}).sort();
          const rows = accs.map((acc) => {
            const entries = ledgerData.ledger[acc] || [];
            const dr = entries.reduce((s, e) => s + (e.debit || 0), 0);
            const cr = entries.reduce((s, e) => s + (e.credit || 0), 0);
            const bal = dr - cr;

            return {
              acc,
              debit: bal > 0 ? bal : 0,
              credit: bal < 0 ? Math.abs(bal) : 0,
              lf: ledgerData.folioMap?.[acc] || "-"
            };
          });

          return {
            rows,
            totalDr: rows.reduce((s, r) => s + r.debit, 0),
            totalCr: rows.reduce((s, r) => s + r.credit, 0)
          };
        }, [ledgerData]);

        const getFilteredJournal = () => {
          if (!journalSearch) return journal;
          const q = journalSearch.toLowerCase();
          return journal.filter((e) => {
            const d = e.date.toLowerCase();
            const n = e.narration.toLowerCase();
            const a = [...e.debits, ...e.credits].map((x) => x.acc.toLowerCase()).join(" ");
            return journalSearchMode === "date"
              ? d.includes(q)
              : journalSearchMode === "narration"
              ? n.includes(q)
              : journalSearchMode === "account"
              ? a.includes(q)
              : d.includes(q) || n.includes(q) || a.includes(q);
          });
        };

        const getFilteredLedger = () => {
          const accs = Object.keys(ledgerData.ledger).sort();
          if (!ledgerSearch) return accs;
          return accs.filter((a) => a.toLowerCase().includes(ledgerSearch.toLowerCase()));
        };

        const fonts = {
          p: '"Playfair Display", serif',
          c: '"Crimson Text", serif',
          e: '"EB Garamond", serif'
        };

        const btn1 =
          "px-6 py-2.5 bg-[#3a2820] border-2 border-[#5c4033] text-[#d4af37] hover:bg-[#2a1f18] hover:border-[#8b6f47] rounded-md font-bold text-xs tracking-widest uppercase flex items-center gap-2 transition-all shadow-lg";

        const inp =
          "w-full px-4 py-3.5 bg-[#faf8f3] border-2 border-[#b8956a] rounded-md text-[#3e2a1f] focus:border-[#8b6f47] focus:ring-4 focus:ring-[#d4af37]/20 transition-all outline-none shadow-inner font-semibold";

        return (
          <div className="min-h-screen relative z-10" style={{ fontFamily: fonts.e }}>
            <header className="wood-panel sticky top-0 z-50 border-b-4 border-[#d4af37] shadow-2xl">
              <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 relative z-10">
                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 py-4">
                  <div className="flex items-center gap-5">
                    <div className="wax-seal p-3 rounded-full relative">
                      <Icon name="Feather" className="w-8 h-8 text-[#d4af37]" />
                    </div>
                    <div>
                      <h1
                        className="text-2xl sm:text-3xl lg:text-4xl font-bold gold-foil embossed title-tight"
                        style={{ fontFamily: fonts.p }}
                      >
                        SARASWATI INTERNATIONAL SCHOOL
                      </h1>
                      <p className="text-[10px] sm:text-xs text-[#c9a961] font-semibold tracking-[0.25em] uppercase mt-1.5">
                        Accounts & Ledger System
                      </p>
                    </div>
                  </div>

                  {/* SINGLE DROPDOWN MENU */}
                  <div className="w-full lg:w-auto leather rounded-lg px-4 py-3 border-2 border-[#8b5a2b] shadow-inner flex items-center gap-3">
                    <div className="brass p-2 rounded">

                      const maxRows = Math.max(drRows.length, crRows.length);

                                          ? "text-left"
                                          : i === 2
                                          ? "text-center w-20"
                                          : i === 3
                                          ? "text-right w-32 border-r-4 border-[#d4c5b0]"
                                          : i === 4
                                          ? "text-left w-32 pl-8"

                                        style={{ fontFamily: fonts.e }}

                                        {d?.particulars || ""}

                                        {d ? paiseToStr(d.debit) : ""}
                                      </td>

                                      <td className="px-5 py-3 text-[#3e2a1f] font-semibold pl-8" style={{ fontFamily: fonts.e }}>
                                        {c?.date || ""}
                                      </td>
                                      <td
                                        className="px-5 py-3 text-[#2c1810] font-medium truncate max-w-[200px]"
                                        title={c?.particulars}
                                        style={{ fontFamily: fonts.e }}
                                      >
                                        {c?.particulars || ""}
                                      </td>
                                      <td className="px-5 py-3 text-center text-[#8b6f47] font-semibold" style={{ fontFamily: fonts.e }}>
                                        {c ? c.jf || "-" : ""}
                                      </td>
                                      <td className="px-5 py-3 text-right font-mono text-[#5c3a2e] font-bold bg-[#fff3e0]/20">
                                        {c ? paiseToStr(c.credit) : ""}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ================= TRIAL BALANCE ================= */}
              {view === "trial" && (
                <div key={"trial-" + flipKey} className="page-flip space-y-8">
                  <div className="parchment rounded-lg border-4 border-[#8b6f47] shadow-2xl overflow-hidden">
                    <div className="wood-panel px-6 sm:px-10 py-6 border-b-4 border-[#d4af37] flex items-center justify-between gap-4 flex-wrap">
                      <h2
                        className="text-2xl sm:text-3xl font-bold flex items-center gap-4 text-[#f4e4bc] embossed"
                        style={{ fontFamily: fonts.p, letterSpacing: "0.15em" }}
                      >
                        <div className="brass p-2 rounded">
                          <Icon name="Scale" className="w-6 h-6 text-[#2c1810]" />
                        </div>
                        Trial Balance
                      </h2>
                      <span className="brass px-5 py-2 rounded-full text-xs font-bold text-[#2c1810] uppercase tracking-widest">
                        Auto Generated
                      </span>
                    </div>

                    <div className="p-6 sm:p-8">
                      {trialBalance.rows.length === 0 ? (
                        <div className="p-16 sm:p-20 text-center">
                          <div className="brass w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center">
                            <Icon name="Scale" className="w-10 h-10 text-[#2c1810]" />
                          </div>
                          <h3 className="text-xl sm:text-2xl text-[#5c4033] font-bold mb-2" style={{ fontFamily: fonts.p }}>
                            No Data Yet
                          </h3>
                          <p className="text-[#8b6f47] italic" style={{ fontFamily: fonts.c }}>
                            Create journal entries to generate Trial Balance automatically.
                          </p>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-sm notebook-table ruled-paper">
                            <thead>
                              <tr className="leather border-b-2 border-[#8b6f47]">
                                {["Particulars", "L.F.", "Debit (₹)", "Credit (₹)"].map((h, i) => (
                                  <th
                                    key={h}
                                    className={`px-6 py-4 font-bold text-[#f4e4bc] uppercase tracking-[0.2em] ${
                                      i === 0
                                        ? "text-left"
                                        : i === 1
                                        ? "text-center w-24 border-l border-r border-[#5c4033]/50"
                                        : i === 2
                                        ? "text-right w-40 border-r border-[#5c4033]/50"
                                        : "text-right w-40"
                                    }`}
                                    style={{ fontFamily: fonts.p, fontSize: "11px" }}
                                  >
                                    {h}
                                  </th>
                                ))}
                              </tr>
                            </thead>

                            <tbody className="divide-y divide-[#d4c5b0]">
                              {trialBalance.rows.map((r, i) => (
                                <tr key={i} className="hover:bg-[#f5ede0]">
                                  <td className="px-6 py-4 text-[#2c1810] font-semibold" style={{ fontFamily: fonts.e }}>
                                    {r.acc}
                                  </td>
                                  <td
                                    className="px-6 py-4 text-center text-[#5c4033] font-semibold border-l border-r border-[#e8dcc8]"
                                    style={{ fontFamily: fonts.e }}
                                  >
                                    {r.lf}
                                  </td>
                                  <td className="px-6 py-4 text-right font-mono text-[#2e4a2e] font-bold bg-[#e8f5e9]/40 border-r border-[#e8dcc8]">
                                    {r.debit ? paiseToStr(r.debit) : ""}
                                  </td>
                                  <td className="px-6 py-4 text-right font-mono text-[#5c3a2e] font-bold bg-[#fff3e0]/40">
                                    {r.credit ? paiseToStr(r.credit) : ""}
                                  </td>
                                </tr>
                              ))}
                            </tbody>

                            <tfoot>
                              <tr className="wood-panel border-t-4 border-[#d4af37]">
                                <td
                                  className="px-6 py-5 text-[#f4e4bc] font-bold uppercase tracking-[0.2em]"
                                  style={{ fontFamily: fonts.p, fontSize: "11px" }}
                                >
                                  Total
                                </td>
                                <td className="px-6 py-5 border-l border-r border-[#5c4033]/50"></td>
                                <td className="px-6 py-5 text-right font-mono text-[#f4e4bc] font-bold">
                                  {paiseToStr(trialBalance.totalDr)}
                                </td>
                                <td className="px-6 py-5 text-right font-mono text-[#f4e4bc] font-bold">
                                  {paiseToStr(trialBalance.totalCr)}
                                </td>
                              </tr>
                            </tfoot>
                          </table>

                          <div className="mt-6 text-center">
                            <span
                              className={`inline-block px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest border-2 ${
                                trialBalance.totalDr === trialBalance.totalCr
                                  ? "bg-[#e8f5e9] text-[#2e4a2e] border-[#556b2f]"
                                  : "bg-[#fff3e0] text-[#5c3a2e] border-[#8b4513]"
                              }`}
                            >
                              {trialBalance.totalDr === trialBalance.totalCr
                                ? "✓ Trial Balance Matched"
                                : "⚠ Trial Balance Not Matched"}
                            </span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<AccountingApp />);
    </script>
  </body>
</html>
