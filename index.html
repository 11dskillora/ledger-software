<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Compound Journal & Ledger</title>

<style>
body{
    font-family:Arial;
    background:#eef2f3;
    padding:20px;
}
h1{text-align:center}
button{
    padding:10px;
    margin:5px;
    border:none;
    background:#34495e;
    color:white;
    cursor:pointer;
}
.card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
}
.row{
    display:flex;
    gap:10px;
    margin-top:5px;
}
input{
    padding:6px;
    width:100%;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
th,td{
    border:1px solid #999;
    padding:6px;
    text-align:center;
}
th{background:#34495e;color:white;}
</style>
</head>

<body>

<h1>📘 Compound Journal & Ledger</h1>

<button onclick="addEntryUI()">Add Compound Journal Entry</button>
<button onclick="viewJournal()">View Compound Journal</button>
<button onclick="viewLedger()">View Ledger</button>

<div id="content"></div>

<script>
let journal = [];
let ledger = {};

/* ---------------- ADD ENTRY ---------------- */
function addEntryUI(){
document.getElementById("content").innerHTML=`
<div class="card">
Date <input type="date" id="date">

<h3>Debit Accounts</h3>
<div id="debits"></div>
<button onclick="addRow('debits')">+ Debit</button>

<h3>Credit Accounts</h3>
<div id="credits"></div>
<button onclick="addRow('credits')">+ Credit</button>

Narration <input id="narr">

<br><br>
<button onclick="saveEntry()">Save Entry</button>
</div>`;
addRow("debits");
addRow("credits");
}

function addRow(id){
document.getElementById(id).innerHTML+=`
<div class="row">
<input placeholder="Account Name">
<input type="number" placeholder="Amount">
</div>`;
}

/* ---------------- SAVE ENTRY ---------------- */
function saveEntry(){
let date=document.getElementById("date").value;
let narr=document.getElementById("narr").value;

let dr=[],cr=[],drT=0,crT=0;

document.querySelectorAll("#debits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){dr.push({a,m});drT+=m;}
});

document.querySelectorAll("#credits .row").forEach(r=>{
let a=r.children[0].value;
let m=+r.children[1].value;
if(a && m){cr.push({a,m});crT+=m;}
});

if(drT!==crT || drT===0){
alert("Debit & Credit must match");
return;
}

/* STORE JOURNAL ENTRY */
journal.push({date,dr,cr,narr});

/* POST TO LEDGER */
dr.forEach(d=>{
if(!ledger[d.a]) ledger[d.a]=[];
ledger[d.a].push({date,p:"To "+cr.map(x=>x.a).join(", "),dr:d.m,cr:""});
});
cr.forEach(c=>{
if(!ledger[c.a]) ledger[c.a]=[];
ledger[c.a].push({date,p:"By "+dr.map(x=>x.a).join(", "),dr:"",cr:c.m});
});

alert("Compound Journal Entry Saved ✅");
}

/* ---------------- VIEW JOURNAL ---------------- */
function viewJournal(){
if(journal.length===0){
document.getElementById("content").innerHTML=
"<div class='card'>No Journal Entries</div>";
return;
}

let h="<div class='card'><h3>Compound Journal Book</h3>";

journal.forEach(j=>{
h+=`
<table>
<tr><th>Date</th><th>Particulars</th><th>Dr (₹)</th><th>Cr (₹)</th></tr>`;
j.dr.forEach(d=>{
h+=`<tr>
<td>${j.date}</td>
<td>${d.a} A/c</td>
<td>${d.m}</td>
<td></td>
</tr>`;
});
j.cr.forEach(c=>{
h+=`<tr>
<td></td>
<td>To ${c.a} A/c</td>
<td></td>
<td>${c.m}</td>
</tr>`;
});
h+=`<tr>
<td></td>
<td colspan="3"><i>${j.narr}</i></td>
</tr></table><br>`;
});

h+="</div>";
document.getElementById("content").innerHTML=h;
}

/* ---------------- VIEW LEDGER ---------------- */
function viewLedger(){
let h="<div class='card'><h3>Ledger</h3>";
for(let a in ledger){
h+=`<h4>${a}</h4>
<table>
<tr><th>Date</th><th>Particulars</th><th>Dr</th><th>Cr</th></tr>`;
ledger[a].forEach(t=>{
h+=`<tr>
<td>${t.date}</td>
<td>${t.p}</td>
<td>${t.dr}</td>
<td>${t.cr}</td>
</tr>`;
});
h+="</table>";
}
h+="</div>";
document.getElementById("content").innerHTML=h;
}
</script>

</body>
</html>
