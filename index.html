<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Ledger - Premium Accounting</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 + ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      html,
      body {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // --- Inline Icon Component (Lucide-like SVGs) ---
      function Icon({ name, className }) {
        const base =
          "w-5 h-5 stroke-current fill-none stroke-[2] stroke-linecap-round stroke-linejoin-round";
        const cls = className ? className : base;

        const icons = {
          Building2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 21V3h18v18" />
              <path d="M9 21V9h6v12" />
              <path d="M7 7h.01" />
              <path d="M17 7h.01" />
              <path d="M7 11h.01" />
              <path d="M17 11h.01" />
              <path d="M7 15h.01" />
              <path d="M17 15h.01" />
            </svg>
          ),
          Plus: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          ),
          ScrollText: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M8 21h12a2 2 0 0 0 2-2V7" />
              <path d="M6 3h12a2 2 0 0 1 2 2v2" />
              <path d="M6 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2" />
              <path d="M6 17h10" />
              <path d="M6 13h10" />
              <path d="M6 9h10" />
            </svg>
          ),
          BookOpen: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 7v14" />
              <path d="M3 18a2 2 0 0 0 2 2h7V6H5a2 2 0 0 0-2 2z" />
              <path d="M21 18a2 2 0 0 1-2 2h-7V6h7a2 2 0 0 1 2 2z" />
            </svg>
          ),
          Pencil: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M17 3a2.85 2.85 0 0 1 4 4L7 21H3v-4Z" />
              <path d="M15 5l4 4" />
            </svg>
          ),
          Save: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8" />
              <path d="M7 3v5h8" />
            </svg>
          ),
          RotateCcw: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          ),
          Undo2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M9 14 4 9l5-5" />
              <path d="M4 9h10a6 6 0 0 1 0 12h-4" />
            </svg>
          ),
          Trash2: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
            </svg>
          ),
          TrendingDown: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 7l6 6 4-4 8 8" />
              <path d="M21 17V7h-10" />
            </svg>
          ),
          TrendingUp: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M3 17l6-6 4 4 8-8" />
              <path d="M21 7v10H11" />
            </svg>
          ),
          Search: (
            <svg className={cls} viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
          ),
          Info: (
            <svg className={cls} viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
          ),
          BadgeCheck: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M12 2l3 3 4 .5-2.5 3.2.8 4.3L12 11l-3.3 2.3.8-4.3L7 5.5 11 5z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
          ),
          ClipboardList: (
            <svg className={cls} viewBox="0 0 24 24">
              <path d="M9 5h6" />
              <path d="M9 3h6v4H9z" />
              <path d="M6 7h12v14H6z" />
              <path d="M9 11h6" />
              <path d="M9 15h6" />
            </svg>
          ),
        };

        return icons[name] || null;
      }

      // --- Helper Functions ---
      function normalizeAccountName(name) {
        let n = String(name || "").trim();
        if (!n) return "";
        n = n.replace(/\s+/g, " ");
        if (!/a\/c$/i.test(n)) n = n + " A/c";
        n = n.replace(/A\/c\s*A\/c$/i, "A/c");
        n = n.charAt(0).toUpperCase() + n.slice(1);
        return n;
      }

      function toPaise(v) {
        const n = Number(v);
        if (!Number.isFinite(n) || n <= 0) return 0;
        return Math.round(n * 100);
      }

      function paiseToStr(p) {
        p = Number(p) || 0;
        return (p / 100).toFixed(2);
      }

      function safeJSONParse(str, fallback) {
        try {
          const obj = JSON.parse(str || "");
          return obj == null ? fallback : obj;
        } catch {
          return fallback;
        }
      }

      // --- App ---
      function AccountingApp() {
        const [view, setView] = useState("new");
        const [journal, setJournal] = useState([]);
        const [undoStack, setUndoStack] = useState([]);

        const [date, setDate] = useState("");
        const [narration, setNarration] = useState("");
        const [debits, setDebits] = useState([]);
        const [credits, setCredits] = useState([]);
        const [editingIndex, setEditingIndex] = useState(null);

        const [journalSearch, setJournalSearch] = useState("");
        const [journalSearchMode, setJournalSearchMode] = useState("all");
        const [ledgerSearch, setLedgerSearch] = useState("");

        const resetFormState = () => {
          setDate(new Date().toISOString().slice(0, 10));
          setNarration("");
          setDebits([{ id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);
          setCredits([{ id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);
          setEditingIndex(null);
        };

        useEffect(() => {
          const j = safeJSONParse(localStorage.getItem("journalData"), []);
          const u = safeJSONParse(localStorage.getItem("undoStack"), []);
          if (Array.isArray(j)) setJournal(j);
          if (Array.isArray(u)) setUndoStack(u);
          resetFormState();
          // eslint-disable-next-line
        }, []);

        useEffect(() => {
          localStorage.setItem("journalData", JSON.stringify(journal));
        }, [journal]);

        useEffect(() => {
          localStorage.setItem("undoStack", JSON.stringify(undoStack));
        }, [undoStack]);

        const addDebitRow = () =>
          setDebits((prev) => [...prev, { id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);

        const addCreditRow = () =>
          setCredits((prev) => [...prev, { id: crypto.randomUUID(), acc: "", amtStr: "", amt: 0 }]);

        const updateRow = (type, index, field, value) => {
          const updateList = (list) => {
            const newList = [...list];
            const item = { ...newList[index] };
            if (field === "acc") item.acc = value;
            if (field === "amtStr") {
              item.amtStr = value;
              item.amt = toPaise(value);
            }
            newList[index] = item;
            return newList;
          };

          if (type === "debit") setDebits((prev) => updateList(prev));
          else setCredits((prev) => updateList(prev));
        };

        const removeRow = (type, index) => {
          if (type === "debit") {
            setDebits((prev) => (prev.length > 1 ? prev.filter((_, i) => i !== index) : prev));
          } else {
            setCredits((prev) => (prev.length > 1 ? prev.filter((_, i) => i !== index) : prev));
          }
        };

        const debitParticulars = useMemo(() => {
          const validAccs = debits.map((d) => normalizeAccountName(d.acc)).filter(Boolean);
          return validAccs.length ? "By " + validAccs.join(", ") : "";
        }, [debits]);

        const creditParticulars = useMemo(() => {
          const validAccs = credits.map((c) => normalizeAccountName(c.acc)).filter(Boolean);
          return validAccs.length ? "To " + validAccs.join(", ") : "";
        }, [credits]);

        const handleSaveEntry = () => {
          const finalDebits = debits
            .map((d) => ({ ...d, acc: normalizeAccountName(d.acc) }))
            .filter((d) => d.acc || d.amt > 0);

          const finalCredits = credits
            .map((c) => ({ ...c, acc: normalizeAccountName(c.acc) }))
            .filter((c) => c.acc || c.amt > 0);

          const errors = [];

          if (!finalDebits.length) errors.push("Add at least 1 debit line.");
          if (!finalCredits.length) errors.push("Add at least 1 credit line.");

          finalDebits.forEach((d, i) => {
            if (!d.acc) errors.push(`Debit row ${i + 1}: Account name is required.`);
            if (d.amt <= 0) errors.push(`Debit row ${i + 1}: Amount must be > 0.`);
          });

          finalCredits.forEach((c, i) => {
            if (!c.acc) errors.push(`Credit row ${i + 1}: Account name is required.`);
            if (c.amt <= 0) errors.push(`Credit row ${i + 1}: Amount must be > 0.`);
          });

          const dTotal = finalDebits.reduce((sum, d) => sum + d.amt, 0);
          const cTotal = finalCredits.reduce((sum, c) => sum + c.amt, 0);

          if (dTotal !== cTotal) {
            errors.push(
              `Debit total (₹${paiseToStr(dTotal)}) must equal Credit total (₹${paiseToStr(cTotal)}).`
            );
          }

          if (errors.length) {
            alert("Please fix these errors:\n\n" + errors.map((e) => "• " + e).join("\n"));
            return;
          }

          const entry = {
            date: date || new Date().toISOString().slice(0, 10),
            narration: narration || "-",
            debits: finalDebits.map((d) => ({ acc: d.acc, amt: d.amt })),
            credits: finalCredits.map((c) => ({ acc: c.acc, amt: c.amt })),
            jf: "-",
          };

          if (editingIndex !== null) {
            const oldEntry = JSON.parse(JSON.stringify(journal[editingIndex]));
            setUndoStack((prev) => [...prev, { type: "edit", index: editingIndex, oldEntry }]);

            setJournal((prev) => {
              const copy = [...prev];
              copy[editingIndex] = entry;
              return copy;
            });

            alert("✓ Entry updated successfully!");
          } else {
            setUndoStack((prev) => [...prev, { type: "add", index: journal.length, entry }]);
            setJournal((prev) => [...prev, entry]);
          }

          resetFormState();
        };

        const handleEditEntry = (index) => {
          const e = journal[index];
          setDate(e.date);
          setNarration(e.narration === "-" ? "" : e.narration);

          setDebits(
            e.debits.map((d) => ({
              id: crypto.randomUUID(),
              acc: d.acc,
              amt: d.amt,
              amtStr: paiseToStr(d.amt),
            }))
          );

          setCredits(
            e.credits.map((c) => ({
              id: crypto.randomUUID(),
              acc: c.acc,
              amt: c.amt,
              amtStr: paiseToStr(c.amt),
            }))
          );

          setEditingIndex(index);
          setView("new");
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const handleDeleteEntry = (index) => {
          if (!window.confirm(`Delete Entry #${index + 1}?`)) return;
          const oldEntry = JSON.parse(JSON.stringify(journal[index]));
          setUndoStack((prev) => [...prev, { type: "delete", index, oldEntry }]);
          setJournal((prev) => prev.filter((_, i) => i !== index));
        };

        const handleDeleteAll = () => {
          if (!journal.length) return alert("No entries to delete.");
          if (!window.confirm("DELETE ALL ENTRIES?\nThis action can be undone.")) return;

          setUndoStack((prev) => [
            ...prev,
            { type: "deleteAll", prevJournal: JSON.parse(JSON.stringify(journal)) },
          ]);
          setJournal([]);
          alert("✓ All entries deleted successfully!");
        };

        const handleUndo = () => {
          if (!undoStack.length) return alert("Nothing to undo.");

          const last = undoStack[undoStack.length - 1];
          setUndoStack((prev) => prev.slice(0, -1));

          if (last.type === "add") {
            setJournal((prev) => prev.filter((_, i) => i !== last.index));
          } else if (last.type === "edit") {
            setJournal((prev) => {
              const copy = [...prev];
              if (copy[last.index]) copy[last.index] = last.oldEntry;
              return copy;
            });
          } else if (last.type === "delete") {
            setJournal((prev) => {
              const copy = [...prev];
              copy.splice(last.index, 0, last.oldEntry);
              return copy;
            });
          } else if (last.type === "deleteAll") {
            setJournal(last.prevJournal || []);
          }
        };

        // Ledger generation (L.F.)
        const ledgerData = useMemo(() => {
          const ledger = {};
          const accSet = new Set();

          journal.forEach((e) => {
            e.debits.forEach((d) => accSet.add(d.acc));
            e.credits.forEach((c) => accSet.add(c.acc));
          });

          const sortedAccs = Array.from(accSet).sort();
          const folioMap = {};
          sortedAccs.forEach((acc, i) => (folioMap[acc] = "L" + (i + 1)));

          const ensureAcc = (acc) => {
            if (!ledger[acc]) ledger[acc] = [];
          };

          journal.forEach((entry, idx) => {
            const jf = entry.jf || "-";
            const creditParticularsStr = "To " + entry.credits.map((c) => c.acc).join(", ");
            const debitParticularsStr = "By " + entry.debits.map((d) => d.acc).join(", ");

            entry.debits.forEach((d) => {
              ensureAcc(d.acc);
              ledger[d.acc].push({
                entryIndex: idx,
                date: entry.date,
                particulars: creditParticularsStr,
                debit: d.amt,
                credit: 0,
                jf,
                lf: folioMap[d.acc] || "-",
              });
            });

            entry.credits.forEach((c) => {
              ensureAcc(c.acc);
              ledger[c.acc].push({
                entryIndex: idx,
                date: entry.date,
                particulars: debitParticularsStr,
                debit: 0,
                credit: c.amt,
                jf,
                lf: folioMap[c.acc] || "-",
              });
            });
          });

          return { ledger, folioMap };
        }, [journal]);

        // Trial Balance auto generation
        const trialBalance = useMemo(() => {
          const accounts = Object.keys(ledgerData.ledger || {}).sort();
          const rows = accounts.map((acc) => {
            const entries = ledgerData.ledger[acc] || [];
            const dr = entries.reduce((s, e) => s + (e.debit || 0), 0);
            const cr = entries.reduce((s, e) => s + (e.credit || 0), 0);
            const bal = dr - cr;
            return {
              acc,
              debit: bal > 0 ? bal : 0,
              credit: bal < 0 ? Math.abs(bal) : 0,
            };
          });

          const totalDr = rows.reduce((s, r) => s + r.debit, 0);
          const totalCr = rows.reduce((s, r) => s + r.credit, 0);

          return { rows, totalDr, totalCr };
        }, [ledgerData]);

        const getFilteredJournal = () => {
          if (!journalSearch) return journal;
          const q = journalSearch.toLowerCase();

          return journal.filter((e) => {
            const dateStr = e.date.toLowerCase();
            const narr = e.narration.toLowerCase();
            const accs = [...e.debits, ...e.credits].map((x) => x.acc.toLowerCase()).join(" ");

            if (journalSearchMode === "date") return dateStr.includes(q);
            if (journalSearchMode === "narration") return narr.includes(q);
            if (journalSearchMode === "account") return accs.includes(q);
            return dateStr.includes(q) || narr.includes(q) || accs.includes(q);
          });
        };

        const getFilteredLedgerAccounts = () => {
          const accounts = Object.keys(ledgerData.ledger).sort();
          if (!ledgerSearch) return accounts;
          const q = ledgerSearch.toLowerCase();
          return accounts.filter((a) => a.toLowerCase().includes(q));
        };

        return (
          <div
            className="min-h-screen bg-[#f4f1ea] text-[#4a3b32] font-serif selection:bg-[#d4b483] selection:text-[#2c1810]"
            style={{ fontFamily: '"Crimson Text", serif' }}
          >
            {/* Header */}
            <header className="relative bg-gradient-to-r from-[#5c4033] via-[#704214] to-[#5c4033] border-b-4 border-[#8b5e3c] sticky top-0 z-50 shadow-xl">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
                <div className="flex justify-between h-20 items-center">
                  <div className="flex items-center gap-4">
                    <div className="bg-gradient-to-br from-[#d4af37] to-[#8b6c42] p-2 rounded-lg text-[#2c1810] shadow-lg ring-1 ring-[#f4e4bc]/30">
                      <Icon name="Building2" className="w-7 h-7" />
                    </div>
                    <div>
                      <h1
                        className="text-2xl font-bold tracking-wide text-[#f4e4bc] leading-none"
                        style={{ fontFamily: '"Playfair Display", serif' }}
                      >
                        ELITE LEDGER
                      </h1>
                      <p className="text-xs text-[#d4af37] font-semibold tracking-[0.2em] uppercase mt-1">
                        Premium Accounting
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center bg-[#4a3228] rounded-full p-1 border border-[#6d4c3d] shadow-inner">
                    {[
                      { id: "new", label: "Transaction", icon: "Plus" },
                      { id: "journal", label: "Journal", icon: "ScrollText" },
                      { id: "ledger", label: "LedgerBook", icon: "BookOpen" },
                      { id: "trial", label: "Trial Balance", icon: "ClipboardList" },
                    ].map((tab) => (
                      <button
                        key={tab.id}
                        onClick={() => setView(tab.id)}
                        className={`
                          flex items-center gap-2 px-5 py-2 rounded-full text-sm font-bold transition-all duration-300
                          ${
                            view === tab.id
                              ? "bg-gradient-to-b from-[#f4e4bc] to-[#d4af37] text-[#3e2723] shadow-md transform scale-105"
                              : "text-[#a68b7c] hover:text-[#d4af37] hover:bg-[#5c4033]"
                          }
                        `}
                        style={{ fontFamily: '"Playfair Display", serif' }}
                      >
                        <Icon name={tab.icon} className="w-4 h-4" />
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </header>

            {/* Main */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">
              {/* NEW */}
              {view === "new" && (
                <div className="max-w-4xl mx-auto space-y-8">
                  <div className="bg-[#fdfbf7] rounded-xl shadow-[0_4px_20px_-4px_rgba(62,39,35,0.15)] border border-[#dcd0b9] overflow-hidden relative">
                    <div className="px-8 py-6 border-b border-[#e8dfcf] bg-[#faf8f2] flex items-center justify-between">
                      <h2
                        className="text-2xl font-bold flex items-center gap-3 text-[#5c4033]"
                        style={{ fontFamily: '"Playfair Display", serif' }}
                      >
                        <Icon name="Pencil" className="w-6 h-6 text-[#d4af37]" />
                        {editingIndex !== null ? "Edit Transaction" : "New Transaction Entry"}
                      </h2>

                      <div className="flex gap-3">
                        <button
                          onClick={handleDeleteAll}
                          className="px-5 py-2 bg-[#fff5f5] border-2 border-[#e6c8c8] text-[#a0522d] hover:bg-[#ffebeb] rounded-lg font-bold text-xs tracking-widest uppercase flex items-center gap-2 transition-colors"
                        >
                          <Icon name="Trash2" className="w-4 h-4" /> Delete All
                        </button>
                      </div>
                    </div>

                    <div className="p-8 space-y-10">
                      {/* Date + narration */}
                      <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
                        <div className="md:col-span-4">
                          <label className="block text-xs font-bold text-[#8d7b68] uppercase tracking-widest mb-2 font-sans">
                            Transaction Date
                          </label>
                          <input
                            type="date"
                            value={date}
                            onChange={(e) => setDate(e.target.value)}
                            className="w-full px-4 py-3 bg-[#fffefc] border-2 border-[#e6dec8] rounded-lg text-[#5c4033] focus:border-[#d4af37] focus:ring-4 focus:ring-[#d4af37]/10 transition-all outline-none font-medium"
                          />
                        </div>
                        <div className="md:col-span-8">
                          <label className="block text-xs font-bold text-[#8d7b68] uppercase tracking-widest mb-2 font-sans">
                            Narration
                          </label>
                          <input
                            type="text"
                            value={narration}
                            onChange={(e) => setNarration(e.target.value)}
                            placeholder="Description of the transaction..."
                            className="w-full px-4 py-3 bg-[#fffefc] border-2 border-[#e6dec8] rounded-lg text-[#5c4033] placeholder-[#d0c4b4] focus:border-[#d4af37] focus:ring-4 focus:ring-[#d4af37]/10 transition-all outline-none"
                          />
                        </div>
                      </div>

                      {/* Debits & Credits */}
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 relative">
                        <div className="space-y-4">
                          <h3
                            className="text-lg font-bold text-[#556b2f] border-b-2 border-[#556b2f]/20 pb-2 mb-4 flex items-center gap-2"
                            style={{ fontFamily: '"Playfair Display", serif' }}
                          >
                            <Icon name="TrendingDown" className="w-5 h-5" /> Debit Accounts
                          </h3>

                          <div className="space-y-4">
                            {debits.map((row, i) => (
                              <div key={row.id} className="flex gap-3 items-start">
                                <div className="flex-1 space-y-1">
                                  <input
                                    placeholder="Account Name"
                                    value={row.acc}
                                    onChange={(e) => updateRow("debit", i, "acc", e.target.value)}
                                    className="w-full px-3 py-2.5 bg-[#f9fcf8] border border-[#d5e0d5] rounded-md text-[#2c3e2c] focus:border-[#556b2f] focus:ring-2 focus:ring-[#556b2f]/20 outline-none shadow-sm placeholder-[#b0c4b0]"
                                  />
                                  <div className="text-[11px] text-[#8a9a8a] px-1 italic font-serif">
                                    {creditParticulars

                                  <td
                                    colSpan="3"
                                    className="px-4 py-3 text-right text-xs uppercase text-[#8d7b68] tracking-widest font-serif"
                                  >
                                    Total Cr.
                                  </td>
                                  <td className="px-4 py-3 text-right font-mono text-base">
                                    ₹{paiseToStr(crTotal)}
                                  </td>
                                </tr>
                              </tfoot>
                            </table>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<AccountingApp />);
    </script>
  </body>
</html>
