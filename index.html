<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SARASWATI INTERNATIONAL SCHOOL - Accounting System</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* =========================================================
       LIGHT WOODY PREMIUM UI
       Shader Background + Glassmorphism + 3D Cards
       ========================================================= */

    :root {
      /* Palette */
      --text-main: #3e2723;       /* Dark Coffee */
      --text-muted: #6d5d52;      /* Muted Brown */
      --gold: #bfa176;            /* Muted Gold */
      --gold-hover: #a68b5b;
      --glass: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --shadow-soft: 0 15px 35px rgba(62, 39, 35, 0.1);
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Lato', sans-serif;
    }

    * { box-sizing: border-box; cursor: none; /* Custom cursor */ }
    
    body {
      margin: 0; padding: 0;
      font-family: var(--font-body);
      color: var(--text-main);
      overflow-x: hidden;
      background: #f0e6d2; /* Fallback */
    }

    /* --- Custom Cursor --- */
    .cursor-dot, .cursor-outline {
      position: fixed; top: 0; left: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%; z-index: 9999;
      pointer-events: none;
    }
    .cursor-dot { width: 8px; height: 8px; background: var(--text-main); }
    .cursor-outline { 
      width: 40px; height: 40px; 
      border:1px solid rgba(62,39,35,0.2); 
      transition: width 0.2s, height 0.2s, background 0.2s; 
    }
    body:hover .cursor-outline.hovered {
      width: 60px; height: 60px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(2px);
      border: none;
    }

    /* --- 1. Full-Screen Shader Background --- */
    #canvas-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    }
    
    /* --- 2. Bottom Scrolling Light Effect --- */
    .bottom-glow {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 300px;
      background: radial-gradient(circle at 50% 100%, rgba(255, 245, 230, 0.8), transparent 70%);
      pointer-events: none; z-index: 0;
      mix-blend-mode: overlay;
      opacity: 0.5;
      transition: opacity 0.5s ease, background 0.5s ease;
    }

    /* --- Layout --- */
    .app { min-height: 100vh; padding: 20px; position: relative; z-index: 1; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* --- 3. Magnetic Navigation --- */
    .topbar {
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border:1px solid var(--glass-border);
      border-radius: 50px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      box-shadow: var(--shadow-soft);
    }

    .brand { font-family: var(--font-heading); font-weight: 600; font-size: 1.2rem; letter-spacing: 0.05em; }

    .nav-links { display: flex; gap: 15px; }
    
    .magnetic-wrap {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(62,39,35,0.2);
      padding: 10px 24px;
      border-radius: 30px;
      font-family: var(--font-body);
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .btn:hover, .btn.active {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(62,39,35,0.15);
    }

    /* --- 4. 3D Dashboard Cards --- */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .card-3d {
      height: 200px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: perspective(1000px);
      box-shadow: var(--shadow-soft);
      border:1px solid var(--glass-border);
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(10px);
    }

    .card-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.6; transition: transform 0.5s;
    }
    .card-3d:hover .card-bg-img { transform: scale(1.05); }

    .card-content {
      position: relative; z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      transform: translateZ(30px); /* 3D pop */
    }

    .card-title { font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 5px; }
    .card-value { font-family: var(--font-body); font-size: 1.5rem; font-weight: 700; }
    .card-glare {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(125deg, rgba(255,255,255,0.4), transparent 60%);
      opacity: 0; pointer-events: none; mix-blend-mode: overlay;
    }

    /* --- Content Sections (Glass) --- */
    .paper {
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow-soft);
      border:1px solid var(--glass-border);
      min-height: 400px;
      animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-family: var(--font-heading); font-size: 2rem; margin-bottom: 20px; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; }

    /* --- Forms --- */
    .form-grid { display: grid; grid-template-columns:1fr 1fr; gap: 20px; margin-bottom: 20px; }
    input, select, textarea {
      width: 100%; padding: 12px 15px;
      border-radius: 12px; border: 1px solid rgba(62,39,35,0.2);
      background: rgba(255,255,255,0.7);
      font-family: var(--font-body);
      font-size: 1rem; outline: none; transition: 0.3s;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(191, 161, 118, 0.2); }

    .entry-lines { display: flex; flex-direction: column; gap: 10px; }
    .entry-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: center; }
    
    .btn-action {
      padding: 12px 30px; background: var(--text-main); color: white;
      border: none; border-radius: 30px; font-weight: 700; cursor: pointer;
      box-shadow: 0 5px 15px rgba(62,39,35,0.2); transition: transform 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }

    /* --- Tables --- */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { text-align: left; padding: 15px; background: rgba(62,39,35,0.05); color: var(--text-main); font-weight: 700; font-family: var(--font-heading); }
    td { padding: 15px; border-bottom: 1px solid rgba(62,39,35,0.1); font-family: var(--font-body); }
    tr:hover td { background: rgba(255,255,255,0.5); }
    
    .mono { font-family: 'Courier New', monospace; letter-spacing: -0.5px; }
    .text-right { text-align: right; }

    /* --- Responsive --- */
    @media(max-width: 768px) {
      .topbar { flex-direction: column; gap: 15px; }
      .form-grid, .entry-row { grid-template-columns: 1fr; }
      .cursor-dot, .cursor-outline { display: none; }
      * { cursor: auto; }
    }
  </style>
</head>
<body>

  <!-- 1. Shader Background -->
  <div id="canvas-container"></div>
  
  <!-- 2. Bottom Glow -->
  <div class="bottom-glow" id="bottom-glow"></div>

  <!-- Cursor -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-outline" id="cursor-outline"></div>

  <div class="app">
    <div class="container">
      
      <!-- 3. Magnetic Navigation -->
      <nav class="topbar">
        <div class="brand magnetic-area">
          <div class="magnetic-wrap">SIS ACCOUNTING</div>
        </div>
        <div class="nav-links">
          <div class="magnetic-area">
            <button class="btn active magnetic-wrap" data-view="dashboard" onclick="switchView('dashboard')">Dashboard</button>
          </div>
          <div class="magnetic-area">
            <button class="btn magnetic-wrap" data-view="new" onclick="switchView('new')">New Entry</button>
          </div>
          <div class="magnetic-area">
            <button class="btn magnetic-wrap" data-view="journal" onclick="switchView('journal')">Journal</button>
          </div>
          <div class="magnetic-area">
            <button class="btn magnetic-wrap" data-view="ledger" onclick="switchView('ledger')">Ledger</button>
          </div>
          <!-- NEW: Trial Balance Button -->
          <div class="magnetic-area">
            <button class="btn magnetic-wrap" data-view="trial" onclick="switchView('trial')">Trial Balance</button>
          </div>
        </div>
      </nav>

      <!-- Main View Container -->
      <main id="main-content">
        <!-- Content Injected via JS -->
      </main>
    </div>
  </div>

  <script>
    /* =========================================================
       ACCOUNTING ENGINE (Simplified: Dashboard + Journal + Ledger + Trial)
       ========================================================= */
    
    const LS_KEY = "SIS_ACCOUNTING_V3";
    const uid = () => Math.random().toString(16).slice(2) + Date.now().toString(16);

    // State
    const state = {
      view: 'dashboard',
      entries: [],
      ledger: {},
      folioNext: 1
    };

    // Utils
    function safeText(s) { return String(s ?? "").replace(/[<>]/g,""); }
    function toPaise(str) { 
      if(str === "" || str === null || str === undefined) return 0;
      const n = Number(str);
      if(!Number.isFinite(n)) return 0;
      return Math.round(n * 100);
    }
    function paiseToStr(p) {
      return (p/100).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    // Data Logic
    function saveLocal() {
      localStorage.setItem(LS_KEY, JSON.stringify({ entries: state.entries, ledger: state.ledger, folioNext: state.folioNext }));
    }
    function loadLocal() {
      const raw = localStorage.getItem(LS_KEY);
      if(raw) {
        const data = JSON.parse(raw);
        state.entries = data.entries || [];
        state.ledger = data.ledger || {};
        state.folioNext = data.folioNext || 1;
      }
    }

    function buildLedger() {
      // Simple ledger generation from journal
      state.ledger = {};
      state.entries.forEach(e => {
        // Process Debits
        e.debits.forEach(d => {
          if(!state.ledger[d.acc]) state.ledger[d.acc] = { dr: 0, cr: 0, lf: state.folioNext++ };
          state.ledger[d.acc].dr += d.amtPaise;
        });
        // Process Credits
        e.credits.forEach(c => {
          if(!state.ledger[c.acc]) state.ledger[c.acc] = { dr: 0, cr: 0, lf: state.folioNext++ };
          state.ledger[c.acc].cr += c.amtPaise;
        });
      });
    }

    // View Rendering
    const mainContent = document.getElementById('main-content');

    function switchView(v) {
      state.view = v;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-view="${v}"]`).classList.add('active');
      render();
    }

    function render() {
      buildLedger(); // Ensure ledger is up to date
      mainContent.innerHTML = '';
      
      if(state.view === 'dashboard') renderDashboard();
      else if(state.view === 'new') renderNewEntry();
      else if(state.view === 'journal') renderJournal();
      else if(state.view === 'ledger') renderLedger();
      else if(state.view === 'trial') renderTrialBalance(); // NEW
      
      // Re-bind UI effects
      initMagnetic();
      init3DCards();
    }

    // --- 1. Dashboard View (3D Cards) ---
    function renderDashboard() {
      let totalEntries = state.entries.length;
      let totalDr = 0;
      let totalCr = 0;
      state.entries.forEach(e => {
        e.debits.forEach(d => totalDr += d.amtPaise);
        e.credits.forEach(c => totalCr += c.amtPaise);
      });

      const html = `
        <div class="dashboard-grid">
          <div class="card-3d tilt-card">
            <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600" class="card-bg-img">
            <div class="card-glare"></div>
            <div class="card-content">
              <div class="card-title">Total Entries</div>
              <div class="card-value">${totalEntries}</div>
            </div>
          </div>
          <div class="card-3d tilt-card">
            <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&grayscale" class="card-bg-img">
            <div class="card-glare"></div>
            <div class="card-content">
              <div class="card-title">Total Debit</div>
              <div class="card-value">${paiseToStr(totalDr)}</div>
            </div>
          </div>
          <div class="card-3d tilt-card">
            <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&grayscale" class="card-bg-img">
            <div class="card-glare"></div>
            <div class="card-content">
              <div class="card-title">Total Credit</div>
              <div class="card-value">${paiseToStr(totalCr)}</div>
            </div>
          </div>
        </div>
        <div class="paper">
          <h2 class="section-title">Overview</h2>
          <p>Welcome to the Saraswati International School Accounting System. Use the navigation above to create entries, view records, or generate the Trial Balance.</p>
        </div>
      `;
      mainContent.innerHTML = html;
    }

    // --- 2. New Entry ---
    let tempDebits = [{id: uid(), acc: '', amt: ''}];
    let tempCredits = [{id: uid(), acc: '', amt: ''}];

    function renderNewEntry() {
      const html = `
        <div class="paper">
          <h2 class="section-title">New Journal Entry</h2>
          <div class="form-grid">
            <div>
              <label>Date</label>
              <input type="date" id="entryDate" value="${todayISO()}">
            </div>
            <div>
              <label>Narration</label>
              <input type="text" id="entryNarr" placeholder="Description...">
            </div>
          </div>
          
          <h3>Debits</h3>
          <div class="entry-lines" id="debitLines"></div>
          <button class="btn" onclick="addLine('debit')">+ Add Debit</button>

          <h3 style="margin-top:20px;">Credits</h3>
          <div class="entry-lines" id="creditLines"></div>
          <button class="btn" onclick="addLine('credit')">+ Add Credit</button>

          <div style="margin-top:30px; text-align:right;">
            <button class="btn-action" onclick="saveEntry()">Save Entry</button>
          </div>
        </div>
      `;
      mainContent.innerHTML = html;
      renderLines('debit', tempDebits);
      renderLines('credit', tempCredits);
    }

    function addLine(side) {
      if(side === 'debit') tempDebits.push({id: uid(), acc: '', amt: ''});
      else tempCredits.push({id: uid(), acc: '', amt: ''});
      renderLines(side, side==='debit' ? tempDebits : tempCredits);
    }

    function renderLines(side, arr) {
      const container = document.getElementById(side + 'Lines');
      container.innerHTML = arr.map((line, i) => `
        <div class="entry-row" data-id="${line.id}" data-side="${side}">
          <input type="text" placeholder="Account Name" class="inp-acc" value="${safeText(line.acc)}">
          <input type="number" placeholder="Amount" class="inp-amt" value="${line.amt}">
          <button class="btn" style="padding:5px 10px; color:red;" onclick="removeLine('${side}', ${i})">✕</button>
        </div>
      `).join('');
    }

    function removeLine(side, index) {
      if(side === 'debit') tempDebits.splice(index, 1);
      else tempCredits.splice(index, 1);
      renderLines(side, side==='debit' ? tempDebits : tempCredits);
    }

    function saveEntry() {
      const date = document.getElementById('entryDate').value;
      const narr = document.getElementById('entryNarr').value;
      
      // Collect Debits
      const debRows = document.querySelectorAll('#debitLines .entry-row');
      const debits = [];
      debRows.forEach(r => {
        const acc = r.querySelector('.inp-acc').value;
        const amt = toPaise(r.querySelector('.inp-amt').value);
        if(acc && amt > 0) debits.push({id: uid(), acc, amtPaise: amt});
      });

      // Collect Credits
      const credRows = document.querySelectorAll('#creditLines .entry-row');
      const credits = [];
      credRows.forEach(r => {
        const acc = r.querySelector('.inp-acc').value;
        const amt = toPaise(r.querySelector('.inp-amt').value);
        if(acc && amt > 0) credits.push({id: uid(), acc, amtPaise: amt});
      });

      const drTotal = debits.reduce((a,b)=>a+b.amtPaise,0);
      const crTotal = credits.reduce((a,b)=>a+b.amtPaise,0);

      if(drTotal !== crTotal) {
        alert(`Debit Total (${paiseToStr(drTotal)}) must match Credit Total (${paiseToStr(crTotal)}).`);
        return;
      }

      state.entries.push({
        id: uid(),
        date, narration: narr,
        debits, credits,
        createdAt: Date.now()
      });
      
      // Reset
      tempDebits = [{id: uid(), acc: '', amt: ''}];
      tempCredits = [{id: uid(), acc: '', amt: ''}];
      saveLocal();
      switchView('journal');
    }

    // --- 3. Journal View ---
    function renderJournal() {
      const rows = [...state.entries].sort((a,b) => b.createdAt - a.createdAt);
      let html = `<div class="paper"><h2 class="section-title">Journal Entries</h2>`;
      
      if(rows.length === 0) html += `<p>No entries found.</p>`;
      else {
        html += `<table>
          <thead><tr><th>Date</th><th>Particulars</th><th class="text-right">Debit</th><th class="text-right">Credit</th></tr></thead>
          <tbody>`;
        
        rows.forEach(e => {
          const drTotal = e.debits.reduce((a,b)=>a+b.amtPaise,0);
          const crTotal = e.credits.reduce((a,b)=>a+b.amtPaise,0);
          
          e.debits.forEach((d, i) => {
            html += `<tr>
              <td>${i===0?e.date:''}</td>
              <td><b>${d.acc}</b> ${i===0?`<br><small class="text-muted">${e.narration}</small>`:''}</td>
              <td class="text-right mono">${paiseToStr(d.amtPaise)}</td>
              <td></td>
            </tr>`;
          });
          e.credits.forEach(c => {
            html += `<tr>
              <td></td>
              <td style="padding-left:20px;">To <b>${c.acc}</b></td>
              <td></td>
              <td class="text-right mono">${paiseToStr(c.amtPaise)}</td>
            </tr>`;
          });
          // Totals for entry
          html += `<tr style="background:rgba(0,0,0,0.02);">
            <td colspan="2" style="text-align:right"><b>Total</b></td>
            <td class="text-right mono"><b>${paiseToStr(drTotal)}</b></td>
            <td class="text-right mono"><b>${paiseToStr(crTotal)}</b></td>
          </tr>`;
        });
        html += `</tbody></table>`;
      }
      html += `</div>`;
      mainContent.innerHTML = html;
    }

    // --- 4. Ledger View ---
    function renderLedger() {
      buildLedger();
      const accounts = Object.keys(state.ledger).sort();
      let html = `<div class="paper"><h2 class="section-title">General Ledger</h2>`;
      
      if(accounts.length === 0) html += `<p>No ledger data.</p>`;
      else {
        html += `<div style="display:grid; grid-template-columns: 1fr; gap:20px;">`;
        accounts.forEach(acc => {
          const data = state.ledger[acc];
          const bal = data.dr - data.cr;
          const balType = bal >= 0 ? "Dr" : "Cr";
          
          html += `
            <div style="background:rgba(255,255,255,0.4); padding:15px; border-radius:12px; border:1px solid rgba(0,0,0,0.05);">
              <h3 style="margin-top:0;">${acc} <small>(LF: ${data.lf})</small></h3>
              <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #ccc;">
                <span>Total Debit:</span> <span class="mono">${paiseToStr(data.dr)}</span>
              </div>
              <div style="display:flex; justify-content:space-between; padding:10px 0;">
                <span>Total Credit:</span> <span class="mono">${paiseToStr(data.cr)}</span>
              </div>
              <div style="margin-top:10px; padding:10px; background:rgba(191,161,118,0.2); border-radius:8px; text-align:center;">
                <b>Balance: ${paiseToStr(Math.abs(bal))} ${balType}</b>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      html += `</div>`;
      mainContent.innerHTML = html;
    }

    // --- 5. Trial Balance View (NEW) ---
    function renderTrialBalance() {
      buildLedger();
      const accounts = Object.keys(state.ledger).sort();
      let totalDr = 0;
      let totalCr = 0;
      
      let html = `<div class="paper"><h2 class="section-title">Trial Balance</h2>`;
      
      if(accounts.length === 0) {
        html += `<p>No data available. Create entries first.</p>`;
      } else {
        html += `<table>
          <thead>
            <tr>
              <th>Account Name</th>
              <th class="text-right">L.F.</th>
              <th class="text-right">Debit Balance (₹)</th>
              <th class="text-right">Credit Balance (₹)</th>
            </tr>
          </thead>
          <tbody>`;
          
        accounts.forEach(acc => {
          const data = state.ledger[acc];
          const bal = data.dr - data.cr;
          
          if (bal === 0) return; // Skip zero balance accounts

          if (bal > 0) {
            // Debit Balance
            totalDr += bal;
            html += `
              <tr>
                <td><b>${safeText(acc)}</b></td>
                <td class="text-right">${data.lf}</td>
                <td class="text-right mono">${paiseToStr(bal)}</td>
                <td class="text-right"></td>
              </tr>`;
          } else {
            // Credit Balance
            totalCr += Math.abs(bal);
            html += `
              <tr>
                <td><b>${safeText(acc)}</b></td>
                <td class="text-right">${data.lf}</td>
                <td class="text-right"></td>
                <td class="text-right mono">${paiseToStr(Math.abs(bal))}</td>
              </tr>`;
          }
        });

        // Footer Totals
        const isMatched = totalDr === totalCr;
        const matchColor = isMatched ? 'green' : 'red';

        html += `</tbody>
          <tfoot>
            <tr style="background:rgba(0,0,0,0.03); font-weight:700;">
              <td colspan="2" style="text-align:right;">Total:</td>
              <td class="text-right mono">${paiseToStr(totalDr)}</td>
              <td class="text-right mono">${paiseToStr(totalCr)}</td>
            </tr>
          </tfoot>
        </table>
        
        <div style="margin-top:20px; text-align:center; padding:15px; background:rgba(255,255,255,0.4); border-radius:12px; border:1px solid rgba(0,0,0,0.05);">
          Status: <b style="color:${matchColor};">${isMatched ? '✓ Matched' : '✗ Not Matched'}</b>
        </div>`;
      }
      html += `</div>`;
      mainContent.innerHTML = html;
    }

    /* =========================================================
       VISUAL EFFECTS (Three.js + UI Logic)
       ========================================================= */

    // --- 1. Three.js Light Woody Shader ---
    const initThreeJS = () => {
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const geometry = new THREE.PlaneGeometry(2, 2);
      const uniforms = {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      };

      // Shader for Light Wood with Moving Noise
      const fragmentShader = `
        uniform float u_time;
        uniform vec2 u_resolution;
        
        float random (in vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        float noise (in vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            
            // Create wood grain lines
            float n = noise(vec2(uv.x * 20.0, uv.y * 5.0 + u_time * 0.05));
            float grain = fract(n * 10.0);
            
            // Base Wood Colors (Light)
            vec3 colorA = vec3(0.94, 0.90, 0.82); // Cream
            vec3 colorB = vec3(0.86, 0.78, 0.65); // Light Wood
            
            vec3 finalColor = mix(colorA, colorB, grain);
            
            // Add soft light patches
            float light = sin(uv.x * 10.0 + u_time * 0.1) * 0.05;
            finalColor += light;

            gl_FragColor = vec4(finalColor, 1.0);
        }
      `;

      const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        fragmentShader: fragmentShader,
        vertexShader: 'void main(){gl_Position=vec4(position,1.0);}'
      });

      const plane = new THREE.Mesh(geometry, material);
      scene.add(plane);

      const animate = () => {
        requestAnimationFrame(animate);
        uniforms.u_time.value += 0.01;
        renderer.render(scene, camera);
      };
      animate();

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.x = window.innerWidth;
        uniforms.u_resolution.value.y = window.innerHeight;
      });
    };

    // --- 2. Magnetic Buttons ---
    function initMagnetic() {
      document.querySelectorAll('.magnetic-area').forEach(magnet => {
        const wrap = magnet.querySelector('.magnetic-wrap');
        if(!wrap) return;

        magnet.addEventListener('mousemove', (e) => {
          const rect = magnet.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          wrap.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });
        magnet.addEventListener('mouseleave', () => {
          wrap.style.transform = 'translate(0px, 0px)';
        });
      });
    }

    // --- 3. 3D Tilt Cards ---
    function init3DCards() {
      document.querySelectorAll('.card-3d').forEach(card => {
        const glare = card.querySelector('.card-glare');
        
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -10; // Max 10deg tilt
          const rotateY = ((x - centerX) / centerX) * 10;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          
          // Glare
          glare.style.opacity = '1';
          glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.5), transparent 60%)`;
        });
        
        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
          glare.style.opacity = '0';
        });
      });
    }

    // --- 4. Bottom Scrolling Light ---
    window.addEventListener('scroll', () => {
      const scroll = window.scrollY;
      const height = document.body.scrollHeight - window.innerHeight;
      const pct = scroll / height;
      
      const glow = document.getElementById('bottom-glow');
      // Make it brighter/more intense as we scroll
      glow.style.opacity = 0.3 + (pct * 0.5);
      // Shift color slightly
      glow.style.background = `radial-gradient(circle at 50% 100%, rgba(255, 245, 230, ${0.5 + pct*0.4}), transparent 70%)`;
    });

    // --- 5. Custom Cursor ---
    const cursorDot = document.getElementById('cursor-dot');
    const cursorOutline = document.getElementById('cursor-outline');
    
    window.addEventListener('mousemove', (e) => {
      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top = e.clientY + 'px';
      cursorOutline.animate({
        left: e.clientX + 'px',
        top: e.clientY + 'px'
      }, { duration: 500, fill: "forwards" });
    });

    // Initialize
    loadLocal();
    initThreeJS();
    render();

  </script>
</body>
</html>
