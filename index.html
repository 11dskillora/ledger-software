<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARASWATI INTERNATIONAL SCHOOL - Accounting System</title>

  <style>
    /* ==========================================================
       SARASWATI INTERNATIONAL SCHOOL - NOTEBOOK LEDGER SYSTEM
       Premium Woody UI + Notebook Paper + Mobile Friendly
       ========================================================== */

    :root{
      --wood-dark:#2a1f18;
      --wood-mid:#3b2a21;
      --wood-light:#5b3f31;

      --paper:#fbf8f1;
      --paper-2:#f3eee2;
      --ink:#2b1b13;
      --muted:#7a5d47;

      --gold:#d7b04a;
      --border:#caa574;
      --shadow: 0 18px 50px rgba(0,0,0,.35);

      --ok:#2e6b3d;
      --bad:#8a2f2f;
      --warn:#8a6b2f;

      --radius:18px;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      font-family: "Georgia", serif;
      color:var(--ink);

      /* Wooden desk background (no external image required) */
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.06), transparent 40%),
        radial-gradient(circle at 90% 30%, rgba(255,255,255,.04), transparent 35%),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.03) 0px,
          rgba(255,255,255,.03) 3px,
          rgba(0,0,0,.06) 6px,
          rgba(0,0,0,.06) 10px
        ),
        linear-gradient(135deg, var(--wood-dark), var(--wood-mid), var(--wood-light));
      background-attachment: fixed;
    }

    /* ------------------ Header ------------------ */
    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      padding:14px 14px;
      backdrop-filter: blur(10px);
      background: rgba(20,12,8,.45);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .brand{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title .school{
      font-weight:900;
      letter-spacing:.8px;
      font-size:16px;
      color:#fff;
      text-transform:uppercase;
    }
    .title .sub{
      font-size:12px;
      color:rgba(255,255,255,.75);
      font-family: "Courier New", monospace;
    }

    .menu{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    select, button, input{
      font-family: inherit;
      font-size:14px;
    }

    select{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color:#fff;
      outline:none;
      cursor:pointer;
    }
    select option{
      color:#000;
    }

    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      color:#fff;
      cursor:pointer;
      transition:.2s ease;
      font-weight:700;
      letter-spacing:.2px;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.16);}
    .btn:active{transform: translateY(0px);}

    .btn.bad{background: rgba(138,47,47,.25);}
    .btn.bad:hover{background: rgba(138,47,47,.35);}
    .btn.warn{background: rgba(138,107,47,.25);}
    .btn.warn:hover{background: rgba(138,107,47,.35);}
    .btn.ok{background: rgba(46,107,61,.25);}
    .btn.ok:hover{background: rgba(46,107,61,.35);}

    /* ------------------ Main Layout ------------------ */
    .wrap{
      max-width:1200px;
      margin:18px auto;
      padding:0 14px 30px;
    }

    .paper{
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.12));
    }

    .paper-inner{
      background:
        radial-gradient(circle at 50% 0%, rgba(0,0,0,.04), transparent 50%),
        linear-gradient(180deg, var(--paper), var(--paper-2));
      padding:18px;
      position:relative;
    }

    /* Notebook margin line */
    .paper-inner::before{
      content:"";
      position:absolute;
      left:32px;
      top:0;
      bottom:0;
      width:2px;
      background: rgba(210,80,80,.35);
    }

    .section-title{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      padding-bottom:10px;
      border-bottom:2px dashed rgba(122,93,71,.45);
      margin-bottom:14px;
    }
    .section-title h2{
      margin:0;
      font-size:20px;
      letter-spacing:.3px;
    }
    .section-title .hint{
      font-family:"Courier New", monospace;
      font-size:12px;
      color:rgba(43,27,19,.75);
      text-align:right;
    }

    /* ------------------ Page Flip Animation ------------------ */
    .page{
      transform-origin: left center;
      animation: flipIn .55s ease;
    }
    @keyframes flipIn{
      0%{transform: perspective(1200px) rotateY(-60deg); opacity:0;}
      100%{transform: perspective(1200px) rotateY(0deg); opacity:1;}
    }

    /* ------------------ Form ------------------ */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media(max-width:860px){
      .grid{grid-template-columns:1fr;}
      .paper-inner::before{left:20px;}
    }

    .card{
      background: rgba(255,255,255,.7);
      border:1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      padding:12px;
    }

    .label{
      font-family:"Courier New", monospace;
      font-size:12px;
      color:rgba(43,27,19,.75);
      margin-bottom:6px;
      font-weight:700;
    }

    .input, .amount{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.15);
      outline:none;
      background: rgba(255,255,255,.95);
      transition:.2s ease;
    }
    .input:focus, .amount:focus{
      border-color: rgba(90,63,49,.55);
      box-shadow: 0 0 0 3px rgba(215,176,74,.25);
    }

    /* Disable scroll changing numbers visually */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{
      -webkit-appearance: none;
      margin:0;
    }
    input[type=number]{ -moz-appearance:textfield; }

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    /* ------------------ Tables ------------------ */
    .table-wrap{overflow:auto; border-radius:16px;}
    table{
      width:100%;
      border-collapse:collapse;
      min-width: 680px;
      background: rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.10);
      border-radius:16px;
      overflow:hidden;
    }
    th,td{
      padding:10px 12px;
      text-align:left;
      border-bottom:1px dashed rgba(122,93,71,.35); /* Notebook dashed lines */
      vertical-align:top;
    }
    th{
      background: linear-gradient(180deg, rgba(215,176,74,.25), rgba(255,255,255,.65));
      font-weight:900;
      letter-spacing:.2px;
    }
    tr:hover td{background: rgba(215,176,74,.08);}

    .small{
      font-family:"Courier New", monospace;
      font-size:12px;
      color:rgba(43,27,19,.75);
    }

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      font-family:"Courier New", monospace;
      font-size:12px;
      font-weight:900;
      border:1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.7);
    }
    .pill.ok{color:var(--ok);}
    .pill.bad{color:var(--bad);}
    .pill.warn{color:var(--warn);}

    .footer-note{
      margin-top:12px;
      font-family:"Courier New", monospace;
      font-size:12px;
      color:rgba(43,27,19,.72);
    }

    /* Mobile tables */
    @media(max-width:520px){
      table{min-width: 560px;}
      .title .school{font-size:14px;}
    }
  </style>
</head>

<body>
  <!-- ===========================
       TOP BAR
       =========================== -->
  <div class="topbar">
    <div class="brand">
      <div class="title">
        <div class="school">SARASWATI INTERNATIONAL SCHOOL</div>
        <div class="sub">Notebook Ledger System • CBSE Style • Auto Save</div>
      </div>

      <div class="menu">
        <select id="viewSelect" title="Choose section">
          <option value="newEntry">New Entry</option>
          <option value="journal">Journal</option>
          <option value="ledger">Ledger</option>
          <option value="trialBalance">Trial Balance</option>
        </select>

        <button class="btn warn" id="undoBtn" title="Undo last action">Undo</button>
        <button class="btn bad" id="deleteJournalBtn" title="Delete only Journal">Delete Journal</button>
        <button class="btn bad" id="deleteLedgerBtn" title="Delete only Ledger">Delete Ledger</button>
        <button class="btn bad" id="deleteAllBtn" title="Delete Everything">Delete All</button>
      </div>
    </div>
  </div>

  <!-- ===========================
       MAIN
       =========================== -->
  <div class="wrap">
    <div class="paper">
      <div class="paper-inner">
        <div class="section-title">
          <h2 id="sectionTitle">New Entry</h2>
          <div class="hint" id="sectionHint">
            Add multiple debit & credit lines in one entry.<br/>
            Totals must match.
          </div>
        </div>

        <div id="page" class="page"></div>

        <div class="footer-note">
          Tip: Use account names like Cash, Bank, Purchases, Sales, Capital, Furniture etc. for best CBSE output.
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       ADVANCED ACCOUNTING SYSTEM (Single HTML file)
       - Multiple Dr/Cr lines per entry
       - Auto LocalStorage
       - Trial Balance
       - Undo
       - Delete Journal/Ledger/All
       - Page flip animation
       ========================================================== */

    // ------------------ Utilities ------------------
    const $ = (id) => document.getElementById(id);

    function inr(n){
      const num = Number(n || 0);
      return "₹ " + num.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function deepClone(obj){
      return JSON.parse(JSON.stringify(obj));
    }

    function nowDate(){
      const d = new Date();
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}-${mm}-${yy}`;
    }

    // ------------------ App State ------------------
    let state = {
      journal: [], // entries: {id,date,narration,lines:[{type,account,amount}]}
      // ledger is derived from journal to avoid mismatch errors
      lastId: 1
    };

    // Undo stack: stores snapshots
    let undoStack = [];

    // ------------------ LocalStorage ------------------
    const STORAGE_KEY = "sis_ledger_state_v1";

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      try{
        const parsed = JSON.parse(raw);
        // validate minimal structure
        if(parsed && Array.isArray(parsed.journal)){
          state = parsed;
          if(typeof state.lastId !== "number") state.lastId = 1;
        }
      }catch(e){
        console.warn("LocalStorage parse error:", e);
      }
    }

    // ------------------ Undo Logic ------------------
    function pushUndoSnapshot(){
      // keep max 25 snapshots
      undoStack.push(deepClone(state));
      if(undoStack.length > 25) undoStack.shift();
      updateUndoButton();
    }

    function undo(){
      if(undoStack.length === 0) return;
      state = undoStack.pop();
      saveState();
      render();
      updateUndoButton();
    }

    function updateUndoButton(){
      $("undoBtn").disabled = undoStack.length === 0;
      $("undoBtn").style.opacity = undoStack.length === 0 ? "0.5" : "1";
      $("undoBtn").style.cursor = undoStack.length === 0 ? "not-allowed" : "pointer";
    }

    // ------------------ Ledger Derivation ------------------
    function buildLedgerFromJournal(){
      // Ledger format: {accountName: {debits:[{date,particulars,amount}], credits:[...], totalDr,totalCr,balanceType,balance}}
      const ledger = {};

      function ensure(acc){
        if(!ledger[acc]){
          ledger[acc] = { account: acc, debits: [], credits: [], totalDr:0, totalCr:0 };
        }
      }

      for(const entry of state.journal){
        const date = entry.date;
        const narration = entry.narration || "";
        const lines = entry.lines || [];

        // For ledger particulars, we list opposite accounts combined
        const debitAccounts = lines.filter(l => l.type === "Dr").map(l => l.account);
        const creditAccounts = lines.filter(l => l.type === "Cr").map(l => l.account);

        for(const line of lines){
          ensure(line.account);
          const amount = Number(line.amount || 0);

          if(line.type === "Dr"){
            ledger[line.account].debits.push({
              date,
              particulars: "To " + creditAccounts.join(", "),
              amount,
              narration
            });
            ledger[line.account].totalDr += amount;
          }else{
            ledger[line.account].credits.push({
              date,
              particulars: "By " + debitAccounts.join(", "),
              amount,
              narration
            });
            ledger[line.account].totalCr += amount;
          }
        }
      }

      // compute balances
      for(const acc in ledger){
        const a = ledger[acc];
        const bal = a.totalDr - a.totalCr;
        if(bal >= 0){
          a.balanceType = "Dr";
          a.balance = bal;
        }else{
          a.balanceType = "Cr";
          a.balance = Math.abs(bal);
        }
      }
      return ledger;
    }

    // ------------------ Trial Balance ------------------
    function buildTrialBalance(ledger){
      const rows = [];
      let totalDr = 0;
      let totalCr = 0;

      const accounts = Object.keys(ledger).sort((a,b)=>a.localeCompare(b));

      for(const acc of accounts){
        const a = ledger[acc];
        const dr = a.balanceType === "Dr" ? a.balance : 0;
        const cr = a.balanceType === "Cr" ? a.balance : 0;
        totalDr += dr;
        totalCr += cr;
        rows.push({ acc, dr, cr });
      }
      return { rows, totalDr, totalCr };
    }

    // ------------------ Number Scroll Disable ------------------
    function disableNumberScroll(){
      document.addEventListener("wheel", function(e){
        const active = document.activeElement;
        if(active && active.tagName === "INPUT" && active.type === "number"){
          e.preventDefault();
        }
      }, { passive:false });

      document.addEventListener("keydown", function(e){
        const active = document.activeElement;
        if(active && active.tagName === "INPUT" && active.type === "number"){
          // block arrow up/down changing value
          if(e.key === "ArrowUp" || e.key === "ArrowDown"){
            e.preventDefault();
          }
        }
      });
    }

    // ------------------ UI Renderers ------------------
    function setPage(title, hint, html){
      $("sectionTitle").textContent = title;
      $("sectionHint").innerHTML = hint;

      // force page flip animation restart
      const page = $("page");
      page.classList.remove("page");
      void page.offsetWidth; // reflow
      page.classList.add("page");
      page.innerHTML = html;
    }

    function renderNewEntry(){
      const html = `
        <div class="grid">
          <div class="card">
            <div class="label">Date</div>
            <input class="input" id="entryDate" value="${nowDate()}" />

            <div class="label" style="margin-top:10px;">Narration</div>
            <input class="input" id="entryNarration" placeholder="(Optional) e.g. Being goods sold for cash" />

            <div class="row-actions">
              <button class="btn ok" id="addDrBtn">+ Add Debit Line</button>
              <button class="btn ok" id="addCrBtn">+ Add Credit Line</button>
              <button class="btn" id="resetLinesBtn">Reset Lines</button>
            </div>

            <div class="row-actions">
              <button class="btn ok" id="saveEntryBtn">Save Entry</button>
            </div>

            <div class="small" style="margin-top:10px;">
              Rule: Total Debit must equal Total Credit.
            </div>
          </div>

          <div class="card">
            <div class="label">Entry Lines</div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:90px;">Type</th>
                    <th>Account</th>
                    <th style="width:170px;">Amount</th>
                    <th style="width:90px;">Remove</th>
                  </tr>
                </thead>
                <tbody id="linesBody"></tbody>
                <tfoot>
                  <tr>
                    <th colspan="2">Totals</th>
                    <th colspan="2">
                      <span class="pill ok" id="totalsPill">Dr ₹0.00 | Cr ₹0.00</span>
                    </th>
                  </tr>
                </tfoot>
              </table>
            </div>

            <div class="small" style="margin-top:10px;">
              Tip: Use proper CBSE style accounts like Cash, Purchases, Sales, Rent, Wages, Capital etc.
            </div>
          </div>
        </div>
      `;

      setPage(
        "New Entry",
        "Add multiple debit & credit lines in one entry.<br/>Totals must match.",
        html
      );

      // default lines
      const defaultLines = [
        { type:"Dr", account:"Cash", amount:0 },
        { type:"Cr", account:"Capital", amount:0 }
      ];

      let tempLines = defaultLines.map(x=>({...x}));

      function renderLines(){
        const body = $("linesBody");
        body.innerHTML = tempLines.map((l, idx)=>`
          <tr>
            <td><span class="pill ${l.type==="Dr"?"ok":"bad"}">${l.type}</span></td>
            <td>
              <input class="input" data-idx="${idx}" data-field="account" value="${escapeHtml(l.account)}" placeholder="Account name"/>
            </td>
            <td>
              <input class="amount" type="number" min="0" step="1" data-idx="${idx}" data-field="amount" value="${Number(l.amount)||0}" />
            </td>
            <td>
              <button class="btn bad" data-remove="${idx}">X</button>
            </td>
          </tr>
        `).join("");

        // input handlers
        body.querySelectorAll("input").forEach(inp=>{
          inp.addEventListener("input", ()=>{
            const i = Number(inp.getAttribute("data-idx"));
            const field = inp.getAttribute("data-field");
            if(field === "amount"){
              tempLines[i][field] = Number(inp.value || 0);
            }else{
              tempLines[i][field] = inp.value;
            }
            updateTotals();
          });
        });

        // remove handlers
        body.querySelectorAll("button[data-remove]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const i = Number(btn.getAttribute("data-remove"));
            tempLines.splice(i,1);
            renderLines();
            updateTotals();
          });
        });

        updateTotals();
      }

      function totals(){
        const dr = tempLines.filter(x=>x.type==="Dr").reduce((a,b)=>a+Number(b.amount||0),0);
        const cr = tempLines.filter(x=>x.type==="Cr").reduce((a,b)=>a+Number(b.amount||0),0);
        return {dr,cr};
      }

      function updateTotals(){
        const t = totals();
        const pill = $("totalsPill");
        const ok = Math.abs(t.dr - t.cr) < 0.00001 && t.dr > 0;
        pill.textContent = `Dr ${inr(t.dr)} | Cr ${inr(t.cr)}`;
        pill.className = "pill " + (ok ? "ok" : "warn");
      }

      function addLine(type){
        tempLines.push({ type, account:"", amount:0 });
        renderLines();
      }

      $("addDrBtn").addEventListener("click", ()=>addLine("Dr"));
      $("addCrBtn").addEventListener("click", ()=>addLine("Cr"));
      $("resetLinesBtn").addEventListener("click", ()=>{
        tempLines = defaultLines.map(x=>({...x}));
        renderLines();
      });

      $("saveEntryBtn").addEventListener("click", ()=>{
        const date = $("entryDate").value.trim() || nowDate();
        const narration = $("entryNarration").value.trim();

        // sanitize and validate
        const cleaned = tempLines
          .map(l=>({
            type: l.type,
            account: (l.account||"").trim(),
            amount: Number(l.amount||0)
          }))
          .filter(l=>l.account.length>0 && l.amount>0);

        if(cleaned.length < 2){
          alert("Please enter at least 2 valid lines with account names and amounts.");
          return;
        }

        const drTotal = cleaned.filter(x=>x.type==="Dr").reduce((a,b)=>a+b.amount,0);
        const crTotal = cleaned.filter(x=>x.type==="Cr").reduce((a,b)=>a+b.amount,0);

        if(Math.abs(drTotal - crTotal) > 0.00001){
          alert("Debit total must equal Credit total.");
          return;
        }

        pushUndoSnapshot(); // for undo

        state.journal.push({
          id: state.lastId++,
          date,
          narration,
          lines: cleaned
        });

        saveState();
        $("viewSelect").value = "journal";
        render();
      });

      renderLines();
    }

    function renderJournal(){
      if(state.journal.length === 0){
        setPage(
          "Journal",
          "No journal entries found.<br/>Go to New Entry to add.",
          `<div class="card small">Journal is empty.</div>`
        );
        return;
      }

      let html = `
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:70px;">No.</th>
                  <th style="width:110px;">Date</th>
                  <th>Particulars</th>
                  <th style="width:140px;">Debit (₹)</th>
                  <th style="width:140px;">Credit (₹)</th>
                </tr>
              </thead>
              <tbody>
      `;

      // CBSE journal style: show each line in separate row
      state.journal.forEach((entry, idx)=>{
        entry.lines.forEach((line, lineIdx)=>{
          html += `
            <tr>
              <td>${lineIdx===0 ? (idx+1) : ""}</td>
              <td>${lineIdx===0 ? escapeHtml(entry.date) : ""}</td>
              <td>
                ${line.type==="Dr"
                  ? `<strong>${escapeHtml(line.account)}</strong> A/c Dr.`
                  : `<span style="padding-left:22px;">To <strong>${escapeHtml(line.account)}</strong> A/c</span>`
                }
                ${lineIdx===entry.lines.length-1 && entry.narration
                  ? `<div class="small" style="margin-top:6px;"><em>(${escapeHtml(entry.narration)})</em></div>`
                  : ""
                }
              </td>
              <td>${line.type==="Dr" ? inr(line.amount) : ""}</td>
              <td>${line.type==="Cr" ? inr(line.amount) : ""}</td>
            </tr>
          `;
        });

        html += `
          <tr>
            <td colspan="5" class="small">
              <span class="pill ok">Entry ID: ${entry.id}</span>
              <span class="pill warn">Lines: ${entry.lines.length}</span>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      setPage(
        "Journal",
        "CBSE style journal format.<br/>Entries auto-save to LocalStorage.",
        html
      );
    }

    function renderLedger(){
      const ledger = buildLedgerFromJournal();
      const accounts = Object.keys(ledger).sort((a,b)=>a.localeCompare(b));

      if(accounts.length === 0){
        setPage(
          "Ledger",
          "No ledger accounts found.<br/>Add journal entries first.",
          `<div class="card small">Ledger is empty.</div>`
        );
        return;
      }

      let html = `<div class="card">`;

      for(const acc of accounts){
        const a = ledger[acc];
        html += `
          <div style="margin:12px 0 18px;">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
              <h3 style="margin:0;">${escapeHtml(acc)} A/c</h3>
              <div class="small">
                Total Dr: <strong>${inr(a.totalDr)}</strong> |
                Total Cr: <strong>${inr(a.totalCr)}</strong> |
                Balance: <span class="pill ${a.balanceType==="Dr"?"ok":"bad"}">${a.balanceType} ${inr(a.balance)}</span>
              </div>
            </div>

            <div class="table-wrap" style="margin-top:8px;">
              <table>
                <thead>
                  <tr>
                    <th colspan="2">Dr.</th>
                    <th colspan="2">Cr.</th>
                  </tr>
                  <tr>
                    <th style="width:120px;">Date</th>
                    <th>Particulars</th>
                    <th style="width:120px;">Date</th>
                    <th>Particulars</th>
                  </tr>
                </thead>
                <tbody>
        `;

        // align debit and credit rows side-by-side
        const maxRows = Math.max(a.debits.length, a.credits.length);
        for(let i=0;i<maxRows;i++){
          const d = a.debits[i];
          const c = a.credits[i];
          html += `
            <tr>
              <td>${d ? escapeHtml(d.date) : ""}</td>
              <td>${d ? `${escapeHtml(d.particulars)} <span class="small">(${inr(d.amount)})</span>` : ""}</td>
              <td>${c ? escapeHtml(c.date) : ""}</td>
              <td>${c ? `${escapeHtml(c.particulars)} <span class="small">(${inr(c.amount)})</span>` : ""}</td>
            </tr>
          `;
        }

        // closing balance row
        html += `
            <tr>
              <td colspan="4" class="small">
                Closing Balance: <span class="pill ${a.balanceType==="Dr"?"ok":"bad"}">${a.balanceType} ${inr(a.balance)}</span>
              </td>
            </tr>
        `;

        html += `
                </tbody>
              </table>
            </div>
          </div>
          <hr style="border:none;border-top:2px dashed rgba(122,93,71,.35);margin:18px 0;">
        `;
      }

      html += `</div>`;

      setPage(
        "Ledger",
        "Ledger auto-generated from Journal.<br/>CBSE style T-format ledger.",
        html
      );
    }

    function renderTrialBalance(){
      const ledger = buildLedgerFromJournal();
      const tb = buildTrialBalance(ledger);

      if(tb.rows.length === 0){
        setPage(
          "Trial Balance",
          "No accounts found.<br/>Add entries first.",
          `<div class="card small">Trial Balance is empty.</div>`
        );
        return;
      }

      let html = `
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:70px;">S.No.</th>
                  <th>Particulars</th>
                  <th style="width:160px;">Debit (₹)</th>
                  <th style="width:160px;">Credit (₹)</th>
                </tr>
              </thead>
              <tbody>
      `;

      tb.rows.forEach((r, i)=>{
        html += `
          <tr>
            <td>${i+1}</td>
            <td>${escapeHtml(r.acc)}</td>
            <td>${r.dr ? inr(r.dr) : ""}</td>
            <td>${r.cr ? inr(r.cr) : ""}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
              <tfoot>
                <tr>
                  <th colspan="2">Total</th>
                  <th>${inr(tb.totalDr)}</th>
                  <th>${inr(tb.totalCr)}</th>
                </tr>
              </tfoot>
            </table>
          </div>

          <div class="small" style="margin-top:10px;">
            Status:
            ${Math.abs(tb.totalDr - tb.totalCr) < 0.00001
              ? `<span class="pill ok">Tally Matched</span>`
              : `<span class="pill bad">Not Matching</span>`
            }
          </div>
        </div>
      `;

      setPage(
        "Trial Balance",
        "Auto-generated Trial Balance.<br/>Totals must match.",
        html
      );
    }

    // ------------------ Delete Buttons ------------------
    function deleteJournal(){
      if(state.journal.length === 0){
        alert("Journal is already empty.");
        return;
      }
      if(!confirm("Delete Journal? (Ledger/Trial Balance will also become empty because they are generated from Journal.)")) return;

      pushUndoSnapshot();
      state.journal = [];
      saveState();
      render();
    }

    function deleteLedger(){
      // ledger is derived, so deleting ledger means deleting journal as well (to avoid mismatch)
      if(state.journal.length === 0){
        alert("Ledger is already empty.");
        return;
      }
      if(!confirm("Delete Ledger? (This will clear Journal too because Ledger is generated from Journal.)")) return;

      pushUndoSnapshot();
      state.journal = [];
      saveState();
      render();
    }

    function deleteAll(){
      if(state.journal.length === 0 && state.lastId === 1){
        alert("Everything is already empty.");
        return;
      }
      if(!confirm("Delete ALL data? This will remove all saved entries permanently.")) return;

      pushUndoSnapshot();
      state = { journal: [], lastId: 1 };
      saveState();
      render();
    }

    // ------------------ View Render ------------------
    function render(){
      const view = $("viewSelect").value;

      if(view === "newEntry") renderNewEntry();
      else if(view === "journal") renderJournal();
      else if(view === "ledger") renderLedger();
      else if(view === "trialBalance") renderTrialBalance();
      else renderNewEntry();

      updateUndoButton();
    }

    // ------------------ HTML escape ------------------
    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // ------------------ Init ------------------
    function init(){
      loadState();
      disableNumberScroll();

      $("viewSelect").addEventListener("change", render);
      $("undoBtn").addEventListener("click", undo);

      $("deleteJournalBtn").addEventListener("click", deleteJournal);
      $("deleteLedgerBtn").addEventListener("click", deleteLedger);
      $("deleteAllBtn").addEventListener("click", deleteAll);

      render();
    }

    init();
  </script>
</body>
</html>
